<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mossheart Voxel Studio</title>
<style>
  :root { --bg: #0b0d09; --panel: #12150f; --panel2: #181c14; --fg: #e9e4cf; --dim: #9a967f; --acc: #e0b25c; --acc2: #8cc84a; --line: rgba(233, 228, 207, 0.12); --warn: #ff9b7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button, select, input { font: inherit; color: var(--fg); background: #1d2118; border: 1px solid var(--line); border-radius: 6px; }
  button { padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--acc); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.on { background: #3a3220; border-color: var(--acc); color: #ffe7b0; }
  button.pri { background: #33401f; border-color: #6f9a3a; }
  button.warn { color: var(--warn); }
  input, select { padding: 3px 6px; min-width: 0; }
  input[type=range] { padding: 0; accent-color: var(--acc); }
  input[type=color] { padding: 0 2px; height: 26px; }
  #app { display: grid; grid-template-columns: 240px 1fr 360px; grid-template-rows: 46px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 650; letter-spacing: 0.03em; color: var(--acc); }
  header .brand small { color: var(--dim); font-weight: 400; margin-left: 4px; }
  header .ttl { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; margin-left: 10px; }
  #title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subtitle { color: var(--dim); font-size: 11px; }
  header .sp { flex: 1; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside .top { padding: 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
  aside .top .row { display: flex; gap: 6px; }
  aside .top .row button { flex: 1; }
  #lib { overflow-y: auto; flex: 1; padding: 4px 0 20px; }
  .gh { padding: 7px 10px 4px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; user-select: none; }
  .gh em, .it em { float: right; font-style: normal; color: var(--dim); font-size: 10px; margin-left: 6px; }
  .it { padding: 3px 10px 3px 22px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it:hover { background: var(--panel2); }
  .it.on { background: #2a2a1a; color: #ffe7b0; box-shadow: inset 3px 0 var(--acc); }
  .empty { padding: 2px 22px 6px; color: var(--dim); font-size: 12px; }
  main { position: relative; min-width: 0; min-height: 0; }
  #cv, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cv { touch-action: none; }
  #ov { pointer-events: none; }
  #tools { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; align-items: center; background: rgba(18, 21, 15, 0.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px; backdrop-filter: blur(4px); }
  #tools .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  #tools .cur { display: flex; align-items: center; gap: 6px; padding-right: 6px; color: var(--dim); }
  #status { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 11px ui-monospace, Consolas, monospace; color: var(--dim); pointer-events: none; padding-left: 64px; }
  #status .warn { color: var(--warn); }
  #timeline { position: absolute; right: 10px; top: 10px; display: none; gap: 8px; align-items: center; background: rgba(18, 21, 15, 0.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  #timeline input { width: 120px; }
  #flabel { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); }
  #side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #tabs { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); }
  #tabs button { border-radius: 6px 6px 0 0; border-bottom: none; flex: 1; padding: 5px 4px; font-size: 12px; }
  #panel { overflow-y: auto; flex: 1; padding: 0 10px 30px; }
  section { border-bottom: 1px solid var(--line); padding: 10px 0; }
  section h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--acc); font-weight: 600; }
  .dim { color: var(--dim); font-size: 12px; margin: 6px 0; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .row.wrap { flex-wrap: wrap; }
  .f { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: center; margin: 3px 0; }
  .f.mat { grid-template-columns: 92px auto 1fr; }
  .f label { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scrub { cursor: ew-resize; user-select: none; }
  .scrub:hover { color: var(--acc); }
  .vec { display: grid; grid-template-columns: 62px 1fr 1fr 1fr; gap: 4px; align-items: center; margin: 3px 0; }
  .vec .vl { color: var(--dim); font-size: 12px; }
  .vec .f { grid-template-columns: 12px 1fr; gap: 2px; margin: 0; }
  .vec input { width: 100%; padding: 3px 3px; }
  .chk { display: inline-flex; gap: 6px; align-items: center; margin: 3px 10px 3px 0; color: var(--fg); font-size: 12px; }
  .sw { display: inline-flex; height: 14px; border-radius: 3px; overflow: hidden; vertical-align: middle; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4); flex: none; }
  .sw i { display: block; width: 7px; height: 100%; }
  .big .sw { height: 22px; } .big .sw i { width: 18px; }
  .prims { max-height: 260px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .pr { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .pr:hover { background: var(--panel2); }
  .pr.on { background: #3a3220; }
  .pr.off { opacity: 0.45; }
  .pr b { color: var(--acc); font-weight: 600; width: 10px; }
  .pr em { font-style: normal; font-size: 10px; color: var(--acc2); }
  .pr .eye { margin-left: auto; color: var(--dim); }
  .mlist { max-height: 220px; overflow-y: auto; }
  .mrow { display: flex; gap: 8px; align-items: center; padding: 2px 4px; cursor: pointer; border-radius: 4px; }
  .mrow:hover { background: var(--panel2); }
  .mrow.on { background: #3a3220; }
  .mrow em { font-style: normal; font-size: 10px; color: var(--acc2); margin-left: auto; }
  .rule { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; margin: 6px 0; }
  .rule .f { grid-template-columns: 70px 1fr; }
  .rule .f.mat { grid-template-columns: 0 auto 1fr; } .rule .f.mat label { display: none; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; margin: 6px 0; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: #2a2a1a; border: 1px solid var(--acc); color: #ffe7b0; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 5; max-width: 80vw; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #fail { display: none; position: fixed; inset: 0; place-items: center; background: var(--bg); color: var(--warn); white-space: pre-wrap; padding: 20px; }
  body.failed #fail { display: grid; }
  #log, #result { display: none; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 46px 55vh auto auto; height: auto; min-height: 100vh; }
    html, body { overflow: auto; }
    aside { max-height: 34vh; border-right: none; border-bottom: 1px solid var(--line); order: 3; }
    main { order: 2; }
    #side { order: 4; border-left: none; }
    header .brand small, #b-preview, #b-fork { display: none; }
    #tools { flex-wrap: wrap; right: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">Mossheart <small>Voxel Studio</small></span>
    <div class="ttl"><span id="title"></span><span id="subtitle"></span></div>
    <span class="sp"></span>
    <button id="b-undo" title="Undo (Ctrl+Z)">↶</button><button id="b-redo" title="Redo (Ctrl+Y)">↷</button>
    <button id="b-fork" title="make an editable copy of this library model">Fork</button>
    <button id="b-save" data-doc title="Save to the studio library (Ctrl+S)">Save</button>
    <button id="b-preview" data-doc title="Open the engine with this asset (?gallery=studio)">Preview in engine</button>
  </header>
  <aside>
    <div class="top">
      <div class="row"><button id="b-new" class="pri">New asset</button><button id="b-open" title=".json / .js asset or MagicaVoxel .vox">Import…</button></div>
      <input id="search" placeholder="search models">
    </div>
    <div id="lib"></div>
  </aside>
  <main>
    <canvas id="cv"></canvas><canvas id="ov"></canvas>
    <div id="tools"></div>
    <div id="timeline"><button id="play">▶</button><input id="frame" type="range" min="0" max="0" value="0"><span id="flabel"></span></div>
    <div id="status"></div>
  </main>
  <div id="side"><div id="tabs"></div><div id="panel"></div></div>
</div>
<div id="toast"></div>
<div id="fail"></div>
<pre id="log"></pre>
<pre id="result"></pre>
<!-- Mossheart generator (vendored): models, styles, ramps. SVK records which script defined which models. -->
<script>
/* Pixel-art engine: palette-indexed buffers with depth, iso cube terrain,
   SDF models ray-marched straight to quantised pixels, pixel-space post. */
(function () {
  const P = (window.PX = {});
  const SQ3 = Math.sqrt(3);

  P.hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  P.ramp = (s) => s.trim().split(/\s+/).map(P.hex);
  P.rng = (seed) => { let s = (seed * 2654435761) >>> 0 || 1; return () => ((s = Math.imul(s ^ (s >>> 15), 0x2c1b3c6d) + 0x6d2b79f5 >>> 0) / 4294967296); };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  P.clamp = clamp;
  P.smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ------------------------------------------------------------------ noise
  function hash(x, y, z, s) {
    let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x61c88647) ^ Math.imul((s | 0) + 1, 0x3c6ef372);
    h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d); h = Math.imul(h ^ (h >>> 12), 0x297a2d39); h ^= h >>> 15;
    return (h >>> 0) / 4294967296;
  }
  P.hash = hash;
  const fade = (t) => t * t * (3 - 2 * t);
  function noise(x, y, z = 0, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const u = fade(x - xi), v = fade(y - yi), w = fade(z - zi);
    const c = (a, b, d) => hash(xi + a, yi + b, zi + d, s);
    const l = (a, b, t) => a + (b - a) * t;
    return l(l(l(c(0, 0, 0), c(1, 0, 0), u), l(c(0, 1, 0), c(1, 1, 0), u), v), l(l(c(0, 0, 1), c(1, 0, 1), u), l(c(0, 1, 1), c(1, 1, 1), u), v), w);
  }
  P.noise = noise;
  P.fbm = (x, y, z = 0, s = 0, o = 3) => { let a = 0, f = 1, amp = 0.5, n = 0; for (let i = 0; i < o; i++) { a += noise(x * f, y * f, z * f, s + i * 17) * amp; n += amp; f *= 2.03; amp *= 0.5; } return a / n; };
  // Nearest jittered feature point; returns a shared object (copy what you need).
  const CELL = { f1: 0, f2: 0, x: 0, y: 0, z: 0, id: 0 };
  P.cell = function (x, y, z, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let f1 = 9, f2 = 9;
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = xi + dx, cy = yi + dy, cz = zi + dz;
      const px = cx + hash(cx, cy, cz, s), py = cy + hash(cx, cy, cz, s + 1), pz = cz + hash(cx, cy, cz, s + 2);
      const d = (px - x) * (px - x) + (py - y) * (py - y) + (pz - z) * (pz - z);
      if (d < f1) { f2 = f1; f1 = d; CELL.x = px; CELL.y = py; CELL.z = pz; CELL.id = hash(cx, cy, cz, s + 3); } else if (d < f2) f2 = d;
    }
    CELL.f1 = Math.sqrt(f1); CELL.f2 = Math.sqrt(f2); return CELL;
  };
  P.cell2 = function (x, y, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9, f2 = 9;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = xi + dx, cy = yi + dy;
      const px = cx + 0.15 + 0.7 * hash(cx, cy, 0, s), py = cy + 0.15 + 0.7 * hash(cx, cy, 0, s + 1);
      const d = (px - x) * (px - x) + (py - y) * (py - y);
      if (d < f1) { f2 = f1; f1 = d; CELL.x = px; CELL.y = py; CELL.id = hash(cx, cy, 0, s + 3); } else if (d < f2) f2 = d;
    }
    CELL.f1 = Math.sqrt(f1); CELL.f2 = Math.sqrt(f2); return CELL;
  };
  // HD moss: shade a soft height field of cushions (no cells), darker in the hollows. Ln: light direction.
  P.velvetAt = function (td, X, Y, base, Ln) {
    const f = td.scale ?? 1.6, e = 0.02, sd = td.seed ?? 13;
    const hf = (x, y) => P.fbm(x * f, y * f, 0, sd, 3) + 0.4 * P.fbm(x * f * 3.3, y * f * 3.3, 0, sd + 50, 2);
    const h0 = hf(X, Y), gx = (hf(X + e, Y) - h0) / e, gy = (hf(X, Y + e) - h0) / e, amp = td.amp ?? 0.22;
    const nx = -gx * amp, ny = -gy * amp, nl = Math.sqrt(nx * nx + ny * ny + 1);
    let s = base + ((nx * Ln[0] + ny * Ln[1] + Ln[2]) / nl - Ln[2]) * (td.k ?? 1.1) + (h0 - 0.7) * (td.hk ?? 0.35);
    if (td.fuzz) s += (noise(X * 46, Y * 46, 0, 41) - 0.5) * td.fuzz + (noise(X * 110, Y * 110, 0, 42) - 0.5) * td.fuzz * 0.3;
    if (td.flowers && hash(Math.floor(X * 9), Math.floor(Y * 9), 0, 44) > 1 - td.flowers && Math.hypot((X * 9 % 1) - 0.5, (Y * 9 % 1) - 0.5) < 0.16) return { ramp: td.flowerRamp, s: 0.75 + (0.5 - (Y * 9 % 1)) * 0.6 };
    return { ramp: td.top2 && P.fbm(X * 0.45, Y * 0.45, 0, 29) > 1 - (td.mix ?? 0.3) ? td.top2 : td.top, s };
  };

  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  P.bayer = (x, y) => (BAYER[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
  // Shade 0..1 -> ramp index. "band" dithers only in a narrow band between two tones (hand-placed look).
  P.quant = function (s, n, x, y, mode) {
    const g = clamp(s, 0, 1) * (n - 1);
    let i = Math.floor(g); const r = g - i;
    if (mode === "bayer") { if (r > P.bayer(x, y)) i++; }
    else if (mode === "band") { if (r > 0.64 || (r > 0.36 && ((x + y) & 1))) i++; }
    else if (r >= 0.5) i++;
    return i > n - 1 ? n - 1 : i;
  };

  // ------------------------------------------------------------------ buffers
  class Buf {
    constructor(w, h) {
      this.w = w; this.h = h; const n = w * h;
      this.ri = new Int16Array(n).fill(-1); this.lv = new Int8Array(n); this.z = new Float32Array(n).fill(-1e9);
      this.em = new Uint8Array(n); this.tag = new Uint8Array(n);
    }
    put(x, y, ri, lv, z, em = 0, tag = 0) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return false;
      const i = y * this.w + x; if (z < this.z[i]) return false;
      this.ri[i] = ri; this.lv[i] = lv; this.z[i] = z; this.em[i] = em; this.tag[i] = tag; return true;
    }
  }
  P.Buf = Buf;

  P.palette = function (ramps) {
    const names = Object.keys(ramps), list = names.map((n) => ramps[n]), id = {};
    names.forEach((n, i) => (id[n] = i));
    return { names, list, id };
  };
  P.resolve = function (buf, pal) {
    const out = new Uint8ClampedArray(buf.w * buf.h * 4);
    for (let i = 0; i < buf.w * buf.h; i++) {
      const r = buf.ri[i]; if (r < 0) continue;
      const ramp = pal.list[r]; const c = ramp[clamp(buf.lv[i], 0, ramp.length - 1)];
      out[i * 4] = c[0]; out[i * 4 + 1] = c[1]; out[i * 4 + 2] = c[2]; out[i * 4 + 3] = 255;
    }
    return out;
  };
  P.colorsUsed = function (buf, pal) {
    const set = new Set();
    for (let i = 0; i < buf.w * buf.h; i++) if (buf.ri[i] >= 0) set.add(pal.list[buf.ri[i]][clamp(buf.lv[i], 0, pal.list[buf.ri[i]].length - 1)].join(","));
    return set.size;
  };
  P.toURL = function (rgba, w, h) {
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").putImageData(new ImageData(rgba, w, h), 0, 0);
    return cv.toDataURL("image/png");
  };

  // ------------------------------------------------------------------ projection
  // Cell (cx, cy) spans world [cx, cx+1] x [cy, cy+1]; Z in cell units (one step = 0.5).
  P.view = (tw, ox, oy) => ({ tw, a: tw / 2, b: tw / 4, hz: tw / 2, ox, oy });
  P.proj = (v, X, Y, Z) => [v.ox + (X - Y) * v.a, v.oy + (X + Y) * v.b - Z * v.hz];

  // ------------------------------------------------------------------ SDF models
  P.prim = {
    S: (c, r, m, o) => Object.assign({ k: 0, x: c[0], y: c[1], z: c[2], r, m }, o),
    E: (c, rr, m, o) => Object.assign({ k: 1, x: c[0], y: c[1], z: c[2], rx: rr[0], ry: rr[1], rz: rr[2], m }, o),
    C: (a, b, ra, rb, m, o) => { const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2]; return Object.assign({ k: 2, x: a[0], y: a[1], z: a[2], bx, by, bz, bb: bx * bx + by * by + bz * bz || 1e-6, ra, rb, m }, o); },
    B: (c, h, r, m, o) => Object.assign({ k: 3, x: c[0], y: c[1], z: c[2], hx: h[0], hy: h[1], hz: h[2], r, m }, o),
    Y: (c, r, hh, m, o) => Object.assign({ k: 4, x: c[0], y: c[1], z: c[2], r, hh, rr: (o && o.round) || 0, m }, o),
  };
  // World-to-local matrix for an object rotated by `ang` about axis "x" | "y" | "z".
  P.rot = function (axis, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    if (axis === "x") return [1, 0, 0, 0, c, s, 0, -s, c];
    if (axis === "y") return [c, 0, -s, 0, 1, 0, s, 0, c];
    return [c, s, 0, -s, c, 0, 0, 0, 1];
  };
  P.rotMul = (A, B) => [0, 1, 2].flatMap((r) => [0, 1, 2].map((c) => A[r * 3] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c]));
  function dPrim(p, x, y, z) {
    let dx = x - p.x, dy = y - p.y, dz = z - p.z;
    if (p.R) { const R = p.R, lx = R[0] * dx + R[1] * dy + R[2] * dz, ly = R[3] * dx + R[4] * dy + R[5] * dz; dz = R[6] * dx + R[7] * dy + R[8] * dz; dx = lx; dy = ly; }
    switch (p.k) {
      case 0: return Math.sqrt(dx * dx + dy * dy + dz * dz) - p.r;
      case 1: {
        const ax = dx / p.rx, ay = dy / p.ry, az = dz / p.rz;
        const k0 = Math.sqrt(ax * ax + ay * ay + az * az), k1 = Math.sqrt(ax * ax / (p.rx * p.rx) + ay * ay / (p.ry * p.ry) + az * az / (p.rz * p.rz));
        return k1 < 1e-9 ? -Math.min(p.rx, p.ry, p.rz) : (k0 * (k0 - 1)) / k1;
      }
      case 2: {
        let h = (dx * p.bx + dy * p.by + dz * p.bz) / p.bb; h = h < 0 ? 0 : h > 1 ? 1 : h;
        const qx = dx - p.bx * h, qy = dy - p.by * h, qz = dz - p.bz * h;
        return Math.sqrt(qx * qx + qy * qy + qz * qz) - (p.ra + (p.rb - p.ra) * h);
      }
      case 3: {

   Same conventions as models.js: world cell units, anchor at ground centre, Z up, enemies face +X. */
(function () {

  const VF = [0.577, 0.577, 0.577], VR = [0.707, -0.707, 0], VU = [-0.408, -0.408, 0.816], UP = [0, 0, 1];

  // Rotation rows for a box whose local x runs along d and local z along n.
  function frame(d, n) {
    const w = [n[1] * d[2] - n[2] * d[1], n[2] * d[0] - n[0] * d[2], n[0] * d[1] - n[1] * d[0]];
    return [...d, ...w, ...n];
  }

  // Chibi face painted toward the viewer: big eyes with a highlight, optional blush, mouth, angry brows.
  function cface(q, hr, o = {}) {
    if (q[0] * VF[0] + q[1] * VF[1] + q[2] * VF[2] < 0.15 * hr) return null;
    let u = (q[0] * VR[0] + q[1] * VR[1]) / hr, v = (q[0] * VU[0] + q[1] * VU[1] + q[2] * VU[2]) / hr;
    if (o.tilt) { const c = Math.cos(o.tilt), s = Math.sin(o.tilt); [u, v] = [u * c + v * s, -u * s + v * c]; }
    const ex = o.ex ?? 0.36, ey = o.ey ?? 0.05, er = o.er ?? 0.2, sq = o.squint ?? 1;
    for (const sx of o.one ? [0] : [-1, 1]) {
      const du = u - sx * ex, dv = (v - ey) * sq;

<script>
/* Round four: the Bell Jar opened up into a Japanese moss garden under a thick forest canopy.
   A wider jar on a 14-cell island, gentle half-step terraces, low moss mounds, stepping stones,
   an organic pond; deep green shade with a few hard-edged sun pools; a dark forest behind.
   Each scene also emits layers (base, beams, pool, moss, leaf, bg) for the live board. */
(function () {
  const P = window.PX, { hd, plinth, TERRAIN, STRATA, LIGHT, velvet } = P.r3;

  const N = 14, C = 7, RI = 7.0, RG = 7.35, DRUM = 0.92;

  // Garden map from a few shapes: hills (in steps, rounded to half steps) or a height(x, y) function
  // (whole steps), cell paths, water (an elliptical pond, or a list of ellipses and stream segments)
  // and an optional gravel field (signed distance, + inside). Water and gravel cells cover every tile
  // a shape touches; the textures then draw the exact wobbly shore from waterD / gravelD. Ponds sit at
  // their own level (h); streams keep the terrain height and fall where they step down.
  // Cells wholly outside the island circle are "_"; the renderer trims the rest to the circle (st.clip).
  const garden = (o) => {
    const n = o.N || N, c = n / 2, hgt = [], typ = [], path = new Set();
    // water shapes as signed distances (+ inside); g grows the shape to find every tile it touches

      ? { h: w.h, d: (x, y, g = 0) => (1 - Math.hypot((x - w.e.x) / (w.e.rx + g), (y - w.e.y) / (w.e.ry + g))) * Math.min(w.e.rx, w.e.ry) }

    for (const pts of o.paths || []) for (let k = 0; k + 1 < pts.length; k++) {
      let [x, y] = pts[k]; const [x1, y1] = pts[k + 1]; path.add(x + "," + y);
      while (x !== x1 || y !== y1) { if (x !== x1) x += Math.sign(x1 - x); else y += Math.sign(y1 - y); path.add(x + "," + y); }
    }
    for (let y = 0; y < n; y++) {
      hgt.push([]); typ.push([]);
      for (let x = 0; x < n; x++) {
        const cx = x + 0.5, cy = y + 0.5;
        let h = 2;
        if (o.height) h = Math.round(o.height(cx, cy));
        for (const hl of o.hills || []) h += hl.h * P.smooth(hl.r, hl.r * 0.35, Math.hypot(cx - hl.x, cy - hl.y));

        if (onPath) t = o.lane || (t === "g" ? "u" : "t");
        for (const w of waters) if (w.d(cx, cy, 0.72) > 0) { t = onPath && o.ford ? "v" : "w"; if (w.h !== undefined) h = w.h; else if (w.lvl) h = w.lvl(cx, cy); }
        hgt[y].push(h); typ[y].push(Math.hypot(cx - c, cy - c) < c + 0.71 ? t : "_");
      }
    }
    const waterD = waters.length ? (x, y) => Math.max(...waters.map((w) => w.d(x, y))) : null;
    return { W: n, H: n, hgt, typ, floor: -3, rings: o.rings || [], waterD, gravelD: o.gravel || null, geo: { N: n, C: c, RI: c }, path: o.paths || [] };
  };

  // Terrain: smooth velvet carpet (bigger, calmer cushions), stepping stones, raked gravel, a calm pond.
  const carpet = Object.assign({}, velvet, { scale: 1.1, amp: 0.14, k: 0.75, hk: 0.12, fuzz: 0.045, mix: 0.22, flowers: 0 });
  const tobi = Object.assign({}, carpet, { tex: "tobi", stone: "stone", f: 1.25, rad: 0.27, base: 0.6, stoneBase: 0.72, side: "earth", sideTex: "moss", drip: null, tufts: 0 });
  const GARDEN = Object.assign({}, TERRAIN, {

  const jar = (o) => {

    return hd(Object.assign({
      tw: 76, pad: 0.55, headMin: 7.4 * sc, foot: 0.8, L: [-0.3, 0.32, 0.9], amb: 0.22, layers: true, sceneOnly: true, terrain: GARDEN, strata: STRATA, waterDrop: 0, lip: 0.04, clip: { x: C, y: C, r: RI, foot: DRUM },
      bg: forest({ lo: 0.05, k: 0.5, trunks: TRUNKS, bokeh: BOKEH }),
      solids: (st) => [
        plinth(st, { type: "cyl", cx: C, cy: C, R: RG + 0.45, zb: -2.15, zt: -1.5 }, (X, Y) => Math.hypot(X - C, Y - C) - RG),
        { shape: { type: "cyl", cx: C, cy: C, R: RG - 0.06, zb: -1.5, zt: DRUM }, shade(X, Y, Z, n) {

<script>
/* Round six: Momiji with real height. Terraces a full cube tall with mossy rock cliffs, waterfalls
   stepping down them into the pond, and a large map with a whole tower-defence path: stone stairs
   up each terrace, a red bridge over the river, towers along the way. */
(function () {
  const P = window.PX, { garden, jar, CANOPY, DRAPED, ledges, warp, MAPLE, forest, TRUNKS } = P.r4;

  // Cliffs: the Momiji moss lip, then mossy rock. The path is a pale gravel lane with stepping stones.
  const CLIFF = {};
  for (const k in DRAPED) CLIFF[k] = Object.assign({}, DRAPED[k], { sideTex: "cliff", rock: "rock", drapeD: 0.12, drapeK: 0.18 });
  const RAMPS = {
    maple: ["#d4482a", 8, 0.12, 0.78, 0.3], moss: ["#4a8a30", 9, 0.1, 0.86, 0.32, 1.05],
    sky: ["#040403", "#0b0a05", "#151309", "#201c0d", "#2c2612", "#3c3418", "#4e4222", "#645432"],
    rock: ["#6f675a", 9, 0.08, 0.8, 0.22], gravel: ["#b9b1a0", 8, 0.3, 0.92, 0.12, 0.5], fall: ["#8ccac2", 10, 0.2, 0.99, 0.12], lacq: ["#c43a22", 8, 0.12, 0.74, 0.25],
  };

  // Path cells in walking order, from polylines of cell corners.
  const cellsOf = (pts) => {
    const out = [pts[0].slice()];
    for (let k = 0; k + 1 < pts.length; k++) {
      let [x, y] = pts[k]; const [x1, y1] = pts[k + 1];
      while (x !== x1 || y !== y1) { if (x !== x1) x += Math.sign(x1 - x); else y += Math.sign(y1 - y); out.push([x, y]); }
    }
    return out;
  };
  // Walk the path: stone stairs on the lower tile wherever it climbs, an arched bridge wherever it
  // crosses water (from the bank tile before to the bank tile after).
  const trail = (map) => {
    const deco = [], isW = (x, y) => map.typ[y][x] === "w";
    for (const cs of map.path.map(cellsOf)) {
      for (let i = 0; i + 1 < cs.length; i++) {
        const [x, y] = cs[i], [x1, y1] = cs[i + 1];
        if (isW(x, y) || isW(x1, y1)) continue;
        const d = map.hgt[y1][x1] - map.hgt[y][x]; if (!d) continue;
        const [lx, ly, hx, hy] = d > 0 ? [x, y, x1, y1] : [x1, y1, x, y];
        deco.push(["stairs", { H: Math.abs(d) * 0.5, dir: (hx - lx + hy - ly > 0 ? "+" : "-") + (hx !== lx ? "x" : "y") }, lx, ly]);
      }
      for (let i = 1; i < cs.length; i++) {
        if (!isW(...cs[i]) || isW(...cs[i - 1])) continue;
        let j = i; while (j < cs.length && isW(...cs[j])) j++;
        if (j >= cs.length) break;
        const [ax, ay] = cs[i - 1], [bx, by] = cs[j], [wx, wy] = cs[i], L = Math.hypot(bx - ax, by - ay) + 0.1;
        deco.push(["bridge", { L, rise: 0.2 + 0.05 * L }, wx, wy, { dx: (ax + bx) / 2 - wx, dy: (ay + by) / 2 - wy, dz: (map.hgt[ay][ax] - map.hgt[wy][wx]) * 0.5 + 0.14, flip: ay !== by, overWater: true }]);
        i = j;
      }
    }
    return deco;
  };

  const falls = (o) => {
    const path = o.map.path.flatMap(cellsOf).map(([x, y]) => ["", {}, x, y]), deco = o.deco.concat(trail(o.map));
    const dress = ledges(o.map, { seed: o.seed, skip: deco.concat(path), cushions: o.cushions ?? 0.18, ferns: o.ferns ?? 0.34, rocks: o.rocks ?? 0.1 });

      L: [-0.45, 0.36, 0.82], terrain: CLIFF, bevel: 0.16, aoW: 0.34, aoK: 0.36, glassZt: 3.4, ramps: RAMPS,
      bg: forest({ lo: 0.05, k: 0.5, trunks: TRUNKS, bokeh: [[0.12, 0.1, 0.03, 0.16], [0.24, 0.05, 0.02, 0.14], [0.62, 0.06, 0.035, 0.1], [0.9, 0.14, 0.025, 0.16], [0.77, 0.03, 0.018, 0.12]] }),
      hd: { bloom: 0.85, threshold: 0.84, radius: 6, haze: 0.06, fog: [40, 32, 18], vignette: 0.5, beamK: 0.66, beamW: 1.1, beamCol: [255, 212, 146], motes: 0 },
    }, o, { deco: deco.concat(dress), light: CANOPY({ shade: 0.44, pool: 0.5, beams: o.beams }) }));
  };

  // F1 — Falls: an amphitheatre of terraces rising to a high plateau at the back. The river leaves the

    paths: [[[13, 6], [10, 6], [10, 4], [7, 4], [7, 2], [5, 2]]], lane: "u",

      ["mound", { seed: 1, sz: 1.5 }, 1, 8], ["mound", { seed: 2, sz: 1.3 }, 11, 9], ["mound", { seed: 5, sz: 1.2 }, 4, 12], ["niwaki", { seed: 6, H: 1.6, girth: 0.75, spread: 0.6, padR: 0.44, n: 5, flat: 0.24, mat: "maple", bumps: 3 }, 2, 10],
      ["fern", { seed: 3, sz: 1.2 }, 8, 8], ["fern", { seed: 4, sz: 1.1 }, 12, 10]],
    beams: [{ x: 4.2, y: 7.6, r: 1.15, len: 18 }, { x: 7.8, y: 11.6, r: 1.1, k: 0.95, len: 18 }, { x: 10.4, y: 6.2, r: 1.0, k: 0.85, len: 18 }],
  });

  // L1 — Valley: a 24-tile island. A summit with the Heart Tree at the back, five levels of terraces
  // around it, a river falling level by level into a lake at the front, and a full enemy route.
  const VAL = (x, y) => Math.hypot(x - 8, y - 7.5) + warp(x, y, 2.0);
  const VALLEY = garden({
    N: 24,
    height: (x, y) => { const d = VAL(x, y); return 2 + 2 * (d < 10.4) + 2 * (d < 7.9) + 2 * (d < 5.4) + 2 * (d < 2.9); },
    water: [{ seg: [9.6, 8.2, 9.6, 17.8], r: 0.6, carve: true }, { e: { x: 10.4, y: 19.6, rx: 3.2, ry: 2.0 }, h: 2 }],

<script>
/* Mossheart Engine POC: shared namespace, logging, URL params and column-major mat4 helpers.
   Everything hangs off window.ME, the same way the generator hangs off window.PX. */
(function () {
  const ME = (window.ME = { VS: 16 });

  // ------------------------------------------------------------------ log (also the self-test channel)
  ME.lines = [];
  ME.errors = [];
  ME.log = (...a) => {
    const s = a.map((x) => (typeof x === "string" ? x : JSON.stringify(x))).join(" ");
    ME.lines.push(s);
    console.log(s);
    const el = document.getElementById("log");
    if (el) el.textContent = ME.lines.slice(-400).join("\n");
  };
  ME.err = (...a) => { ME.errors.push(a.join(" ")); ME.log("ERROR", ...a); };
  window.addEventListener("error", (e) => ME.err("JS", e.message, (e.filename || "").split("/").pop() + ":" + e.lineno));
  window.addEventListener("unhandledrejection", (e) => ME.err("PROMISE", (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)));

  ME.VERSION = "0.2";
  ME.params = new URLSearchParams(location.search);
  ME.q = (k, d) => (ME.params.has(k) ? ME.params.get(k) : d);
  ME.qn = (k, d) => (ME.params.has(k) ? parseFloat(ME.params.get(k)) : d);

  // ------------------------------------------------------------------ keys by physical position
  // A key binding is a position on the keyboard (KeyboardEvent.code: KeyQ, KeyW, Digit1...), so it stays
  // in the same place on every layout: Q/E on QWERTY are A/E on AZERTY. label(code) is what that key
  // shows on the user's layout, for help text. It comes from the keys pressed so far, else the browser's
  // layout map (navigator.keyboard), else a guess (AZERTY for French, else QWERTY) that the first letter
  // pressed corrects. Shortcuts with Ctrl (undo, save) stay on e.key: they follow the letter, not the place.
  //   ME.keys.code(e) -> e.code; for an event without one (synthetic, old browsers), the QWERTY code of e.key
  //   ME.keys.is(e, ...codes) -> true if e is one of them; "Digit1" also matches "Numpad1"
  //   ME.keys.digit(e) -> 0-9 from the digit row or the numpad (no Shift needed on AZERTY), else -1
  //   ME.keys.label(code) -> "A" for "KeyQ" on AZERTY;  ME.keys.text(s): each {Code} in s becomes its label
  //   ME.keys.layout -> "qwerty" | "azerty" | "qwertz";  ME.keys.onChange(fn): the labels changed
  {
    const K = (ME.keys = {}), seen = new Map(), subs = [];
    const SWAP = { qwerty: {}, azerty: { KeyQ: "A", KeyA: "Q", KeyW: "Z", KeyZ: "W", Semicolon: "M", KeyM: ",", Comma: ";", Period: ":" }, qwertz: { KeyY: "Z", KeyZ: "Y" } };
    const NAMES = { Space: "Space", Comma: ",", Period: ".", Semicolon: ";", BracketLeft: "[", BracketRight: "]", Escape: "Esc", Delete: "Del", Backspace: "Backspace", Home: "Home", Enter: "Enter" };
    const FROM_KEY = { " ": "Space", ",": "Comma", ".": "Period", ";": "Semicolon", "[": "BracketLeft", "]": "BracketRight" };
    let map = null, mapLayout = null;
    const lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
    K.layout = /^fr(-fr|-be|-lu|-mc)?$/.test(lang) ? "azerty" : "qwerty";
    const changed = () => subs.forEach((f) => { try { f(); } catch (e) { ME.err("KEYS", e.message); } });
    // what a letter key's character says of the layout: one of the three, or only which one it is not
    const layoutOf = (code, ch) => ({ KeyQ: { A: "azerty", Q: "!azerty" }, KeyA: { Q: "azerty", A: "!azerty" }, KeyW: { Z: "azerty", W: "!azerty" }, KeyZ: { W: "azerty", Y: "qwertz", Z: "qwerty" }, KeyY: { Z: "qwertz", Y: "!qwertz" } }[code] || {})[ch];
    K.code = (e) => {
      if (e.code) return e.code;
      const k = e.key || "";
      if (/^[a-z]$/i.test(k)) return "Key" + k.toUpperCase();
      if (/^[0-9]$/.test(k)) return "Digit" + k;
      return FROM_KEY[k] || k;
    };
    K.is = (e, ...codes) => { const c = K.code(e); return codes.some((x) => c === x || (x.startsWith("Digit") && c === "Numpad" + x.slice(5))); };
    K.digit = (e) => { const m = /^(?:Digit|Numpad)(\d)$/.exec(K.code(e)); return m ? +m[1] : -1; };
    K.label = (code) => {
      const d = /^(?:Digit|Numpad)(\d)$/.exec(code);

      const s = seen.get(code) || (map && mapLayout === K.layout ? map.get(code) : null);
      if (s) return s.length === 1 ? s.toUpperCase() : s;
      if (SWAP[K.layout][code]) return SWAP[K.layout][code];

      return m ? m[1] : NAMES[code] || code;
    };

    K.onChange = (fn) => { subs.push(fn); };

    // unshifted digit row is & é " ' ...) and the layout it gives away
    K.learn = (e) => {
      if (!e.code || !e.key || e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey || /^(Digit|Numpad)/.test(e.code)) return;

      let L = layoutOf(e.code, ch);

    };

    K.reset = (layout) => { seen.clear(); K.layout = layout || (mapLayout || "qwerty"); changed(); };
    window.addEventListener("keydown", (e) => { if (e.isTrusted) K.learn(e); }, true);
    try {
      if (navigator.keyboard && navigator.keyboard.getLayoutMap) {
        navigator.keyboard.getLayoutMap().then((m) => {
          map = m;
          mapLayout = m.get("KeyQ") === "a" ? "azerty" : m.get("KeyY") === "z" ? "qwertz" : "qwerty";
          if (!seen.size) K.layout = mapLayout;
          changed();
        }, () => {});
      }
    } catch (e) { /* no layout map (an iframe without the permission): guess and learn */ }
  }

  // Voxels per tile edge: every bake reads ME.VS (and stores it as T.VS). An app picks one of VS_LEVELS
  // with ME.setVS before it bakes; ?vs=N overrides the app's choice. Memory and bake time grow with VS³:
  // 32-64 are for close-up asset work (64 bakes the whole library in about 190 s), never for a phone (24 at most).
  ME.VS_LEVELS = [8, 12, 16, 20, 24, 32, 48, 64];
  ME.setVS = (n) => { const L = ME.VS_LEVELS; ME.VS = L.reduce((b, v) => (Math.abs(v - n) < Math.abs(b - n) ? v : b), L[0]); return ME.VS; };
  ME.vsPinned = ME.params.has("vs");
  if (ME.vsPinned) ME.setVS(ME.qn("vs", 16));

  // Let the page paint between bake steps, but only every ~40 ms: each real yield costs a frame, and the
  // bake calls this often. A message-channel post is not clamped like setTimeout.
  const ch = new MessageChannel(), waiting = [];
  ch.port1.onmessage = () => waiting.shift()();
  let lastYield = 0;
  ME.tick = () => {
    if (performance.now() - lastYield < 40) return Promise.resolve();
    return new Promise((r) => { waiting.push(() => { lastYield = performance.now(); r(); }); ch.port2.postMessage(0); });
  };
  ME.progress = (label, f) => {
    const bar = document.getElementById("bar"), txt = document.getElementById("bartxt");
    if (bar) bar.style.width = Math.round(f * 100) + "%";
    if (txt) txt.textContent = label;
  };
  ME.now = () => performance.now();

  // ------------------------------------------------------------------ mat4, column-major (WGSL layout)
  const M4 = (ME.m4 = {});
  M4.fromRows = (r) => { const m = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) m[j * 4 + i] = r[i][j]; return m; };
  M4.mul = (a, b) => {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; }
    return o;
  };

  M4.inv = (m) => {
    const a = Array.from(m), inv = new Float32Array(16);
    inv[0] = a[5] * a[10] * a[15] - a[5] * a[11] * a[14] - a[9] * a[6] * a[15] + a[9] * a[7] * a[14] + a[13] * a[6] * a[11] - a[13] * a[7] * a[10];
    inv[4] = -a[4] * a[10] * a[15] + a[4] * a[11] * a[14] + a[8] * a[6] * a[15] - a[8] * a[7] * a[14] - a[12] * a[6] * a[11] + a[12] * a[7] * a[10];
    inv[8] = a[4] * a[9] * a[15] - a[4] * a[11] * a[13] - a[8] * a[5] * a[15] + a[8] * a[7] * a[13] + a[12] * a[5] * a[11] - a[12] * a[7] * a[9];
    inv[12] = -a[4] * a[9] * a[14] + a[4] * a[10] * a[13] + a[8] * a[5] * a[14] - a[8] * a[6] * a[13] - a[12] * a[5] * a[10] + a[12] * a[6] * a[9];
    inv[1] = -a[1] * a[10] * a[15] + a[1] * a[11] * a[14] + a[9] * a[2] * a[15] - a[9] * a[3] * a[14] - a[13] * a[2] * a[11] + a[13] * a[3] * a[10];
    inv[5] = a[0] * a[10] * a[15] - a[0] * a[11] * a[14] - a[8] * a[2] * a[15] + a[8] * a[3] * a[14] + a[12] * a[2] * a[11] - a[12] * a[3] * a[10];
    inv[9] = -a[0] * a[9] * a[15] + a[0] * a[11] * a[13] + a[8] * a[1] * a[15] - a[8] * a[3] * a[13] - a[12] * a[1] * a[11] + a[12] * a[3] * a[9];
    inv[13] = a[0] * a[9] * a[14] - a[0] * a[10] * a[13] - a[8] * a[1] * a[14] + a[8] * a[2] * a[13] + a[12] * a[1] * a[10] - a[12] * a[2] * a[9];
    inv[2] = a[1] * a[6] * a[15] - a[1] * a[7] * a[14] - a[5] * a[2] * a[15] + a[5] * a[3] * a[14] + a[13] * a[2] * a[7] - a[13] * a[3] * a[6];
    inv[6] = -a[0] * a[6] * a[15] + a[0] * a[7] * a[14] + a[4] * a[2] * a[15] - a[4] * a[3] * a[14] - a[12] * a[2] * a[7] + a[12] * a[3] * a[6];
    inv[10] = a[0] * a[5] * a[15] - a[0] * a[7] * a[13] - a[4] * a[1] * a[15] + a[4] * a[3] * a[13] + a[12] * a[1] * a[7] - a[12] * a[3] * a[5];
    inv[14] = -a[0] * a[5] * a[14] + a[0] * a[6] * a[13] + a[4] * a[1] * a[14] - a[4] * a[2] * a[13] - a[12] * a[1] * a[6] + a[12] * a[2] * a[5];
    inv[3] = -a[1] * a[6] * a[11] + a[1] * a[7] * a[10] + a[5] * a[2] * a[11] - a[5] * a[3] * a[10] - a[9] * a[2] * a[7] + a[9] * a[3] * a[6];
    inv[7] = a[0] * a[6] * a[11] - a[0] * a[7] * a[10] - a[4] * a[2] * a[11] + a[4] * a[3] * a[10] + a[8] * a[2] * a[7] - a[8] * a[3] * a[6];
    inv[11] = -a[0] * a[5] * a[11] + a[0] * a[7] * a[9] + a[4] * a[1] * a[11] - a[4] * a[3] * a[9] - a[8] * a[1] * a[7] + a[8] * a[3] * a[5];
    inv[15] = a[0] * a[5] * a[10] - a[0] * a[6] * a[9] - a[4] * a[1] * a[10] + a[4] * a[2] * a[9] + a[8] * a[1] * a[6] - a[8] * a[2] * a[5];
    const det = a[0] * inv[0] + a[1] * inv[4] + a[2] * inv[8] + a[3] * inv[12];
    for (let i = 0; i < 16; i++) inv[i] /= det;
    return inv;
  };

  // sRGB byte -> linear float
  ME.lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
})();

<script>
/* SDF evaluation and voxelisation of generator models.
   dPrim / evalModel are copied verbatim from vendor/gen/px.js (private there), plus a function prim (k: 5);
   the voxeliser samples them on a grid, skipping 4^3 bricks whose centre distance proves them all-empty or all-solid,
   and in the others evaluating only the prims that can matter there (cull). */
(function () {
  const ME = window.ME, P = window.PX, noise = P.noise, clamp = P.clamp;

  // ---- verbatim port of px.js dPrim / evalModel (EV_M = material of the nearest primitive)
  function dPrim(p, x, y, z) {
    let dx = x - p.x, dy = y - p.y, dz = z - p.z;
    if (p.R) { const R = p.R, lx = R[0] * dx + R[1] * dy + R[2] * dz, ly = R[3] * dx + R[4] * dy + R[5] * dz; dz = R[6] * dx + R[7] * dy + R[8] * dz; dx = lx; dy = ly; }
    switch (p.k) {
      case 0: return Math.sqrt(dx * dx + dy * dy + dz * dz) - p.r;
      case 1: {
        const ax = dx / p.rx, ay = dy / p.ry, az = dz / p.rz;
        const k0 = Math.sqrt(ax * ax + ay * ay + az * az), k1 = Math.sqrt(ax * ax / (p.rx * p.rx) + ay * ay / (p.ry * p.ry) + az * az / (p.rz * p.rz));
        return k1 < 1e-9 ? -Math.min(p.rx, p.ry, p.rz) : (k0 * (k0 - 1)) / k1;
      }
      case 2: {
        let h = (dx * p.bx + dy * p.by + dz * p.bz) / p.bb; h = h < 0 ? 0 : h > 1 ? 1 : h;
        const qx = dx - p.bx * h, qy = dy - p.by * h, qz = dz - p.bz * h;
        return Math.sqrt(qx * qx + qy * qy + qz * qz) - (p.ra + (p.rb - p.ra) * h);
      }
      case 3: {
        const qx = Math.abs(dx) - p.hx, qy = Math.abs(dy) - p.hy, qz = Math.abs(dz) - p.hz;
        const ox = qx > 0 ? qx : 0, oy = qy > 0 ? qy : 0, oz = qz > 0 ? qz : 0;
        return Math.sqrt(ox * ox + oy * oy + oz * oz) + Math.min(Math.max(qx, qy, qz), 0) - p.r;
      }
      // engine extension (px.js has no such prim): a distance function in local coordinates that may set
      // p.m to the material at that point, e.g. a studio voxel layer (src/asset-format.js)
      case 5: return p.f(dx, dy, dz);
      default: {
        const a = Math.sqrt(dx * dx + dy * dy) - p.r + p.rr, b = Math.abs(dz) - p.hh + p.rr;
        const oa = a > 0 ? a : 0, ob = b > 0 ? b : 0;
        return Math.min(Math.max(a, b), 0) + Math.sqrt(oa * oa + ob * ob) - p.rr;
      }
    }
  }
  let EV_M = null;
  function evalModel(prims, x, y, z) {
    let d = 1e9, best = 1e9; EV_M = null;
    for (let i = 0; i < prims.length; i++) {
      const p = prims[i];
      let e = dPrim(p, x, y, z);
      if (p.disp) e += (noise(x * p.df, y * p.df, z * p.df, 7) - 0.5) * p.disp;
      if (p.sub) { if (-e > d) { d = -e; if (p.subm) EV_M = p.subm; } continue; }
      if (e < best) { best = e; EV_M = p.m; }
      if (p.k2) { const h = clamp(0.5 + (0.5 * (e - d)) / p.k2, 0, 1); d = e + (d - e) * h - p.k2 * h * (1 - h); }
      else if (e < d) d = e;
    }
    return d;
  }

  // ---- prim culling: the prims that can change the distance (or also the nearest material) anywhere in a
  // ball of radius r (model units) around a point where all of them were just evaluated (evalRaw).
  // Over the ball each prim's distance stays in an interval around its value at the centre: its Lipschitz
  // bound times r, plus disp/2 for the displacement noise (in [0, 1)). The ellipsoid's estimate is not
  // Lipschitz near its centre, but it is g * (k0 - 1) with g = k0/k1 in [rmin, rmax] and k0 = |p / radii|
  // (1/rmin)-Lipschitz, which bounds it. Then evalModel's loop is walked with bounds: [Lo, U] on the running
  // distance d, B above the nearest distance. A union prim is dropped when it cannot lower d (e >= d, or
  // e - d >= k2 for a smooth one, whose blend weight is then 1) and, with MAT, cannot be the nearest; a
  // carving prim when it cannot raise d. Function prims (k: 5) have no bound and stay.
  // The kept prims run the same operations in the same order. Dropping a non-smooth or carving prim leaves
  // every bit as it was; dropping a smooth one at weight 1 skips d = e + (d - e), which can move d's last
  // bit. That is allowed only with SMOOTH: where a value is compared with a threshold (inside or not, AO),
  // never for normals (a difference of nearly equal distances: a component that is exactly 0 by symmetry
  // would flip the octahedral encoding). tools/cull-check.js compares the library byte for byte.
  const MAT = 1, SMOOTH = 2, INFO = new WeakMap();
  // per-prim constants, recomputed for every model at every bake (a studio edits prims in place)
  function setInfo(prims) {
    for (const p of prims) {
      let sc = 1, L, ell = null;
      if (p.R) { // a rotation keeps distances; any other linear map stretches them by at most its Frobenius norm
        const R = p.R;
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (Math.abs(R[i * 3] * R[j * 3] + R[i * 3 + 1] * R[j * 3 + 1] + R[i * 3 + 2] * R[j * 3 + 2] - (i === j ? 1 : 0)) > 1e-9) sc = Math.hypot(...R);
      }
      switch (p.k) {
        case 0: case 3: L = 1; break; // exact distances
        case 1: { const a = Math.max(p.rx, p.ry, p.rz), b = Math.min(p.rx, p.ry, p.rz); L = b > 0 ? 0 : Infinity; ell = { a, b, kL: sc / b }; break; }
        case 2: L = p.bb > 0 ? 1 + Math.abs(p.rb - p.ra) / Math.sqrt(p.bb) : Infinity; break; // the radius changes along the axis
        case 5: L = Infinity; break;
        default: L = 1; // the rounded cylinder
      }
      if (p.k2 && !(p.k2 > 0)) L = Infinity;
      INFO.set(p, { L: L * sc, ell: L === Infinity ? null : ell, pad: (p.disp ? Math.abs(p.disp) / 2 : 0) + 1e-7 }); // pad: the noise, and rounding slack
    }

  // Ground kinds of the v1 map (docs/decisions/2026-10-21-map-format.md, section 2): a recipe and its
  // materials. Every parameter left out is today's constant in bake-terrain.js, so these bake what the
  // generator's letters bake now (content/garden-map.js maps m, u/t, w and s to them).
  C.kinds = {
    moss: { recipe: "carpet", top: "moss", mottle: "moss2", cushions: true, litter: "maple", drape: ["moss", "moss2"], overhang: "moss", under: "rock", grass: true, lamps: true },
    lane: { recipe: "lane", top: "gravel", stones: "stone", edge: "moss", drape: ["moss", "moss2"], overhang: "moss", under: "rock" },
    water: { recipe: "water", bed: ["stone", "pebble", "pebble2"], shore: "pebble", bank: "moss", drape: ["moss", "moss2"], overhang: "moss", under: "rock" },
    sandbank: { recipe: "layer", top: "sand", depth: 0.3, under: "rock" },
  };
  // The valley's look, today's renderer defaults (R.set) as content (docs/decisions/2026-10-22-engine-
  // library.md, L4): the canopy shadow, light shafts, the bell-jar glass, wind, and the forest backdrop
  C.look = { canopy: true, shafts: true, shaftK: 0.13, glass: true, glassK: 1, wind: true, windK: 1, backdrop: "forest" };
  // the palette materials of the renderer's special features (L5): the backdrop's sky ramp, the water
  // surface, the falls sheet and the leaf litter
  C.special = { sky: "sky", water: "water", fall: "fall", litter: "maple" };
  // terrain materials the engine's dig() and collapse() loosen into grains (a sand-bank tile uses it later;
  // until a map cell does, it is only defined)
  C.sand = ["sand"];
  // the material of a model prim that names none
  C.defaultMaterial = "stone";
  // grass tufts: the ground materials they grow on, and the blade materials
  C.grass = { ground: ["moss", "moss2", "maple", "mound", "mound2"], blade: "leaf2", blade2: "moss2", reed: "pine", dry: "leafDry" };

  // deco drawn as ray-marched volumes (trees, lanterns, the generator's sample towers) instead of being
  // stamped into the terrain; deco that walk the route instead
  C.volumeDeco = ["niwaki", "lantern", "hotaru", "puffcap", "sprout", "pine", "cedar", "maple", "bush", "fern"];
  // walkers of the route: model options, speed (tiles/s), gait (flipbook cycles per tile), hop or roll
  C.walkers = { piglet: { o: { seed: 7 }, speed: 0.62, rate: 2.2, gait: "hop" }, pillbug: { o: {}, speed: 0.42, rate: 1.6, gait: "roll" } };

  // flipbook frames of animated volumes (over the generator's animation phase o.t)
  C.flipbookFrames = { hotaru: 4, puffcap: 4, sprout: 4, piglet: 4, pillbug: 4 };
  // point lights from glowing prims of static volumes: material -> [r, g, b, intensity, radius]
  C.primLights = { glow: [1.0, 0.7, 0.36, 2.6, 2.6], firefly: [0.85, 1.0, 0.42, 1.5, 1.7], spore: [0.5, 0.95, 0.85, 1.0, 1.7], capspot: [0.5, 0.95, 0.85, 0.6, 1.7], wisp: [0.7, 0.9, 1.0, 0.6, 1.7] };
  // materials that shade the sun volume at half weight (leafy crowns let light through)
  C.sunShadeHalf = ["maple", "leaf", "leaf2", "pine"];
  // wind response per prop: [lean per unit of gust, flutter, flutter rate]
  C.sway = { niwaki: [0.05, 0.012, 2.1], pine: [0.04, 0.01, 2.4], cedar: [0.035, 0.008, 1.9], maple: [0.05, 0.012, 2.1], fern: [0.16, 0.06, 4.3], bush: [0.07, 0.03, 3.1] };
  // the size of the generator's unit models (they stand about one tile tall; build.js UNIT_K)
  C.modelScale = { lantern: 1.45, wolf: 1.6, mushroom: 1.35, mossling: 1.7, boar: 1.25, shellback: 1.2, moth: 1.35, ironclad: 1.5 };
  // Ground lamps the terrain baker lines the map with: paper andon by the lanes, little moss-capped
  // stone lamps by the water, each with its light (radius, colour, intensity, glowing material)
  C.groundLamps = {
    max: 14, spacing: 2.3,
    lane: { model: "andon", light: { r: 2.1, col: [1.0, 0.76, 0.42], k: 2.4, mat: "lanternPaper" } },
    water: { model: "forestLantern", light: { r: 1.8, col: [1.0, 0.7, 0.36], k: 2.1, mat: "candle" } },
  };
  // particle emitters from static volumes: falling leaves from maple crowns, fireflies round lanterns
  C.particles = {
    leaves: (p) => p.name === "niwaki" && p.o && p.o.mat === "maple",
    fireflies: (p) => p.name === "hotaru" || p.name === "lantern",
  };
})();

</script>
<script>
/* Momiji's generator maps as v1 engine maps (docs/decisions/2026-10-21-map-format.md, section 3; the
   reference is MapV1.fromGarden in docs/decisions/2026-10-21-map-format.js). The engine stops reading
   map.geo, map.waterD, the map.typ letters and map.path; this adapter turns a generator style into the
   plain-data map the engine reads instead.
     ME.content.mapFromGarden(st)   -> a v1 map (garden() styles: a jar frame; parseMap styles: a box)
     ME.content.gardenWater         -> the water shapes of the garden styles, by style id
     ME.content.checkGardenMap(st)  -> { id, errors, warnings, props, bytes, water: { samples, differ } }
   garden() (vendor/gen/styles4.js) keeps its water shapes in a closure, so the lists below are a copy of
   the ones in styles4.js and styles5.js. Only the outline is kept: the generator's carve and h have
   already shaped the heights. checkGardenMap compares their distance with the closure's at every 1/32
   tile, so a generator update that moves a shape fails the demo self-test. */
(function () {
  const ME = window.ME, C = (ME.content = ME.content || {});
  const B36 = "0123456789abcdefghijklmnopqrstuvwxyz";

  C.gardenWater = {
    "mf-valley": [{ seg: [9.6, 8.2, 9.6, 17.8], r: 0.6 }, { ellipse: [10.4, 19.6, 3.2, 2.0] }],
    "mf-falls": [{ seg: [3.6, 2.6, 3.6, 7.0], r: 0.66 }, { seg: [3.8, 7.4, 6.4, 7.4], r: 0.5 }, { seg: [6.4, 7.4, 6.4, 10.4], r: 0.5 }, { ellipse: [3.9, 7.5, 1.3, 0.95] }, { ellipse: [7.6, 11.5, 2.2, 1.5] }],
  };
  // the older jars of vendor/gen/styles4.js (Koke-dera's pond is shared by three of them)
  const KOKE = [{ ellipse: [4.0, 10.2, 2.4, 1.9] }], RAV = [[11.8, 1.2], [8.6, 5.4], [6.4, 7.6], [3.4, 11.0]];
  Object.assign(C.gardenWater, {
    "jar-koke": KOKE, "jar-kodama": KOKE, "jar-momiji": KOKE,
    "mom-terrace": [{ ellipse: [3.8, 10.6, 2.3, 1.7] }, { seg: [5.3, 6.1, 4.3, 9.4], r: 0.34 }],
    "mom-ravine": RAV.slice(1).map(([x1, y1], i) => ({ seg: [RAV[i][0], RAV[i][1], x1, y1], r: 0.5 })).concat([{ ellipse: [3.2, 11.2, 1.7, 1.3] }]),
    "mom-hill": [{ ellipse: [3.6, 11.0, 2.2, 1.6] }, { seg: [6.2, 6.9, 4.2, 10.0], r: 0.34 }],
  });

  // garden() letters -> the Momiji kinds (content/momiji.js). "t" is a lane without gravel, which the
  // terrain baker bakes as "u"; "v" is a ford (water the route crosses: the route is in game.route);
  // "s" is #26's sand bank. Karesansui's raked gravel "g" gets a style kind, as below.
  const GARDEN_KIND = { m: "moss", u: "lane", t: "lane", w: "water", v: "water", s: "sandbank", _: null };

  // The older parseMap styles (square dioramas, each with its own letters) keep "m" as Momiji moss and
  // get one kind for each other letter (as does a garden letter with no Momiji kind), named
  // "<style id>-<letter>", from the style's terrain entry: water for its water tex, a layer of its top
  // over its side material for the rest. These only make the map complete and valid; how close they
  // come to the generator's look is M1–M4's business.
  const styleKind = (st, ch) => {
    const tr = (st.terrain && st.terrain[ch]) || {}, under = tr.side || "earth";
    if (tr.tex === "water") return { recipe: "water", bed: [tr.pebble || "stone"], shore: tr.pebble || "stone", under };
    const k = { recipe: "layer", top: tr.top || "moss", depth: 0.25, under };
    if (typeof tr.drip === "string") k.drape = tr.drip;
    if (k.top === "moss") k.grass = true;
    return k;
  };

  // the water shapes as one signed distance (+ inside, in tiles), with garden()'s formulas
  const waterDist = (shapes) => {
    if (!shapes || !shapes.length) return null;
    const ds = shapes.map((w) => {
      if (w.ellipse) { const [ex, ey, rx, ry] = w.ellipse; return (x, y) => (1 - Math.hypot((x - ex) / rx, (y - ey) / ry)) * Math.min(rx, ry); }
      const [x0, y0, x1, y1] = w.seg, r = w.r;
      return (x, y) => { const vx = x1 - x0, vy = y1 - y0, k = Math.max(0, Math.min(1, ((x - x0) * vx + (y - y0) * vy) / (vx * vx + vy * vy))); return r - Math.hypot(x - x0 - vx * k, y - y0 - vy * k); };
    });
    return (x, y) => Math.max(...ds.map((d) => d(x, y)));
  };

  C.mapFromGarden = (st) => {
    const m = st.map, garden = !!m.geo, rowsOf = (r) => (typeof r === "string" ? [...r] : r);
    const typ = m.typ.map(rowsOf);
    // the legend: one character per letter used
    const legend = {}, kinds = (C.kinds = C.kinds || {});
    for (const r of typ) for (const ch of r) {
      if (ch in legend) continue;
      if (ch === "_") legend[ch] = null;
      else if (ch === "m" || (garden && ch in GARDEN_KIND)) legend[ch] = GARDEN_KIND[ch];
      else {
        const name = st.id + "-" + ch;
        if (!kinds[name]) kinds[name] = styleKind(st, ch);
        legend[ch] = name;
      }
    }
    if (garden && m.waterD && !C.gardenWater[st.id]) throw new Error("mapFromGarden: no water shapes for " + st.id + " (add them to ME.content.gardenWater)");
    // heights in half steps when they are whole, quarter steps when there are half steps
    const whole = m.hgt.every((r) => r.every(Number.isInteger)), hStep = whole ? 0.5 : 0.25, k = whole ? 1 : 2;
    const props = [];
    for (const d of st.deco || []) {
      if (!d) continue;
      const [name, o, x, y, ex] = d, p = [name, o === undefined ? null : o, x, y];
      if (ex && Object.keys(ex).length) p.push(ex);
      props.push(p);
    }
    const map = {
      v: 1, id: st.id, W: m.W, H: m.H, hStep,
      h: m.hgt.map((r) => (r.every((v) => v * k >= 0 && v * k < 36) ? r.map((v) => B36[v * k]).join("") : r.map((v) => v * k))),
      kind: typ.map((r) => r.join("")),
      legend, floor: m.floor * k,
      water: (garden && C.gardenWater[st.id]) || [],
      props,
    };
    if (garden) {
      // the island: a circle clip round the centre, the drum, its strata and the glass; and today's
      // fixed bake box, written out so a later default can't move Momiji's bytes
      const { C: c, RI } = m.geo;
      map.frame = { type: "jar", c: [c, c], r: RI, foot: (st.clip && st.clip.foot) ?? 0.92, glassTop: st.glassZt ?? 3.4, strata: st.strata || [] };
      map.box = { o: [-1, -1, -2.5], size: [26, 26, 10] };
    } else map.frame = { type: "box" }; // a square block, cut square at the edges (M2)
    map.game = { route: m.path || [] };
    return map;
  };

  // The adapter's check, for the demo self-test: the map validates (once the engine has ME.validateMap,
  // M1) and survives JSON, and its water shapes give the generator's distance exactly
  C.checkGardenMap = (st) => {
    const map = C.mapFromGarden(st), json = JSON.stringify(map), back = JSON.parse(json);
    const val = ME.validateMap ? ME.validateMap(back, C.kinds) : { errors: [], warnings: ["ME.validateMap not built yet (M1)"] };
    const water = { samples: 0, differ: 0 };
    if (st.map.waterD) {
      const wd = waterDist(back.water);
      for (let y = -1; y <= st.map.H + 1; y += 1 / 32) for (let x = -1; x <= st.map.W + 1; x += 1 / 32) { water.samples++; if (wd(x, y) !== st.map.waterD(x, y)) water.differ++; }
    }
    return { id: st.id, errors: val.errors, warnings: val.warnings, props: back.props.length, bytes: json.length, same: JSON.stringify(back) === json, water };
  };
})();

</script>
<script>
/* Critter models for the ambient wildlife (critters.js) and the ground lanterns. Same conventions as the
   generator's models: tile units, anchor at the ground centre, Z up, facing +X, animation phase o.t.
   Critters are baked at o.fine x the voxel density and drawn scaled back down, so bodies a few tenths
   of a tile long keep their shape. ME.content.critters lists the flipbooks the model bake produces, and
   ME.content.addMaterials(st) adds their ramps to a style. */
(function () {
  const ME = window.ME, P = window.PX, { S, E, C, B, Y } = P.prim, TAU = Math.PI * 2, M = window.MODELS;
  const rx = (a) => P.rot("x", a);
  const pitch = (a) => P.rot("y", -a); // raises the +x end of a prim by a
  const near = (x, y, z, c, r) => (x - c[0]) ** 2 + (y - c[1]) ** 2 + (z - c[2]) ** 2 < r * r;
  // a flat wing of length L hinged on the body axis at (x, 0, z), raised by angle a on side sd
  const wing = (x, z, sd, a, L, w, m) => E([x, sd * Math.cos(a) * L * 0.5, z + Math.sin(a) * L * 0.5], [w, L * 0.5, 0.01], m, { R: rx(sd * a) });

  M.squirrel = (o = {}) => {
    const t = o.t ?? 0, ph = t * TAU, p = [], sit = o.pose === "sit";
    let hc;
    if (sit) {
      // upright, nibbling a nut held in the fore paws, tail curled up the back
      const nib = Math.sin(ph * 2) * 0.006;
      hc = [0.035, 0, 0.245 + nib];
      p.push(E([-0.01, 0, 0.125], [0.062, 0.058, 0.095], "squirrel", { k2: 0.03 }), E([-0.015, 0, 0.05], [0.07, 0.07, 0.05], "squirrel", { k2: 0.03 }));
      for (const sd of [-1, 1]) {
        p.push(C([0.03, sd * 0.03, 0.15], [0.07, sd * 0.012, 0.19 + nib], 0.014, 0.011, "squirrel"));
        p.push(E([0.03, sd * 0.045, 0.012], [0.04, 0.02, 0.012], "squirrel"));
      }
      p.push(S([0.082, 0, 0.195 + nib], 0.02, "acorn"));
      [[-0.07, 0.06, 0.035], [-0.13, 0.12, 0.05], [-0.15, 0.21, 0.06], [-0.12, 0.3, 0.058], [-0.07, 0.34, 0.045]].forEach(([x, z, r], k) => p.push(S([x + Math.sin(ph + k) * 0.004, 0, z], r, "squirrelTail", { k2: 0.04 })));
    } else {
      // bounding run: front paws reach while the hind legs push, back stretching and bunching
      const s = Math.sin(ph), c = Math.cos(ph), z0 = 0.1 + Math.abs(s) * 0.035, st = 1 + 0.18 * c;
      hc = [0.12 * st + 0.02, 0, z0 + 0.045];
      p.push(E([0, 0, z0], [0.11 * st, 0.058, 0.06 - 0.008 * c], "squirrel", { k2: 0.03 }));
      for (const sd of [-1, 1]) {
        p.push(C([0.07 * st, sd * 0.032, z0 - 0.02], [0.07 * st + 0.05 * c + 0.02, sd * 0.034, Math.max(0.008, 0.01 + 0.04 * s)], 0.014, 0.01, "squirrel"));
        p.push(E([-0.07 * st, sd * 0.04, z0 - 0.005], [0.05, 0.028, 0.045], "squirrel", { k2: 0.02 }));
        p.push(C([-0.07 * st, sd * 0.04, z0 - 0.03], [-0.07 * st - 0.05 * c, sd * 0.04, Math.max(0.008, 0.01 - 0.04 * s)], 0.016, 0.01, "squirrel"));
      }
      for (let k = 0; k < 5; k++) {
        const u = k / 4, x = -0.11 * st - 0.05 - u * 0.15 + u * u * 0.06, z = z0 + 0.03 + u * 0.16 + Math.sin(ph - k * 0.9) * 0.025;
        p.push(S([x, 0, z], 0.032 + 0.028 * Math.sin(u * Math.PI * 0.9), "squirrelTail", { k2: 0.04 }));
      }
    }
    p.push(S(hc, 0.05, "squirrel", { k2: 0.02 }), E([hc[0] + 0.045, 0, hc[2] - 0.012], [0.03, 0.026, 0.024], "squirrel", { k2: 0.015 }));
    for (const sd of [-1, 1]) {
      p.push(C([hc[0] - 0.01, sd * 0.026, hc[2] + 0.035], [hc[0] - 0.025, sd * 0.032, hc[2] + 0.085], 0.014, 0.004, "squirrel"));
      p.push(S([hc[0] + 0.03, sd * 0.032, hc[2] + 0.012], 0.011, "void"));
    }
    return {
      prims: p, r: 0.3, h: 0.42, k: 1,
      detail: (x, y, z, m, nx, ny, nz) => {
        if (m === "squirrel" && (nz < -0.35 || (sit && nx > 0.55 && z > 0.05 && z < 0.21))) return "squirrelLight";
        if (m === "squirrelTail" && P.noise(x * 60, y * 60, z * 60, 5) > 0.66) return "squirrel";
        return m;
      },
    };
  };

  // o.col "robin" (brown, orange face and breast) or "tit" (green back, blue cap and wings, yellow breast)
  M.songbird = (o = {}) => {
    const t = o.t ?? 0, ph = t * TAU, pose = o.pose || "stand", tit = o.col === "tit", p = [];
    const back = tit ? "titGreen" : "birdBody", wm = tit ? "titBlue" : "birdWing";
    let bc, hc, fwd;
    if (pose === "fly") {
      bc = [0, 0, 0.13]; hc = [0.078, 0, 0.15]; fwd = [1, 0, -0.1];
      p.push(E(bc, [0.075, 0.048, 0.048], back, { k2: 0.03 }), E([-0.1, 0, 0.135], [0.05, 0.034, 0.008], wm));
      const a = 0.15 + Math.sin(ph) * 1.0;
      for (const sd of [-1, 1]) p.push(wing(-0.005, 0.14, sd, a, 0.13, 0.042, wm));
    } else {
      const peck = pose === "peck";
      bc = peck ? [0.012, 0, 0.082] : [0, 0, 0.09];
      hc = peck ? [0.085, 0, 0.06] : [0.06, 0, 0.145];
      fwd = peck ? [0.6, 0, -0.8] : [1, 0, -0.1];
      p.push(E(bc, [0.072, 0.052, 0.056], back, { k2: 0.03, R: pitch(peck ? -0.45 : 0.2) }));
      for (const sd of [-1, 1]) {
        p.push(E([bc[0] - 0.012, sd * 0.045, bc[2] + 0.01], [0.055, 0.012, 0.03], wm, { R: pitch(peck ? -0.4 : 0.25) }));
        p.push(C([0, sd * 0.018, 0.04], [0.01, sd * 0.02, 0], 0.006, 0.005, "birdLeg"));
      }
      p.push(E([-0.09, 0, peck ? 0.13 : 0.1], [0.05, 0.026, 0.008], wm, { R: pitch(peck ? -0.7 : -0.45) }));
    }
    p.push(S(hc, 0.038, back, { k2: 0.025 }));
    const bk = [hc[0] + fwd[0] * 0.032, 0, hc[2] + fwd[2] * 0.032];
    p.push(C(bk, [bk[0] + fwd[0] * 0.03, 0, bk[2] + fwd[2] * 0.03], 0.011, 0.003, "beak"));
    for (const sd of [-1, 1]) p.push(S([hc[0] + 0.02, sd * 0.027, hc[2] + 0.012], 0.008, "void"));
    return {
      prims: p, r: 0.25, h: 0.32, k: 1,
      detail: (x, y, z, m, nx, ny, nz) => {
        if (m !== back) return m;
        const head = near(x, y, z, hc, 0.045);
        if (tit) {
          if (head) return nz > 0.45 ? "titBlue" : Math.abs(ny) > 0.55 ? "titCheek" : m;
          return nz < 0.15 && nx > -0.4 ? "titYellow" : m;
        }
        if (head) return nx > 0.3 && z < hc[2] + 0.01 ? "birdBreast" : m;
        return nx > 0.25 && nz < 0.45 ? "birdBreast" : m;
      },
    };
  };

  // o.col "orange" | "blue" | "yellow"; o.t is the wing beat (open flat at 0.5)
  M.butterfly = (o = {}) => {
    const t = o.t ?? 0, fl = 0.12 + 1.25 * (0.5 + 0.5 * Math.cos(t * TAU)), z0 = 0.02, p = [];
    const wm = o.col === "blue" ? "wingBlue" : o.col === "yellow" ? "wingYellow" : "wingOrange";
    p.push(C([-0.045, 0, z0], [0.03, 0, z0 + 0.004], 0.008, 0.011, "bugBody"), S([0.04, 0, z0 + 0.006], 0.012, "bugBody"));
    for (const sd of [-1, 1]) {
      const tip = [0.087, sd * 0.032, z0 + 0.055];
      p.push(C([0.045, sd * 0.006, z0 + 0.012], tip, 0.004, 0.003, "bugBody"), S(tip, 0.007, "bugBody"));
      p.push(wing(0.016, z0 + 0.006, sd, fl, 0.1, 0.046, wm), wing(-0.03, z0 + 0.004, sd, fl * 0.92, 0.078, 0.036, wm));
    }
    return {
      prims: p, r: 0.16, h: 0.2, k: 1,
      detail: (x, y, z, m) => {
        if (m !== wm) return m;
        const d = Math.hypot(y, z - z0), lim = x > -0.006 ? 0.082 : 0.062;
        if (d > lim) return "wingEdge";
        if (d > lim - 0.022 && P.noise(x * 80, y * 80, z * 80, 4) > 0.56) return "wingSpot";
        return m;
      },
    };
  };

  M.dragonfly = (o = {}) => {
    const t = o.t ?? 0, ph = t * TAU, z0 = 0.025, p = [
      C([-0.2, 0, z0 + 0.012], [0.02, 0, z0], 0.007, 0.011, "dragonBody"),
      E([0.035, 0, z0], [0.026, 0.017, 0.019], "dragonBody", { k2: 0.01 }),
      S([0.066, 0, z0 + 0.002], 0.014, "dragonBody"),
    ];
    for (const sd of [-1, 1]) {
      p.push(S([0.073, sd * 0.013, z0 + 0.008], 0.012, "dragonEye"));
      p.push(wing(0.045, z0 + 0.016, sd, 0.12 + 0.3 * Math.sin(ph), 0.2, 0.019, "dragonWing"));
      p.push(wing(0.016, z0 + 0.016, sd, 0.12 + 0.3 * Math.sin(ph + 2.2), 0.19, 0.023, "dragonWing"));
    }
    return { prims: p, r: 0.22, h: 0.14, k: 1, detail: (x, y, z, m) => (m === "dragonBody" && x < 0 && ((x * 40) % 1 + 1) % 1 < 0.3 ? "dragonDark" : m) };
  };

  M.bee = (o = {}) => {
    const t = o.t ?? 0, a = 0.3 + 0.7 * Math.sin(t * TAU), z0 = 0.035, p = [
      E([-0.005, 0, z0], [0.042, 0.031, 0.031], "bee", { k2: 0.01 }),
      S([0.042, 0, z0 + 0.004], 0.02, "beeDark"),
    ];
    for (const sd of [-1, 1]) {
      p.push(wing(-0.004, z0 + 0.024, sd, a, 0.065, 0.024, "beeWing"));
      p.push(C([0.052, sd * 0.008, z0 + 0.012], [0.07, sd * 0.02, z0 + 0.032], 0.003, 0.003, "beeDark"));
    }
    return { prims: p, r: 0.08, h: 0.1, k: 1, detail: (x, y, z, m) => (m === "bee" && (x < -0.034 || ((x + 1) * 45) % 1 < 0.38) ? "beeDark" : m) };
  };

  M.frog = (o = {}) => {
    const t = o.t ?? 0, p = [];
    let hc;
    if (o.pose === "jump") {
      hc = [0.09, 0, 0.115];
      p.push(E([0, 0, 0.09], [0.1, 0.058, 0.045], "frog", { k2: 0.02, R: pitch(0.25) }), E(hc, [0.05, 0.055, 0.035], "frog", { k2: 0.02 }));
      for (const sd of [-1, 1]) {
        p.push(C([-0.07, sd * 0.04, 0.08], [-0.2, sd * 0.05, 0.035], 0.022, 0.01, "frog"), E([-0.215, sd * 0.05, 0.03], [0.03, 0.022, 0.006], "frog"));
        p.push(C([0.08, sd * 0.04, 0.07], [0.145, sd * 0.05, 0.03], 0.012, 0.008, "frog"));
      }
    } else {
      // squat, nose up, throat pulsing
      const pulse = Math.max(0, Math.sin(t * TAU)) * 0.012;
      hc = [0.055, 0, 0.095];
      p.push(E([-0.015, 0, 0.065], [0.085, 0.068, 0.05], "frog", { k2: 0.02, R: pitch(0.3) }), E(hc, [0.05, 0.062, 0.038], "frog", { k2: 0.025 }));
      p.push(E([0.062, 0, 0.06 - pulse * 0.5], [0.035, 0.04, 0.022 + pulse], "frogBelly", { k2: 0.01 }));
      for (const sd of [-1, 1]) {
        p.push(E([-0.06, sd * 0.06, 0.035], [0.06, 0.028, 0.032], "frog", { k2: 0.015 }), E([0, sd * 0.075, 0.008], [0.045, 0.022, 0.008], "frog"));
        p.push(C([0.06, sd * 0.045, 0.05], [0.085, sd * 0.05, 0.006], 0.013, 0.009, "frog"));
      }
    }
    for (const sd of [-1, 1]) {
      p.push(S([hc[0] + 0.01, sd * 0.038, hc[2] + 0.033], 0.02, "frog"));
      p.push(S([hc[0] + 0.022, sd * 0.045, hc[2] + 0.04], 0.012, "frogEye"), S([hc[0] + 0.032, sd * 0.049, hc[2] + 0.042], 0.006, "void"));
    }
    return {
      prims: p, r: 0.25, h: 0.2, k: 1,
      detail: (x, y, z, m, nx, ny, nz) => (m !== "frog" ? m : nz < -0.3 ? "frogBelly" : nz > 0.4 && P.noise(x * 50, y * 50, z * 50, 6) > 0.62 ? "frogDark" : m),

  };

  // o.col "ogon" (all gold) or kohaku patches seeded by o.seed; a travelling wave swings the tail
  M.koi = (o = {}) => {
    const t = o.t ?? 0, ph = t * TAU, z0 = 0.045, p = [], N = 7;
    const wig = (x) => Math.sin(ph - x * 18) * 0.022 * (0.25 + (0.14 - x) * 3.5);
    for (let k = 0; k < N; k++) {

      p.push(E([x, wig(x), z0], [0.032, w, w * 0.85], "koiWhite", { k2: 0.02 }));

    p.push(E([-0.175, wig(-0.175), z0 + 0.004], [0.032, 0.006, 0.034], "koiFin"));
    for (const sd of [-1, 1]) {
      p.push(E([0.075, sd * 0.045 + wig(0.075), z0 - 0.016], [0.022, 0.018, 0.004], "koiFin", { R: rx(sd * 0.4) }));
      p.push(S([0.135, sd * 0.021 + wig(0.135), z0 + 0.012], 0.006, "void"));
    }
    return {
      prims: p, r: 0.22, h: 0.1, k: 1,
      detail: (x, y, z, m) => (m !== "koiWhite" ? m : o.col === "ogon" ? "koiGold" : P.noise(x * 22 + 3, y * 22, z * 22 + (o.seed || 0) * 5.3, 2) > 0.5 ? "koiOrange" : m),
    };
  };

  // o.pose "sit" (o.t twitches an ear) or "hop" (o.t runs crouch -> stretched -> crouch)
  M.bunny = (o = {}) => {
    const t = o.t ?? 0, hop = o.pose === "hop", s = hop ? Math.sin(t * Math.PI) : 0, tw = hop ? 0 : Math.max(0, Math.sin(t * TAU)), p = [];
    const hc = [0.07 + s * 0.05, 0, 0.15 - s * 0.02];
    p.push(E([-0.015, 0, 0.085 + s * 0.03], [0.085 + s * 0.035, 0.068, 0.072 - s * 0.012], "bunny", { k2: 0.03, R: pitch(0.15 - s * 0.25) }));
    p.push(E(hc, [0.056, 0.048, 0.046], "bunny", { k2: 0.025 }));
    for (const sd of [-1, 1]) {
      const ea = s * 0.9 + (sd > 0 ? tw * 0.3 : 0), e0 = [hc[0] - 0.01, sd * 0.02, hc[2] + 0.035];
      p.push(C(e0, [e0[0] - 0.02 - Math.sin(ea) * 0.09, sd * 0.032, e0[2] + Math.cos(ea) * 0.1], 0.017, 0.012, "bunny"));
      p.push(S([hc[0] + 0.035, sd * 0.03, hc[2] + 0.012], 0.01, "void"));
      p.push(E([-0.05 - s * 0.03, sd * 0.05, 0.05 + s * 0.03], [0.058, 0.028, 0.045], "bunny", { k2: 0.02 }));
      p.push(C([-0.05 - s * 0.03, sd * 0.05, 0.03 + s * 0.03], [-0.02 - s * 0.14, sd * 0.05, 0.008 + s * 0.02], 0.016, 0.012, "bunny"));
      p.push(C([0.05 + s * 0.03, sd * 0.03, 0.06 + s * 0.02], [0.065 + s * 0.08, sd * 0.03, 0.008 + s * 0.03], 0.012, 0.01, "bunny"));
    }
    p.push(S([hc[0] + 0.055, 0, hc[2] - 0.005], 0.009, "bunnyNose"), S([-0.1 - s * 0.03, 0, 0.1 + s * 0.02], 0.028, "bunnyTail"));
    return { prims: p, r: 0.24, h: 0.3, k: 1, detail: (x, y, z, m, nx, ny, nz) => (m === "bunny" && nz < -0.45 ? "bunnyTail" : m) };
  };

  M.snail = (o = {}) => {
    const t = o.t ?? 0, ph = t * TAU, st = Math.sin(ph) * 0.008, sc = [-0.012, 0, 0.065], p = [
      E([st, 0, 0.016], [0.085 + st, 0.024, 0.016], "snailBody", { k2: 0.01 }),

  // Ground lanterns. forestLantern: a squat moss-capped stone yukimi on three feet; andon: a paper lamp

  M.forestLantern = (o = {}) => {
    const r = P.rng(o.seed || 3), s = 0.9 + r() * 0.2, p = [];
    for (let k = 0; k < 3; k++) { const a = (k / 3) * TAU + 0.5; p.push(C([Math.cos(a) * 0.08 * s, Math.sin(a) * 0.08 * s, 0], [Math.cos(a) * 0.05 * s, Math.sin(a) * 0.05 * s, 0.07 * s], 0.018, 0.014, "stone")); }

    p.push(B([0, 0, 0.14 * s], [0.052 * s, 0.052 * s, 0.045 * s], 0.008, "stone"));
    p.push(B([0.052 * s, 0, 0.14 * s], [0.008, 0.028 * s, 0.026 * s], 0, "candle"), B([0, 0.052 * s, 0.14 * s], [0.028 * s, 0.008, 0.026 * s], 0, "candle"));
    p.push(B([-0.052 * s, 0, 0.14 * s], [0.008, 0.028 * s, 0.026 * s], 0, "candle"), B([0, -0.052 * s, 0.14 * s], [0.028 * s, 0.008, 0.026 * s], 0, "candle"));
    p.push(C([0, 0, 0.19 * s], [0, 0, 0.25 * s], 0.13 * s, 0.02, "stone"), S([0, 0, 0.265 * s], 0.025 * s, "stone"));
    return { prims: p, r: 0.18, h: 0.3, k: 1.4, lz: 0.14 * s, detail: (x, y, z, m, nx, ny, nz) => (m === "stone" && nz > 0.45 && P.noise(x * 30, y * 30, z * 30, 3) > 0.4 ? "moss" : m) };
  };
  M.andon = (o = {}) => {
    const r = P.rng(o.seed || 5), hgt = 0.2 + r() * 0.08, p = [
      Y([0, 0, hgt * 0.5], 0.018, hgt * 0.5, "lanternWood"),
      B([0, 0, hgt + 0.065], [0.055, 0.055, 0.065], 0.004, "lanternPaper"),
      B([0, 0, hgt + 0.002], [0.062, 0.062, 0.008], 0.002, "lanternWood"),
      B([0, 0, hgt + 0.135], [0.07, 0.07, 0.008], 0.003, "lanternWood"),
      C([0, 0, hgt + 0.143], [0, 0, hgt + 0.18], 0.045, 0.01, "lanternWood"),
    ];
    for (const [dx, dy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) p.push(B([dx * 0.055, dy * 0.055, hgt + 0.065], [0.007, 0.007, 0.066], 0, "lanternWood"));
    return { prims: p, r: 0.12, h: hgt + 0.2, k: 1.4, lz: hgt + 0.065, detail: (x, y, z, m) => (m === "lanternPaper" && ((z - hgt) * 30 % 1 + 1) % 1 < 0.14 ? "paperRib" : m) };
  };

  // flipbooks for the critter sim: key -> [model, options, frames, fine]. Drawn CRITTER_SCALE x life size;
  // fine 1.5 gives them voxels a little smaller than the terrain's, 2 for the insects.
  const content = (ME.content = ME.content || {});
  content.critterScale = 1.6;
  content.critters = {
    squirrelRun: ["squirrel", { pose: "run" }, 4, 1.5], squirrelSit: ["squirrel", { pose: "sit" }, 2, 1.5],
    robinStand: ["songbird", { col: "robin" }, 1, 1.5], robinPeck: ["songbird", { col: "robin", pose: "peck" }, 1, 1.5], robinFly: ["songbird", { col: "robin", pose: "fly" }, 4, 1.5],
    titStand: ["songbird", { col: "tit" }, 1, 1.5], titPeck: ["songbird", { col: "tit", pose: "peck" }, 1, 1.5], titFly: ["songbird", { col: "tit", pose: "fly" }, 4, 1.5],
    butterflyOrange: ["butterfly", { col: "orange" }, 4, 2], butterflyBlue: ["butterfly", { col: "blue" }, 4, 2], butterflyYellow: ["butterfly", { col: "yellow" }, 4, 2],
    dragonfly: ["dragonfly", { size: 0.7 }, 2, 2], bee: ["bee", {}, 2, 2],
    frogSit: ["frog", {}, 2, 1.5], frogJump: ["frog", { pose: "jump" }, 1, 1.5],
    koiKohaku: ["koi", { seed: 1 }, 4, 1.5], koiKohaku2: ["koi", { seed: 4 }, 4, 1.5], koiOgon: ["koi", { col: "ogon" }, 4, 1.5],
    bunnySit: ["bunny", {}, 2, 1.5], bunnyHop: ["bunny", { pose: "hop" }, 4, 1.5],
    snail: ["snail", {}, 2, 2], beetle: ["beetle", { size: 0.32 }, 4, 1.5], moth: ["fluffmoth", { size: 0.32 }, 4, 2],
  };

  // Ramps and material flags for the new materials; a style's own entries win.
  const RAMPS = {
    squirrel: ["#b8622a", 6, 0.12, 0.62, 0.3], squirrelTail: ["#c87434", 6, 0.16, 0.7, 0.3], squirrelLight: ["#ecd2a6", 5, 0.45, 0.92, 0.2], acorn: ["#8a5a2a", 4, 0.15, 0.55],
    birdBody: ["#7c5a40", 5, 0.12, 0.6, 0.25], birdWing: ["#5e4432", 5, 0.08, 0.5, 0.2], birdBreast: ["#e8692c", 5, 0.25, 0.78, 0.3], beak: ["#e0a040", 4, 0.3, 0.75], birdLeg: ["#6a5040", 3, 0.15, 0.5],
    titGreen: ["#8aa046", 5, 0.2, 0.7, 0.3], titBlue: ["#4a82c8", 5, 0.15, 0.7, 0.25], titYellow: ["#f2d24a", 5, 0.35, 0.9, 0.25], titCheek: ["#f4f0e4", 3, 0.6, 0.95],
    bugBody: ["#2e2a2c", 3, 0.05, 0.3], wingOrange: ["#f28a2c", 5, 0.3, 0.82, 0.3], wingBlue: ["#58a6f0", 5, 0.25, 0.85, 0.25], wingYellow: ["#f4dc5c", 5, 0.4, 0.92, 0.25],
    wingEdge: ["#2a2226", 3, 0.04, 0.28], wingSpot: ["#fbf6ea", 2, 0.7, 0.98],
    dragonBody: ["#2aa89a", 5, 0.12, 0.7, 0.25], dragonDark: ["#1d3a40", 3, 0.04, 0.3], dragonEye: ["#3a6ad0", 4, 0.2, 0.75], dragonWing: ["#d8eef4", 3, 0.6, 0.97],
    bee: ["#f2bc2a", 4, 0.3, 0.82, 0.3], beeDark: ["#2e2622", 3, 0.04, 0.28], beeWing: ["#eef4f8", 2, 0.75, 0.98],
    frog: ["#5aa83a", 5, 0.15, 0.72, 0.3], frogDark: ["#2f6a2a", 4, 0.08, 0.45], frogBelly: ["#d8dca0", 4, 0.45, 0.9], frogEye: ["#e8b838", 3, 0.4, 0.85],
    koiWhite: ["#f4efe6", 4, 0.55, 0.97], koiOrange: ["#f06424", 5, 0.25, 0.8, 0.3], koiGold: ["#f2b438", 5, 0.3, 0.88, 0.3], koiFin: ["#f6d2b4", 3, 0.55, 0.95],
    bunny: ["#9c8068", 5, 0.15, 0.68, 0.25], bunnyTail: ["#f2ece0", 3, 0.6, 0.96], bunnyNose: ["#e89a9a", 2, 0.5, 0.85],
    snailShell: ["#b8783e", 5, 0.15, 0.7, 0.3], snailDark: ["#5a3a24", 3, 0.06, 0.4], snailBody: ["#c4b494", 4, 0.3, 0.8],
    lanternPaper: ["#ffb45c", "#ffd890", "#fff2cc"], lanternWood: ["#5a3a26", 5, 0.08, 0.5], candle: ["#ffb347", "#ffe8a8", "#fffbe8"], paperRib: ["#c9955a", 3, 0.3, 0.62],
  };
  const MATS = {
    squirrel: { wrap: 0.5 }, squirrelTail: { wrap: 0.6 }, bunny: { wrap: 0.5 }, bunnyTail: { wrap: 0.6 },
    wingOrange: { wrap: 0.7 }, wingBlue: { wrap: 0.7 }, wingYellow: { wrap: 0.7 }, dragonWing: { wrap: 0.8, bias: 0.15 }, beeWing: { wrap: 0.8, bias: 0.15 }, koiFin: { wrap: 0.7 },
    lanternPaper: { em: 1, flat: 1 }, candle: { em: 1, flat: 1 },
  };
  // Ramps that win over the style's own. The generator's sand (["#e2b878", …, 0.3]) hue-shifts its shade from
  // ochre the short way round through red, so shaded sand banks drew as a crimson band. The Momiji sand is an
  // explicit list, dark to light, that stays in warm browns and ochres.
  const OWN = {
    sand: ["#6a4a2e", "#80593a", "#977046", "#ad8652", "#c29c62", "#d4b276", "#e2c68e", "#eed8aa"],
  };
  content.addMaterials = (st) => {
    for (const k in RAMPS) if (!st.ramps[k]) st.ramps[k] = RAMPS[k];
    Object.assign(st.ramps, OWN);
    for (const k in MATS) if (!st.mats[k]) st.mats[k] = MATS[k];
  };
})();

<script>
/* Materials: name -> 8-bit id, resolved through the style's mats/ramps exactly like px.js does
   (mat.ramp || name). Each material gets a base albedo (its ramp near s = 0.6 + bias), a lighting
   class, and its whole hue-shifted ramp resampled to 16 steps for the ramp-shading mode. */
(function () {
  const ME = window.ME, P = window.PX;
  // lighting classes; which material is which comes from the content (ME.content.materialClass)
  const CLS = (ME.CLS = { DEFAULT: 0, MOSS: 1, FOLIAGE: 2, EMISSIVE: 3, WATER: 4, ROCK: 5, BARK: 6, SKIN: 7 });
  // per-voxel albedo jitter by class (the "voxel grain")
  const VAR = [0.1, 0.12, 0.18, 0, 0.04, 0.16, 0.14, 0.06];

  class Palette {
    constructor(st) { this.st = st; this.names = [null]; this.ids = {}; this.missing = new Set(); }
    id(name) {
      let i = this.ids[name];
      if (i !== undefined) return i;
      i = this.names.length;
      if (i > 255) throw new Error("more than 255 materials");
      this.names.push(name); this.ids[name] = i;
      return i;
    }
    mat(name) { return Object.assign({ ramp: name }, this.st.mats[name] || {}); }
    ramp(name) {
      const M = this.mat(name);
      let spec = this.st.ramps[M.ramp];
      if (!spec) { this.missing.add(name); spec = this.st.ramps.stone; }
      return P.makeRamp(spec);
    }
    // GPU tables: mats = 2 x vec4 per id [albedo.rgb(linear), emissive] [wrap, jitter, bias, class];
    // ramps = 16 x 256 rgba8 (sRGB) rows.
    build() {
      const mats = new Float32Array(256 * 8), ramps = new Uint8Array(16 * 256 * 4), byName = (ME.content && ME.content.materialClass) || {};
      for (let i = 1; i < this.names.length; i++) {
        const name = this.names[i], M = this.mat(name), r = this.ramp(name), n = r.length;
        const cls = M.em ? CLS.EMISSIVE : M.cls ?? CLS[byName[name]] ?? CLS.DEFAULT; // mats may give their class number (cls)
        const s0 = Math.min(1, Math.max(0, 0.6 + (M.bias || 0))), c = r[Math.round(s0 * (n - 1))];
        mats.set([ME.lin(c[0]), ME.lin(c[1]), ME.lin(c[2]), M.em ? 1 : 0, M.wrap ?? 0.25, VAR[cls], M.bias || 0, cls], i * 8);
        for (let j = 0; j < 16; j++) {
          const g = (j / 15) * (n - 1), a = Math.floor(g), b = Math.min(n - 1, a + 1), t = g - a;
          for (let k = 0; k < 3; k++) ramps[(i * 16 + j) * 4 + k] = Math.round(r[a][k] + (r[b][k] - r[a][k]) * t);
          ramps[(i * 16 + j) * 4 + 3] = 255;
        }
      }
      return { mats, ramps };
    }
  }
  ME.Palette = Palette;
})();

</script>
<script>
/* Terrain bake: a map voxelised at ME.VS voxels per tile edge. The map is a v1 map (st.map.v !== undefined,
   docs/decisions/2026-10-21-map-format.md: heights, kinds from ME.content.kinds, water shapes, props, a
   frame) or a generator map (the diorama format: letters, heights, a water closure, deco), which the bake
   reads as a v1 map whose kinds come from the content's terrain roles (the old style path, until M6).
   Columns rise from the floor to the tile's top; the kind's recipe gives the top (moss carpet, gravel lane
   with stepping stones, pebble river bed, a layer of sand), the next few voxels a hanging moss drape,
   everything below the kind's under material. Lips get 1-3 voxel moss overhangs, the island is clipped to
   its circle over a strata drum and a wooden plinth (the jar frame), and static props are stamped in from
   their SDFs. Which deco become volumes or walkers instead of terrain comes from the content
   (ME.content.volumeDeco, .walkers); the jar, the drape and the lobes take their materials from
   ME.content.terrain. */
(function () {
  const ME = window.ME, P = window.PX, sm = P.smooth;
  // deco names asset packs want as ray-marched volumes (added to the content's volumeDeco)
  ME.VOLUME_DECO = ME.VOLUME_DECO || new Set();

  // ---- Map format v1: the validator (the reference's MapV1.validate, docs/decisions/2026-10-21-map-format.js)
  const B36 = "0123456789abcdefghijklmnopqrstuvwxyz";
  const STEPS = [0.25, 0.5, 1];
  const RECIPES = {
    // required and optional parameters of each terrain recipe
    layer: { need: ["top", "depth", "under"], may: ["mottle", "mottleK", "edge", "stripe"] },
    carpet: { need: ["top", "under"], may: ["mottle", "cushions", "litter"] },
    lane: { need: ["top", "under"], may: ["stones", "edge"] },
    water: { need: ["bed", "under"], may: ["shore", "bank", "surface", "depth"] },
  };
  const FLAGS = ["drape", "overhang", "grass", "fringe", "lamps", "recipe"];
  const AT = ["dx", "dy", "dz", "rot", "flip", "overWater", "as"];

  // anything a JSON round trip would drop or change: functions, undefined, NaN, Infinity, -0
  const impure = (v, path, out) => {
    if (typeof v === "function" || typeof v === "undefined" || typeof v === "symbol" || typeof v === "bigint") out.push(path + " is " + typeof v);

    const c = { VS, X: 0, Y: 0, cx: 0, cy: 0, trees, wetV, fringes }, out = {};
    const DRAPE = [M.moss, M.moss2], skirt = !jar && F.edge && F.edge.skirt ? id(F.edge.skirt) : 0, e1 = 1 / VS; // e1: the outermost voxel ring of the map

    for (let j = 0; j < NY; j++) {
      if ((j & 31) === 0) { ME.progress("terrain columns " + Math.round((j / NY) * 100) + "%", 0.05 + 0.15 * (j / NY)); await ME.tick(); }

      for (let i = 0; i < NX; i++) {
        const X = O[0] + (i + 0.5) / VS, col = j * NX + i;

          for (let k = kPB; k < kPT; k++) vox[k * PLANE + col] = k === kPT - 1 && r > PL_R - 0.09 ? M.brass : M.wood;
