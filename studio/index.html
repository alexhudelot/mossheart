            if (shell) {

        if (!kd) continue;
        // terrain column: the kind's recipe gives the surface material and micro relief
        out.kT = kOf(G.z[cy * G.W + cx]); out.mTop = 0; out.extra = 0; out.two = false; out.bed = false; out.layer = 0;
        c.X = X; c.Y = Y; c.cx = cx; c.cy = cy;

        if (bed) wetCols++;

        const dr = layer ? null : jar ? DRAPE : kd.drape;

        const n1 = P.noise(X * 9, Y * 9, 0, 5);
        if (n1 > 0.52) dd += Math.round((n1 - 0.52) * 30);
        if (P.noise(X * 21, Y * 21, 0, 6) > 0.8) dd += 5;
        const kEnd = kT + extra;
        for (let k = kF; k < kEnd; k++) {
          const dz = kEnd - 1 - k;

        }
        if (jar) for (let k = kEnd; k < kD; k++) vox[k * PLANE + col] = 0; // beds carved below the drum top

        if (skirt && (X < e1 || Y < e1 || X > G.W - e1 || Y > G.H - e1)) for (let k = kF; k < kEnd - 1; k++) vox[k * PLANE + col] = skirt;
        top[col] = kEnd;
      }
    }

    // Moss overhangs: where a column stands 4+ voxels above a neighbour, hang 0-3 voxels over the lip.
    ME.progress("moss overhangs", 0.21); await ME.tick();
    const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    let lobes = 0;
    for (let j = 1; j < NY - 1; j++) for (let i = 1; i < NX - 1; i++) {

    // Static props stamped into the grid; volume props and walkers are returned for the model bake.
    const grid = { vox, NX, NY, NZ, O, vs: VS };
    const volumes = [], walkers = [];
    let stamped = 0, propCount = 0;
    const deco = G.props;
    for (let n = 0; n < deco.length; n++) {
      const [name, o, x, y, ex] = deco[n];
      if (!name || !window.MODELS[name]) continue;
      const place = { name, o, X: x + 0.5 + (ex.dx || 0), Y: y + 0.5 + (ex.dy || 0), Z: G.z[y * G.W + x] + (ex.dz || 0), flip: !!ex.flip };

      if (VOLUME_DECO.has(name)) { volumes.push(place); continue; }
      if ((n & 7) === 0) { ME.progress("stamping props " + n + "/" + deco.length, 0.22 + 0.1 * (n / deco.length)); await ME.tick(); }
      stamped += ME.stampModel(ME.modelOf(name, o), place, grid, pal);
      propCount++;

    // Ground lamps (content.groundLamps): one kind lining the lanes, another by the water, on moss tiles
    // clear of the props, at least `spacing` tiles apart. Stamped into the grid; each one lights.
    const lights = [], GL = CT.groundLamps;
    if (GL) {
      const surfZ = (X, Y, zFrom) => {
        const i = Math.floor((X - O[0]) * VS), j = Math.floor((Y - O[1]) * VS);
        for (let k = Math.min(NZ - 1, kOf(zFrom)); k >= 0; k--) if (vox[k * PLANE + j * NX + i]) return O[2] + (k + 1) / VS;
        return zFrom;
      };
      const taken = deco.filter((d) => window.MODELS[d[0]]).map((d) => [d[2] + 0.5 + (d[4].dx || 0), d[3] + 0.5 + (d[4].dy || 0)]);
      const cand = [];
      for (let cy = 0; cy < G.H; cy++) for (let cx = 0; cx < G.W; cx++) {
        const kd = kindAt(cx, cy);

        let dir = null, kind = null;
        for (const [dx, dy] of D4) {
          const t = recipeAt(cx + dx, cy + dy);

        placed.push({ X, Y });

        const L = c.kind.light;
        lights.push({ p: lp, r: L.r, col: L.col.slice(), k: L.k, mat: L.mat });
      }
    }

    // The map's point lights (tiles)
    for (const l of G.lights) lights.push({ p: l.p.slice(), r: l.r, col: l.col.slice(), k: l.k });

    // Water: one surface quad per wet tile, falls where a wet tile steps down into lower water.
    const water = [], falls = [];
    for (let cy = 0; cy < G.H; cy++) for (let cx = 0; cx < G.W; cx++) {
      const kd = kindAt(cx, cy);
      if (!kd || kd.recipe !== "water") continue;
      let any = false;
      for (let s = 0; s < 64 && !any; s++) any = wetV(cx + ((s % 8) + 0.5) / 8, cy + (Math.floor(s / 8) + 0.5) / 8) > 0;
      if (!any) continue;
      const h = G.hv[cy * G.W + cx], Zw = G.z[cy * G.W + cx] - kd.surface;
      let fx = 0, fy = 0;
      for (const [dx, dy] of D4) if (recipeAt(cx + dx, cy + dy) === "water") { const dh = G.hv[(cy + dy) * G.W + cx + dx] - h; if (dh < 0) { fx += dx; fy += dy; } else if (dh > 0) { fx -= dx; fy -= dy; } }
      const stream = G.wd && Math.abs(G.wd(cx + 0.5, cy + 0.5)) < 1 && (fx || fy) ? 1 : 0;
      water.push({ x: cx, y: cy, z: Zw, fx, fy, stream });

        if (hb >= h) continue;

          if (wetV(ex, ey) > 0) { u0 = Math.min(u0, u - 0.5 / 32); u1 = Math.max(u1, u + 0.5 / 32); }
        }
        if (u1 <= u0) continue;
        const ztop = Zw, zbot = G.z[ib] - kindAt(cx + dx, cy + dy).surface, off = 0.7 / VS;
        // the falling sheet stands just in front of the cliff face, facing the lower tile
        const ex0 = dx ? cx + (dx > 0 ? 1 + off : -off) : cx + u0, ey0 = dy ? cy + (dy > 0 ? 1 + off : -off) : cy + u0;
        const ex1 = dx ? ex0 : cx + u1, ey1 = dy ? ey0 : cy + u1;

    ME.progress("density mips", 0.33); await ME.tick();

    const f = ME.coarseStep(VS), CPU = VS / f, QX = NX / f, QY = NY / f, QZ = (B.size[2] + 3) * CPU, coarse = new Uint8Array(QX * QY * QZ);

    const stats = { dims: [NX, NY, NZ], solid, wetCols, lobes, props: propCount, lanterns: lights.length, stampedVoxels: stamped, water: water.length, falls: falls.length, zTop: O[2] + (kMax + 1) / VS, ms: Math.round(ME.now() - t0) };

    const bounds = { min: O.slice(), max: [O[0] + B.size[0], O[1] + B.size[1], O[2] + B.size[2]] };
    const T = { O, NX, NY, NZ, VS, vox, top, mips: [d1, d2], coarse, cdims: [QX, QY, QZ], CPU, volumes, walkers, water, falls, beams, lights, stats, bounds, frame: F,

  // the bake cache key's code: the bake's helpers and its tables (cache.js)
  ME.bakeTerrain.parts = [ME.validateMap, ME.waterDist, gridOf, resolve, heights, kindNames, rows, impure, ...Object.values(RECIPE),
    JSON.stringify({ B36, STEPS, RECIPES, FLAGS, AT, FIXED_BOX })];

  // The coarse occupancy (docs/decisions/2026-10-20-sun-volume-density.md): one cell is f voxels on a side,
  // f the largest divisor of VS that keeps VS / f >= 8 cells per tile, and at least 2 (f = 2 up to vs=20,
  // as before: the low densities phones pick keep their small volume; 3 at 24, 8 at 64).
  ME.coarseStep = (VS) => { let f = VS; while (VS % f || VS / f < 8) f--; return Math.max(2, f); };
  // Refill the coarse cells lo..hi (inclusive, cell coordinates) from T.vox: the occupancy averaged over
  // the cell's f^3 voxels (the bake fills the whole grid, a carve the box around the change), plus the
  // static volumes' splat (T.splat, from the model bake) so a carve keeps the trees' shade.
  ME.coarseFill = (T, lo, hi) => {
    const { vox, NX, NY, NZ, coarse, cdims, splat } = T, f = T.VS / T.CPU, n = f * f * f, PL = NX * NY;
    for (let z = lo[2]; z <= hi[2]; z++) for (let y = lo[1]; y <= hi[1]; y++) for (let x = lo[0]; x <= hi[0]; x++) {
      let s = 0;
      for (let k = z * f; k < Math.min(NZ, z * f + f); k++) for (let j = y * f; j < y * f + f; j++) {

        for (let i = x * f; i < x * f + f; i++) if (vox[row + i]) s += 255;
      }

      coarse[c] = splat ? Math.min(255, Math.floor(s / n) + splat[c]) : Math.floor(s / n);

  // Walkable ground: first solid voxel scanning down from zFrom (rebuilt from the arrays on a cache hit).
  ME.groundAt = (T) => {
    const { O, NX, NY, NZ, VS, vox } = T, PLANE = NX * NY;
    return (X, Y, zFrom) => {
      const i = Math.floor((X - O[0]) * VS), j = Math.floor((Y - O[1]) * VS);

      for (let k = Math.min(NZ - 1, Math.floor((zFrom - O[2]) * VS)); k >= 0; k--) if (vox[k * PLANE + j * NX + i]) return O[2] + (k + 1) / VS;
      return O[2];
    };
  };
})();

<script>
/* Model bake: the scene's volume props, its walkers and critters, and any models an app asks for,
   voxelised for the ray-marched volume pass. Animated models are baked as flipbooks over the
   generator's own animation phase o.t. Volumes are laid out brick-aligned (8^3) in a virtual atlas that
   exists only as a brick map; the voxels of occupied bricks live in a dense brick pool. Static volumes
   are also splatted into the coarse occupancy so trees shade the sun volume. Frame counts, walkers,
   critters and glowing materials come from ME.content. */
(function () {
  const ME = window.ME;
  // registries asset packs add to (assets/asset-kit.js and friends), on top of the content pack's tables:
  // flipbook frames per model, emissive material -> point light [r, g, b, k(, radius)]
  ME.FRAMES = ME.FRAMES || {};
  ME.LIGHT_COL = ME.LIGHT_COL || {};

  // opts.walkers = false skips the content's walkers; opts.models = { key: [name, o, frames] } adds
  // flipbooks for an app's own instance layer (returned as extraFrames[key]). Model options o.scale
  // and o.remap (material name -> name) let an app reuse and recolour the content's models.
  ME.bakeModels = async function (T, st, pal, opts = {}) {
    const CT = ME.content, FRAMES = Object.assign({}, ME.FRAMES, CT.flipbookFrames), LIGHT_COL = Object.assign({}, ME.LIGHT_COL, CT.primLights);
    const t0 = ME.now(), VS = ME.VS, variants = [], byKey = new Map();
    const add = (name, o) => {
      const key = name + JSON.stringify(o);
      if (byKey.has(key)) return byKey.get(key);
      const idx = variants.length;
      variants.push({ name, o, key }); byKey.set(key, idx);
      return idx;
    };
    // flipbook frames for a model name, keeping the deco's own options
    const frames = (name, o) => { const n = FRAMES[name] || 1; if (n === 1) return [add(name, o)]; return Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n }))); };

    const statics = T.volumes.map((v) => ({ place: v, frames: frames(v.name, v.o), phase: v.o && v.o.t !== undefined ? v.o.t : 0 }));
    // walkers on the route: the style's own list (st.walkers), else the content's; each is
    // { type, model?, o?, speed, rate, gait: hop | roll | fly, fly? (hover height) }
    const walkerTypes = opts.walkers === false ? [] : st.walkers || Object.entries(CT.walkers || {}).map(([type, w]) => Object.assign({ type }, w)), walkerFrames = {};
    for (const w of walkerTypes) walkerFrames[w.type] = frames(w.model || w.type, w.o || {});
    const extraFrames = {};
    for (const key in opts.models || {}) {
      const [name, o, n] = opts.models[key];
      extraFrames[key] = n > 1 ? Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n }))) : [add(name, o)];
    }
    // critter flipbooks, baked at `fine` x density (o.size overrides the model's own scale)
    const critterFrames = {}, CRITTERS = CT.critters || {};
    for (const key in CRITTERS) {
      const [name, o, n, fine] = CRITTERS[key];
      critterFrames[key] = Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n, fine })));
    }

    // voxelise every variant
    const vols = [];
    for (let i = 0; i < variants.length; i++) {
      const v = variants[i];
      if ((i & 1) === 0) { ME.progress("voxelising " + v.name + " (" + (i + 1) + "/" + variants.length + ")", 0.5 + 0.3 * (i / variants.length)); await ME.tick(); }
      // critters (o.fine set) are drawn content.critterScale x life size so they read beside the chibi
      // units; app models may set their own scale (o.scale) and recolour materials (o.remap: name -> name)
      const md = ME.modelOf(v.name, v.o), fine = (v.o && v.o.fine) || 1;
      let vf = fine; // o.chunk: voxelise at 1/chunk density and draw scaled back up (the chunky "toy" look)
      if (v.o && v.o.scale) md.k = v.o.scale * fine;
      else if (fine !== 1) md.k = ((v.o && v.o.size) || md.k) * fine * (CT.critterScale ?? 1);
      if (v.o && v.o.chunk) { md.k /= v.o.chunk; vf = 1 / v.o.chunk; }
      if (v.o && v.o.remap) {
        const map = v.o.remap, d0 = md.detail;
        md.detail = (x, y, z, m, nx, ny, nz) => { const r = d0 ? d0(x, y, z, m, nx, ny, nz) || m : m; return map[r] || r; };
      }
      const vx = ME.voxelizeModel(md, VS, pal);
      vx.md = md; vx.name = v.name; vx.fine = vf;
      vols.push(vx);
    }

    // shelf-pack brick-aligned volumes into the atlas; short volumes stack in z inside a column whose
    // footprint fits them (critters and ferns would otherwise each reserve the full atlas depth)
    const pad = (n) => Math.ceil(n / 8) * 8, W = 1024, AZ = Math.max(8, ...vols.map((v) => pad(v.dims[2]))), cols = [];
    let x = 0, y = 0, rowH = 0;
    for (const v of vols) {
      const [nx, ny, nz] = v.dims.map(pad);
      let c = cols.find((c) => c.w >= nx && c.h >= ny && c.w - nx <= 16 && c.h - ny <= 16 && c.z + nz <= AZ);
      if (!c) {
        if (x + nx > W) { x = 0; y += rowH; rowH = 0; }
        c = { x, y, w: nx, h: ny, z: 0 }; cols.push(c);
        x += nx; rowH = Math.max(rowH, ny);
      }
      v.base = [c.x, c.y, c.z]; v.pdims = [nx, ny, nz]; c.z += nz;
    }

    // pool holding only the occupied bricks (the layout is ~1% solid, so the pool is a fraction of it)
    const AX = W, AY = pad(y + rowH), BX = AX / 8, BY = AY / 8, BZ = AZ / 8, bricks = new Uint32Array(BX * BY * BZ);
    const occupied = (v, ix, iy, iz) => {
      const [nx, ny, nz] = v.dims;
      for (let z = iz * 8; z < Math.min(nz, iz * 8 + 8); z++) for (let yy = iy * 8; yy < Math.min(ny, iy * 8 + 8); yy++)
        for (let xx = ix * 8; xx < Math.min(nx, ix * 8 + 8); xx++) if (v.rgba[((z * ny + yy) * nx + xx) * 4 + 3]) return true;

     base     ms_heart                               o.hurt 0..2 (healthy, wounded, critical), 4-frame idle

              ms_mite ms_mender ms_midge ms_mole ms_lichen ms_mother (second boss)   4-frame walk / fly cycles
     props    ms_rift (blight spawn) ms_glowcap ms_lamp ms_stone ms_kodama
   Showrooms: ?gallery=set-towers | set-towers2 | set-heart | set-enemies | set-enemies2 | set-world (a mini level: enemies walk the path,

      for (const sd of [-1, 1]) {

  // (what it lobs). Level 2 adds an unhatched sibling egg and a poison puddle, level 3 a small basket beside it.
  model("ms_toad", 1.9, (o) => {
    const L = lv(o), w = ph(o), t = o.t || 0, R = [0.13, 0.16, 0.19][L - 1], es = [0.85, 1, 1.1][L - 1];

<script>
/* Mossheart asset format v1: voxel assets as data, registered as generator models.

   prims authored at scale 1 and drawn at doc.k. Needs PX (vendor/gen); ME is optional (volume deco,
   point-light colours). The studio (studio/) edits these documents; MossAsset.register(doc) loads one.

             rot?: [x, y, z] degrees (not C), k2? (smooth blend), sub?, subm?, disp?, df?, mir? (mirror in y),

           model units; value 0 = untouched, 1..254 = mats[value - 1], 255 = erased. vox as an array is a
           flipbook: frames = its length, phase t shows vox[floor(t * frames + 1e-6) % frames] (null: no cells),

  AF.rleEncode = (vals) => {
    const out = [];

  };

    const vals = new Uint8Array(N);

  };

  AF.key = (i, j, k) => ((i + 512) * 1024 + (j + 512)) * 1024 + (k + 512);
  AF.unkey = (c) => [Math.floor(c / 1048576) - 512, (Math.floor(c / 1024) % 1024) - 512, (c % 1024) - 512];
  AF.layerCells = (L) => {
    const cells = new Map();
    if (!L) return cells;
    const [nx, ny, nz] = L.n, vals = AF.rleDecode(L.rle, nx * ny * nz);
    for (let z = 0, i = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++, i++) {
      const v = vals[i];

  AF.cellsLayer = (cells) => {
    if (!cells.size) return null;

    }

    for (const [c, v] of cells) { const q = AF.unkey(c); vals[((q[2] - mn[2]) * n[1] + q[1] - mn[1]) * n[0] + q[0] - mn[0]] = v === 255 ? 255 : mi[v] + 1; }
    return { o: mn, n, mats, rle: AF.rleEncode(vals) };

  // Squared Euclidean distance transform (Felzenszwalb) along one line of the grid.
  function edt1(f, n, d, v, z) {

    // content would leave the scanned box (1.6 r, 1.45 h)
    const md = { prims, r: doc.r ? Math.max(doc.r, R / 1.6) : R, h: doc.h ? Math.max(doc.h, H / 1.45) : H, k: doc.k || 1 };
    const detail = makeDetail(doc, g);

  };

  const pcache = new WeakMap();
  function paintMap(paint) {
    let m = pcache.get(paint);
    if (m) return m;
    m = new Map();
    const c = paint.cells;
    for (let i = 0; i < c.length; i += 4) m.set(AF.key(c[i], c[i + 1], c[i + 2]), paint.mats[c[i + 3]]);
    pcache.set(paint, m);
    return m;
  }

    const rules = doc.rules && doc.rules.length ? doc.rules : null;
    let baseDetail = null;
    if (doc.inherit && doc.base && window.MODELS[doc.base.model]) {
      try { baseDetail = window.MODELS[doc.base.model](Object.assign({}, doc.base.o)).detail || null; } catch (e) { baseDetail = null; }
    }
    if (!paint && !rules && !baseDetail) return null;
    return (x, y, z, m, nx, ny, nz) => {
      if (paint) { const v = paint.get(AF.key(Math.floor(x * g), Math.floor(y * g), Math.floor(z * g))); if (v) return v; }
      if (rules) for (const r of rules) {
        if (r.m && r.m !== m) continue;
        if (r.nz !== undefined && r.nz !== null && nz <= r.nz) continue;
        if (r.n && P.noise(x * r.n[0], y * r.n[0], z * r.n[0], r.n[1]) <= r.n[2]) continue;
        return r.to;

  AF.fromModel = function (name, o = {}, meta = {}) {
    const src = window.MODELS[name](Object.assign({}, o)), prims = [];
    for (const p of src.prims) {
      if (p.k === 5) continue;
      const q = { t: "SECBY"[p.k] || "Y", p: [p.x, p.y, p.z], m: p.m || ((window.ME || {}).content || {}).defaultMaterial };
      if (p.k === 0) q.r = p.r;
      else if (p.k === 1) q.s = [p.rx, p.ry, p.rz];
      else if (p.k === 2) {
        const bv = p.R ? applyCols(p.R, [p.bx, p.by, p.bz]) : [p.bx, p.by, p.bz];
        q.b = add(q.p, bv); q.ra = p.ra; q.rb = p.rb;
      } else if (p.k === 3) { q.s = [p.hx, p.hy, p.hz]; if (p.r) q.r = p.r; }
      else { q.r = p.r; q.hh = p.hh; if (p.rr) q.rr = p.rr; }
      if (p.R && p.k !== 2) q.rot = AF.rotOf(p.R);
      if (p.k2) q.k2 = p.k2;
      if (p.sub) { q.sub = true; if (p.subm) q.subm = p.subm; }
      if (p.disp) { q.disp = p.disp; q.df = p.df; }
      prims.push(q);
    }
    const k = meta.k ?? src.k ?? 1;
    return AF.normalize(Object.assign({ name: meta.name || name + "_edit", label: meta.label || name, k, r: src.r, h: src.h, frames: 1, prims, base: { model: name, o }, inherit: !!src.detail }, meta.extra || {}));
  };

  AF.normalize = (doc) => {
    const d = Object.assign({ format: AF.FORMAT, version: AF.VERSION, name: "asset", label: "", k: 1, frames: 1, prims: [] }, doc);
    if (!d.grid) d.grid = 16 * d.k;
    if (Array.isArray(d.vox)) { if (d.vox.length) d.frames = d.vox.length; else delete d.vox; } // a flipbook of layers: one frame per layer
    return d;
  };
  AF.validate = (doc) => {
    if (!doc || doc.format !== AF.FORMAT) throw new Error("not a Mossheart asset (format must be \"" + AF.FORMAT + "\")");
    if (doc.version > AF.VERSION) throw new Error("asset format v" + doc.version + " is newer than this runtime (v" + AF.VERSION + ")");
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(doc.name)) throw new Error("asset name must be an identifier: " + doc.name);
    return doc;
  };

  // ---------------------------------------------------------------- register
  // The document's materials go into every loaded style (and AF.ramps / AF.mats for styles made later),
  // its model into MODELS, and with the engine loaded it becomes a volume deco with point lights.
  AF.installMaterials = (doc) => {
    for (const name in doc.mats || {}) {
      const mt = doc.mats[name], opt = {};
      for (const k of ["em", "cls", "wrap", "bias"]) if (mt[k] !== undefined) opt[k] = mt[k];
      if (opt.em) opt.flat = 1;
      AF.ramps[name] = mt.ramp; AF.mats[name] = opt;
      for (const st of window.STYLES || []) { if (st.ramps) st.ramps[name] = mt.ramp; if (st.mats) st.mats[name] = opt; }
      if (window.ME && ME.LIGHT_COL && mt.light) ME.LIGHT_COL[name] = mt.light;
    }
  };
  AF.register = function (doc) {
    doc = AF.validate(AF.normalize(doc));
    AF.docs[doc.name] = doc;
    AF.installMaterials(doc);
    window.MODELS[doc.name] = (o) => AF.build(AF.docs[doc.name], o || {});
    if (window.ME) {
      // as assets/asset-kit.js model(): a ray-marched volume with its flipbook, its source in the bake-cache key
      if (ME.VOLUME_DECO) ME.VOLUME_DECO.add(doc.name);
      if (ME.FRAMES) { if (doc.frames > 1) ME.FRAMES[doc.name] = doc.frames; else delete ME.FRAMES[doc.name]; }
      ME.ASSET_SRC = (ME.ASSET_SRC || "") + JSON.stringify(doc);
    }
    return doc;
  };
  AF.list = () => Object.keys(AF.docs);

  // ?gallery=studio: the assets handed over by the studio's "Preview in engine" first, then every registered
  // studio asset, in the showroom of assets/asset-kit.js (rows of up to five, spaced by footprint).
  if (window.ME && ME.ASSET_THEMES) Object.defineProperty(ME.ASSET_THEMES, "studio", {
    enumerable: true, configurable: true,
    get() {
      const names = [...new Set([...AF.loadPreview(), ...AF.list()])], rows = [], cs = [-1.3, 1.7, 4.2, -3.8];
      for (let r = 0; r * 5 < names.length && r < cs.length; r++) {
        const ids = names.slice(r * 5, r * 5 + 5), w = ids.map((n) => { const md = window.MODELS[n]({}); return Math.max(1.3, 2 * md.r * md.k * 0.9 + 0.3); });
        const total = w.reduce((a, b) => a + b, 0), us = [];
        let u = -total / 2;
        for (const x of w) { us.push(u + x / 2); u += x; }
        rows.push([ids.map((n) => [n, {}, n]), cs[r], us]);
      }
      return { label: "Studio assets", rows };
    },
  });

  // The studio hands assets to the engine page through localStorage (?gallery=studio).
  AF.PREVIEW_KEY = "mossheart.studio.preview";
  AF.loadPreview = () => {
    try {
      const rec = JSON.parse(localStorage.getItem(AF.PREVIEW_KEY) || "null");
      if (!rec || !Array.isArray(rec.docs)) return [];
      return rec.docs.map((d) => AF.register(d).name);
    } catch (e) { return []; }
  };

  // An engine-loadable script for one or more documents (assets/*.js).
  AF.toScript = (docs) => {
    const list = Array.isArray(docs) ? docs : [docs];
    const head = "/* Mossheart assets (format v" + AF.VERSION + "): " + list.map((d) => d.name).join(", ") + ".\n   Made in the Mossheart Voxel Studio (studio/index.html). Load after vendor/gen and src/asset-format.js. */\n";
    return head + list.map((d) => "MossAsset.register(" + JSON.stringify(d) + ");\n").join("");
  };
})();

<script>
/* Studio I/O: MagicaVoxel .vox read/write, downloads, file picking and the local asset library
   (localStorage, so a page reload or the engine's ?gallery=studio can see the assets). */
(function () {
  const SV = (window.SV = window.SV || {}), P = window.PX;

  // ---------------------------------------------------------------- MagicaVoxel .vox
  // MagicaVoxel's default palette: a 6-level colour cube (blue fastest, white first), then 10-step
  // red, green, blue and grey ramps. Entry k is colour index k + 1.
  function defaultPalette() {
    const lv = [0xff, 0xcc, 0x99, 0x66, 0x33, 0x00], rp = [0xee, 0xdd, 0xbb, 0xaa, 0x88, 0x77, 0x55, 0x44, 0x22, 0x11], out = [];
    for (const r of lv) for (const g of lv) for (const b of lv) if (r || g || b) out.push([r, g, b, 255]);
    for (const c of [0, 1, 2]) for (const v of rp) { const q = [0, 0, 0, 255]; q[c] = v; out.push(q); }
    for (const v of rp) out.push([v, v, v, 255]);
    out.push([0, 0, 0, 0]);
    return out;
  }
  // -> { size: [x, y, z], voxels: [[x, y, z, colourIndex]], palette: [[r, g, b, a]] x 256 } (first model)
  SV.readVox = function (buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf), tag = (o) => String.fromCharCode(u8[o], u8[o + 1], u8[o + 2], u8[o + 3]);
    if (tag(0) !== "VOX ") throw new Error("not a MagicaVoxel file");
    let size = null, voxels = null, palette = null, o = 8;
    const end = buf.byteLength;
    // MAIN's children are a flat chunk list: walk them all
    if (tag(o) === "MAIN") o += 12 + dv.getInt32(o + 4, true);
    while (o + 12 <= end) {
      const id = tag(o), n = dv.getInt32(o + 4, true), c = o + 12;
      if (id === "SIZE" && !size) size = [dv.getInt32(c, true), dv.getInt32(c + 4, true), dv.getInt32(c + 8, true)];
      else if (id === "XYZI" && !voxels) {
        const cnt = dv.getInt32(c, true); voxels = [];
        for (let i = 0; i < cnt; i++) voxels.push([u8[c + 4 + i * 4], u8[c + 5 + i * 4], u8[c + 6 + i * 4], u8[c + 7 + i * 4]]);
      } else if (id === "RGBA") { palette = []; for (let i = 0; i < 256; i++) palette.push([u8[c + i * 4], u8[c + i * 4 + 1], u8[c + i * 4 + 2], u8[c + i * 4 + 3]]); }
      o = c + n + dv.getInt32(o + 8, true);
    }
    if (!size || !voxels) throw new Error("no model in .vox file");
    return { size, voxels, palette: palette || defaultPalette() };
  };
  SV.writeVox = function (size, voxels, palette) {
    if (size.some((s) => s > 256)) throw new Error(".vox models are at most 256 voxels on a side (this one is " + size.join("x") + ")");
    const sizeC = 12, xyziC = 4 + voxels.length * 4, rgbaC = 1024, kids = 3 * 12 + sizeC + xyziC + rgbaC;
    const buf = new ArrayBuffer(8 + 12 + kids), dv = new DataView(buf), u8 = new Uint8Array(buf);
    let o = 0;
    const tag = (s) => { for (let i = 0; i < 4; i++) u8[o++] = s.charCodeAt(i); }, i32 = (v) => { dv.setInt32(o, v, true); o += 4; };
    tag("VOX "); i32(150);
    tag("MAIN"); i32(0); i32(kids);
    tag("SIZE"); i32(sizeC); i32(0); i32(size[0]); i32(size[1]); i32(size[2]);
    tag("XYZI"); i32(xyziC); i32(0); i32(voxels.length);
    for (const v of voxels) { u8[o++] = v[0]; u8[o++] = v[1]; u8[o++] = v[2]; u8[o++] = v[3]; }
    tag("RGBA"); i32(rgbaC); i32(0);
    for (let i = 0; i < 256; i++) { const c = palette[i] || [0, 0, 0, 0]; u8[o++] = c[0]; u8[o++] = c[1]; u8[o++] = c[2]; u8[o++] = c[3] ?? 255; }
    return buf;
  };

  // A material for an imported colour: its hue and saturation, lightness spread so the ramp's albedo
  // point (s = 0.6, see src/palette.js) lands on the colour itself.
  SV.rampFor = function (rgb) {
    const [, , l] = P.toHsl(rgb), lo = Math.min(0.9, Math.max(0.03, l - 0.33)), hi = Math.min(0.98, Math.max(lo + 0.1, lo + 0.55));
    return [P.toHex(rgb), 6, +lo.toFixed(3), +hi.toFixed(3), 0.3];
  };

  // ---------------------------------------------------------------- files
  SV.download = function (name, data, type = "application/octet-stream") {
    const blob = data instanceof Blob ? data : new Blob([data], { type }), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  SV.pickFile = (accept) => new Promise((res) => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = accept;
    inp.onchange = () => res(inp.files[0] || null); inp.click();
  });

  // ---------------------------------------------------------------- local library
  const LIB = "mossheart.studio.library", CUR = "mossheart.studio.current";
  const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d; } catch (e) { return d; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  SV.store = {
    all: () => get(LIB, {}),
    save(doc) { const l = get(LIB, {}); l[doc.name] = doc; return put(LIB, l); },
    remove(name) { const l = get(LIB, {}); delete l[name]; return put(LIB, l); },
    current: () => get(CUR, null),
    setCurrent: (rec) => put(CUR, rec),
    preview: (docs, focus) => put(window.MossAsset.PREVIEW_KEY, { docs, focus, at: Date.now() }),
  };
})();

<script>
/* Studio viewport: WebGL2, one instanced cube per surface voxel of a baked volume (ME.voxelizeModel
   output: material, oct normal, AO), shaded with the engine's model lighting (src/shaders/light.js, the
   sprite form: wrapped lambert + ambient + canopy offset, AO, then each material's 16-step ramp, voxel
   grain, emissive glow). The camera is the engine's 2:1 projection (src/camera.js) or a free orbit.
   Picking is a DDA through the volume. Everything lives on window.SV. */
(function () {
  const SV = (window.SV = window.SV || {}), ME = window.ME, M4 = ME.m4;
  const SQ2 = Math.SQRT2, ENGINE_SQ = Math.SQRT1_2 / Math.cos(Math.PI / 6); // engine Z squash at 30 degrees

  // ---------------------------------------------------------------- camera
  class Cam {
    constructor() { this.yaw = 0; this.pitch = 30; this.engine = true; this.zoom = 120; this.target = [0, 0, 0.5]; this.anim = null; }
    // world -> view basis: right, up (screen), toward viewer
    basis() {
      const c = Math.cos(this.yaw), s = Math.sin(this.yaw), e = ((this.engine ? 30 : this.pitch) * Math.PI) / 180, sq = this.engine ? ENGINE_SQ : 1;
      const rx = [(c - s) / SQ2, (-s - c) / SQ2, 0], fw = [(c + s) / SQ2, (c - s) / SQ2, 0];
      const up = [-fw[0] * Math.sin(e), -fw[1] * Math.sin(e), Math.cos(e) * sq], dp = [fw[0] * Math.cos(e), fw[1] * Math.cos(e), Math.sin(e)];
      return { rx, up, dp };
    }
    matrix(w, h) {
      const { rx, up, dp } = this.basis(), T = this.target, kx = (this.zoom * 2) / w, ky = (this.zoom * 2) / h, dz = 1 / 60;
      const row = (v, k) => [v[0] * k, v[1] * k, v[2] * k, -(v[0] * T[0] + v[1] * T[1] + v[2] * T[2]) * k];
      return M4.fromRows([row(rx, kx), row(up, ky), row(dp, -dz), [0, 0, 0, 1]]);
    }
    // eased 90-degree snaps, as the engine camera
    snap(dir) { const to = Math.round(this.yaw / (Math.PI / 2) + dir) * (Math.PI / 2); this.anim = { from: this.yaw, to, t0: performance.now() }; }
    update(now) {
      if (!this.anim) return false;
      const u = Math.min(1, (now - this.anim.t0) / 420), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      this.yaw = this.anim.from + (this.anim.to - this.anim.from) * e;
      if (u >= 1) this.anim = null;
      return true;
    }
  }
  SV.Cam = Cam;

  // ---------------------------------------------------------------- shaders
  const VS_VOX = `#version 300 es
  precision highp float; precision highp int;
  layout(location=0) in vec3 aCorner; layout(location=1) in vec3 aFaceN;
  layout(location=2) in uvec4 aInst; layout(location=3) in vec4 aNao;
  uniform mat4 uVP; uniform vec3 uOrigin; uniform float uVox; uniform vec3 uBoxO;
  out vec3 vN; out vec3 vLoc; out vec3 vFace; out vec3 vVox; flat out uint vMat; flat out uint vFlag; out float vAo;
  void main() {
    vec3 cell = vec3(aInst.xyz);
    vec3 p = uOrigin + (cell + aCorner) * uVox;
    gl_Position = uVP * vec4(p, 1.0);
    vec2 e = aNao.xy * 2.0 - 1.0; vec3 n = vec3(e, 1.0 - abs(e.x) - abs(e.y));
    if (n.z < 0.0) n.xy = (1.0 - abs(n.yx)) * vec2(n.x >= 0.0 ? 1.0 : -1.0, n.y >= 0.0 ? 1.0 : -1.0);
    vN = normalize(n); vLoc = aCorner; vFace = aFaceN; vVox = cell + uBoxO; vMat = aInst.w & 255u; vFlag = aInst.w >> 8u; vAo = aNao.z;
  }`;
  const FS_VOX = `#version 300 es
  precision highp float; precision highp int; precision highp sampler2D;
  in vec3 vN; in vec3 vLoc; in vec3 vFace; in vec3 vVox; flat in uint vMat; flat in uint vFlag; in float vAo;
  uniform sampler2D uRamps; uniform sampler2D uMats;
  uniform vec3 uL; uniform vec4 uLook; uniform vec4 uLook2; uniform int uMode; uniform float uTime; uniform vec3 uViewDir;
  out vec4 oCol;
  float hash13(vec3 p) { vec3 p3 = fract(p * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
  vec3 rampC(uint m, float s) { return texture(uRamps, vec2((clamp(s, 0.0, 1.0) * 15.0 + 0.5) / 16.0, (float(m) + 0.5) / 256.0)).rgb; }
  vec3 toSrgb(vec3 c) { c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
  void main() {
    vec4 m0 = texelFetch(uMats, ivec2(0, int(vMat)), 0), m1 = texelFetch(uMats, ivec2(1, int(vMat)), 0);
    uint cls = uint(m1.w + 0.5);
    vec3 n = vN; float ao = vAo;
    // uLook: shade, pool, amb, aoK  uLook2: canopy light (0 shade .. 1 sun pool), spriteK, exposure, face shading
    float shade = uLook.x, pool = uLook.y, amb = uLook.z, aoK = uLook.w, cook = uLook2.x;

    const check = (name, cond, info) => { R.checks[name] = cond ? (info ?? true) : { fail: info ?? false }; if (!cond) R.ok = false; };
    // same voxels (material, normal, AO) at the same absolute positions, whatever the boxes
    const voxSet = (v) => { const m = new Map(), [nx, ny, nz] = v.dims; for (let z = 0, i = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++, i++) if (v.rgba[i * 4 + 3]) m.set(AF.key(v.box[0] + x, v.box[1] + y, v.box[2] + z), v.rgba.slice(i * 4, i * 4 + 4).join()); return m; };
    const sameGrid = (a, b) => { const A = voxSet(a), B = voxSet(b); if (A.size !== B.size) return false; for (const [k, v] of A) if (B.get(k) !== v) return false; return true; };
    try {
      // 1. every library model bakes
      const t0 = performance.now(), fails = [];
      let n = 0;
      for (const g of LIB) for (const it of g.items) {
        if (it.kind !== "model") continue;
        try { S.mode = "lib"; S.lib = { name: it.name, o: it.o, frames: 1, fine: it.fine || 1, chunk: 1 }; S.version++; const v = bake(0); if (!v.solid) fails.push(it.label + ": empty"); n++; } catch (e) { fails.push(it.label + ": " + e.message); }
      }
      check("library_bakes", fails.length === 0, { models: n, ms: Math.round(performance.now() - t0), fails });
      // 2. a forked model bakes voxel-identical to the original (prims + inherited detail)
      for (const name of ["kg_puff", "sc_thorn", "hs_moth", "ms_thorn", "ms_spirit", "squirrel", "lantern"]) {
        if (!window.MODELS[name]) continue;
        const md = ME.modelOf(name, {}), a = ME.voxelizeModel(md, VS, pal), doc = AF.fromModel(name, {}, { name: "t_" + name, k: md.k }), b = ME.voxelizeModel(AF.build(doc), VS, pal);
        check("fork_identical_" + name, sameGrid(a, b), { prims: doc.prims.length, solid: [a.solid, b.solid] });
      }
      // 3. voxel layer: added cells appear, erased cells vanish, paint recolours (grid aligned)
      const doc = AF.normalize({ name: "t_layer", k: 1, prims: [{ t: "B", p: [0, 0, 0.25], s: [0.25, 0.25, 0.25], m: "stone" }] });
      const cells = new Map();
      for (let x = 0; x < 3; x++) cells.set(AF.key(x, 0, 10), "moss");
      cells.set(AF.key(0, 0, 3), 255);
      doc.vox = AF.cellsLayer(cells);
      doc.paint = { mats: ["maple"], cells: [-1, -1, 7, 0] };
      const v = ME.voxelizeModel(AF.build(doc), VS, pal), at = (i, j, k) => { const x = i - v.box[0], y = j - v.box[1], z = k - v.box[2]; return x < 0 || y < 0 || z < 0 || x >= v.dims[0] || y >= v.dims[1] || z >= v.dims[2] ? 0 : v.rgba[((z * v.dims[1] + y) * v.dims[0] + x) * 4 + 3]; };
      check("layer_add", [0, 1, 2].every((x) => pal.names[at(x, 0, 10)] === "moss") && !at(3, 0, 10) && !at(0, 0, 11), [0, 1, 2, 3].map((x) => pal.names[at(x, 0, 10)]));
      check("layer_erase", at(0, 0, 3) === 0 && at(1, 0, 3) !== 0);
      check("paint", pal.names[at(-1, -1, 7)] === "maple", pal.names[at(-1, -1, 7)]);
      // 4. mirror and motion
      const dm = AF.normalize({ name: "t_mir", k: 1, frames: 4, prims: [{ t: "S", p: [0, 0.2, 0.3], r: 0.08, m: "stone", mir: true, mv: [0, 0, 0.1] }] });
      const m0 = AF.build(dm, { t: 0 }), m1 = AF.build(dm, { t: 0.25 });
      check("mirror", m0.prims.length === 2 && m0.prims[1].y === -0.2);
      check("motion", Math.abs(m1.prims[0].z - 0.4) < 1e-9, m1.prims[0].z);
      // 5. rotation round trip
      const rot = [20, -35, 70], back = AF.rotOf(AF.rotRows(rot));
      check("rotation_roundtrip", back.every((a, i) => Math.abs(a - rot[i]) < 1e-3), back);
      // 6. .vox round trip and import
      const vx = { size: [4, 3, 2], voxels: [[0, 0, 0, 1], [3, 2, 1, 2], [1, 1, 0, 1]], palette: Array.from({ length: 256 }, (_, i) => [i, 255 - i, 128, 255]) };
      const rd = SV.readVox(SV.writeVox(vx.size, vx.voxels, vx.palette));
      check("vox_roundtrip", rd.size.join() === "4,3,2" && JSON.stringify(rd.voxels) === JSON.stringify(vx.voxels) && rd.palette[1].join() === "1,254,128,255");
      const vd = docFromVox("t_vox", rd), vv = ME.voxelizeModel(AF.build(vd), VS, pal);
      check("vox_import", vv.solid === 3, { solid: vv.solid, mats: Object.keys(vd.mats) });
      // 7. engine script round trip
      const d2 = AF.normalize(clone(doc));
      d2.name = "t_script";
      const code = AF.toScript(d2);
      new Function(code)();
      check("script_register", !!window.MODELS.t_script && sameGrid(ME.voxelizeModel(window.MODELS.t_script({}), VS, pal), v));
      // 7b. a flipbook of voxel layers (vox as an array): each frame bakes to exactly its layer's cells and
      //     materials at vs = grid, r / h are the same at every t, register makes it a 3-frame flipbook
      const FG = 32, flips = [];
      for (let f = 0; f < 3; f++) {
        const cs = new Map();
        for (let z = 0; z < 4 + 3 * f; z++) for (let y = -2; y < 2; y++) for (let x = f - 3; x < 3; x++) cs.set(AF.key(x, y, z), (x + y + z) % 3 ? "stone" : "moss");
        cs.set(AF.key(5, 5, 9 * f), "maple"); // a lone cell that moves up
        flips.push(cs);
      }
      const fd = AF.normalize({ name: "t_flip", k: 1, grid: FG, prims: [], vox: flips.map(AF.cellsLayer), fps: 8 });
      check("flip_frames", fd.frames === 3, fd.frames);
      const flipBakes = flips.map((cs, f) => {
        const fv = ME.voxelizeModel(AF.build(fd, { t: f / 3 }), FG, pal), [nx, ny, nz] = fv.dims;
        let bad = 0;
        for (let z = 0, i = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++, i++) if (fv.rgba[i * 4 + 3] && pal.names[fv.rgba[i * 4 + 3]] !== cs.get(AF.key(fv.box[0] + x, fv.box[1] + y, fv.box[2] + z))) bad++;
        return { solid: fv.solid, cells: cs.size, bad };
      });
      check("flip_layers_exact", flipBakes.every((b) => b.solid === b.cells && !b.bad), flipBakes);
      const fb = [0, 1, 2].map((f) => AF.build(fd, { t: f / 3 }));
      check("flip_union_bounds", fb.every((m) => m.r === fb[0].r && m.h === fb[0].h), fb.map((m) => [r4(m.r), r4(m.h)]));
      AF.register(clone(fd));
      check("flip_register", !!window.MODELS.t_flip && ME.FRAMES.t_flip === 3, ME.FRAMES.t_flip);
      // 8. the editor round: open, edit through the tools, undo, render
      openDoc(doc); refresh();
      const before = cur.solid;
      const pk = { cell: null, ground: [0.6, 0.6, 0] };
      S.mat = "maple"; applyTool(pk, "add"); settle(); refresh();
      check("tool_add_on_ground", cur.solid === before + 1, [before, cur.solid]);
      undo(-1); refresh();
      check("undo", cur.solid === before, cur.solid);
      view.resize(); view.render(1);
      const gl = view.gl;
      check("webgl", gl.getError() === 0);
      S.sel = 0; refresh();
      check("owners", view.cells.some((i) => own[i] === 0));
      // the voxel tools edit the shown frame's layer of a flipbook, and only that one; a stroke that
      // crosses a frame tick writes only its own cell into the new frame (not the old frame's cells)
      openDoc(fd); S.frame = 1; refresh(); layer = null;
      const was = clone(S.doc.vox);
      applyTool({ cell: null, ground: [0.6, 0.6, 0] }, "add");
      S.frame = 2;
      applyTool({ cell: null, ground: [-0.6, -0.6, 0] }, "add"); settle(); layer = null;
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b), keys = (l) => new Set(AF.layerCells(l).keys());
      const k1 = keys(S.doc.vox[1]), k2 = keys(S.doc.vox[2]), w1 = keys(was[1]), w2 = keys(was[2]);
      check("flip_edit_frame", same(S.doc.vox[0], was[0]) && k1.size === w1.size + 1 && [...w1].every((k) => k1.has(k)) && k2.size === w2.size + 1 && [...w2].every((k) => k2.has(k)), { frame1: [w1.size, k1.size], frame2: [w2.size, k2.size] });
      // a stroke pauses playback
      S.playing = true; setTool("add"); refresh(); fit();
      const rc = view.cv.getBoundingClientRect(), pt = view.project([0.6, 0.6, 0]);
      for (const type of ["pointerdown", "pointerup"]) view.cv.dispatchEvent(new PointerEvent(type, { clientX: rc.left + pt[0], clientY: rc.top + pt[1], bubbles: true, pointerId: 8, button: 0, buttons: type === "pointerup" ? 0 : 1, isPrimary: true }));
      check("stroke_pauses_playback", !S.playing);
      setTool("select"); S.frame = 0;
      // 9. pointer flow on the real canvas: click a shape to select it, drag its move handle, add a voxel
      //    with the add tool, undo with Ctrl+Z
      newDoc(); refresh(); fit();
      const rect = view.cv.getBoundingClientRect(), K = S.doc.k;
      const fire = (type, x, y) => view.cv.dispatchEvent(new PointerEvent(type, { clientX: rect.left + x, clientY: rect.top + y, bubbles: true, pointerId: 7, button: 0, buttons: type === "pointerup" ? 0 : 1, isPrimary: true }));
      const click = (s) => { fire("pointerdown", s[0], s[1]); fire("pointerup", s[0], s[1]); };
      setTool("select"); S.sel = -1;
      click(view.project(add3(mul3(S.doc.prims[1].p, K), [0, 0, S.doc.prims[1].r * K * 0.5])));
      check("ui_click_select", S.sel === 1, S.sel);
      const hs = view.project(handles()[0].pos), p0 = S.doc.prims[1].p.slice();
      fire("pointerdown", hs[0], hs[1]); fire("pointermove", hs[0] + 40, hs[1]); fire("pointerup", hs[0] + 40, hs[1]);
      check("ui_drag_handle", Math.abs(S.doc.prims[1].p[0] - p0[0]) + Math.abs(S.doc.prims[1].p[1] - p0[1]) > 0.02, S.doc.prims[1].p);
      refresh();
      const solid0 = cur.solid;
      setTool("add");
      click(view.project(add3(mul3(S.doc.prims[1].p, K), [0, 0, S.doc.prims[1].r * K * 0.97])));
      refresh();
      check("ui_add_voxel", !!S.doc.vox && cur.solid > solid0, [solid0, cur.solid]);
      window.dispatchEvent(new KeyboardEvent("keydown", { key: "z", ctrlKey: true }));
      refresh();
      check("ui_undo_key", !S.doc.vox && cur.solid === solid0, cur.solid);
      renderRight();
      check("ui_panels", ["shape", "voxel", "mats", "asset", "view"].every((t) => { S.tab = t; renderRight(); return $("#panel").children.length > 0; }));
    } catch (e) { R.ok = false; R.error = e.stack || e.message; }
    R.ok = R.ok && ME.errors.length === 0;
    $("#result").textContent = JSON.stringify(R, null, 1);
    document.title = "SELFTEST DONE";
  }
  // ?shots=model[@o-json],... or doc:<name>: one viewport PNG each (deterministic, no animation)
  async function shots() {
    const out = [];
    for (const name of ME.q("shots").split(",")) {
      if (name === "ui") { out.push("NOTE use -Snap for page screenshots"); continue; }
      if (name.startsWith("doc:")) openDoc(AF.docs[name.slice(4)] || SV.store.all()[name.slice(4)]);
      else openLib({ name, label: name, o: {}, frames: 1 });
      refresh(); fit(); view.resize(); fit(); view.render(1);
      out.push("FILE studio-" + name.replace(/[^a-z0-9_.-]+/gi, "_") + ".png " + view.cv.toDataURL("image/png").split(",")[1]);
    }
    $("#result").textContent = out.join("\n") + "\nERRORS " + ME.errors.length + "\n" + ME.errors.join("\n") + "\nDONE";
  }

  window.addEventListener("load", () => { try { boot(); } catch (e) { ME.err("BOOT", e.stack || e.message); $("#result").textContent = JSON.stringify({ ok: false, error: e.stack || e.message }); document.body.classList.add("failed"); $("#fail").textContent = e.message; } });
})();

</script>
