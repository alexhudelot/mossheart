      this.stats.damage[by.team] += dmg;
      this.emit("damage", { unit: t.id, dmg, hp: t.hp, by: by.id, area });
      if (t.hp <= 0) {
        t.alive = false; t.ap = 0; t.overwatch = false; t.ambush = false;
        if (by.team !== t.team) { by.kills++; this.stats.kills[by.team]++; }
        this.emit("kill", { unit: t.id, by: by.id });
        if (settle) this.checkEnd();
      }
    }
    overwatchOn(u) {
      if (!this.canAct(u) || u.ammo <= 0) return false;
      u.ap = 0; u.overwatch = true; this.stats.actions++;
      this.emit("overwatch", { unit: u.id });
      return true;
    }
    reload(u) {
      if (!this.canAct(u) || u.ammo >= this.weapon(u).mag) return false;
      u.ap -= 1; u.ammo = this.weapon(u).mag; this.stats.actions++;
      this.emit("reload", { unit: u.id });
      return true;
    }
    // what u's ability may target: true / false for a target (unit or [x, y]) and why not
    abilityCheck(u, target) {
      const A = this.ability(u), g = this.grid;
      if (!this.canAct(u)) return "not now";
      if (u.ap < A.ap) return "needs " + A.ap + " AP";
      if (A.charges && u.charges <= 0) return "no charges left";
      if (A.kind === "hunker") return "";
      if (A.kind === "aimed") return target && target.id !== undefined ? (this.shotInfo(u, target, { aimed: true }).ok && u.ammo > 0 ? "" : "no shot") : "pick a target";
      if (A.kind === "heal") {
        if (!target || target.id === undefined || target.team !== u.team || !target.alive) return "pick a wounded ally";
        if (target.hp >= target.maxHp) return "unhurt";
        const d = this.dist(u.x, u.y, target.x, target.y);
        return d <= A.range && (d < 1.5 || g.los(u.x, u.y, this.eye(u), target.x, target.y, this.chest(target))) ? "" : "out of reach";
      }
      if (A.kind === "mark") {
        if (!target || target.id === undefined || target.team === u.team || !target.alive) return "pick an enemy";
        return this.dist(u.x, u.y, target.x, target.y) <= A.range && g.los(u.x, u.y, this.eye(u), target.x, target.y, this.chest(target)) ? "" : "no sight";
      }
      if (A.kind === "area") {
        const p = target && target.id !== undefined ? [target.x, target.y] : target;
        if (!p || !g.inside(p[0], p[1])) return "pick a tile";
        if (this.dist(u.x, u.y, p[0], p[1]) > A.range) return "out of range";
        if (!A.arc && !g.los(u.x, u.y, this.eye(u), p[0], p[1], 0.4)) return "no sight";
        return "";
      }
      return "unknown";
    }
    // tiles an area ability centred on [x, y] catches
    areaTiles(u, x, y) {
      const A = this.ability(u), g = this.grid, R = Math.ceil(A.radius), out = [];
      for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
        const tx = x + dx, ty = y + dy;
        if (g.inside(tx, ty) && Math.sqrt(dx * dx + dy * dy) <= A.radius + 1e-9 && !g.solid(tx, ty)) out.push([tx, ty]);
      }
      return out;
    }
    useAbility(u, target) {
      const A = this.ability(u);
      if (this.abilityCheck(u, target) !== "") return false;
      this.stats.actions++;
      if (A.charges) u.charges--;
      u.ap = A.ends ? 0 : u.ap - A.ap;
      if (A.kind === "hunker") { u.hunker = true; this.emit("hunker", { unit: u.id }); return true; }
      if (A.kind === "aimed") { u.ap = 0; this.fire(u, target, this.shotInfo(u, target, { aimed: true }), { aimed: true }); return true; }
      if (A.kind === "heal") {
        const amount = Math.min(A.heal, target.maxHp - target.hp);
        target.hp += amount;
        this.emit("heal", { unit: u.id, target: target.id, amount });
        return true;
      }
      if (A.kind === "mark") { target.markedBy = u.team; this.emit("mark", { unit: u.id, target: target.id }); return true; }
      // area: every unit caught (friends too) loses the roll minus armour, cover objects break
      const p = target.id !== undefined ? [target.x, target.y] : target, tiles = this.areaTiles(u, p[0], p[1]);
      u.facing = Math.atan2(p[1] - u.y, p[0] - u.x);
      const caught = this.units.filter((v) => v.alive && tiles.some(([x, y]) => v.x === x && v.y === y));
      const hits = caught.map((v) => ({ unit: v.id, dmg: Math.max(1, this.rng.int(A.dmg[0], A.dmg[1]) - this.def(v).armour) }));
      this.stats.areas++;
      this.emit("area", { unit: u.id, ability: this.def(u).ability, at: p, tiles, hits });
      if (A.breaks) for (const [x, y] of tiles) {
        const was = this.grid.cover[this.grid.idx(x, y)];
        if (this.grid.breakCover(x, y)) { this.stats.coverBroken++; this.emit("cover_broken", { x, y, was }); }
      }
      // every hit lands before the end is decided: a blast that wipes out both squads is a draw
      for (const h of hits) this.hurt(this.units[h.unit], h.dmg, u, true, false);
      this.checkEnd();
      return true;
    }
    // the team's turn is over (any AP left is lost)
    endTurn() {
      if (this.over) return false;
      for (const u of this.living(this.team)) u.ap = 0;
      this.beginTurn(1 - this.team);
      return true;
    }
    beginTurn(team) {
      if (this.over) return;
      if (team === this.first) this.round++;
      this.team = team;
      if (this.round > D.MAX_ROUNDS) { this.finish(-1); return; }
      for (const u of this.units) {
        if (u.markedBy === team) u.markedBy = -1; // marks last until the marking team's next turn
        if (u.team !== team || !u.alive) continue;
        u.ap = this.round === 1 && team === this.first ? D.FIRST_TURN_AP : D.AP; u.overwatch = false; u.ambush = false; u.hunker = false;
      }
      // the side moving second waits for the first's opening on overwatch
      if (this.round === 1 && team === this.first && D.SECOND_OVERWATCH) for (const u of this.living(1 - team)) {
        if (u.ammo <= 0) continue;
        u.overwatch = true; u.ambush = true;
        this.emit("overwatch", { unit: u.id, ambush: true });
      }
      this.emit("turn", { team, round: this.round });
    }
    checkEnd() {
      const a = this.living(0).length, b = this.living(1).length;
      if (!a || !b) this.finish(a ? 0 : b ? 1 : -1);
    }
    finish(winner) {
      if (this.over) return;
      this.over = true; this.winner = winner;
      for (const u of this.units) u.ap = 0;
      this.emit("end", { winner, round: this.round });
    }
    // a compact picture of the state (determinism checks, tests)
    snapshot() {
      return JSON.stringify({ t: this.team, r: this.round, rng: this.rng.s, u: this.units.map((u) => [u.x, u.y, u.hp, u.ap, u.ammo, u.alive ? 1 : 0, u.overwatch ? (u.ambush ? 2 : 1) : 0, u.hunker ? 1 : 0, u.markedBy, u.charges]), c: this.grid.cover.join("") });
    }
  }
  G.Battle = Battle;
})();

<script>
/* The squad AI: plays one team's turn through the Battle's own actions, one action at a time (step()), so
   the view can show each before the next. No randomness: the same battle always plays the same way.
   Each step it scores every action of every unit that still has AP and takes the best one:
     value of a tile   - the damage the enemies who see it can expect to do there (threat; cover, height and
                         flanks come from Battle.shotInfo), + a little for cover itself, + the best shot from
                         there if AP remains, - straying from the kind's preferred distance to the nearest
                         enemy, - straying far from the squad
     a shot            expected damage + the chance to kill x the target's worth (snipers, medics, mechs and
                         heavies first), + more the more hurt the target is (focus the weak); flanked targets
                         score high through their crit and missing cover
     move then act     the value of the tile moved to (so it walks into cover, onto high ground and around
                         flanks before it shoots)
     abilities         grenade/rocket where they catch enemies (and spare friends) or break the cover they
                         hide behind; heal the hurt; mark the target others can shoot; hunker when exposed
                         with nothing to shoot; aimed shot when standing still
     reload, overwatch, end
   Every candidate is compared with doing nothing (the threat where the unit stands), so a unit acts only
   when it gains; a turn ends when no unit gains. */
(function () {
  const G = (window.TG = window.TG || {}), D = G.Defs;
  const WORTH = { sniper: 2, heavy: 1.5, mech: 2, medic: 1.6, drone: 1, rifle: 1.2 };
  // the weights of a tile's value (tools/sim.js ?tune=AI.name=value tries others): the threat of enemies
  // who must move to shoot, cover, a shot from the tile, the pull to the kind's preferred distance (and
  // its growth with each quiet turn), a flank, the overwatch fire a move walks into; against standoffs:
  // the preferred distance shrinks by prefShrink of itself each quiet turn after the second (to 2 tiles at
  // least), and the overwatch fire weighs 1 / (1 + owQuiet x quiet turns); death: the weight of the chance
  // to be killed at the tile (x the unit's worth), beside the damage expected there; quietHarm (0 or 1): a
  // quiet turn is one without harm done (damage, broken cover), not one without a shot
  const TUNE = { stepThreat: 0.5, cover: 0.25, shotThere: 0.92, pref: 0.12, prefQuiet: 0.12, flanked: 0.6, overwatch: 1, prefShrink: 0.1, owQuiet: 0.25, death: 0, quietHarm: 1 };

  class AI {
    // tune: this AI's own weights over AI.TUNE (tools/sim.js ?challenger= plays one against the other)
    constructor(battle, team, tune = {}) { this.b = battle; this.team = team; this.T = Object.assign({}, TUNE, tune); this.log = []; this.quiet = 0; this.turnKey = ""; this.shots = 0; }

    // the damage u can expect to take at (x, y): in full from the enemies that see it now, at a third from
    // those that could step out and shoot it next turn; and whether one of them flanks it there
    threat(u, x, y) {
      const b = this.b;
      let sum = 0, flanked = false;
      for (const e of b.enemiesOf(u)) {
        const i = b.shotInfo(e, u, { tx: x, ty: y }), k = e.ammo > 0 ? 1 : 0.6;
        const hurt = i.expDmg + (this.T.death ? this.T.death * this.killChance(i, u) * (2 + WORTH[u.kind]) : 0);
        if (i.ok) { sum += hurt * k; if (i.flanked) flanked = true; }
        else if (i.dist <= b.def(e).mob + b.weapon(e).opt[1]) sum += hurt * k * this.T.stepThreat;
      }
      return { sum, flanked };
    }
    // expected damage x the chance to kill: P(roll - armour >= hp) over the uniform roll, on a hit
    killChance(info, t) {
      const [a, z] = info.dmg;
      let k = 0;
      for (let d = a; d <= z; d++) if (Math.max(1, d - info.armour) >= t.hp) k++;
      return (info.chance / 100) * (k / (z - a + 1)) + (info.chance / 100) * (info.crit / 100) * (k < z - a + 1 ? 0.5 : 0);
    }
    shotValue(u, t, info) {
      return info.expDmg + this.killChance(info, t) * (4 + 2 * WORTH[t.kind]) + (1 - t.hp / t.maxHp) * 0.8;
    }
    bestShot(u, fx, fy, o = {}) {
      const b = this.b;
      if (u.ammo <= 0) return null;
      let best = null;
      for (const t of b.enemiesOf(u)) {
        const info = b.shotInfo(u, t, Object.assign({ fx, fy }, o));
        if (!info.ok) continue;
        const v = this.shotValue(u, t, info);
        if (!best || v > best.v) best = { v, t, info };
      }
      return best;
    }
    // how good it is to end up on (x, y) with apAfter AP left
    tileValue(u, x, y, apAfter) {
      const b = this.b, K = b.def(u), th = this.threat(u, x, y);
      let v = -th.sum - (th.flanked ? this.T.flanked : 0) + (K.fly ? 0 : this.T.cover * b.grid.maxCover(x, y));
      if (apAfter >= 1) { const s = this.bestShot(u, x, y); if (s) v += s.v * this.T.shotThere; }
      const en = b.enemiesOf(u);
      if (en.length) {
        let dmin = 1e9;
        for (const e of en) dmin = Math.min(dmin, b.dist(x, y, e.x, e.y));
        // the longer nobody has fired, the closer and the harder both sides close in (no standoffs)
        const pref = Math.max(2, K.pref * (1 - this.T.prefShrink * Math.max(0, this.quiet - 2)));
        v -= (this.T.pref + this.T.prefQuiet * this.quiet) * Math.abs(dmin - pref);
      }
      // bunched up under the enemy's grenades and rockets
      if (en.some((e) => b.ability(e).kind === "area" && e.charges > 0)) {
        for (const a of b.living(u.team)) if (a !== u && Math.max(Math.abs(a.x - x), Math.abs(a.y - y)) <= 1) v -= 0.5;
      }
      const al = b.living(u.team).filter((a) => a !== u);
      if (al.length) {
        let s = 0;
        for (const a of al) s += b.dist(x, y, a.x, a.y);
        const avg = s / al.length;
        if (avg > 7) v -= 0.1 * (avg - 7);
      }
      return v;
    }

    // what walking to a tile of reach r costs under the enemy's overwatch: each overwatcher fires once, at
    // the first step (start excluded) it has a shot at, as Battle.reactTo does; its expected damage there,
    // plus the chance it kills. Returns tile index -> cost, memoised along the shared path prefixes.
    overwatchRisk(u, r) {
      const b = this.b, g = b.grid, ws = b.enemiesOf(u).filter((w) => w.overwatch && w.ammo > 0);
      if (!ws.length) return () => 0;
      const memo = new Map(); // tile index -> per overwatcher: its cost once it has fired on the way, else null
      const at = (i) => {
        if (memo.has(i)) return memo.get(i);
        const e = r.get(i), fired = e.prev < 0 ? ws.map(() => null) : at(e.prev).slice();
        if (e.prev >= 0) {
          const x = i % g.W, y = (i - x) / g.W;
          ws.forEach((w, k) => {
            if (fired[k] !== null) return;
            const info = b.shotInfo(w, u, { reaction: true, ambush: w.ambush, tx: x, ty: y });
            if (info.ok) fired[k] = info.expDmg + this.killChance(info, u) * (2 + WORTH[u.kind]);
          });
        }
        memo.set(i, fired);
        return fired;
      };
      return (i) => at(i).reduce((a, c) => a + (c || 0), 0);
    }

    // every scored option of u: { v, act: () => bool, what }
    options(u) {
      const b = this.b, A = b.ability(u), g = b.grid, here = this.tileValue(u, u.x, u.y, 0), out = [];
      out.push({ v: here, what: "end", act: null });
      // shots from here (and the aimed shot)
      for (const t of b.enemiesOf(u)) {
        if (u.ammo <= 0) break;
        const info = b.shotInfo(u, t);
        if (info.ok) out.push({ v: this.shotValue(u, t, info) + here, what: "shoot " + t.kind + "#" + t.id, act: () => b.shoot(u, t) });
        if (A.kind === "aimed" && u.ap >= 2) {
          const ai = b.shotInfo(u, t, { aimed: true });
          if (ai.ok) out.push({ v: this.shotValue(u, t, ai) + here + 0.1, what: "aimed " + t.kind + "#" + t.id, act: () => b.useAbility(u, t) });
        }
      }
      // moves (then whatever the AP left buys)
      const r = b.reach(u), risk = this.overwatchRisk(u, r), owK = this.T.overwatch / (1 + this.T.owQuiet * this.quiet);
      for (const [i, e] of r) {
        if (!e.end || e.ap > u.ap || i === g.idx(u.x, u.y)) continue;
        const x = i % g.W, y = (i - x) / g.W;
        out.push({ v: this.tileValue(u, x, y, u.ap - e.ap) - 0.02 * e.cost - owK * risk(i), what: "move " + x + "," + y, act: () => b.move(u, x, y) });
      }
      const mag = b.weapon(u).mag;
      if (u.ammo < mag) out.push({ v: here + (u.ammo === 0 ? 2.5 : u.ammo < mag / 2 ? 0.6 : 0.1), what: "reload", act: () => b.reload(u) });
      if (u.ammo > 0) {
        const near = b.enemiesOf(u).filter((e) => b.dist(u.x, u.y, e.x, e.y) <= b.weapon(u).max).length;
        out.push({ v: here + (0.6 + 0.35 * Math.min(3, near)) / (1 + 0.5 * this.quiet), what: "overwatch", act: () => b.overwatchOn(u) });
      }
      // the ability
      if (b.abilityCheck(u, null) !== "not now" && (!A.charges || u.charges > 0) && u.ap >= A.ap) {
        if (A.kind === "hunker" && g.maxCover(u.x, u.y) > 0) {
          const th = this.threat(u, u.x, u.y).sum;
          out.push({ v: here + th * 0.45 - 0.3, what: "hunker", act: () => b.useAbility(u, null) });
        }
        if (A.kind === "heal") for (const a of b.living(u.team)) {
          if (a.maxHp - a.hp < 2 || b.abilityCheck(u, a) !== "") continue;
          const amt = Math.min(A.heal, a.maxHp - a.hp);
          out.push({ v: here + amt * 0.9 * (a.hp <= 3 ? 1.5 : 1), what: "heal " + a.kind + "#" + a.id, act: () => b.useAbility(u, a) });
        }
        if (A.kind === "mark") for (const t of b.enemiesOf(u)) {
          if (t.markedBy === u.team || b.abilityCheck(u, t) !== "") continue;
          const shooters = b.living(u.team).filter((a) => a !== u && a.ap > 0 && a.ammo > 0 && b.shotInfo(a, t).ok).length;
          if (!shooters) continue;
          out.push({ v: here + 0.7 * shooters + (t.hp <= 6 ? 0.5 : 0) + 0.2 * WORTH[t.kind], what: "mark " + t.kind + "#" + t.id, act: () => b.useAbility(u, t) });
        }
        if (A.kind === "area") {
          const seen = new Set();
          for (const e of b.enemiesOf(u)) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const x = e.x + dx, y = e.y + dy, key = x + "," + y;
            if (seen.has(key) || !g.inside(x, y)) continue;
            seen.add(key);
            if (b.abilityCheck(u, [x, y]) !== "") continue;
            const v = this.areaValue(u, x, y);
            if (v > 0) out.push({ v: here + v, what: A.name + " " + key, act: () => b.useAbility(u, [x, y]) });
          }
        }
      }
      return { here, out };
    }
    areaValue(u, x, y) {
      const b = this.b, A = b.ability(u), tiles = b.areaTiles(u, x, y), g = b.grid, avg = (A.dmg[0] + A.dmg[1]) / 2;
      let v = 0, foes = 0;
      for (const v2 of b.units) {
        if (!v2.alive || !tiles.some(([tx, ty]) => tx === v2.x && ty === v2.y)) continue;
        const d = Math.max(1, avg - b.def(v2).armour), kill = d >= v2.hp ? 1 : 0;
        if (v2.team === u.team) v -= (d + kill * 6) * 1.6;
        else { foes++; v += d + kill * (4 + 2 * WORTH[v2.kind]) + 0.6 * g.maxCover(v2.x, v2.y); }
      }
      if (!foes) return 0;
      // one foe in the open is a shot's job; the blast pays for crowds and for cover
      return v - (foes === 1 ? 3 : 0) - (A.charges && u.charges === 1 ? 0.5 : 0);
    }

    // one action of the team's turn; false when the turn is over (it has called endTurn)
    step() {
      const b = this.b;
      if (b.over || b.team !== this.team) return false;
      // turns in a row without a shot or a blast from either side (the standoff pressure); with quietHarm,
      // without damage or broken cover, so shots that keep missing don't hold the pressure off
      const key = b.round + ":" + b.team;
      const fired = this.T.quietHarm ? b.stats.damage[0] + b.stats.damage[1] + b.stats.coverBroken : b.stats.shots + b.stats.areas;
      if (key !== this.turnKey) { this.turnKey = key; this.quiet = fired === this.shots ? this.quiet + 1 : 0; this.shots = fired; }
      let best = null;
      for (const u of b.living(this.team)) {
        if (u.ap <= 0) continue;
        const { here, out } = this.options(u);
        for (const o of out) {
          if (!o.act) continue;
          const gain = o.v - here;
          if (gain > 0.05 && (!best || gain > best.gain)) best = { gain, u, o };
        }
      }
      if (best && best.o.act()) { this.log.push(best.u.kind + "#" + best.u.id + " " + best.o.what); return true; }
      b.endTurn();
      return false;
    }
    playTurn(max = 60) { for (let n = 0; n < max && this.step(); n++); if (!this.b.over && this.b.team === this.team) this.b.endTurn(); }
  }
  AI.TUNE = TUNE;
  G.AI = AI;
})();

<script>
/* Test maps in the engine's map format v1 (docs/decisions/2026-10-21-map-format.md; the rules read h, hStep,
   kind, legend and game, see src/core/grid.js), for the rules-only tests and as the maps the game plays
   until Art-Tactics' urban map lands. Plain data, no engine.
   "yard" and "range" are drawn as one sketch per map, one character per tile:
     .  asphalt          ,  concrete         g  grating
     h  half cover (on concrete)             f  full cover (on asphalt)
     1  stairs, 1 m      2  platform, 2 m    H  half cover on the platform
     #  building (solid, 6 m)
   Each cover cell gets one cover prop (a barrier, or a container for full cover), as Grid.check wants.
   "yard" is point-symmetric (tile x, y mirrors 15 - x, 15 - y), so neither side has the better ground:
   two raised platforms reached by stairs, two buildings, barriers, containers and crates.
   "urban" is a copy of the decision's reference map MapV1.URBAN (docs/decisions/2026-10-21-map-format.js),
   until Art-Tactics' urban map (M7) replaces it. */
(function () {
  const TC = (window.TC = window.TC || {});
  TC.maps = TC.maps || {};
  const H = { "1": 1, "2": 2, H: 2, "#": 6 }, K = { ".": "a", f: "a", g: "g", "#": "#" }, C = { h: "h", H: "h", f: "f" };
  const fromSketch = (id, rows, spawn) => {
    const props = [];
    rows.forEach((r, y) => [...r].forEach((c, x) => { if (C[c]) props.push([C[c] === "f" ? "container" : "barrier", null, x, y]); }));
    return {
      v: 1, id, W: rows[0].length, H: rows.length, hStep: 0.5, floor: -2,
      h: rows.map((r) => [...r].map((c) => (H[c] ?? 0).toString(36)).join("")),
      kind: rows.map((r) => [...r].map((c) => K[c] || "c").join("")),
      legend: { a: "asphalt", c: "concrete", g: "grating", "#": "ruin" },

     baker's water (a carved bed and the water surface).

    // 0 against another solid tile, 2 the ruin's own ground floor (a free tile inside the bounding box of
    // the solid tiles it touches), 1 the street

        const qx = x + dx, qy = y + dy;

      roads: rd ? [{ r: rd, axis: rd[3] - rd[1] >= rd[2] - rd[0] ? "y" : "x" }] : [],

    // building's wall (tc_ruin) up to its height, in its kind's skin, windows on the street and bare scorched
    // walls inside; on the MVP map, a plain block raised to its height (map.h metres)

   model has k = 0.5 (1 tile = 2 m), so at 64 voxels per tile one voxel is 3.1 cm, a 1.8 m soldier is 58
   voxels tall and panel lines are 1 voxel wide. Heroes (units) are baked with o.fine; terrain stamps

     tc_drums     oil drums: 0 a cluster of three, 1 a burn barrel (fire), 2 tipped over, leaking

     tc_fence     0 chain-link panel on posts, 1 razor-wire coil on stakes, 2 police barricade (striped)

   The option also sets how big the units are on screen (o.scale over real size; all of them are bigger
   than the MVP set's real-size units).
     tc_char  o.id (TC.CAST id) o.sty (A|B|C) o.pose (idle aim) o.yaw (radians, about z) o.fine
   Each option has its own materials (c<sty>_<colour>), so its ramps (banded or smooth) never touch the

    const bust = near.map((q) => Object.assign({}, q, { x: q.x - hc[0], y: q.y - hc[1], z: q.z - hc[2] }));
    const prims = [...xform([...bust, knife], Mr), ...xform(back, FACECAM)];
    return { prims: xform(prims, I3, [0, 0, TC.PORTRAIT_Z]), r: rd * 1.1 + 0.3, h: TC.PORTRAIT_Z + rd * 1.1 + 0.3, detail: md.detail, kMul: kMulOf(ch, O), disc: rd * 1.07 };
  };
  // the size on screen over real size: the option's scale, a little less for the drones and the mechs
  const kMulOf = (ch, O) => O.scale * (ch.kind === "mech" ? 0.85 : ch.kind === "drone" ? 0.9 : 1);
  const build = (ch, O, o) => (ch.kind === "drone" ? drone(ch, O, o) : ch.kind === "mech" ? mech(ch, O, o) : person(ch, O, o));
  // a portrait's disc (the card's edge, its ink rim included): its centre above the model's anchor and its
  // radius, in metres after the option's scale (the showroom's portrait export crops to it)
  TC.portraitDisc = (id, sty = TC.STYLE) => {
    const ch = byId[id], O = TC.STYLES[sty] || TC.STYLES.A, k = kMulOf(ch, O), md = portrait(ch, build(ch, O, { pose: "idle" }), { yaw: 0.3 }, O);
    return { z: TC.PORTRAIT_Z * k, r: md.disc * k };

  // ---------------------------------------------------------------- registration
  model("tc_char", (o) => {
    const ch = byId[o.id] || TC.CAST[0], O = TC.STYLES[o.sty] || TC.STYLES.A;
    const md = build(ch, O, o);

    md.kMul = kMulOf(ch, O);

  // ---------------------------------------------------------------- the game's units (the user's pick: A, 2026-10-22)
  // The cast replaces the faction pairs in the game (src/art/models.js): team 0 is Kitsune Ward, team 1 Red
  // Lotus, each kind its character drawn in TC.STYLE. TC.castUnit gives what the view needs per character,
  // in tiles: h (the model's height) and muzzle (aim pose, facing +x). The rules' eye heights
  // (TC.units[kind].eye) stay real-size: the option's scale is a drawing choice, not a taller line of sight.
  TC.STYLE = "A";
  TC.SQUADS = ["Kitsune Ward", "Red Lotus"];
  TC.castModel = (team, kind, pose, sty = TC.STYLE) => ["tc_char", { id: TC.castOf(team ? 1 : 0, kind).id, sty, pose }];
  TC.castUnit = (team, kind, sty = TC.STYLE) => {
    const ch = TC.castOf(team ? 1 : 0, kind), O = TC.STYLES[sty] || TC.STYLES.A, md = build(ch, O, { pose: "aim" }), k = 0.5 * kMulOf(ch, O);
    return { h: +(md.h * k).toFixed(3), muzzle: md.muzzle.map((v) => +(v * k).toFixed(3)) };
  };

  for (const kind of Object.keys(TC.units || {})) {
    const a = TC.castUnit(0, kind), b = TC.castUnit(1, kind);
    Object.assign(TC.units[kind], { h: Math.max(a.h, b.h), muzzle: a.muzzle });
  }
})();

<script>
/* Tactics art, the units for the game (the contract in games/Tactics/ARCHITECTURE.md, "Art contract"):
   TG.art.bakeList()  -> { key: [model, o, frames] } for ME.bakeModels(..., { models }): 2 teams x 6 kinds x
                         the 2 baked poses (idle, aim; docs/decisions/2026-10-20-hero-density.md), at hero density
   TG.art.bind(MB)    -> TG.models[team][kind][pose] = { mi, fine, muzzle, h, eye } (mi: the baked variant)
   The units are the cast (assets/cast.js: twelve named characters, TC.castModel, drawn in TC.STYLE, the
   user's pick) and TC.team[t].squad is the cast's squad (TC.SQUADS). Without the cast, the faction pair
   TC.PAIR (A by default) and its squads. Fire, hit and down are the view's (aim + recoil and a muzzle light,
   a tilt, a burst). Reads ME and TC only. */
(function () {
  const ME = window.ME, TC = window.TC, TG = (window.TG = window.TG || {});
  const KINDS = ["rifle", "heavy", "sniper", "medic", "drone", "mech"], POSES = ["idle", "aim"];
  // units are drawn at TC.heroVS voxels per tile: twice the terrain's by default (32 at vs=16) until the
  // engine's progressive upgrade (E2/E4) lets the game bake 64 without the wait; the showroom sets 64.
  // The phone cap is the game's (the hero density decision).
  const fine = () => Math.max(1, (TC.heroVS || 2 * ME.VS) / ME.VS);
  const key = (t, k, p) => "tu:" + t + ":" + k + ":" + p;
  const cast = () => !!(TC.CAST && TC.castModel);
  // the squads' names (the HUD's banner): the cast's, else the faction pair's
  const squads = () => { if (cast()) TC.SQUADS.forEach((s, t) => { TC.team[t].squad = s; }); else TC.setPair(TC.PAIR); };
  TG.art = {
    kinds: KINDS, poses: POSES,
    bakeList() {
      const out = {}, f = fine();
      squads();
      for (const t of [0, 1]) for (const k of KINDS) for (const p of POSES) {
        const [name, o] = cast() ? TC.castModel(t, k, p) : TC.unitModel(t, k, p);
        out[key(t, k, p)] = [name, Object.assign({ fine: f }, o), 1];
      }
      return out;
    },
    bind(MB) {
      const models = (TG.models = [{}, {}]);
      squads();
      for (const t of [0, 1]) for (const k of KINDS) {
        const U = TC.units[k], C = cast() ? TC.castUnit(t, k) : U, m = (models[t][k] = {});
        for (const p of POSES) {
          const fr = MB.extraFrames[key(t, k, p)];
          if (!fr) continue;
          m[p] = { mi: fr[0], fine: MB.models[fr[0]].fine, muzzle: C.muzzle.slice(), h: C.h, eye: U.eye };
        }
      }
      return models;
    },
  };
})();

    }
    // the map's other props, where their models are loaded (cover props are drawn by the pieces above)
    for (const [name, o, x, y] of map.props || []) if (M[name] && !(G.Defs.COVER_PROPS[name])) deco.push([name, o || {}, x + ox, y + oy]);
    return {
      id: "tactics-" + (map.id || "map"), map: { W: N, H: N, hgt, typ, floor: -3, path: [[[ox, oy], [ox + 1, oy]]], geo: { C: N / 2, RI: 11.6 } },
      deco, ramps: RAMPS, mats: MATS, L: [-0.42, 0.62, 0.66], amb: 0.3, aoK: 0.45, shadowK: 0.32, glassZt: 3.4,
      light: { shade: 0.1, pool: 0.4, soft: 0.16, sideK: 1.3, spriteK: 1, beams: [] },
      hd: { bloom: 1.1, haze: 0.05, vignette: 0.55, fog: [8, 10, 22], beamCol: [120, 200, 255] },
      tactics: { ox, oy, z0: BASE * 0.5 },
    };
  };

  // ---------------------------------------------------------------- TG.art (the bound models)
  G.art = G.art || {};
  if (!G.art.bakeList) G.art.bakeList = () => TC.bakeList();
  if (!G.art.bind) G.art.bind = (MB) => {
    const out = [{}, {}];
    for (let t = 0; t < 2; t++) for (const k of KINDS) {
      const u = TC.units[k], one = (p) => { const mi = MB.extraFrames[t + ":" + k + ":" + p][0]; return { mi, fine: MB.models[mi].fine || 1, muzzle: u.muzzle, h: u.h, eye: u.eye }; };
      const idle = one("idle"), aim = one("aim");
      out[t][k] = { idle, aim, fire: aim, hit: idle, down: idle };
    }
    G.models = out;
    return out;
  };
})();

</script>
<script>
/* The battle's look in the engine's shader hooks (ME.SHADER_HOOKS; spliced in by the Renderer):
     mark     units: a faint rim in the team's colour, a bright one when selected, red when targeted,
              amber while on overwatch, a magenta scan while marked, a white flash when hit (markV)
     overlay  the tactical grid on the map's floor, the move range (1 AP in the team's colour, a dash in
              amber), the path, the area a grenade will catch, the hovered tile
   Ground maps (written by BattleView):
     setCells   per world tile: r = reach (255: 1 AP, 128: dash), g = on the path, b = 255 target tile,
                128 area, a = 255 inside the map
     setField   per world tile (fieldRes 1): the tile's floor height / 8, so overlays paint the floor only
   Renderer.user slots:
     user[0] = overlay on, grid on, hovered world tile xy (-1 = none)
     user[2] = the acting team's colour, -;  user[3] = hover colour, -
     user[4], user[5] = team 0 and team 1 colours (unit rims) */
(function () {
  const G = (window.TG = window.TG || {});

  // instance mark bits (sim.put mark; markV = hit flash 0..1)
  G.MARK = { TEAM1: 1, SELECTED: 2, OVERWATCH: 8, TARGET: 16, MARKED: 32, GHOST: 64 };

  G.shaderHooks = () => ({
    mark: /* wgsl */ `
fn hookMark(m: u32, flash: f32, n: vec3f, lp: vec3f, hc: f32, seed: f32) -> Mark {
  var g = Mark(vec4f(0.0), vec3f(0.0));
  let tm = u.vdir.w;
  let rim = pow(1.0 - clamp(dot(n, -u.vdir.xyz), 0.0, 1.0), 2.4);
  let tc = select(u.user[4].rgb, u.user[5].rgb, (m & ${G.MARK.TEAM1}u) != 0u);
  g.emit += tc * rim * 0.45;
  if ((m & ${G.MARK.SELECTED}u) != 0u) { g.emit += tc * rim * (1.6 + 0.5 * sin(tm * 4.0)) + tc * 0.08; }
  if ((m & ${G.MARK.TARGET}u) != 0u) { g.emit += vec3f(1.0, 0.25, 0.2) * rim * (1.5 + 0.6 * sin(tm * 7.0)); }
  if ((m & ${G.MARK.OVERWATCH}u) != 0u) { g.emit += vec3f(1.0, 0.78, 0.3) * rim * (0.7 + 0.3 * sin(tm * 2.5)); }
  if ((m & ${G.MARK.MARKED}u) != 0u) { g.emit += vec3f(1.0, 0.2, 0.65) * step(0.82, fract(lp.z * 9.0 - tm * 1.6)) * 0.9; }
  if ((m & ${G.MARK.GHOST}u) != 0u) { g.tint = vec4f(tc, 0.6); g.emit += tc * (0.25 + rim); }
  if (flash > 0.0) { g.tint = vec4f(1.0, 0.95, 0.9, max(g.tint.a, flash)); g.emit += vec3f(1.0, 0.7, 0.6) * flash * 1.2; }
  return g;
}`,

    overlay: /* wgsl */ `
fn hookOverlay(c: vec3f, p: vec3f, n: vec3f, unit: bool) -> vec3f {
  if (unit || u.user[0].x < 0.5) { return c; }
  let cl = vec2i(floor(p.xy));
  let cell = cellAt(cl);
  if (cell.a < 0.5) { return c; }
  // the floor only: up-facing, at the tile's own floor height (not the top of a crate on it)
  let floorZ = fieldAt(vec2f(cl) + 0.5) * 8.0;
  let top = sstep(0.55, 0.85, n.z) * (1.0 - sstep(0.12, 0.2, abs(p.z - floorZ)));
  if (top <= 0.0) { return c; }
  let f = fract(p.xy);
  let edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  let line = 1.0 - sstep(0.025, 0.07, edge);
  var col = c;
  col = mix(col, vec3f(0.55, 0.85, 1.0), line * 0.1 * u.user[0].y * top);
  if (cell.r > 0.75) { col = mix(col, u.user[2].rgb * 1.2, (0.14 + 0.5 * line) * top); }
  else if (cell.r > 0.25) { col = mix(col, vec3f(1.0, 0.72, 0.25), (0.1 + 0.45 * line) * top); }
  if (cell.b > 0.75) { col = mix(col, vec3f(1.0, 0.25, 0.2), (0.3 + 0.5 * line) * top); }
  else if (cell.b > 0.25) { col = mix(col, vec3f(1.0, 0.45, 0.15), (0.28 + 0.4 * line) * top * (0.8 + 0.2 * sin(u.vdir.w * 6.0))); }
  if (cell.g > 0.5) {
    let d = length(f - 0.5);
    col = mix(col, vec3f(1.0), (1.0 - sstep(0.07, 0.12, d)) * 0.85 * top);
  }
  if (all(cl == vec2i(u.user[0].zw))) { col = mix(col, u.user[3].rgb * 1.5, (0.18 + 0.7 * (1.0 - sstep(0.03, 0.09, edge))) * top); }
  return col;
}`,
  });
})();

</script>
<script>
/* Where the battle grid sits on the baked world, and the ground maps the shader hooks read (view/shaders.js):
     tile (x, y) of the battle grid = world tile (x + ox, y + oy); its floor at z0 + h * 0.5 (h in metres,
     1 m = half a tile, as the rules' Grid reads it from the v1 map). A v1 map baked as it is puts tile
     (x, y) at world [x, x+1) with its ground at h * hStep, so ox, oy and z0 are 0; a style that places the
     map elsewhere (today's placeholder, on the engine's round island) says where in st.tactics.
     pick(px, py, cam, w, h)   the battle tile under a canvas pixel, or null
     paint({ reach, path, target, area })   the overlay maps: Renderer.setCells (one texel per world tile)
   The floor heights go to Renderer.setField once (the overlay paints the floor only, not cover tops). */
(function () {
  const ME = window.ME, G = (window.TG = window.TG || {});

  class Stage {
    constructor(app, map) {
      const { st, T, R } = app, tc = st.tactics || {};
      this.app = app; this.map = map; this.T = T; this.R = R;
      this.grid = new G.Grid(map); // read only: heights and solid tiles (cover changes in the battle's own grid)
      this.ox = tc.ox ?? 0; this.oy = tc.oy ?? 0; this.z0 = tc.z0 ?? 0;
      this.WW = st.map.W; this.WH = st.map.H; // the world's tile grid (the cell and field maps)
      this.cells = new Uint8Array(this.WW * this.WH * 4);
      const field = new Uint8Array(this.WW * this.WH * (R.fieldRes || 1) ** 2);
      const fr = R.fieldRes || 1, FW = this.WW * fr;
      for (let y = 0; y < map.H; y++) for (let x = 0; x < map.W; x++) {
        const v = Math.max(0, Math.min(255, Math.round((this.floorZ(x, y) / 8) * 255)));
        for (let j = 0; j < fr; j++) for (let i = 0; i < fr; i++) field[((y + this.oy) * fr + j) * FW + (x + this.ox) * fr + i] = v;
      }
      R.setField(field);
      this.paint({});
    }
    height(x, y) { return this.grid.h[this.grid.idx(x, y)]; }
    // the kind name of the tile under a world point ("asphalt", "water", "grating"...), "" off the map or
    // over a hole (the audio's surfaces)
    surface(X, Y) { const t = this.tileOf(X, Y); return (t && this.grid.kind[this.grid.idx(t[0], t[1])]) || ""; }
    floorZ(x, y) { return this.z0 + this.height(x, y) * 0.5; }
    // the world point at a tile's centre on its floor
    centre(x, y) { return [x + this.ox + 0.5, y + this.oy + 0.5, this.floorZ(x, y)]; }
    // a world point -> the battle tile it is over (or null off the map)
    tileOf(X, Y) {
      const x = Math.floor(X) - this.ox, y = Math.floor(Y) - this.oy;
      return x >= 0 && y >= 0 && x < this.map.W && y < this.map.H ? [x, y] : null;
    }
    // Screen -> ground: march the view ray from the near plane down until it passes under the baked
    // ground (T.top, the highest voxel per column). Cover and roofs catch the ray, as they should.
    pick(px, py, cam, w, h) {
      const iv = cam.matrices(w, h).ivp, nx = (px / w) * 2 - 1, ny = 1 - (py / h) * 2;
      const a = ME.m4.apply(iv, [nx, ny, 1]), b = ME.m4.apply(iv, [nx, ny, 0]), T = this.T;
      const zTop = T.O[2] + T.NZ / T.VS, zBot = T.O[2];
      const ta = (zTop - a[2]) / (b[2] - a[2]), tb = (zBot - a[2]) / (b[2] - a[2]);
      const t0 = Math.max(0, Math.min(ta, tb)), t1 = Math.min(1, Math.max(ta, tb));
      const L = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]) * (t1 - t0), n = Math.ceil(L * T.VS * 2);
      for (let s = 0; s <= n; s++) {
        const t = t0 + ((t1 - t0) * s) / n, X = a[0] + (b[0] - a[0]) * t, Y = a[1] + (b[1] - a[1]) * t, Z = a[2] + (b[2] - a[2]) * t;
        const i = Math.floor((X - T.O[0]) * T.VS), j = Math.floor((Y - T.O[1]) * T.VS);
        if (i < 0 || j < 0 || i >= T.NX || j >= T.NY) continue;
        const k = T.top[j * T.NX + i];
        if (k >= 0 && Z <= T.O[2] + k / T.VS) return this.tileOf(X, Y);
      }
      return null;
    }
    // reach: Map tile index -> { ap } (battle.reach); path: [[x, y]...]; target: [x, y]; area: [[x, y]...]
    paint({ reach, path, target, area } = {}) {
      const c = this.cells, map = this.map, W = map.W;
      c.fill(0);
      const at = (x, y) => ((y + this.oy) * this.WW + x + this.ox) * 4;
      for (let y = 0; y < map.H; y++) for (let x = 0; x < W; x++) if (!this.grid.closed(this.grid.idx(x, y))) c[at(x, y) + 3] = 255;
      if (reach) for (const [i, e] of reach) if (e.end) c[at(i % W, Math.floor(i / W))] = e.ap === 1 ? 255 : 128;
      if (path) for (const [x, y] of path.slice(1)) c[at(x, y) + 1] = 255;
      if (area) for (const [x, y] of area) c[at(x, y) + 2] = 128;
      if (target) c[at(target[0], target[1]) + 2] = 255;
      this.R.setCells(c);
    }
  }
  G.Stage = Stage;
})();

</script>
<script>
/* The squads on screen: an instance layer of the engine Sim (sim.layers) drawing each unit with the art's
   bound models (TG.models[team][kind][pose], art/models.js or the placeholder). It shows the battle as the
   playback has got to it (view/playback.js), not as the rules already are: a display copy per unit with
   its world position, facing, pose, hit flash and the hp the bars show. The playback moves these; the
   input sets selected, targets and hoverId.
     unit fields: id, team, kind, x, y (tile), P [X, Y, Z], yaw, pose, flash, hit (the hit tilt, 1 -> 0 over 0.2 s), hp, maxHp, alive, gone (hidden
     after its death burst), overwatch, hunker, marked, walk (a step in progress) */
(function () {
  const G = (window.TG = window.TG || {});
  const lerp = (a, b, u) => a + (b - a) * u, ease = (u) => (u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2);
  const angLerp = (a, b, u) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * u; };

  class UnitsView {
    constructor(stage, battle) {
      this.stage = stage;
      this.units = battle.units.map((u) => ({
        id: u.id, team: u.team, kind: u.kind, x: u.x, y: u.y, P: stage.centre(u.x, u.y), yaw: u.facing, yawTo: u.facing,
        pose: "idle", poseT: 0, flash: 0, hit: 0, hp: u.hp, maxHp: u.maxHp, alive: true, gone: false, overwatch: false, hunker: false, marked: false, walk: null, recoil: 0,
      }));
      this.selected = -1; this.targets = new Set(); this.hoverId = -1;
    }
    // where a unit's body is (chest height), its eye and its weapon's muzzle, in the world
    chest(u) { const m = this.model(u); return [u.P[0], u.P[1], u.P[2] + (m.h || 0.9) * 0.6]; }
    head(u) { const m = this.model(u); return [u.P[0], u.P[1], u.P[2] + (m.h || 0.9) + 0.12]; }
    muzzle(u) {
      const m = this.model(u, "aim"), q = m.muzzle || [0.4, 0, 0.6], c = Math.cos(u.yaw), s = Math.sin(u.yaw);
      return [u.P[0] + q[0] * c - q[1] * s, u.P[1] + q[0] * s + q[1] * c, u.P[2] + q[2]];
    }
    model(u, pose = u.pose) { const k = G.models[u.team][u.kind]; return k[pose] || k.idle; }

    // a step from tile to tile over dur seconds (a hop where the floor changes height)
    stepTo(u, to, dur) {
      const from = u.P.slice(), P1 = this.stage.centre(to[0], to[1]);
      u.walk = { from, to: P1, t: 0, dur }; u.yawTo = Math.atan2(P1[1] - from[1], P1[0] - from[0]);
      u.x = to[0]; u.y = to[1];
    }
    face(u, X, Y) { u.yawTo = Math.atan2(Y - u.P[1], X - u.P[0]); }
    update(dt) {
      for (const u of this.units) {
        u.flash = Math.max(0, u.flash - dt * 3);
        u.hit = Math.max(0, u.hit - dt * 5);
        u.recoil = Math.max(0, u.recoil - dt * 6);
        u.yaw = angLerp(u.yaw, u.yawTo, Math.min(1, dt * 12));
        const w = u.walk;
        if (w) {
          w.t += dt;
          const k = Math.min(1, w.t / w.dur), e = ease(k), dz = w.to[2] - w.from[2];
          u.P = [lerp(w.from[0], w.to[0], e), lerp(w.from[1], w.to[1], e), lerp(w.from[2], w.to[2], e) + (Math.abs(dz) > 0.01 ? Math.sin(k * Math.PI) * 0.18 : Math.abs(Math.sin(k * Math.PI)) * 0.03)];
          if (k >= 1) { u.P = w.to.slice(); u.walk = null; }
        }
      }
    }
    // the engine Sim's instance layer
    writeInstances(time, sim, i) {
      const MK = G.MARK;
      for (const u of this.units) {
        if (u.gone) continue;
        const m = this.model(u), k = 1 / (m.fine || 1);
        let Z = u.P[2];
        if (u.kind === "drone") Z += Math.sin(time * 2.3 + u.id) * 0.04;
        const breathe = u.kind === "drone" || u.kind === "mech" ? 0 : Math.sin(time * 1.8 + u.id * 1.7) * 0.012;
        const back = u.recoil * 0.05, X = u.P[0] - Math.cos(u.yaw) * back, Y = u.P[1] - Math.sin(u.yaw) * back;
        let mark = u.team ? MK.TEAM1 : 0;
        if (u.id === this.selected) mark |= MK.SELECTED;
        if (this.targets.has(u.id) || u.id === this.hoverId) mark |= MK.TARGET;
        if (u.overwatch) mark |= MK.OVERWATCH;
        if (u.marked) mark |= MK.MARKED;
        const sc = u.hunker ? [k * 1.04, k * 1.04, k * 0.9] : [k, k, k * (1 + breathe)];
        // a hit throws the unit back about 12 degrees for 0.2 s (pitch raises the model's front, +X)
        const pitch = u.kind === "drone" ? 0 : 0.21 * Math.sin(Math.PI * (1 - u.hit));
        sim.put(i++, m.mi, X, Y, Z, u.yaw, false, sc, [0, 0], 1, pitch, mark, u.flash);
      }
      return i;
    }
    // canvas pixel -> the living unit drawn there (the nearest within its screen size), or null
    pickUnit(px, py, cam, w, h) {
      let best = null, bd = Infinity;
      for (const u of this.units) {
        if (!u.alive) continue;
        const m = this.model(u), a = cam.toScreen(u.P, w, h), b = cam.toScreen([u.P[0], u.P[1], u.P[2] + (m.h || 0.9)], w, h);
        const r = Math.max(10, Math.abs(a[1] - b[1]) * 0.45), cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
        const d = Math.hypot((px - cx) / r, (py - cy) / (Math.abs(a[1] - b[1]) * 0.55 + 6));
        if (d < 1 && d < bd) { bd = d; best = u; }
      }
      return best;
    }
  }
  G.UnitsView = UnitsView;
})();

</script>
<script>
/* Effects: what shots and blasts look like, through the engine's sprite batch (R.sprites: tracers, muzzle
   flashes, sparks, shock rings, the health bars), its point lights (R.setLights: muzzle and blast light)
   and its voxel physics (phys: chips knocked off cover, cover giving way, units bursting into their
   voxels, blast debris). Floating combat text is DOM, placed over the canvas every frame.
     tracer(a, b, col)  muzzle(p, col)  sparks(p, n, col)  ring(p, r, col)  blast(p, r)
     chip(p)            a shot strikes cover at p: a few voxels knocked off it
     crumble(X, Y, Z, was)  a cover object destroyed: its voxels come loose and slump
     burst(u)           a unit dies: it bursts into its own voxels
     text(p, s, cls)    a floating label at world p */
(function () {
  const ME = window.ME, G = (window.TG = window.TG || {}), K = ME.SPRITE;

  class Fx {
    constructor(app, units, floatsEl) {
      this.app = app; this.R = app.R; this.phys = app.phys; this.MB = app.MB; this.units = units; this.el = floatsEl;
      this.beams = []; this.orbs = []; this.rings = []; this.sparkList = []; this.floats = []; this.flashes = []; this.shells = [];
      this.baseLights = []; this.lightsDirty = false; this.vox = new Map(); this.time = 0;
    }
    setBaseLights(list) { this.baseLights = list; this.lightsDirty = true; }
    tracer(a, b, col, w = 0.035, life = 0.14) { this.beams.push({ a, b, col, w, life, t: 0 }); }
    muzzle(p, col) {
      this.orbs.push({ p, size: 0.22, col, life: 0.09, t: 0 });
      this.flash(p, col, 1.8, 0.12);
    }
    flash(p, col, k, life, r = 2.2) { this.flashes.push({ p, col, k, life, t: 0, r }); this.lightsDirty = true; }
    sparks(p, n, col, speed = 2.2) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * Math.PI * 2, e = Math.random() * 1.2, s = speed * (0.3 + 0.7 * Math.random());
        this.sparkList.push({ p: p.slice(), v: [Math.cos(a) * Math.cos(e) * s, Math.sin(a) * Math.cos(e) * s, Math.sin(e) * s + 0.6], col, life: 0.25 + Math.random() * 0.35, t: 0 });
      }
    }
    ring(p, r, col, life = 0.5, ground = true) { this.rings.push({ p, r, col, life, t: 0, ground }); }
    // a grenade or rocket flying from a to b over dur s, arcing up by arc tiles at mid-flight
    lob(a, b, dur, arc, col) { this.shells.push({ a, b, life: dur, arc, col, t: 0 }); }
    shellAt(s) { const u = Math.min(1, s.t / s.life); return [s.a[0] + (s.b[0] - s.a[0]) * u, s.a[1] + (s.b[1] - s.a[1]) * u, s.a[2] + (s.b[2] - s.a[2]) * u + 4 * s.arc * u * (1 - u)]; }
    blast(p, r) {
      this.orbs.push({ p: [p[0], p[1], p[2] + 0.3], size: r * 1.4, col: [1.0, 0.55, 0.2], life: 0.35, t: 0 });
      this.ring([p[0], p[1], p[2] + 0.05], r * 1.3, [1.0, 0.5, 0.2], 0.6);
      this.sparks([p[0], p[1], p[2] + 0.3], 40, [1.0, 0.7, 0.3], 4);
      this.flash([p[0], p[1], p[2] + 0.8], [1.0, 0.6, 0.3], 5, 0.4, r * 3);
      if (this.phys) this.phys.explode(p, Math.min(0.9, r * 0.5), 260, { speed: 2.6, life: 8 });
    }
    chip(p) {
      this.sparks(p, 10, [1.0, 0.85, 0.55], 1.8);
      if (this.phys) this.phys.dig(p, 0.09, { speed: 1.4 });
    }
    crumble(X, Y, Z, was) {
      if (!this.phys) return;
      const top = was === "f" ? 1.25 : 0.5;
      for (let z = 0.15; z <= top; z += 0.3) this.phys.collapse([X, Y, Z + z], 0.62);
      this.phys.dig([X, Y, Z + top * 0.6], 0.3, { speed: 1.2 });
    }
    // a model's voxels, sampled once: positions relative to its anchor (world units) and the material
    voxelsOf(mi, max = 900) {
      let v = this.vox.get(mi);
      if (v) return v;
      const MB = this.MB, m = MB.models[mi], VS = this.app.T.VS * (m.fine || 1), [nx, ny, nz] = m.dims, [ox, oy, oz] = m.box, all = [];
      for (let z = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
        const mat = MB.voxel(mi, x, y, z);
        if (mat) all.push([(ox + x + 0.5) / VS, (oy + y + 0.5) / VS, (oz + z + 0.5) / VS, mat]);
      }
      for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)), t = all[i]; all[i] = all[j]; all[j] = t; }
      v = all.slice(0, max);
      this.vox.set(mi, v);
      return v;
    }
    burst(u) {
      const m = this.units.model(u), list = this.voxelsOf(m.mi), c = Math.cos(u.yaw), s = Math.sin(u.yaw), cz = (m.h || 0.9) * 0.45, P = this.phys;
      this.sparks(this.units.chest(u), 24, [1.0, 0.6, 0.4], 2.6);
      if (!P) return;
      for (const [x0, y0, z, mat] of list) {
        const x = x0 * c - y0 * s, y = x0 * s + y0 * c, dz = z - cz, dl = Math.hypot(x, y, dz) || 1, sp = 1.3 * (0.4 + 0.6 * Math.random());
        P.emitMat(u.P[0] + x, u.P[1] + y, u.P[2] + z, (x / dl) * sp + (Math.random() - 0.5) * 0.4, (y / dl) * sp + (Math.random() - 0.5) * 0.4, (dz / dl) * sp * 0.5 + sp * 0.5, mat, 40);
      }
    }
    text(p, s, cls = "") {
      const d = document.createElement("div");
      d.className = "float " + cls; d.textContent = s;
      this.el.appendChild(d);
      this.floats.push({ p: p.slice(), d, t: 0, life: 1.3 });
    }

    update(dt) {
      this.time += dt;
      const age = (list) => { for (const f of list) f.t += dt; return list.filter((f) => f.t < f.life); };
      this.beams = age(this.beams); this.orbs = age(this.orbs); this.rings = age(this.rings); this.shells = age(this.shells);
      for (const s of this.shells) if (Math.random() < dt * 40) this.sparkList.push({ p: this.shellAt(s), v: [0, 0, 0.2], col: [0.8, 0.6, 0.4], life: 0.3, t: 0 });
      const nf = this.flashes.length; this.flashes = age(this.flashes); if (this.flashes.length !== nf) this.lightsDirty = true;
      for (const s of this.sparkList) { s.v[2] -= 6 * dt; for (let k = 0; k < 3; k++) s.p[k] += s.v[k] * dt; }
      this.sparkList = age(this.sparkList);
      for (const f of this.floats) { f.t += dt; f.p[2] += dt * 0.35; if (f.t >= f.life) f.d.remove(); }
      this.floats = this.floats.filter((f) => f.t < f.life);
      // the point lights change only when a flash starts or ends (re-binning is CPU work)
      if (this.lightsDirty) {
        this.lightsDirty = false;
        this.R.setLights([...this.baseLights, ...this.flashes.map((f) => ({ p: f.p, r: f.r, col: f.col, k: f.k }))]);
      }
    }
    // the sprite batch for this frame: effects (additive), then the health bars (alpha, on top)
    draw(barPx = 1) {
      const sp = this.R.sprites;
      sp.begin();
      for (const b of this.beams) { const f = 1 - b.t / b.life; sp.put(b.a[0], b.a[1], b.a[2], b.w, b.b[0], b.b[1], b.b[2], K.BEAM, b.col[0] * 3 * f, b.col[1] * 3 * f, b.col[2] * 3 * f, 1); }
      for (const o of this.orbs) { const f = 1 - o.t / o.life; sp.put(o.p[0], o.p[1], o.p[2], o.size * (0.6 + 0.4 * f), 0, 0, 0, K.ORB, o.col[0] * 2 * f, o.col[1] * 2 * f, o.col[2] * 2 * f, 1); }
      for (const s of this.sparkList) { const f = 1 - s.t / s.life; sp.put(s.p[0], s.p[1], s.p[2], 0.035, 0, 0, 0, K.ORB, s.col[0] * 2.5 * f, s.col[1] * 2.5 * f, s.col[2] * 2.5 * f, 1); }
      for (const r of this.rings) { const u = r.t / r.life, f = 1 - u; sp.put(r.p[0], r.p[1], r.p[2], r.r * (0.3 + 0.7 * Math.sqrt(u)), 0, 0, 0, r.ground ? K.GROUND : K.RING, r.col[0] * 1.6 * f, r.col[1] * 1.6 * f, r.col[2] * 1.6 * f, 1); }
      for (const s of this.shells) { const p = this.shellAt(s); sp.put(p[0], p[1], p[2], 0.09, 0, 0, 0, K.ORB, s.col[0] * 2.5, s.col[1] * 2.5, s.col[2] * 2.5, 1); }
      sp.overlay();
      const team = (window.TC && window.TC.team) || [];
      for (const u of this.units.units) {
        if (!u.alive) continue;
        const p = this.units.head(u), c = (team[u.team] && team[u.team].rgb) || [1, 1, 1];
        sp.put(p[0], p[1], p[2], 0, Math.max(18, u.maxHp * 4) * barPx, 4 * barPx, u.hp / u.maxHp, K.BAR, c[0], c[1], c[2], 1);
      }
      sp.end();
    }
    // the floating labels follow their world points
    place(cam, canvas) {
      const r = canvas.getBoundingClientRect(), kx = r.width / canvas.width, ky = r.height / canvas.height;
      for (const f of this.floats) {
        const [x, y] = cam.toScreen(f.p, canvas.width, canvas.height), u = f.t / f.life;
        f.d.style.transform = `translate(${(x * kx).toFixed(1)}px, ${(y * ky).toFixed(1)}px) translate(-50%, -100%)`;
        f.d.style.opacity = (u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3).toFixed(2);
      }
    }
  }
  G.Fx = Fx;
})();

</script>
<script>
/* Plays the battle's events back at the view's pace. The rules resolve an action at once and emit events
   (core/battle.js); this queues them and turns each into a timed beat on the units (view/units.js) and the
   effects (view/fx.js): a step walks a tile, a shot turns, aims, fires a tracer and strikes, a blast lobs
   and explodes. The input waits until it is idle. hooks: turn(e), end(e), changed() (the HUD redraws),
   cue(name, p, o) (the sound of a beat at world point p, or null: shot.<weapon>, impact[.crit|.cover|.miss],
   impact.water, impact.metal (a miss landing in water or on grating), launch.<ability>, blast.<ability>,
   debris, step.<kind>.<surface> (the tile's kind name), down.<kind>, overwatch[.fire], reload, hunker,
   heal, mark, turn[.enemy], end[.win|.lose|.draw]; the audio resolves them, src/audio/audio.js).
   speed scales every beat (the scripted match plays fast). */
(function () {
  const G = (window.TG = window.TG || {});
  const WEAPON_FX = {
    rifle: { n: 3, gap: 0.06, w: 0.03, col: [1.0, 0.85, 0.5] },
    lmg: { n: 5, gap: 0.05, w: 0.035, col: [1.0, 0.75, 0.4] },
    rail: { n: 1, gap: 0, w: 0.07, col: [0.55, 0.9, 1.0], life: 0.35 },
    smg: { n: 4, gap: 0.045, w: 0.025, col: [1.0, 0.9, 0.6] },
    pulse: { n: 2, gap: 0.09, w: 0.045, col: [0.5, 1.0, 0.9] },
    cannon: { n: 2, gap: 0.12, w: 0.06, col: [1.0, 0.65, 0.3] },
  };

  class Playback {
    constructor(battle, stage, units, fx, hooks = {}) {
      this.b = battle; this.stage = stage; this.units = units; this.fx = fx; this.hooks = hooks;
      this.queue = []; this.job = null; this.speed = 1; this.played = 0;
      battle.onAny((e) => this.queue.push(e));
    }
    get idle() { return !this.job && !this.queue.length; }
    update(dt) {
      let left = dt * this.speed;
      while (left > 0) {
        if (!this.job) {
          if (!this.queue.length) break;
          const e = this.queue.shift();
          this.job = this.begin(e); this.job.t = 0; this.played++;
          this.hooks.changed && this.hooks.changed(e);
        }
        const j = this.job, step = Math.min(left, j.dur - j.t);
        j.t += step; left -= step;
        while (j.at.length && j.at[0][0] <= j.t + 1e-9) j.at.shift()[1]();
        if (j.t >= j.dur - 1e-9) { for (const [, f] of j.at) f(); this.job = null; }
        if (step <= 0 && this.job) break;
      }
    }
    // an event -> { dur, at: [[time, fn]...] } (sorted)
    begin(e) {
      const U = this.units.units, fx = this.fx, uv = this.units, st = this.stage;
      const at = [], job = { dur: 0.05, at };
      const later = (t, f) => at.push([t, f]);
      const cue = (name, p, o) => this.hooks.cue && this.hooks.cue(name, p, o);
      const u = e.unit !== undefined ? U[e.unit] : null;
      switch (e.type) {
        case "turn":
          for (const v of U) {
            if (v.team === e.team) { v.overwatch = false; v.hunker = false; }
            if (v.markedBy === e.team) { v.marked = false; v.markedBy = -1; }
          }
          this.hooks.turn && this.hooks.turn(e);
          cue(this.hooks.mine && !this.hooks.mine(e.team) ? "turn.enemy" : "turn", null);
          job.dur = 0.9;
          break;
        case "move": u.pose = "idle"; job.dur = 0.02; break;
        case "step": {
          const diag = e.from[0] !== e.to[0] && e.from[1] !== e.to[1], climb = st.height(e.to[0], e.to[1]) !== st.height(e.from[0], e.from[1]);
          job.dur = (diag ? 0.27 : 0.2) + (climb ? 0.08 : 0);
          uv.stepTo(u, e.to, job.dur);
          const surf = st.grid.kind[st.grid.idx(e.to[0], e.to[1])] || "";
          later(job.dur * 0.5, () => cue("step." + u.kind + (surf ? "." + surf : ""), u.P));
          break;
        }
        case "shot": {
          const t = U[e.target], W = WEAPON_FX[e.weapon] || WEAPON_FX.rifle;
          this.crit = e.crit;
          if (e.reaction) { u.overwatch = false; fx.text(uv.head(u), "OVERWATCH", "ow"); cue("overwatch.fire", u.P); }
          uv.face(u, t.P[0], t.P[1]); u.pose = "aim";
          const t0 = e.reaction ? 0.15 : 0.32;
          for (let k = 0; k < W.n; k++) later(t0 + k * W.gap, () => {
            const a = uv.muzzle(u), b = this.impact(u, t, e, k);
            fx.tracer(a, b, W.col, W.w, W.life || 0.12);
            fx.muzzle(a, W.col);
            u.recoil = 1;
            cue("shot." + e.weapon, a);
            cue(e.hit ? (e.crit && k === 0 ? "impact.crit" : "impact") : e.coverTile ? "impact.cover" : "impact.miss", b);
            // a miss that lands on the ground: water splashes, grating rings
            if (!e.hit && !e.coverTile) { const s = st.surface(b[0], b[1]); if (s === "water" || s === "grating") cue(s === "water" ? "impact.water" : "impact.metal", b); }
            if (e.hit) fx.sparks(b, 6, [1.0, 0.45, 0.3]);
            else if (e.coverTile) fx.chip(b);
            else fx.sparks(b, 3, [0.9, 0.8, 0.6], 1.2);
          });
          const tEnd = t0 + W.n * W.gap + 0.12;
          later(tEnd, () => {
            if (!e.hit) fx.text(uv.head(t), e.coverTile ? "MISS · COVER" : "MISS", "miss");
          });
          later(tEnd + 0.35, () => { u.pose = "idle"; });
          job.dur = tEnd + 0.15;
          break;
        }
        case "damage":
          u.hp = e.hp; u.flash = 1; u.hit = 1;
          fx.text(uv.head(u), (this.crit && !e.area ? "CRIT −" : "−") + e.dmg, this.crit && !e.area ? "crit" : "dmg");
          job.dur = e.area ? 0.05 : 0.2;
          break;
        case "kill":
          u.alive = false; u.overwatch = false;
          later(0.12, () => { fx.burst(u); u.gone = true; cue("down." + u.kind, uv.chest(u)); });
          fx.text(uv.head(u), "DOWN", "down");
          job.dur = 0.75;
          break;
        case "overwatch": u.overwatch = true; u.pose = "aim"; fx.text(uv.head(u), "OVERWATCH", "ow"); cue("overwatch", u.P); later(0.4, () => { u.pose = "idle"; }); job.dur = 0.5; break;
        case "reload": fx.text(uv.head(u), "RELOAD", "info"); cue("reload", u.P); job.dur = 0.45; break;
        case "hunker": u.hunker = true; fx.text(uv.head(u), "HUNKER", "info"); cue("hunker", u.P); job.dur = 0.4; break;
        case "heal": {
          const t = U[e.target];
          fx.tracer(uv.chest(u), uv.chest(t), [0.3, 1.0, 0.55], 0.05, 0.4);
          cue("heal", uv.chest(t));
          later(0.3, () => { t.hp += e.amount; fx.sparks(uv.chest(t), 14, [0.3, 1.0, 0.5], 0.8); fx.text(uv.head(t), "+" + e.amount, "heal"); });
          job.dur = 0.7;
          break;
        }
        case "mark": {
          const t = U[e.target];
          uv.face(u, t.P[0], t.P[1]);
          fx.tracer(uv.muzzle(u), uv.chest(t), [1.0, 0.25, 0.7], 0.02, 0.5);
          cue("mark", uv.chest(u));
          later(0.25, () => { t.marked = true; t.markedBy = u.team; fx.text(uv.head(t), "MARKED", "mark"); });
          job.dur = 0.65;
          break;
        }
        case "area": {
          const p = st.centre(e.at[0], e.at[1]), grenade = e.ability === "grenade", fly = grenade ? 0.7 : 0.4;
          uv.face(u, p[0], p[1]); u.pose = "aim";
          later(0.25, () => { const a = uv.muzzle(u); fx.lob(a, [p[0], p[1], p[2] + 0.1], fly, grenade ? 1.6 : 0.25, grenade ? [1.0, 0.8, 0.4] : [1.0, 0.5, 0.25]); if (!grenade) fx.muzzle(a, [1.0, 0.6, 0.3]); cue("launch." + e.ability, a); });
          later(0.25 + fly, () => { fx.blast(p, 1.5); this.hooks.shake && this.hooks.shake(0.6); u.pose = "idle"; cue("blast." + e.ability, p); });
          job.dur = 0.25 + fly + 0.45;
          break;
        }
        case "cover_broken": { const p = st.centre(e.x, e.y); fx.crumble(p[0], p[1], p[2], e.was); cue("debris", p); job.dur = 0.04; break; }
        case "end": this.hooks.end && this.hooks.end(e); cue(e.winner < 0 ? "end.draw" : this.hooks.mine && !this.hooks.mine(e.winner) ? "end.lose" : "end.win", null); job.dur = 0.01; break;
      }
      at.sort((a, b) => a[0] - b[0]);
      return job;
    }
    // where shot k of a burst ends: the target's chest, the cover it struck (the side facing the shooter),
    // or past the target
    impact(u, t, e, k) {
      const c = this.units.chest(t), j = () => (Math.random() - 0.5) * 0.12;
      if (e.hit && (k === 0 || Math.random() < 0.7)) return [c[0] + j(), c[1] + j(), c[2] + j()];
      if (e.coverTile) {
        const p = this.stage.centre(e.coverTile[0], e.coverTile[1]), dx = u.P[0] - p[0], dy = u.P[1] - p[1], L = Math.hypot(dx, dy) || 1;
        const tall = e.cover === 2;
        return [p[0] + (dx / L) * 0.42 + j(), p[1] + (dy / L) * 0.42 + j(), p[2] + (tall ? 0.6 : 0.3) + Math.random() * 0.2];
      }
      const dx = c[0] - u.P[0], dy = c[1] - u.P[1], L = Math.hypot(dx, dy) || 1, side = (Math.random() < 0.5 ? -1 : 1) * (0.35 + Math.random() * 0.3);
      return [c[0] + (dx / L) * 1.2 - (dy / L) * side, c[1] + (dy / L) * 1.2 + (dx / L) * side, Math.max(t.P[2] + 0.05, c[2] - 0.4 + Math.random() * 0.6)];
    }
  }
  G.Playback = Playback;
})();

</script>
<script>
/* The HUD (DOM over the canvas): whose turn and the round, both squads (hp as shown by the playback, AP,
   ammo, status), the selected unit's actions with their keys, the shot preview (hit chance and what makes
   it), the turn banner and the end screen. It shows; the input (src/input.js) decides: every button calls
   one of its handlers. refresh(view) redraws from { battle, units (display copies), sel, mode, preview }. */
(function () {
  const ME = window.ME, G = (window.TG = window.TG || {}), D = G.Defs;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // a squad's display name: the art's TC.team[t].squad, else its name
  const squad = (t) => { const x = ((window.TC && window.TC.team) || [])[t] || {}; return x.squad || x.name || "Team " + t; };
  const ICON = { rifle: "◆", heavy: "■", sniper: "▲", medic: "✚", drone: "◎", mech: "⬢" };
  // the action bar: id, label, key (a physical key: ME.keys names it in the player's layout)
  const ACTIONS = [
    { id: "shoot", label: "Shoot", key: "Digit1" },
    { id: "overwatch", label: "Overwatch", key: "Digit2" },
    { id: "reload", label: "Reload", key: "Digit3" },
    { id: "ability", label: "Ability", key: "Digit4" },
    { id: "next", label: "Next unit", key: "Tab" },
    { id: "end", label: "End turn", key: "Enter" },
  ];

  class Hud {
    constructor(on) {
      this.on = on;
      this.bar = $("actions"); this.btn = {};
      for (const a of ACTIONS) {
        const b = document.createElement("button");
        b.className = "btn act " + a.id; b.dataset.id = a.id;
        b.innerHTML = `<span class="lbl"></span><kbd></kbd>`;
        b.addEventListener("click", () => this.on.action(a.id));
        this.bar.appendChild(b); this.btn[a.id] = b;
      }
      $("again").addEventListener("click", () => this.on.again());
      this.keys(); ME.keys.onChange(() => this.keys());
      this.bannerT = 0;
    }
    keys() {
      for (const a of ACTIONS) this.btn[a.id].querySelector("kbd").textContent = a.key === "Tab" ? "Tab" : a.key === "Enter" ? "↵" : ME.keys.label(a.key);
      $("help").textContent = ME.keys.text("click a unit, then a tile to move · hover an enemy to aim, click to fire · {KeyQ}/{KeyE} turn the view · wheel zoom · drag pan · {KeyM} sound · Esc cancel");
    }
    banner(text, cls) {
      const b = $("banner");
      b.textContent = text; b.className = "show " + (cls || "");
      clearTimeout(this.bannerT); this.bannerT = setTimeout(() => { b.className = cls || ""; }, 1300);
    }
    refresh(v) {
      const B = v.battle, player = v.player;
      $("round").textContent = "Round " + Math.max(1, B.round);
      const turn = $("turn");
      turn.textContent = B.over ? "Battle over" : squad(B.team) + (player.includes(B.team) ? " · your move" : " · enemy move");
      turn.className = "t" + B.team;
      for (const t of [0, 1]) {
        const el = $("roster" + t);
        el.innerHTML = `<div class="rname t${t}">${esc(squad(t))}</div>` + B.units.filter((u) => u.team === t).map((u) => {
          const d = v.units[u.id], K = D.UNITS[u.kind], W = D.WEAPONS[K.weapon];
          const pips = Array.from({ length: d.maxHp }, (_, k) => `<i class="${k < d.hp ? "on" : ""}"></i>`).join("");
          const ap = Array.from({ length: D.AP }, (_, k) => `<b class="${k < u.ap && B.team === t && u.alive ? "on" : ""}"></b>`).join("");
          const st = [d.overwatch ? "<em class='ow'>OW</em>" : "", d.hunker ? "<em>HK</em>" : "", d.marked ? "<em class='mk'>MK</em>" : ""].join("");
          return `<div class="card ${d.alive ? "" : "dead"} ${u.id === v.sel ? "sel" : ""}" data-id="${u.id}"><span class="ic">${ICON[u.kind] || "•"}</span><span class="nm">${esc(K.name)}</span><span class="ap">${ap}</span><span class="hp">${pips}</span><span class="am">${u.ammo}/${W.mag}</span>${st}</div>`;
        }).join("");
        for (const c of el.querySelectorAll(".card")) c.onclick = () => this.on.select(+c.dataset.id);
      }
      // the selected unit's panel and actions
      const u = v.sel >= 0 ? B.units[v.sel] : null, mine = u && player.includes(u.team) && B.team === u.team && !B.over;
      this.bar.style.visibility = player.includes(B.team) && !B.over ? "visible" : "hidden";
      const info = $("unit");
      if (u) {
        const K = D.UNITS[u.kind], W = D.WEAPONS[K.weapon], A = D.ABILITIES[K.ability];
        info.innerHTML = `<div class="un t${u.team}">${esc(K.name)}</div><div class="us">${esc(W.name)} · ${W.dmg[0]}–${W.dmg[1]} dmg · aim ${K.aim} · armour ${K.armour} · move ${K.mob}</div><div class="us">${esc(A.name)}${A.charges ? ` (${u.charges} left)` : ""}</div>`;
        info.style.display = "";
      } else info.style.display = "none";
      for (const a of ACTIONS) {
        const b = this.btn[a.id], why = v.why ? v.why(a.id) : "";
        b.disabled = !!why || (!mine && a.id !== "end" && a.id !== "next");
        b.title = why || "";
        b.classList.toggle("on", v.mode === a.id);
        b.querySelector(".lbl").textContent = a.id === "ability" && u ? D.ABILITIES[D.UNITS[u.kind].ability].name : a.label;
      }
      this.preview(v.preview);
      $("hint").textContent = v.hint || "";
    }
    // shot preview: { name, info (battle.shotInfo), label } or null
    preview(p) {
      const el = $("preview");
      if (!p) { el.style.display = "none"; return; }
      const i = p.info, rows = [];
      if (i) {
        rows.push(["range " + i.dist.toFixed(1), i.range]);
        if (i.cover) rows.push([i.cover === 2 ? "full cover" : "half cover", -i.def]);
        if (i.flanked) rows.push(["flanked", "crit +" + D.FLANK_CRIT]);
        if (i.height) rows.push([i.height > 0 ? "high ground" : "shooting up", i.height]);
        if (i.mark) rows.push(["marked", i.mark]);
        if (p.aimed) rows.push(["aimed shot", D.ABILITIES.aimed.aim]);
        if (p.reaction) rows.push(["overwatch", D.OVERWATCH_AIM]);
      }
      el.innerHTML = `<div class="pv-t">${esc(p.label || "Fire at " + p.name)}</div>` + (i ? `<div class="pv-c">${i.chance}<small>%</small></div><div class="pv-s">crit ${i.crit}% · ${Math.max(1, i.dmg[0] - i.armour)}–${Math.max(1, i.dmg[1] - i.armour)} dmg</div><table>${rows.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${typeof b === "number" ? (b > 0 ? "+" : "") + b : esc(b)}</td></tr>`).join("")}</table>` : `<div class="pv-s">${esc(p.text || "")}</div>`);
      el.style.display = "";
    }
    // left: each squad's survivors (a draw is either both wiped out by one blast, or the round limit)
    showEnd(e, stats, player, left = [1, 1]) {
      const won = e.winner >= 0 && player.includes(e.winner), wiped = e.winner < 0 && !left[0] && !left[1];
      const title = wiped ? "No survivors" : e.winner < 0 ? "Stalemate" : player.length === 2 ? squad(e.winner) + " wins" : won ? "Area secured" : "Squad lost";
      const why = wiped ? "The last blast took down both squads in round " + e.round + "."
        : e.winner < 0 ? "Neither squad broke after " + e.round + " rounds."
        : esc(squad(e.winner)) + " held the block in " + e.round + " rounds.";
      $("endtitle").textContent = title;
      $("endtxt").innerHTML = `${why}<br>shots ${stats.shots} · hits ${stats.hits} · crits ${stats.crits} · blasts ${stats.areas} · cover destroyed ${stats.coverBroken}`;
      $("end").classList.add("show");
    }
    hideEnd() { $("end").classList.remove("show"); }
  }
  Hud.squad = squad;
  G.Hud = Hud;
})();
