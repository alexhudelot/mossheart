<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tactics</title>
<style>
/* Tactics HUD: a dark glass panel look over the night city; team 0 cyan, team 1 amber. */
:root {
  --bg: #05070d; --panel: rgba(8, 12, 22, 0.82); --line: rgba(120, 200, 255, 0.22); --ink: #d8e6f2; --dim: #7d8ea3;
  --t0: #38c8f0; --t1: #ff6a2c; --ok: #6cf0a0; --bad: #ff5a4a; --warn: #ffc34a;
  --font: 600 13px "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --roster: 232px; /* each roster's width: the bottom stack stays between them */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: var(--font); overflow: hidden; user-select: none; -webkit-user-select: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(4px); }
.btn { font: var(--font); color: var(--ink); background: rgba(16, 26, 44, 0.9); border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--t0); color: #fff; }
.btn:disabled { opacity: 0.38; cursor: default; }
.btn.on { border-color: var(--t0); box-shadow: 0 0 0 1px var(--t0) inset, 0 0 12px rgba(56, 200, 240, 0.35); }
kbd { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 7px; }

#top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; padding: 6px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }
#round { color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; }
#turn { font-size: 15px; letter-spacing: 0.04em; }
#turn.t0 { color: var(--t0); } #turn.t1 { color: var(--t1); }
#fps { color: var(--dim); font: 11px ui-monospace, Consolas, monospace; }

.roster { position: absolute; top: 56px; width: var(--roster); display: flex; flex-direction: column; gap: 4px; }
.roster.left { left: 10px; } .roster.right { right: 10px; }
.rname { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px 2px; }
.rname.t0 { color: var(--t0); } .rname.t1 { color: var(--t1); }
.card { display: grid; grid-template-columns: 18px 1fr auto auto; grid-template-rows: auto auto; gap: 1px 6px; align-items: center; padding: 5px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
.roster.right .card { cursor: default; }
.card.sel { border-color: var(--t0); box-shadow: 0 0 10px rgba(56, 200, 240, 0.3); }
.card.dead { opacity: 0.32; filter: grayscale(1); }
.card .ic { grid-row: 1 / 3; font-size: 15px; text-align: center; color: var(--dim); }
.roster.left .ic { color: var(--t0); } .roster.right .ic { color: var(--t1); }
.card .nm { font-size: 13px; }
.card .ap { display: flex; gap: 3px; } .card .ap b { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--dim); }
.card .ap b.on { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 6px var(--warn); }
.card .am { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); }
.card .hp { grid-column: 2 / 4; display: flex; gap: 2px; }
.card .hp i { width: 9px; height: 5px; background: rgba(255, 255, 255, 0.12); }
.roster.left .hp i.on { background: var(--t0); } .roster.right .hp i.on { background: var(--t1); }
.card em { font: normal 10px ui-monospace, Consolas, monospace; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
.card em.ow { color: var(--warn); border-color: var(--warn); } .card em.mk { color: #ff60c8; border-color: #ff60c8; }

#banner { position: absolute; top: 32%; left: 0; right: 0; text-align: center; font-size: 30px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0; transition: opacity 0.25s, transform 0.25s; transform: translateY(8px); pointer-events: none; text-shadow: 0 0 18px currentColor; }
#banner.show { opacity: 1; transform: none; }
#banner.t0 { color: var(--t0); } #banner.t1 { color: var(--t1); }

#preview { position: absolute; right: calc(var(--roster) + 20px); bottom: 90px; min-width: 190px; padding: 10px 12px; pointer-events: none; }
.pv-t { color: var(--dim); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
.pv-c { font-size: 38px; line-height: 1.05; color: #fff; } .pv-c small { font-size: 18px; color: var(--dim); }
.pv-s { color: var(--ink); margin: 2px 0 6px; }
#preview table { width: 100%; border-collapse: collapse; font-size: 12px; color: var(--dim); }
#preview td:last-child { text-align: right; color: var(--ink); }

#bottom { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(860px, calc(100% - 2 * var(--roster) - 40px)); pointer-events: none; }
#bottom > * { pointer-events: auto; }
#unit { padding: 6px 12px; text-align: center; }
#unit .un { font-size: 15px; } #unit .un.t0 { color: var(--t0); } #unit .un.t1 { color: var(--t1); }
#unit .us { color: var(--dim); font-size: 12px; }
#hint { color: var(--dim); font-size: 12px; min-height: 15px; text-shadow: 0 1px 3px #000; }
#actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
#actions .end { border-color: rgba(255, 195, 74, 0.5); }
/* the controls line: under the actions, in the stack's flow, so it never runs under a button */
#help { text-align: center; color: var(--dim); font-size: 11px; line-height: 1.35; padding: 1px 10px; border-radius: 4px; background: rgba(5, 7, 13, 0.6); pointer-events: none; }

#floats { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; left: 0; top: 0; font: 700 15px "Bahnschrift", "Segoe UI", system-ui, sans-serif; letter-spacing: 0.04em; white-space: nowrap; text-shadow: 0 0 6px #000, 0 1px 2px #000; color: #fff; }
.float.dmg { color: #ff8a70; } .float.crit { color: #ff4a3a; font-size: 19px; } .float.miss { color: #a9b6c6; }
.float.down { color: #ff4a3a; } .float.heal { color: var(--ok); } .float.ow { color: var(--warn); font-size: 12px; } .float.mark { color: #ff60c8; font-size: 12px; } .float.info { color: var(--ink); font-size: 12px; }

.veil { position: absolute; inset: 0; display: none; place-items: center; background: rgba(3, 5, 10, 0.6); }
.veil.show { display: grid; }
.card.panel, .veil .card { display: block; padding: 22px 28px; text-align: center; max-width: 420px; cursor: default; }
.veil h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; }
.veil p { color: var(--dim); line-height: 1.6; margin: 0 0 16px; }

/* touch: no keyboard, so no key caps and no controls line */
@media (pointer: coarse) { kbd, #help { display: none; } }

@media (max-width: 1100px) {
  :root { --roster: 170px; }
  .roster { top: 50px; } .card { padding: 3px 6px; } .card .nm { font-size: 11px; } .card .am { display: none; }
  .btn { padding: 7px 9px; }
}

/* short screens (phones in landscape): the rosters and the bar get small, the unit card goes (the
   roster's highlighted card says who is selected), and the shot preview sits between the bar and the
   enemy roster */
@media (max-height: 560px) {
  :root { --roster: 150px; }
  #top { top: 6px; padding: 3px 10px; gap: 10px; } #turn { font-size: 13px; }
  .roster { top: 40px; gap: 2px; } .rname { font-size: 10px; padding-bottom: 0; }
  .card { padding: 2px 6px; gap: 0 5px; } .card .ic { font-size: 12px; } .card .nm { font-size: 11px; }
  .card .hp i { width: 6px; height: 4px; } .card .ap b { width: 6px; height: 6px; }
  .card em { font-size: 9px; padding: 0 2px; }
  #unit { display: none !important; }
  #bottom { gap: 3px; bottom: 6px; } #hint { font-size: 11px; min-height: 0; }
  .btn { font-size: 12px; padding: 6px 8px; }
  #preview { bottom: 54px; min-width: 140px; padding: 6px 9px; } .pv-c { font-size: 26px; } #preview table { font-size: 11px; }
  #banner { font-size: 22px; }
}

/* narrow screens (phones upright): both rosters side by side across the top, icons and HP only; the
   bar wraps under the map */
@media (max-width: 600px) {
  :root { --roster: calc(50% - 15px); }
  .roster { top: 44px; gap: 2px; } .rname { font-size: 10px; }
  .card { grid-template-columns: 16px 1fr auto; padding: 2px 5px; } .card .nm { font-size: 10px; } .card .ap, .card em { display: none; }
  .card .hp { grid-column: 2 / 4; } .card .hp i { width: 5px; height: 4px; }
  #bottom { width: calc(100% - 16px); bottom: 16px; } /* the bar spans the width: it rises above the version */
  #version { font-size: 9px; }
  #unit { display: none !important; }
  .btn { font-size: 12px; padding: 7px 8px; } #actions { gap: 4px; }
  #preview { right: 8px; left: auto; bottom: 120px; min-width: 150px; }
}

#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 0 16px; }
#loading .box { width: min(440px, 100%); text-align: center; }
#loading h1 { font-size: 30px; letter-spacing: 0.3em; text-transform: uppercase; margin: 0 0 4px; color: var(--t0); }
#loading p { color: var(--dim); margin: 0 0 18px; }
#track { height: 4px; background: #101826; border-radius: 2px; overflow: hidden; }
#bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--t0), var(--t1)); transition: width 0.15s; }
#bartxt { margin-top: 8px; color: var(--dim); font: 12px ui-monospace, Consolas, monospace; }
.fail { color: #ff9b7a; white-space: pre-wrap; line-height: 1.5; }
.fail small { display: block; color: var(--dim); margin-top: 8px; }
#lost { position: fixed; inset: 0; display: none; place-items: center; background: rgba(3, 5, 10, 0.9); z-index: 20; }
#lost button { font: var(--font); padding: 12px 22px; border-radius: 8px; border: 1px solid var(--t0); background: #0c1422; color: var(--ink); }
#log, #result { display: none; }
/* the version (src/version.js), small in the bottom-right corner, over the loading screen too */
#version { position: fixed; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(2px + env(safe-area-inset-bottom, 0px)); z-index: 30; font: 500 10px/1 "Bahnschrift", "Segoe UI", system-ui, sans-serif; color: rgba(216, 230, 242, 0.5); text-shadow: 0 0 3px #000; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="floats"></div>
<div id="ui">
  <div id="top"><span id="round">Round 1</span><span id="turn"></span><span id="fps"></span></div>
  <div id="roster0" class="roster left"></div>
  <div id="roster1" class="roster right"></div>
  <div id="banner"></div>
  <div id="preview" class="panel" style="display:none"></div>
  <div id="bottom">
    <div id="unit" class="panel" style="display:none"></div>
    <div id="hint"></div>
    <div id="actions"></div>
    <div id="help"></div>
  </div>
  <div id="end" class="veil"><div class="panel card"><h2 id="endtitle"></h2><p id="endtxt"></p><button id="again" class="btn">New battle</button></div></div>
</div>
<div id="loading"><div class="box"><h1>Tactics</h1><p>squad tactics in a voxel city block</p><div id="track"><div id="bar"></div></div><div id="bartxt">loading</div></div></div>
<div id="lost"><button onclick="location.reload()">The GPU was reset · tap to reload</button></div>
<pre id="log"></pre>
<pre id="result"></pre>
<!-- the engine's generator (vendored with it): primitives, model and style helpers the engine reads -->
<script>
/* Pixel-art engine: palette-indexed buffers with depth, iso cube terrain,
   SDF models ray-marched straight to quantised pixels, pixel-space post. */
(function () {
  const P = (window.PX = {});
  const SQ3 = Math.sqrt(3);

  P.hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  P.ramp = (s) => s.trim().split(/\s+/).map(P.hex);
  P.rng = (seed) => { let s = (seed * 2654435761) >>> 0 || 1; return () => ((s = Math.imul(s ^ (s >>> 15), 0x2c1b3c6d) + 0x6d2b79f5 >>> 0) / 4294967296); };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  P.clamp = clamp;
  P.smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ------------------------------------------------------------------ noise
  function hash(x, y, z, s) {
    let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x61c88647) ^ Math.imul((s | 0) + 1, 0x3c6ef372);
    h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d); h = Math.imul(h ^ (h >>> 12), 0x297a2d39); h ^= h >>> 15;
    return (h >>> 0) / 4294967296;
  }
  P.hash = hash;
  const fade = (t) => t * t * (3 - 2 * t);
  function noise(x, y, z = 0, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const u = fade(x - xi), v = fade(y - yi), w = fade(z - zi);
    const c = (a, b, d) => hash(xi + a, yi + b, zi + d, s);
    const l = (a, b, t) => a + (b - a) * t;
    return l(l(l(c(0, 0, 0), c(1, 0, 0), u), l(c(0, 1, 0), c(1, 1, 0), u), v), l(l(c(0, 0, 1), c(1, 0, 1), u), l(c(0, 1, 1), c(1, 1, 1), u), v), w);
  }
  P.noise = noise;
  P.fbm = (x, y, z = 0, s = 0, o = 3) => { let a = 0, f = 1, amp = 0.5, n = 0; for (let i = 0; i < o; i++) { a += noise(x * f, y * f, z * f, s + i * 17) * amp; n += amp; f *= 2.03; amp *= 0.5; } return a / n; };
  // Nearest jittered feature point; returns a shared object (copy what you need).
  const CELL = { f1: 0, f2: 0, x: 0, y: 0, z: 0, id: 0 };
  P.cell = function (x, y, z, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let f1 = 9, f2 = 9;
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = xi + dx, cy = yi + dy, cz = zi + dz;
      const px = cx + hash(cx, cy, cz, s), py = cy + hash(cx, cy, cz, s + 1), pz = cz + hash(cx, cy, cz, s + 2);
      const d = (px - x) * (px - x) + (py - y) * (py - y) + (pz - z) * (pz - z);
      if (d < f1) { f2 = f1; f1 = d; CELL.x = px; CELL.y = py; CELL.z = pz; CELL.id = hash(cx, cy, cz, s + 3); } else if (d < f2) f2 = d;
    }
    CELL.f1 = Math.sqrt(f1); CELL.f2 = Math.sqrt(f2); return CELL;
  };
  P.cell2 = function (x, y, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9, f2 = 9;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = xi + dx, cy = yi + dy;
      const px = cx + 0.15 + 0.7 * hash(cx, cy, 0, s), py = cy + 0.15 + 0.7 * hash(cx, cy, 0, s + 1);
      const d = (px - x) * (px - x) + (py - y) * (py - y);
      if (d < f1) { f2 = f1; f1 = d; CELL.x = px; CELL.y = py; CELL.id = hash(cx, cy, 0, s + 3); } else if (d < f2) f2 = d;
    }
    CELL.f1 = Math.sqrt(f1); CELL.f2 = Math.sqrt(f2); return CELL;
  };
  // HD moss: shade a soft height field of cushions (no cells), darker in the hollows. Ln: light direction.
  P.velvetAt = function (td, X, Y, base, Ln) {
    const f = td.scale ?? 1.6, e = 0.02, sd = td.seed ?? 13;
    const hf = (x, y) => P.fbm(x * f, y * f, 0, sd, 3) + 0.4 * P.fbm(x * f * 3.3, y * f * 3.3, 0, sd + 50, 2);
    const h0 = hf(X, Y), gx = (hf(X + e, Y) - h0) / e, gy = (hf(X, Y + e) - h0) / e, amp = td.amp ?? 0.22;
    const nx = -gx * amp, ny = -gy * amp, nl = Math.sqrt(nx * nx + ny * ny + 1);
    let s = base + ((nx * Ln[0] + ny * Ln[1] + Ln[2]) / nl - Ln[2]) * (td.k ?? 1.1) + (h0 - 0.7) * (td.hk ?? 0.35);
    if (td.fuzz) s += (noise(X * 46, Y * 46, 0, 41) - 0.5) * td.fuzz + (noise(X * 110, Y * 110, 0, 42) - 0.5) * td.fuzz * 0.3;
    if (td.flowers && hash(Math.floor(X * 9), Math.floor(Y * 9), 0, 44) > 1 - td.flowers && Math.hypot((X * 9 % 1) - 0.5, (Y * 9 % 1) - 0.5) < 0.16) return { ramp: td.flowerRamp, s: 0.75 + (0.5 - (Y * 9 % 1)) * 0.6 };
    return { ramp: td.top2 && P.fbm(X * 0.45, Y * 0.45, 0, 29) > 1 - (td.mix ?? 0.3) ? td.top2 : td.top, s };
  };

  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  P.bayer = (x, y) => (BAYER[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
  // Shade 0..1 -> ramp index. "band" dithers only in a narrow band between two tones (hand-placed look).
  P.quant = function (s, n, x, y, mode) {
    const g = clamp(s, 0, 1) * (n - 1);
    let i = Math.floor(g); const r = g - i;
    if (mode === "bayer") { if (r > P.bayer(x, y)) i++; }
    else if (mode === "band") { if (r > 0.64 || (r > 0.36 && ((x + y) & 1))) i++; }
    else if (r >= 0.5) i++;
    return i > n - 1 ? n - 1 : i;
  };

  // ------------------------------------------------------------------ buffers
  class Buf {
    constructor(w, h) {
      this.w = w; this.h = h; const n = w * h;
      this.ri = new Int16Array(n).fill(-1); this.lv = new Int8Array(n); this.z = new Float32Array(n).fill(-1e9);
      this.em = new Uint8Array(n); this.tag = new Uint8Array(n);
    }
    put(x, y, ri, lv, z, em = 0, tag = 0) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return false;
      const i = y * this.w + x; if (z < this.z[i]) return false;
      this.ri[i] = ri; this.lv[i] = lv; this.z[i] = z; this.em[i] = em; this.tag[i] = tag; return true;
    }
  }
  P.Buf = Buf;

  P.palette = function (ramps) {
    const names = Object.keys(ramps), list = names.map((n) => ramps[n]), id = {};
    names.forEach((n, i) => (id[n] = i));
    return { names, list, id };
  };
  P.resolve = function (buf, pal) {
    const out = new Uint8ClampedArray(buf.w * buf.h * 4);
    for (let i = 0; i < buf.w * buf.h; i++) {
      const r = buf.ri[i]; if (r < 0) continue;
      const ramp = pal.list[r]; const c = ramp[clamp(buf.lv[i], 0, ramp.length - 1)];
      out[i * 4] = c[0]; out[i * 4 + 1] = c[1]; out[i * 4 + 2] = c[2]; out[i * 4 + 3] = 255;
    }
    return out;
  };
  P.colorsUsed = function (buf, pal) {
    const set = new Set();
    for (let i = 0; i < buf.w * buf.h; i++) if (buf.ri[i] >= 0) set.add(pal.list[buf.ri[i]][clamp(buf.lv[i], 0, pal.list[buf.ri[i]].length - 1)].join(","));
    return set.size;
  };
  P.toURL = function (rgba, w, h) {
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").putImageData(new ImageData(rgba, w, h), 0, 0);
    return cv.toDataURL("image/png");
  };

  // ------------------------------------------------------------------ projection
  // Cell (cx, cy) spans world [cx, cx+1] x [cy, cy+1]; Z in cell units (one step = 0.5).
  P.view = (tw, ox, oy) => ({ tw, a: tw / 2, b: tw / 4, hz: tw / 2, ox, oy });
  P.proj = (v, X, Y, Z) => [v.ox + (X - Y) * v.a, v.oy + (X + Y) * v.b - Z * v.hz];

  // ------------------------------------------------------------------ SDF models
  P.prim = {
    S: (c, r, m, o) => Object.assign({ k: 0, x: c[0], y: c[1], z: c[2], r, m }, o),
    E: (c, rr, m, o) => Object.assign({ k: 1, x: c[0], y: c[1], z: c[2], rx: rr[0], ry: rr[1], rz: rr[2], m }, o),
    C: (a, b, ra, rb, m, o) => { const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2]; return Object.assign({ k: 2, x: a[0], y: a[1], z: a[2], bx, by, bz, bb: bx * bx + by * by + bz * bz || 1e-6, ra, rb, m }, o); },

  M.shellback = (o = {}) => {
    const t = o.t ?? 0, ph = t * TAU, sz = o.sz ?? 1, p = [], s3 = (v) => [v[0] * sz, v[1] * sz, v[2] * sz];

/* Five visual directions: palettes (hue-shifted ramps), terrain rules, maps, set dressing. */
(function () {
  const P = window.PX;

  // ---------------------------------------------------------------- ramps
  function toHsl([r, g, b]) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  function toRgb([h, s, l]) {
    const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }
  const lerpHue = (a, b, t) => { const d = ((b - a + 540) % 360) - 180; return (a + d * t + 360) % 360; };
  // [baseHex, n, darkL, lightL, hueShift, sat] -> shadows lean blue-violet, lights lean warm yellow.
  function makeRamp(spec) {
    if (typeof spec[1] !== "number") return spec.map(P.hex);
    const [hex, n, lo, hi, shift = 0.3, sat = 1] = spec, [h0, s0] = toHsl(P.hex(hex)), out = [];
    for (let i = 0; i < n; i++) {
      const u = n === 1 ? 0.5 : i / (n - 1), L = lo + (hi - lo) * u;
      const h = u < 0.5 ? lerpHue(h0, 245, shift * (1 - 2 * u)) : lerpHue(h0, 55, shift * (2 * u - 1));
      const S = Math.min(1, s0 * sat * (1 - 0.3 * Math.pow(Math.abs(2 * u - 1), 2)) + (u < 0.4 ? 0.06 : 0));
      out.push(toRgb([h, S, L]));
    }

  // in the same place on every layout: Q/E on QWERTY are A/E on AZERTY. label(code) is what that key

  // layout map (navigator.keyboard), else a guess (AZERTY for French, else QWERTY) that the first letter

    const layoutOf = (code, ch) => ({ KeyQ: { A: "azerty", Q: "!azerty" }, KeyA: { Q: "azerty", A: "!azerty" }, KeyW: { Z: "azerty", W: "!azerty" }, KeyZ: { W: "azerty", Y: "qwertz", Z: "qwerty" }, KeyY: { Z: "qwertz", Y: "!qwertz" } }[code] || {})[ch];
    K.code = (e) => {
      if (e.code) return e.code;
      const k = e.key || "";
      if (/^[a-z]$/i.test(k)) return "Key" + k.toUpperCase();
      if (/^[0-9]$/.test(k)) return "Digit" + k;

    };
    K.is = (e, ...codes) => { const c = K.code(e); return codes.some((x) => c === x || (x.startsWith("Digit") && c === "Numpad" + x.slice(5))); };

  // with ME.setVS before it bakes; ?vs=N overrides the app's choice. Memory and bake time grow with VS³:

  // bake calls this often. A message-channel post is not clamped like setTimeout.

    const bar = document.getElementById("bar"), txt = document.getElementById("bartxt");

  // ------------------------------------------------------------------ mat4, column-major (WGSL layout)
  const M4 = (ME.m4 = {});

    inv[8] = a[4] * a[9] * a[15] - a[4] * a[11] * a[13] - a[8] * a[5] * a[15] + a[8] * a[7] * a[13] + a[12] * a[5] * a[11] - a[12] * a[7] * a[9];
    inv[12] = -a[4] * a[9] * a[14] + a[4] * a[10] * a[13] + a[8] * a[5] * a[14] - a[8] * a[6] * a[13] - a[12] * a[5] * a[10] + a[12] * a[6] * a[9];
    inv[1] = -a[1] * a[10] * a[15] + a[1] * a[11] * a[14] + a[9] * a[2] * a[15] - a[9] * a[3] * a[14] - a[13] * a[2] * a[11] + a[13] * a[3] * a[10];
    inv[5] = a[0] * a[10] * a[15] - a[0] * a[11] * a[14] - a[8] * a[2] * a[15] + a[8] * a[3] * a[14] + a[12] * a[2] * a[11] - a[12] * a[3] * a[10];
    inv[9] = -a[0] * a[9] * a[15] + a[0] * a[11] * a[13] + a[8] * a[1] * a[15] - a[8] * a[3] * a[13] - a[12] * a[1] * a[11] + a[12] * a[3] * a[9];
    inv[13] = a[0] * a[9] * a[14] - a[0] * a[10] * a[13] - a[8] * a[1] * a[14] + a[8] * a[2] * a[13] + a[12] * a[1] * a[10] - a[12] * a[2] * a[9];

    inv[6] = -a[0] * a[6] * a[15] + a[0] * a[7] * a[14] + a[4] * a[2] * a[15] - a[4] * a[3] * a[14] - a[12] * a[2] * a[7] + a[12] * a[3] * a[6];

    inv[7] = a[0] * a[6] * a[11] - a[0] * a[7] * a[10] - a[4] * a[2] * a[11] + a[4] * a[3] * a[10] + a[8] * a[2] * a[7] - a[8] * a[3] * a[6];

  ME.lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
})();

/* WebGPU device setup, error capture and small resource helpers. */
(function () {
  const ME = window.ME;

  // Adapter requests in order: a core adapter, then a compatibility one (WebGPU on OpenGL ES / D3D11,
  // which Chrome offers on phones whose Vulkan driver it does not trust). ?compat=1 asks for compatibility
  // first, ?compat=2 also keeps the device a compatibility one (tests). ME.gpuTried records what each
  // request gave, for the failure screen.
  ME.requestAdapter = async function () {
    const core = [{ powerPreference: "high-performance" }, {}], compat = [{ featureLevel: "compatibility" }, { featureLevel: "compatibility", powerPreference: "low-power" }];
    const tries = ME.qn("compat", 0) ? compat.concat(core) : core.concat(compat);
    ME.gpuTried = [];
    for (const o of tries) {
      let a = null, err = "";
      try { a = await navigator.gpu.requestAdapter(o); } catch (e) { err = e.message; }
      ME.gpuTried.push({ opts: JSON.stringify(o), ok: !!a, err });
      if (a) return a;
    }
    return null;
  };

  // Why WebGPU cannot start here, in words a player can act on.
  ME.gpuAdvice = function () {
    const ua = navigator.userAgent, android = /Android/.test(ua), webview = /; wv\)|Version\/[\d.]+ Chrome\//.test(ua) && android;
    // Chrome 110+ freezes the UA at "Android 10; K" whatever the phone runs (a Galaxy S24+ on Android 16
    // reads as 10), so the Android version is known only from an older, unfrozen UA.
    const frozen = /Android 10; K[;)]/.test(ua);
    const chrome = +((ua.match(/Chrom(?:e|ium)\/(\d+)/) || [])[1] || 0), and = frozen ? 0 : +((ua.match(/Android (\d+)/) || [])[1] || 0);
    const tips = [];
    if (webview) tips.push("This looks like an in-app browser. Open the page in Chrome itself (menu ⋮ → Open in Chrome).");
    if (android && and && and < 12) tips.push("WebGPU on Android needs Android 12 or newer (this is Android " + and + ").");
    if (chrome && chrome < 121) tips.push("Update Chrome: WebGPU on Android needs Chrome 121+ (this is " + chrome + ").");
    // An up-to-date Chrome that offers no adapter, core or compatibility, has blocklisted this GPU (Samsung
    // Xclipse, for one: chrome://gpu, "Dawn Info", says "Blocklisted"). The flag lifts the blocklist.
    if (!tips.length) tips.push(android ? "Chrome does not enable WebGPU on this phone's GPU yet. To play anyway, open chrome://flags/#enable-unsafe-webgpu, set it to Enabled and tap Relaunch." : "This GPU or driver is not enabled for WebGPU. Update the browser and graphics driver, or try Chrome or Edge.");
    return { tips, ua, tried: ME.gpuTried || [] };
  };

  ME.initGPU = async function (canvas) {
    if (!navigator.gpu) throw new Error("WebGPU is not available in this browser (needs Chrome/Edge 113+, Safari 26+, or Android Chrome 121+).");
    const adapter = await ME.requestAdapter();
    if (!adapter) { const e = new Error("No WebGPU adapter."); e.advice = ME.gpuAdvice(); throw e; }

    // device a core one. Otherwise ask for the storage-buffer and storage-texture counts the vertex and
    // fragment stages need (compatibility defaults them to 0; the adapter says what the driver allows).
    const asked = ME.gpuTried.find((t) => t.ok).opts.includes("compatibility");
    const want = ["timestamp-query", "core-features-and-limits"].filter((f) => adapter.features.has(f) && (f === "timestamp-query" ? ME.qn("ts", 1) : ME.qn("compat", 0) < 2));
    const compat = (ME.compat = asked && adapter.featureLevel !== "core" && !want.includes("core-features-and-limits"));
    const requiredLimits = {};

      for (const k of ["maxStorageBuffersInVertexStage", "maxStorageBuffersInFragmentStage", "maxStorageTexturesInFragmentStage", "maxStorageTexturesInVertexStage"])
        if (k in adapter.limits && adapter.limits[k] > 0) requiredLimits[k] = adapter.limits[k];
    // Above VS 24 the terrain's buffers outgrow the default limits (at 64 on the 14-tile jar: buffers up to
    // 1.15 GB against maxBufferSize 256 MB, a 221 MB solid-cell binding against 128 MB), so ask for what the
    // adapter allows. Set ME.VS before this. At 24 and below nothing changes; a phone has no room for 64.
    if (ME.VS > 24)
      for (const k of ["maxBufferSize", "maxStorageBufferBindingSize"]) if (adapter.limits[k] > 0) requiredLimits[k] = adapter.limits[k];

  };

  // WGSL for a compatibility device (OpenGL ES / D3D11): the depth (gD) is read as a float texture, which
  // compatibility allows where it forbids loading a texture_depth_2d; flat varyings take `either` vertex;
  // the G-buffer outputs carry the emissive (zero unless set).
  ME.compatWGSL = (code) => code
    .replace(/var gD: texture_depth_2d;/g, "var gD: texture_2d<f32>;")
    .replace(/textureLoad\(gD, (.+?), 0\)/g, "textureLoad(gD, $1, 0).r")
    .replace(/@interpolate\(flat\)/g, "@interpolate(flat, either)")
    .replace(/(struct GO \{ @location\(0\) a: vec4f, @location\(1\) n: vec4f)(?!, @location\(2\))/g, "$1, @location(2) e: vec4f");

  // Shader module with compile messages forwarded to the log (with the pass name and line).
  ME.shader = function (device, label, code) {
    if (ME.compat) code = ME.compatWGSL(code);
    const mod = device.createShaderModule({ label, code });
    mod.getCompilationInfo().then((ci) => {
      for (const m of ci.messages) {
        const line = code.split("\n")[m.lineNum - 1] || "";
        (m.type === "error" ? ME.err : ME.log)("WGSL " + m.type + " [" + label + ":" + m.lineNum + "] " + m.message + " | " + line.trim().slice(0, 120));
      }
    });
    return mod;
  };

  ME.buffer = function (device, data, usage, label) {
    const size = Math.max(16, Math.ceil(data.byteLength / 4) * 4);
    const b = device.createBuffer({ label, size, usage: usage | GPUBufferUsage.COPY_DST, mappedAtCreation: true });
    new Uint8Array(b.getMappedRange()).set(new Uint8Array(data.buffer, data.byteOffset, data.byteLength));
    b.unmap();
    return b;
  };

  // 3D texture with optional extra mips, all supplied as typed arrays (x fastest, then y, then z).
  ME.tex3d = function (device, label, format, dims, levels, bpp, usage = 0) {
    const t = device.createTexture({ label, format, dimension: "3d", size: dims, mipLevelCount: levels.length, usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | usage });
    levels.forEach((data, mip) => {
      const w = Math.max(1, dims[0] >> mip), h = Math.max(1, dims[1] >> mip), d = Math.max(1, dims[2] >> mip);
      device.queue.writeTexture({ texture: t, mipLevel: mip }, data, { bytesPerRow: w * bpp, rowsPerImage: h }, [w, h, d]);
    });

  };

  // Fullscreen-triangle vertex stage shared by every screen pass.
  ME.FS_VS = /* wgsl */ `
@vertex fn vsFull(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}`;
})();

/* Camera: the generator's 2:1 projection (px.js P.proj) as an affine clip matrix.
   screen x = (X'-Y')*a, screen y = (X'+Y')*a/2 - Z*a, depth = X'+Y'+Z (bigger = nearer),

  class Camera {
    constructor(cx, cy) {

      this.zoom = 30; this.pan = [0, 0];

    // from it: X'+Y' about the centre stays within its xy radius times sqrt(2) at any turn, and Z within

      const kd = kindAt(cx, cy);
      if (!kd || kd.recipe !== "water") continue;
      let any = false;
      for (let s = 0; s < 64 && !any; s++) any = wetV(cx + ((s % 8) + 0.5) / 8, cy + (Math.floor(s / 8) + 0.5) / 8) > 0;
      if (!any) continue;
      const h = G.hv[cy * G.W + cx], Zw = G.z[cy * G.W + cx] - kd.surface;
      let fx = 0, fy = 0;
      for (const [dx, dy] of D4) if (recipeAt(cx + dx, cy + dy) === "water") { const dh = G.hv[(cy + dy) * G.W + cx + dx] - h; if (dh < 0) { fx += dx; fy += dy; } else if (dh > 0) { fx -= dx; fy -= dy; } }
      const stream = G.wd && Math.abs(G.wd(cx + 0.5, cy + 0.5)) < 1 && (fx || fy) ? 1 : 0;
      water.push({ x: cx, y: cy, z: Zw, fx, fy, stream });
      for (const [dx, dy] of D4) {
        if (recipeAt(cx + dx, cy + dy) !== "water") continue;
        const ib = (cy + dy) * G.W + cx + dx, hb = G.hv[ib];
        if (hb >= h) continue;
        // wet run along the shared edge, sampled just inside the upper tile
        let u0 = 1, u1 = 0;
        for (let s = 0; s < 32; s++) {
          const u = (s + 0.5) / 32, ex = dx ? cx + (dx > 0 ? 1 - 0.5 / VS : 0.5 / VS) : cx + u, ey = dy ? cy + (dy > 0 ? 1 - 0.5 / VS : 0.5 / VS) : cy + u;
          if (wetV(ex, ey) > 0) { u0 = Math.min(u0, u - 0.5 / 32); u1 = Math.max(u1, u + 0.5 / 32); }
        }
        if (u1 <= u0) continue;
        const ztop = Zw, zbot = G.z[ib] - kindAt(cx + dx, cy + dy).surface, off = 0.7 / VS;
        // the falling sheet stands just in front of the cliff face, facing the lower tile
        const ex0 = dx ? cx + (dx > 0 ? 1 + off : -off) : cx + u0, ey0 = dy ? cy + (dy > 0 ? 1 + off : -off) : cy + u0;
        const ex1 = dx ? ex0 : cx + u1, ey1 = dy ? ey0 : cy + u1;

    // (about 8 cells per tile at any VS, taller than the voxel grid so the tree canopies fit) that feeds the sun volume.
    ME.progress("density mips", 0.33); await ME.tick();

    let solid = 0, kMax = 0;
    for (let i = 0; i < d0.length; i++) if (vox[i]) { d0[i] = 255; solid++; }

    // the coarse grid is 3 tiles taller than the box (13 tiles for a generator map), f voxels a cell
    const f = ME.coarseStep(VS), CPU = VS / f, QX = NX / f, QY = NY / f, QZ = (B.size[2] + 3) * CPU, coarse = new Uint8Array(QX * QY * QZ);

    // Beams stand on the tile below their foot point (px3 P.lightAt needs bm.z).
    const beams = (st.light.beams || []).map((b) => Object.assign({}, b, { z: b.z ?? G.z[Math.min(G.H - 1, Math.floor(b.y)) * G.W + Math.min(G.W - 1, Math.floor(b.x))] }));

    // Walkable ground: first solid voxel scanning down from zFrom.

    const stats = { dims: [NX, NY, NZ], solid, wetCols, lobes, props: propCount, lanterns: lights.length, stampedVoxels: stamped, water: water.length, falls: falls.length, zTop: O[2] + (kMax + 1) / VS, ms: Math.round(ME.now() - t0) };
    // bounds: the world box in tiles; frame: the map's (jar or box); geo: the jar's measures (null in a box)
    const bounds = { min: O.slice(), max: [O[0] + B.size[0], O[1] + B.size[1], O[2] + B.size[2]] };
    const T = { O, NX, NY, NZ, VS, vox, top, mips: [d1, d2], coarse, cdims: [QX, QY, QZ], CPU, volumes, walkers, water, falls, beams, lights, stats, bounds, frame: F,
      geo: jar ? { C, RI, RG, DRUM, PL_R, PL_ZB, PL_ZT, glassZt: F.glassTop } : null };
    ME.coarseFill(T, [0, 0, 0], [QX - 1, QY - 1, NZ / f - 1]); // the cells above the voxel grid stay empty

  // the bake cache key's code: the bake's helpers and its tables (cache.js)
  ME.bakeTerrain.parts = [ME.validateMap, ME.waterDist, gridOf, resolve, heights, kindNames, rows, impure, ...Object.values(RECIPE),
    JSON.stringify({ B36, STEPS, RECIPES, FLAGS, AT, FIXED_BOX })];

  // The coarse occupancy (docs/decisions/2026-10-20-sun-volume-density.md): one cell is f voxels on a side,
  // f the largest divisor of VS that keeps VS / f >= 8 cells per tile, and at least 2 (f = 2 up to vs=20,
  // as before: the low densities phones pick keep their small volume; 3 at 24, 8 at 64).
  ME.coarseStep = (VS) => { let f = VS; while (VS % f || VS / f < 8) f--; return Math.max(2, f); };
  // Refill the coarse cells lo..hi (inclusive, cell coordinates) from T.vox: the occupancy averaged over
  // the cell's f^3 voxels (the bake fills the whole grid, a carve the box around the change), plus the
  // static volumes' splat (T.splat, from the model bake) so a carve keeps the trees' shade.
  ME.coarseFill = (T, lo, hi) => {
    const { vox, NX, NY, NZ, coarse, cdims, splat } = T, f = T.VS / T.CPU, n = f * f * f, PL = NX * NY;
    for (let z = lo[2]; z <= hi[2]; z++) for (let y = lo[1]; y <= hi[1]; y++) for (let x = lo[0]; x <= hi[0]; x++) {
      let s = 0;
      for (let k = z * f; k < Math.min(NZ, z * f + f); k++) for (let j = y * f; j < y * f + f; j++) {
        const row = k * PL + j * NX;
        for (let i = x * f; i < x * f + f; i++) if (vox[row + i]) s += 255;
      }
      const c = (z * cdims[1] + y) * cdims[0] + x;
      coarse[c] = splat ? Math.min(255, Math.floor(s / n) + splat[c]) : Math.floor(s / n);
    }
  };

  // Walkable ground: first solid voxel scanning down from zFrom (rebuilt from the arrays on a cache hit).
  ME.groundAt = (T) => {
    const { O, NX, NY, NZ, VS, vox } = T, PLANE = NX * NY;
    return (X, Y, zFrom) => {
      const i = Math.floor((X - O[0]) * VS), j = Math.floor((Y - O[1]) * VS);
      if (i < 0 || j < 0 || i >= NX || j >= NY) return zFrom;
      for (let k = Math.min(NZ - 1, Math.floor((zFrom - O[2]) * VS)); k >= 0; k--) if (vox[k * PLANE + j * NX + i]) return O[2] + (k + 1) / VS;
      return O[2];
    };
  };
})();

<script>
/* Greedy mesher: exposed voxel faces merged into quads by material (per-voxel variation is
   restored in the shader from the voxel coordinate). Faces pointing down are never visible from the
   isometric camera and are dropped. Vertices are 8 bytes: uint16 x,y,z (voxel units) + dir|mat<<3.
   For each 90-degree camera snap the visible quads (up and two sides) are sorted front to back into
   their own index range, so a snapped view is one draw call with good early-Z. */
(function () {
  const ME = window.ME;

  ME.greedyMesh = async function (T) {
    const t0 = ME.now(), { vox, NX, NY, NZ } = T, PLANE = NX * NY;
    let kLo = NZ, kHi = 0;
    for (let k = 0; k < NZ; k++) { const a = k * PLANE; for (let c = 0; c < PLANE; c += 3) if (vox[a + c]) { kLo = Math.min(kLo, k); kHi = Math.max(kHi, k); break; } }
    kLo = Math.max(0, kLo - 1); kHi = Math.min(NZ - 1, kHi + 1);
    const ZN = kHi - kLo + 1;

    let cap = 1 << 18, nq = 0, V = new Uint16Array(cap * 16), CEN = new Float32Array(cap * 3), DIR = new Uint8Array(cap);
    const grow = () => {
      cap *= 2;
      const v2 = new Uint16Array(cap * 16); v2.set(V); V = v2;
      const c2 = new Float32Array(cap * 3); c2.set(CEN); CEN = c2;
      const d2 = new Uint8Array(cap); d2.set(DIR); DIR = d2;
    };
    const emit = (dir, mat, p0, p1, p2, p3) => {
      if (nq >= cap) grow();
      const w = dir | (mat << 3), o = nq * 16;
      V[o] = p0[0]; V[o + 1] = p0[1]; V[o + 2] = p0[2]; V[o + 3] = w;
      V[o + 4] = p1[0]; V[o + 5] = p1[1]; V[o + 6] = p1[2]; V[o + 7] = w;
      V[o + 8] = p2[0]; V[o + 9] = p2[1]; V[o + 10] = p2[2]; V[o + 11] = w;
      V[o + 12] = p3[0]; V[o + 13] = p3[1]; V[o + 14] = p3[2]; V[o + 15] = w;
      CEN[nq * 3] = (p0[0] + p2[0]) / 2; CEN[nq * 3 + 1] = (p0[1] + p2[1]) / 2; CEN[nq * 3 + 2] = (p0[2] + p2[2]) / 2;
      DIR[nq] = dir; nq++;
    };

    const merge = (mask, W, H, quad) => {
      for (let j = 0; j < H; j++) for (let i = 0; i < W; ) {
        const n = i + j * W, c = mask[n];

        quad(i, j, w, h, c);

    };

    // +z faces: slice planes between z = s-1 and s
    let mask = new Int16Array(PLANE);
    for (let s = kLo; s <= kHi + 1; s++) {
      if ((s & 15) === 0) { ME.progress("meshing tops " + s, 0.36 + 0.04 * ((s - kLo) / ZN)); await ME.tick(); }
      const a = (s - 1) * PLANE, b = s * PLANE;
      let any = false;
      for (let c = 0; c < PLANE; c++) { const va = s > 0 ? vox[a + c] : 0, vb = s < NZ ? vox[b + c] : 0; const m = va && !vb ? va : 0; mask[c] = m; any = any || m !== 0; }
      if (any) merge(mask, NX, NY, (i, j, w, h, c) => emit(4, c, [i, j, s], [i + w, j, s], [i + w, j + h, s], [i, j + h, s]));
    }
    // x faces: mask over (y, z) per slice s. All slices are filled in one pass along the voxel rows
    // (reading the grid column-wise per slice was cache-hostile), then merged slice by slice.
    ME.progress("meshing x sides", 0.4); await ME.tick();

    for (let z = 0; z < ZN; z++) {

      mask = xm.subarray(s * SL, (s + 1) * SL);

        const z0 = j + kLo, z1 = z0 + h;

    }
    // y faces: mask over (x, z)
    mask = new Int16Array(NX * ZN);
    for (let s = 0; s <= NY; s++) {
      if ((s & 31) === 0) { ME.progress("meshing y sides " + s, 0.44 + 0.04 * (s / NY)); await ME.tick(); }
      let any = false;
      const ya = (s - 1) * NX, yb = s * NX;
      for (let z = 0; z < ZN; z++) {
        const zo = (z + kLo) * PLANE;
        for (let x = 0; x < NX; x++) {
          const va = s > 0 ? vox[zo + ya + x] : 0, vb = s < NY ? vox[zo + yb + x] : 0;
          const m = va && !vb ? va : !va && vb ? -vb : 0;
          mask[x + z * NX] = m; any = any || m !== 0;
        }
      }
      if (any) merge(mask, NX, ZN, (i, j, w, h, c) => {
        const z0 = j + kLo, z1 = z0 + h;
        if (c > 0) emit(2, c, [i, s, z0], [i + w, s, z0], [i + w, s, z1], [i, s, z1]);
        else emit(3, -c, [i, s, z0], [i + w, s, z0], [i + w, s, z1], [i, s, z1]);
      });
    }

    // Per-snap visible quads, sorted front to back by rotated depth (X'+Y'+Z).
    ME.progress("sorting quads per snap", 0.49); await ME.tick();
    const snaps = [], lists = [];
    let total = 0;
    for (let k = 0; k < 4; k++) {
      const th = (k * Math.PI) / 2, c = Math.round(Math.cos(th)), s = Math.round(Math.sin(th));
      const vis = [c + s > 0, c + s < 0, c - s > 0, c - s < 0, true];
      const ids = [];
      for (let q = 0; q < nq; q++) if (vis[DIR[q]]) ids.push(q);
      const key = new Float32Array(nq);
      for (const q of ids) key[q] = (c + s) * CEN[q * 3] + (c - s) * CEN[q * 3 + 1] + CEN[q * 3 + 2];
      const arr = Uint32Array.from(ids).sort((a, b) => key[b] - key[a]);
      lists.push(arr); total += arr.length;
    }
    const IDX = new Uint32Array(total * 6);
    let o = 0;
    for (let k = 0; k < 4; k++) {
      snaps.push({ first: o, count: lists[k].length * 6 });
      for (const q of lists[k]) { const b = q * 4; IDX[o++] = b; IDX[o++] = b + 1; IDX[o++] = b + 2; IDX[o++] = b; IDX[o++] = b + 2; IDX[o++] = b + 3; }
    }
    return { verts: V.subarray(0, nq * 16), index: IDX, snaps, quads: nq, ms: Math.round(ME.now() - t0) };
  };
})();

<script>
/* Model bake: the scene's volume props, its walkers and critters, and any models an app asks for,
   voxelised for the ray-marched volume pass. Animated models are baked as flipbooks over the
   generator's own animation phase o.t. Volumes are laid out brick-aligned (8^3) in a virtual atlas that
   exists only as a brick map; the voxels of occupied bricks live in a dense brick pool. Static volumes
   are also splatted into the coarse occupancy so trees shade the sun volume. Frame counts, walkers,
   critters and glowing materials come from ME.content. */
(function () {
  const ME = window.ME;
  // registries asset packs add to (assets/asset-kit.js and friends), on top of the content pack's tables:
  // flipbook frames per model, emissive material -> point light [r, g, b, k(, radius)]
  ME.FRAMES = ME.FRAMES || {};
  ME.LIGHT_COL = ME.LIGHT_COL || {};

  // opts.walkers = false skips the content's walkers; opts.models = { key: [name, o, frames] } adds
  // flipbooks for an app's own instance layer (returned as extraFrames[key]). Model options o.scale
  // and o.remap (material name -> name) let an app reuse and recolour the content's models.
  ME.bakeModels = async function (T, st, pal, opts = {}) {
    const CT = ME.content, FRAMES = Object.assign({}, ME.FRAMES, CT.flipbookFrames), LIGHT_COL = Object.assign({}, ME.LIGHT_COL, CT.primLights);
    const t0 = ME.now(), VS = ME.VS, variants = [], byKey = new Map();
    const add = (name, o) => {
      const key = name + JSON.stringify(o);
      if (byKey.has(key)) return byKey.get(key);
      const idx = variants.length;
      variants.push({ name, o, key }); byKey.set(key, idx);
      return idx;

    const frames = (name, o) => { const n = FRAMES[name] || 1; if (n === 1) return [add(name, o)]; return Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n }))); };

    const statics = T.volumes.map((v) => ({ place: v, frames: frames(v.name, v.o), phase: v.o && v.o.t !== undefined ? v.o.t : 0 }));
    // walkers on the route: the style's own list (st.walkers), else the content's; each is
    // { type, model?, o?, speed, rate, gait: hop | roll | fly, fly? (hover height) }
    const walkerTypes = opts.walkers === false ? [] : st.walkers || Object.entries(CT.walkers || {}).map(([type, w]) => Object.assign({ type }, w)), walkerFrames = {};
    for (const w of walkerTypes) walkerFrames[w.type] = frames(w.model || w.type, w.o || {});
    const extraFrames = {};
    for (const key in opts.models || {}) {
      const [name, o, n] = opts.models[key];
      extraFrames[key] = n > 1 ? Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n }))) : [add(name, o)];
    }

    const critterFrames = {}, CRITTERS = CT.critters || {};
    for (const key in CRITTERS) {
      const [name, o, n, fine] = CRITTERS[key];
      critterFrames[key] = Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n, fine })));
    }

    const vols = [];
    for (let i = 0; i < variants.length; i++) {
      const v = variants[i];
      if ((i & 1) === 0) { ME.progress("voxelising " + v.name + " (" + (i + 1) + "/" + variants.length + ")", 0.5 + 0.3 * (i / variants.length)); await ME.tick(); }

      // units; app models may set their own scale (o.scale) and recolour materials (o.remap: name -> name)
      const md = ME.modelOf(v.name, v.o), fine = (v.o && v.o.fine) || 1;

      if (v.o && v.o.chunk) { md.k /= v.o.chunk; vf = 1 / v.o.chunk; }
      if (v.o && v.o.remap) {

    // pool holding only the occupied bricks (the layout is ~1% solid, so the pool is a fraction of it)
    const AX = W, AY = pad(y + rowH), BX = AX / 8, BY = AY / 8, BZ = AZ / 8, bricks = new Uint32Array(BX * BY * BZ);
    const occupied = (v, ix, iy, iz) => {
      const [nx, ny, nz] = v.dims;
      for (let z = iz * 8; z < Math.min(nz, iz * 8 + 8); z++) for (let yy = iy * 8; yy < Math.min(ny, iy * 8 + 8); yy++)
        for (let xx = ix * 8; xx < Math.min(nx, ix * 8 + 8); xx++) if (v.rgba[((z * ny + yy) * nx + xx) * 4 + 3]) return true;

      for (let iz = 0; iz < pz; iz++) for (let iy = 0; iy < py; iy++) for (let ix = 0; ix < px; ix++)
        if (occupied(v, ix, iy, iz)) bricks[((bz + iz) * BY + by + iy) * BX + bx + ix] = ++nb;
    }
    const PB = 16, PX = PB * 8, PY = PB * 8, PZ = Math.max(1, Math.ceil(nb / (PB * PB))) * 8, pool = new Uint8Array(PX * PY * PZ * 4);
    for (const v of vols) {
      const [nx, ny, nz] = v.dims, [bx, by, bz] = v.base.map((n) => n / 8);

  // (16 x 16 bricks per pool layer). Rebuilt from the arrays on a cache hit.

  };
})();

<script>
/* Grass bake: tufts of voxel blades on the moss carpet, drawn by the grass pass and bent by the wind.
   Thicker along lane edges, cliff feet and banks; reeds (taller, darker) where moss meets water.
   One vec4 per blade: x, y, z (ground), w = material << 8 | height in voxels << 4 | seed. */
(function () {
  const ME = window.ME, P = window.PX;

  ME.bakeGrass = function (T, st, pal) {
    const t0 = ME.now(), map = st.map, VS = T.VS, { NX, NY, O, vox, top } = T, PLANE = NX * NY, H = P.hash;
    // grass grows on the generator map's moss letters (a v1 map's kinds ask for it from M4 on)
    if (!map.typ) return { blades: new Float32Array([0, 0, -99, 0]), count: 0, ms: 0 };
    const KV = VS / 16; // blade sizes are tuned in voxels at 16 per tile: the same size in tiles at any density

    const hgt = (x, y) => (typ(x, y) === "_" ? -9 : map.hgt[y][x]);

    const GR = ME.content.grass, ok = new Set(GR.ground.map((n) => pal.ids[n]).filter((i) => i !== undefined));
    const M = { grass: pal.id(GR.blade), grass2: pal.id(GR.blade2), reed: pal.id(GR.reed), dry: pal.id(GR.dry) };
    const C = T.geo.C, RI = T.geo.RI, out = [];

      if (typ(cx, cy) !== "m" || Math.hypot(cx + 0.5 - C, cy + 0.5 - C) > RI - 0.4) continue;
      let lane = 0, water = 0, cliff = 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const t = typ(cx + dx, cy + dy);
        if (t === "u" || t === "t") lane = 1;
        if (t === "w") water = 1;
        if (hgt(cx + dx, cy + dy) > hgt(cx, cy)) cliff = 1;
      }
      const patch = P.fbm(cx * 0.35, cy * 0.35, 0, 77);
      const n = Math.round((2 + 3 * lane + 4 * water + 3 * cliff) * (0.45 + patch) * (H(cx, cy, 0, 71) > 0.2 ? 1 : 0.3));
      for (let k = 0; k < n; k++) {

          const col = j * NX + i, kt = top[col];
          if (kt < 1 || !ok.has(vox[(kt - 1) * PLANE + col]) || vox[kt * PLANE + col]) continue;
          const hv = Math.max(1, Math.round(KV * (reed ? 6 + Math.floor(H(i, j, b, 76) * 7) : 2 + Math.floor(H(i, j, b, 76) * 4) + (cliff ? 1 : 0))));
          const mat = reed ? M.reed : H(i, j, b, 77) > 0.82 ? M.dry : H(i, j, b, 78) > 0.5 ? M.grass : M.grass2;

})();

<script>
/* Bake cache: the whole bake (terrain arrays, mesh, model bricks, grass, palette order) kept in
   IndexedDB, so a repeat launch skips the CPU bake. Only the newest bake is kept. The key holds the
   engine version, the style id and a fingerprint of the bake code, so a changed bake never loads a
   stale result. Any failure (no IndexedDB, quota, clone error) falls back to baking. ?nocache=1 skips it. */
(function () {
  const ME = window.ME, DB = "mossheart", STORE = "bake";

  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const fnv = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h >>> 0).toString(36); };

  ME.bakeCache = {
    // extra: anything else the bake depends on (an app's own model list, as a string)
    key(st, extra = "") {
      const code = [ME.bakeTerrain, ...(ME.bakeTerrain.parts || []), ME.coarseStep, ME.coarseFill, ME.greedyMesh, ME.bakeModels, ME.voxelizeModel, ME.stampModel, ME.bakeGrass, ME.modelOf].map(String).join("|");
      // the content the bake reads: terrain roles (functions as their source), the kinds the map's legend
      // names (a generator map's letters are kinds made of the terrain roles), deco, grass, critters
      const C = ME.content, src = (k, v) => (typeof v === "function" ? String(v) : v);
      const v1 = st.map && st.map.v !== undefined, kinds = {};
      if (v1 && C && C.kinds) for (const n of Object.values(st.map.legend || {})) if (n !== null && C.kinds[n]) kinds[n] = C.kinds[n];
      const content = C ? JSON.stringify([C.terrain, kinds, C.volumeDeco, C.defaultMaterial, C.grass, C.critters, C.walkers, C.flipbookFrames], src) : "";
      // a v1 map names the bake, and its game block (route, cover, spawns) is not baked
      const s = v1 ? Object.assign({}, st, { map: Object.assign({}, st.map, { game: undefined }) }) : st;
      return `${ME.VERSION}:${v1 ? st.map.id : st.id}:vs${ME.VS}:${fnv(code + (ME.ASSET_SRC || "") + content + JSON.stringify(s) + extra)}`; // ASSET_SRC: hand-authored asset models (assets/asset-kit.js)
    },
    async get(key) {
      if (ME.qn("nocache", 0) || !window.indexedDB) return null;
      try {
        const db = await open();
        return await new Promise((res, rej) => { const r = db.transaction(STORE).objectStore(STORE).get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
      } catch (e) { ME.log("WARN bake cache read failed:", e.message); return null; }
    },
    // fire and forget: the record is cloned synchronously here, the write commits in the background
    async put(key, rec) {
      if (ME.qn("nocache", 0) || !window.indexedDB) return;
      try {
        const db = await open(), tx = db.transaction(STORE, "readwrite"), s = tx.objectStore(STORE);
        s.clear(); s.put(rec, key);
        await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
      } catch (e) { ME.log("WARN bake cache write failed:", e.message); }
    },
  };
})();

<script>
/* Simulation: the route from map.path (cellsOf ported from styles5.js), walkers that follow it over
   stairs and the bridge using the voxel ground height, props playing their flipbooks and swaying in the
   wind. Produces the per-frame instance table (affine local-voxel -> world and its inverse).
   Everything else that moves is an instance layer (sim.layers, written in order after the walkers):
   an object with writeInstances(time, sim, i, opts) that put()s its instances from index i and returns
   the next free index. The ambient critters are one; a game is another.
   avoid(x, y) marks a point the critters shy away from; wiltAt(x, y) 0..1, if set, makes props droop. */
(function () {
  const ME = window.ME;
  const INST_FLOATS = 28; // 6 x vec4 matrices + vec4u info
  const content = () => ME.content || {};

  // Path cells in walking order, from polylines of cell corners (styles5.js cellsOf).
  const cellsOf = (pts) => {
    const out = [pts[0].slice()];
    for (let k = 0; k + 1 < pts.length; k++) {
      let [x, y] = pts[k]; const [x1, y1] = pts[k + 1];

    }

  class Sim {

      const map = st.map, cells = map.path && map.path.length ? cellsOf(map.path[0]) : [], // no route (a v1 map until M4): no walkers
        isW = (c) => map.typ[c[1]][c[0]] === "w";

    // shader hook (see ME.SHADER_HOOKS).
    put(i, mi, X, Y, Z, yaw, flip, sc, sh, flags, pitch = 0, mark = 0, markV = 0) {

    }

    update(time, opts) {

      let i = 0;
      for (const s of MB.statics) {
        if (s.hidden) continue; // shattered into loose voxels (ME.VoxelPhysics.shatter)
        const p = s.place, n = s.frames.length, mi = s.frames[Math.floor(((time * 1.1 + s.phase) % 1) * n) % n];
        // lean downwind with the gust passing over, plus a faster flutter across it
        // (sway per prop: [lean per unit of gust, flutter, flutter rate]; shear = top shift / height)
        const sw = SWAY[p.name];
        let sh = [0, 0];
        s.wsh = null;
        if (sw && wk) {
          const g = ME.gust(p.X, p.Y, time, wk), ph = p.X * 1.7 + p.Y * 1.1;
          const a = g * sw[0] + Math.sin(time * sw[2] + ph) * sw[1] * wk, b = Math.sin(time * sw[2] * 1.37 + ph * 2.3) * sw[1] * 0.6 * wk;
          const hx = wx * a - wy * b, hy = wy * a + wx * b;

        }

        if (s.kick) sh = [sh[0] + s.kick[0], sh[1] + s.kick[1]];

        }

      }
      this.staticCount = i;
      for (let w = 0; w < this.walkers.length; w++) {
        const u = this.walkers[w], s = (u.s0 + u.speed * time) % this.len, [X, Y, Z, dx, dy] = this.at(s);
        const yaw = Math.atan2(dy, dx), nx = -Math.sin(yaw), ny = Math.cos(yaw);
        const fr = MB.walkerFrames[u.type], g = u.w.gait, ph = s * u.w.rate + u.ph, k = Math.floor((ph % 1) * fr.length);

        if (g === "hop") { const a = Math.abs(Math.sin(ph * Math.PI * 2)); hop = a * 0.06; sq = (0.5 - a) * 0.12; }

        const px = X + nx * u.lat, py = Y + ny * u.lat, pz = Z + hop;
        this.put(i++, fr[k], px, py, pz, yaw, false, [1 + sq * 0.5, 1 + sq * 0.5, 1 - sq], [0, 0], 1);
        this.wpos[w * 2] = px; this.wpos[w * 2 + 1] = py;
      }
      this.wn = this.walkers.length;
      for (const L of this.layers) i = L.writeInstances(time, this, i, opts);
      this.count = i;

    }

<script>
/* Shared WGSL: the per-frame uniform block (mirrored by ME.UOFF), hashing/noise, octahedral normals,
   sun-volume addressing, the wind field and the canopy light: the sun reaches the jar through an
   overhead layer of foliage. Its gaps (anchored at the style's beam spots, plus smaller random ones)
   make the light pools and shafts; leaves inside the gaps dapple them; gusts sway it all. */
(function () {
  const ME = window.ME;
  ME.wgsl = ME.wgsl || {};

  // float offsets into the uniform buffer (vec4 aligned)
  ME.UOFF = { vp: 0, ivp: 16, vdir: 32, sun: 36, res: 40, grid: 44, dims: 48, cgrid: 52, cdims: 56, look: 60, look2: 64, look3: 68, fog: 72, beamCol: 76, canopy: 80, canopy2: 84, shadow: 88, shadow2: 92, beams: 96, beamK: 128, ids: 136, misc: 140, outres: 144, part: 148, psrc: 152, geo: 156, misc2: 160, look4: 164, wind: 168, canopy3: 172, water2: 176, lgrid: 180, field: 184, user: 188 };
  // vec4 slots of app data at the end of the block (u.user[k], Renderer.user) for the shader hooks
  ME.USER_SLOTS = 6;
  ME.USIZE = ME.UOFF.user + 4 * ME.USER_SLOTS;

  // Mirrored exactly by WGSL gust() so trees (CPU) and grass, moss and canopy (GPU) move together.
  ME.WIND_DIR = [0.85, -0.527];
  ME.gust = (x, y, t, k) => {
    const [wx, wy] = ME.WIND_DIR, a = x * wx + y * wy, c = -x * wy + y * wx, ph = a * 0.45 - t * 1.1;
    const g = Math.pow(0.5 + 0.5 * Math.sin(ph + 1.7 * Math.sin(ph * 0.37 + t * 0.13)), 3);
    const cr = 0.65 + 0.35 * Math.sin(c * 0.7 + t * 0.11) * Math.sin(c * 0.31 - t * 0.07);
    return k * (0.3 + 0.9 * g * cr);
  };

  ME.wgsl.common = /* wgsl */ `
struct U {
  vp: mat4x4f, ivp: mat4x4f,
  vdir: vec4f,    // world view direction (towards the scene), w = time
  sun: vec4f,     // L (towards the sun), w = canopy wind offset
  res: vec4f,     // render w, h, 1/w, 1/h
  grid: vec4f,    // voxel grid origin, voxels per unit
  dims: vec4f,    // voxel grid dims, frame
  cgrid: vec4f,   // coarse/sun grid origin, cells per unit
  cdims: vec4f,   // coarse dims, light count
  look: vec4f,    // shade, pool, amb, aoK
  look2: vec4f,   // bevelK, rampMode, -, canopyOn
  look3: vec4f,   // debugView, shaftK, bloomK, exposure
  fog: vec4f,     // fog rgb, haze
  beamCol: vec4f, // beam rgb, vignette
  canopy: vec4f,  // leaf layer opacity 1, 2, leaf scale 1, 2
  canopy2: vec4f, // random gap threshold, -, random gap brightness, gap rim softness
  shadow: vec4f,  // canopy texture: plane origin xy, 1/size, -
  shadow2: vec4f, // -, beam count, sideK, shadowK
  beams: array<vec4f, 8>,   // x y z r: foot points of the style's sun pools
  beamK: array<vec4f, 2>,
  ids: vec4f,     // material ids: sky, water, fall, maple
  misc: vec4f,    // glass, water, particles, shafts toggles
  outres: vec4f,  // canvas w, h, 1/w, 1/h
  part: vec4f,    // leaf, firefly, mist counts, dt
  psrc: vec4f,    // source counts (leaf, firefly, mist), depth range D1-D0
  geo: vec4f,     // island centre, glass radius, glass top, dome height
  misc2: vec4f,   // frame, shaft z top, shaft z bottom, bloom threshold
  look4: vec4f,   // spriteK, moss mottling, -, -
  wind: vec4f,    // direction xy, strength, -
  canopy3: vec4f, // canopy plane height, shaft haze height, haze base z, -
  water2: vec4f,  // ripple count, caustics strength, water-level grid size, -
  lgrid: vec4f,   // light grid origin xy, size wh
  field: vec4f,   // app ground maps: map size wh (tiles), field texels per tile, -

@group(0) @binding(0) var<uniform> u: U;

fn sstep(a: f32, b: f32, x: f32) -> f32 { let t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
fn hash12(p: vec2f) -> f32 { var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
fn hash13(p: vec3f) -> f32 { var p3 = fract(p * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  let a = hash12(i); let b = hash12(i + vec2f(1.0, 0.0)); let c = hash12(i + vec2f(0.0, 1.0)); let d = hash12(i + vec2f(1.0, 1.0));
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}
fn fbm2(p: vec2f) -> f32 {
  var a = 0.0; var f = 1.0; var amp = 0.5; var n = 0.0;
  for (var i = 0; i < 3; i++) { a += vnoise(p * f + vec2f(f32(i) * 17.0)) * amp; n += amp; f *= 2.03; amp *= 0.5; }
  return a / n;
}
fn octEnc(n: vec3f) -> vec2f {
  let m = n / (abs(n.x) + abs(n.y) + abs(n.z));
  if (m.z >= 0.0) { return m.xy; }
  let s = select(vec2f(-1.0), vec2f(1.0), m.xy >= vec2f(0.0));
  return (1.0 - abs(m.yx)) * s;
}
fn octDec(e: vec2f) -> vec3f {
  var n = vec3f(e.x, e.y, 1.0 - abs(e.x) - abs(e.y));
  let t = max(-n.z, 0.0);
  n.x += select(t, -t, n.x >= 0.0);
  n.y += select(t, -t, n.y >= 0.0);
  return normalize(n);
}
fn sunUVW(p: vec3f) -> vec3f { return (p - u.cgrid.xyz) * u.cgrid.w / u.cdims.xyz; }
fn beamKOf(i: i32) -> f32 {
  let v = u.beamK[i / 4]; let j = i % 4;
  return select(select(select(v.w, v.z, j == 2), v.y, j == 1), v.x, j == 0);
}
// Breeze plus gust fronts (ME.gust mirrors this).
fn gust(p: vec2f, t: f32) -> f32 {
  let wd = u.wind.xy; let a = dot(p, wd); let c = dot(p, vec2f(-wd.y, wd.x)); let ph = a * 0.45 - t * 1.1;
  let g = pow(0.5 + 0.5 * sin(ph + 1.7 * sin(ph * 0.37 + t * 0.13)), 3.0);
  let cr = 0.65 + 0.35 * sin(c * 0.7 + t * 0.11) * sin(c * 0.31 - t * 0.07);
  return u.wind.z * (0.3 + 0.9 * g * cr);
}
// Where the sun ray through p crosses the canopy plane, swayed by the wind (branches lean downwind
// in a gust and swing back).
fn canopyQ(p: vec3f, t: f32) -> vec2f {
  let L = u.sun.xyz;
  let q = p.xy + (u.canopy3.x - p.z) * L.xy / max(L.z, 0.2);
  let g = gust(q * 0.5, t);
  let wd = u.wind.xy; let wp = vec2f(-wd.y, wd.x);
  return q - wd * (g * 0.24 + 0.05 * sin(t * 0.7 + q.y * 0.3) * u.wind.z) - wp * 0.05 * sin(t * 0.53 + q.x * 0.21) * u.wind.z;
}
// Openness of the canopy at q: irregular gaps at the style's pool spots, plus smaller random gaps
// (weighted by rk: surfaces get them, shafts do not, so the air is not striped everywhere).
// x = with the random gaps, y = pool gaps only.
fn canopyGaps(q: vec2f, rk: f32) -> vec2f {
  let L = u.sun.xyz; var open = 0.0;
  let nb = i32(u.shadow2.y);
  for (var i = 0; i < nb; i++) {
    let bm = u.beams[i];
    let c = bm.xy + (u.canopy3.x - bm.z) * L.xy / max(L.z, 0.2);
    let d = q - c; let r = length(d);
    if (r > bm.w * 1.9) { continue; }
    let fi = f32(i) * 1.7; let ang = atan2(d.y, d.x);
    // lobed, warped outline: no two pools alike, none a disc
    let lobes = 1.0 + 0.2 * sin(ang * 2.0 + fi) + 0.13 * sin(ang * 3.0 + fi * 2.3) + 0.08 * sin(ang * 5.0 - fi);
    let warp = (vnoise(d * 1.5 + vec2f(fi * 7.0, fi * 3.0)) - 0.5) * 0.65;
    open = max(open, sstep(1.0, 1.0 - u.canopy2.w, r / (bm.w * (lobes + warp))) * beamKOf(i));
  }
  if (rk <= 0.0) { return vec2f(open); }
  let fg = fbm2(q * 0.75 + vec2f(3.1, 7.7));
  return vec2f(max(open, sstep(u.canopy2.x, u.canopy2.x + 0.08, fg) * u.canopy2.z * rk), open);
}
// One layer of leaves: each cell may hold a pointed leaf that flutters on its own.
fn leafLayer(q: vec2f, t: f32, seed: f32) -> f32 {
  let i = floor(q); let f = fract(q); var m = 0.0; let w = u.wind.z;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      let o = vec2f(f32(x), f32(y));
      let h = hash12(i + o + vec2f(seed * 17.0, 3.0));
      if (h > 0.66) { continue; }
      let h2 = hash12(i + o + vec2f(seed * 31.0 + 5.0, 9.0));
      let a = h2 * 6.283 + 0.4 * w * sin(t * (2.0 + h * 3.0) + h * 20.0);
      let c = o + 0.5 + (vec2f(h, h2) - 0.5) * 0.6 + 0.07 * w * vec2f(sin(t * 3.1 + h * 9.0), cos(t * 2.7 + h2 * 9.0));
      let d = f - c; let cs = cos(a); let sn = sin(a);
      let e = vec2f(d.x * cs + d.y * sn, -d.x * sn + d.y * cs) / vec2f(0.62, 0.36);
      // far leaves cast soft shadows (penumbra), so the gaps between them read as round sun flecks
      m = max(m, sstep(1.25, 0.55, length(e) * (1.0 + 0.25 * abs(e.x))));
    }
  }
  return m;
}
// Sun reaching p through the canopy, 0..1. full = with leaves (surfaces); shafts use the gaps with a
// cheap streak breakup instead.
fn canopy(p: vec3f, full: bool) -> f32 {
  let t = u.vdir.w;
  return canopyAt(canopyQ(p, t), t).x;
}
// The canopy at plane point q: x = sun through gaps and leaves (surfaces), y = pool gaps only (shafts).
// Evaluated once per frame into the canopy texture (u.shadow = its plane origin xy and 1/size).
fn canopyAt(q: vec2f, t: f32) -> vec2f {
  let g = canopyGaps(q, 1.0);
  if (g.x <= 0.0) { return g; }
  let l1 = leafLayer(q * u.canopy.z, t, 1.0);
  let l2 = leafLayer(q * u.canopy.w + vec2f(5.2, 1.3) - u.wind.xy * gust(q * 0.5, t) * 0.12, t, 2.0);
  return vec2f(g.x * (1.0 - u.canopy.x * l1) * (1.0 - u.canopy.y * l2), g.y);
}
fn canopyUV(q: vec2f) -> vec2f { return (q - u.shadow.xy) * u.shadow.z; }
`;
  // Canopy texture binding + lookup for a pass (needs a filtering sampler named lin). Off the

@group(1) @binding(${b}) var canT: texture_2d<f32>;
fn canopyT4(q: vec2f) -> vec4f {

@group(1) @binding(0) var outT: texture_storage_2d<rgba8unorm, write>;
@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) id: vec3u) {

  // Shader hooks: the extension points an app (a game) fills with its own WGSL, passed to the Renderer as

})();

/* G-buffer passes. All three voxel forms write the same targets:
   location 0 = albedo (rgba8unorm-srgb, a = AO), location 1 = oct normal xy, material id, aux
   (aux: 0 terrain, 1+steps for ray-marched volumes, +1000 for units, -1 for leaves). */
(function () {
  const ME = window.ME, W = ME.wgsl;

  // generator's st.bevel), AO from occupancy sampled along the normal, voxel grain from a hash.
  W.terrain = W.common + /* wgsl */ `
@group(1) @binding(0) var dens: texture_3d<f32>;
@group(1) @binding(1) var lin: sampler;
@group(1) @binding(2) var<storage, read> mats: array<vec4f>;

struct VO { @builtin(position) pos: vec4f, @location(0) w: vec3f, @location(1) @interpolate(flat) dm: u32 };
struct GO { @location(0) a: vec4f, @location(1) n: vec4f };

@vertex fn vs(@location(0) v: vec4u) -> VO {
  var o: VO;
  let p = vec3f(v.xyz) / u.grid.w + u.grid.xyz;
  o.pos = u.vp * vec4f(p, 1.0); o.w = p; o.dm = v.w;
  return o;
}
fn dens3(t: vec3f, lod: f32) -> f32 { return textureSampleLevel(dens, lin, t / u.dims.xyz, lod).r; }
fn faceN(d: u32) -> vec3f {
  switch d {
    case 0u: { return vec3f(1.0, 0.0, 0.0); }
    case 1u: { return vec3f(-1.0, 0.0, 0.0); }
    case 2u: { return vec3f(0.0, 1.0, 0.0); }
    case 3u: { return vec3f(0.0, -1.0, 0.0); }
    default: { return vec3f(0.0, 0.0, 1.0); }
  }
}
@fragment fn fs(i: VO) -> GO {
  let mat = i.dm >> 3u;
  let fnm = faceN(i.dm & 7u);
  let tv = (i.w - u.grid.xyz) * u.grid.w;
  let vox = floor(tv - fnm * 0.5);

  let h = 0.87; let ka = vec3f(1.0, -1.0, -1.0); let kb = vec3f(-1.0, -1.0, 1.0); let kc = vec3f(-1.0, 1.0, -1.0); let kd = vec3f(1.0);
  let g = (ka * dens3(tv + ka * h, 0.0) + kb * dens3(tv + kb * h, 0.0) + kc * dens3(tv + kc * h, 0.0) + kd * dens3(tv + kd * h, 0.0)) * 0.5;
  var n = fnm;

    if (dot(n, fnm) < 0.2) { n = fnm; }

  let o2 = dens3(tv + n * 5.0, 1.0);

  if (cls == 1u) { jit += (fbm2(i.w.xy * 3.0 + vec2f(i.w.z)) - 0.5) * 0.22; }
  var o: GO;
  o.a = vec4f(m0.rgb * max(0.2, 1.0 + jit), ao);
  o.n = vec4f(octEnc(n), f32(mat), 0.0);
  return o;
}
`;
  // The variant drawn once the app has carved terrain voxels (Renderer.carve): faces of carved cells go.

fn xf(I: Inst, l: vec3f) -> vec3f { let h = vec4f(l, 1.0); return vec3f(dot(I.a0, h), dot(I.a1, h), dot(I.a2, h)); }
fn nrmW(I: Inst, n: vec3f) -> vec3f { return normalize(I.b0.xyz * n.x + I.b1.xyz * n.y + I.b2.xyz * n.z); }

@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {
  let I = insts[ii]; let M = models[I.info.x];
  var o: VO;
  // faces turned away from the (orthographic) view collapse: with frag_depth there is no early-z, so
  // their fragments would otherwise all run up to the back-face discard. Faces: -x +x -y +y -z +z.
  let f = vi / 6u; let vd = u.vdir.xyz;
  let rl = vec3f(dot(I.b0.xyz, vd), dot(I.b1.xyz, vd), dot(I.b2.xyz, vd));
  if (select(-1.0, 1.0, (f & 1u) == 1u) * rl[f >> 1u] > 0.0) { o.pos = vec4f(2.0, 2.0, 0.0, 1.0); return o; }
  var cube = CUBE;
  let l = cube[vi] * vec3f(M.dims.xyz);
  o.pos = u.vp * vec4f(xf(I, l), 1.0); o.l = l; o.ii = ii;
  return o;
}

@fragment fn fs(i: VO) -> GO {
  let I = insts[i.ii]; let M = models[I.info.x];
  let dims = vec3f(M.dims.xyz); let idims = vec3i(M.dims.xyz);
  let vd = u.vdir.xyz;
  let rd = normalize(vec3f(dot(I.b0.xyz, vd), dot(I.b1.xyz, vd), dot(I.b2.xyz, vd)));
  let inv = 1.0 / select(rd, vec3f(1e-6), abs(rd) < vec3f(1e-6));
  let ro = i.l;
  let ta = -ro * inv; let tb = (dims - ro) * inv;
  let tmin = min(ta, tb); let tmax = max(ta, tb);
  let tEnter = max(max(tmin.x, tmin.y), tmin.z);
  let tExit = min(min(tmax.x, tmax.y), tmax.z);
  if (tEnter < -0.05) { discard; } // back face: the front face fragment marches this pixel
  var axis = 0;
  if (tmin.x >= tmin.y && tmin.x >= tmin.z) { axis = 0; } else if (tmin.y >= tmin.z) { axis = 1; } else { axis = 2; }
  let pos = rd > vec3f(0.0);
  let sgn = select(vec3f(-1.0), vec3f(1.0), pos);
  let isg = vec3i(sgn);
  let tDelta = abs(inv);
  let bbase = vec3i(M.base.xyz / 8u);
  var t = max(tEnter, 0.0) + 1e-3;
  var steps = 0u; var hit = false; var cell = vec3i(0); var pb = vec3i(0);
  loop {
    if (t >= tExit || steps > 200u) { break; }
    let p = ro + rd * t;
    let br = vec3i(floor(p / 8.0));
    let slot = textureLoad(bricks, bbase + br, 0).r;
    if (slot == 0u) {
      let tb2 = (vec3f(br) * 8.0 + select(vec3f(0.0), vec3f(8.0), pos) - ro) * inv;
      if (tb2.x <= tb2.y && tb2.x <= tb2.z) { axis = 0; } else if (tb2.y <= tb2.z) { axis = 1; } else { axis = 2; }
      t = min(min(tb2.x, tb2.y), tb2.z) + 1e-3;
      steps += 1u;
      continue;
    }
    let k = slot - 1u;
    pb = vec3i(vec3u(k & 15u, (k >> 4u) & 15u, k >> 8u) * 8u);
    cell = vec3i(floor(p));
    var tMax = (vec3f(cell) + select(vec3f(0.0), vec3f(1.0), pos) - ro) * inv;
    loop {
      if (any(cell < vec3i(0)) || any(cell >= idims)) { t = tExit; break; }
      steps += 1u;
      if (textureLoad(pool, pb + (cell & vec3i(7)), 0).a > 0.0) { hit = true; break; }
      if (tMax.x < tMax.y && tMax.x < tMax.z) { t = tMax.x; cell.x += isg.x; tMax.x += tDelta.x; axis = 0; }
      else if (tMax.y < tMax.z) { t = tMax.y; cell.y += isg.y; tMax.y += tDelta.y; axis = 1; }
      else { t = tMax.z; cell.z += isg.z; tMax.z += tDelta.z; axis = 2; }
      if (any((cell >> vec3u(3u)) != br) || steps > 200u) { t += 1e-3; break; }
    }
    if (hit) { break; }
  }
  if (!hit) { discard; }
  let v = textureLoad(pool, pb + (cell & vec3i(7)), 0);
  let hw = xf(I, ro + rd * t);
  var fl = vec3f(0.0);
  fl[axis] = -sgn[axis];
  let n = normalize(mix(nrmW(I, fl), nrmW(I, octDec(v.xy * 2.0 - 1.0)), 0.8));
  let mat = u32(v.a * 255.0 + 0.5);
  let m0 = mats[mat * 2u]; let m1 = mats[mat * 2u + 1u];
  let hc = hash13(vec3f(cell) + f32(I.info.x) * 7.0);
  let jit = (hc - 0.5) * m1.y;

  if (u32(m1.w + 0.5) == 2u) {
    let tm = u.vdir.w; let g = gust(hw.xy, tm);
    nn = normalize(n + (0.12 + 0.3 * g) * vec3f(sin(tm * (4.0 + hc * 3.0) + hc * 40.0), cos(tm * (3.3 + hc * 2.0) + hc * 27.0), 0.0));
  }
  var o: GO;
  o.a = vec4f(m0.rgb * (1.0 + jit), v.b);
  o.n = vec4f(octEnc(nn), f32(mat), 1.0 + f32(steps) + f32(I.info.y) * 1000.0);
  o.e = vec4f(0.0);
  let mb = I.info.z; let mv = bitcast<f32>(I.info.w);
  if (mb != 0u || mv > 0.0) {
    let g = hookMark(mb, mv, n, vec3f(cell) / u.grid.w, hc, f32(i.ii));
    o.a = vec4f(mix(o.a.rgb, g.tint.rgb, g.tint.a), o.a.a);
    o.e = vec4f(g.emit, 1.0);
  }
  o.depth = (u.vp * vec4f(hw, 1.0)).z;
  return o;
}
`;

const QUAD = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0));

/* Lighting: the sun visibility volume (replaces shadow maps for the static world), unit shadow disks,
   the deferred lighting pass and the half-resolution light shafts. */
(function () {
  const ME = window.ME, W = ME.wgsl;

  W.sunvol = W.common + /* wgsl */ `
@group(1) @binding(0) var occT: texture_3d<f32>;
@group(1) @binding(1) var lin: sampler;
@group(1) @binding(2) var outT: texture_storage_3d<rgba8unorm, write>;
fn march(p: vec3f, dir: vec3f, n: i32, s0: f32, grow: f32, sigma: f32) -> f32 {
  var T = 1.0; var t = s0; var st = s0;
  let top = u.cgrid.z + u.cdims.z / u.cgrid.w;
  for (var i = 0; i < n; i++) {
    let q = p + dir * t;
    let uvw = sunUVW(q);
    if (q.z > top || any(uvw < vec3f(0.0)) || any(uvw > vec3f(1.0))) { break; }
    T *= exp(-textureSampleLevel(occT, lin, uvw, 0.0).r * sigma * st);
    if (T < 0.01) { return 0.0; }
    t += st; st *= grow;
  }
  return T;
}
@compute @workgroup_size(4, 4, 4)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let N = vec3u(u.cdims.xyz);
  if (any(id >= N)) { return; }
  let cell = 1.0 / u.cgrid.w;
  let p = u.cgrid.xyz + (vec3f(id) + 0.5) * cell;
  let sun = march(p, u.sun.xyz, 80, cell, 1.035, 34.0);
  var sky = 2.0 * march(p, vec3f(0.0, 0.0, 1.0), 14, cell, 1.3, 18.0);
  for (var k = 0; k < 6; k++) {
    let a = f32(k) * 1.0472 + 0.3;
    sky += march(p, normalize(vec3f(cos(a) * 0.8, sin(a) * 0.8, 0.6)), 12, cell, 1.3, 18.0);
  }
  textureStore(outT, id, vec4f(sun, sky / 8.0, 0.0, 1.0));
}
`;

  // Deferred lighting. Ramp mode shades like the generator: a scalar s = form + sun pool - canopy shade

fn caustic(q0: vec2f, t: f32) -> f32 {

/* Voxel physics v2 (ME.VoxelPhysics): a pool of loose voxels, each one terrain voxel in size, that fly,
   bounce, come to rest and pile up on the voxel world.
   One bitset holds every solid cell: the terrain (from the terrain voxels at init) and the cells
   held by resting voxels, so a collision test is one load and a voxel can only claim a free cell.
   Flying voxels walk the grid cell by cell along their motion (DDA: nothing thin is ever skipped, at any
   speed; SUBSTEP is the v1 fixed-substep mover, kept for comparison). A resting voxel with no support falls
   again; a granular one slides off a heap edge into a free cell diagonally below. With SLEEP, a resting
   voxel that has checked its cell sleeps until a neighbouring cell is given back (a wake bit per cell).
   With LIST, the step also writes the faces worth drawing (facing the camera, not against a solid cell,
   on screen) for one indirect draw.
   Water: under the surface voxels sink slowly (drag, buoyancy) and drift with the current; light
   non-granular ones (leaves) float. A voxel that hits the surface fast enough logs an impact (args.ev),
   which the CPU turns into a ring on the water and a spray of droplets a frame later. Droplets never
   rest: they end where they touch the ground or the water.
   Sand: a granular voxel on a heap's edge steps into the free cell diagonally below (gives its cell back,
   claims the next); a share of the grains (pp.a.z, from the angle of repose) also step two cells out and
   one down, so piles settle between 27 and 45 degrees. Carved terrain cells are given back by physCarve.
   Voxel (32 bytes): p = position (world) + life left (s); v = velocity; k = material (bits 0-7), state
   (8-9: 0 free, 1 flying, 2 resting, 3 asleep), granular (10), air drag x4 per s (11-16), seed (17-22),
   droplet (23), tumble angle in 1/256 turns (24-31). A resting voxel holds the cell it sits in until its
   last FADE seconds, when it shrinks away.
   Dug sand stays: a grain carved out of the terrain carries the life KEEP (it never expires). Once it has
   slept SETTLE_S seconds on the terrain itself (ter: the terrain cells alone, so never on loose voxels
   that will go) it goes back into the terrain: it lists its cell and material (args.settled) and is
   marked SETTLED, still drawn and still holding its cell; the CPU writes it into T.vox and, from step
   pp.e.y on, the slot is free and the cell stays solid as terrain. A clear leaves dug sand be. */
(function () {
  const ME = window.ME, W = ME.wgsl;

  const VOX = /* wgsl */ `
struct Vox { p: vec4f, v: vec3f, k: u32 };
// a = dt, gravity, share of grains sliding two cells out (angle of repose), restitution; b = ground
// friction per 1/60 s, settle speed, clock, wind pull; c = voxels in use, spawn count, ring slot of the
// first spawn, flags (1 = clear all, 2 = for a terrain reset); d = grid dims, capacity; g = grid origin,
// voxels per unit; h = dig: centre, radius (0 = none); e = this step's number, the last step whose
// settled grains the CPU has written into the terrain
struct PP { a: vec4f, b: vec4f, c: vec4u, d: vec4u, g: vec4f, h: vec4f, e: vec4u };
const FADE = 0.5;
const KEEP_MIN = 1e8; const SETTLED = 4e9; const SETTLED_MIN = 3e9; const SETTLE_S = 1.5; const SETCAP = 2048u;
// dug terrain sand still loose (not yet back in the terrain)
fn keeps(V: Vox) -> bool { return V.p.w > KEEP_MIN && V.p.w < SETTLED_MIN; }
fn stateOf(k: u32) -> u32 { return (k >> 8u) & 3u; }
fn withState(k: u32, s: u32) -> u32 { return (k & ~(3u << 8u)) | (s << 8u); }
fn angleOf(k: u32) -> f32 { return f32(k >> 24u) * (6.2831853 / 256.0); }
fn isDrop(k: u32) -> bool { return (k & (1u << 23u)) != 0u; }
fn spinAxis(k: u32) -> vec3f {
  let s = f32((k >> 17u) & 63u);
  return normalize(vec3f(hash12(vec2f(s, 1.0)), hash12(vec2f(s, 2.0)), hash12(vec2f(s, 3.0))) - 0.5 + vec3f(0.0, 0.0, 1e-3));
}
fn rot(x: vec3f, k: vec3f, a: f32) -> vec3f { let c = cos(a); let s = sin(a); return x * c + cross(k, x) * s + k * dot(k, x) * (1.0 - c); }
`;
  // cells and the solid bitset (both compute shaders bind pp, occ and wake)
  const CELLS = /* wgsl */ `
override SLEEP: bool = true;
fn cellOf(p: vec3f) -> vec3i { return vec3i(floor((p - pp.g.xyz) * pp.g.w)); }
fn inGrid(c: vec3i) -> bool { return all(c >= vec3i(0)) && all(c < vec3i(pp.d.xyz)); }
fn cellIdx(c: vec3i) -> u32 { return u32((c.z * i32(pp.d.y) + c.y) * i32(pp.d.x) + c.x); }
// solid = terrain or held; below the grid is floor, around it is air
fn solid(c: vec3i) -> bool {
  if (!inGrid(c)) { return c.z < 0; }
  let i = cellIdx(c);
  return (atomicLoad(&occ[i >> 5u]) & (1u << (i & 31u))) != 0u;
}
// claims a free cell; false when it is terrain or another voxel got there first
fn claim(i: u32) -> bool { let b = 1u << (i & 31u); return (atomicOr(&occ[i >> 5u], b) & b) == 0u; }
fn markWake(c: vec3i) { if (inGrid(c)) { let i = cellIdx(c); atomicOr(&wake[i >> 5u], 1u << (i & 31u)); } }
// a cell given back; wakes the resting voxels it held up (above), now lets slide (beside, diagonally
// above, two out and one above) or now shows a face of (all six neighbours: their cached open faces change)
fn release(i: u32) {
  atomicAnd(&occ[i >> 5u], ~(1u << (i & 31u)));
