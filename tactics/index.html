<script>
/* The tactics game's sound set (Art-Tactics): a sound bank for the audio engine (MA.renderBanks) and the
   cue table that maps the game's cues (ARCHITECTURE.md, "Audio") to its sounds, as TC.audio. Realistic
   first: small arms with a crack, a muzzle thump and the street's slap behind them; rounds that thud
   into plate, spall off concrete, ring off steel or plop into the flood; boots that sound like the tile
   they land on; the city under each mood (wind and drips in the overcast flood, rain and a far siren at
   night, the industrial drone of the smog). The cyborg side is in the details: servo whines, a rail
   gun's capacitor, a mech's hydraulics. All of it is synthesised (noise, filters, pitch sweeps, modal
   rings and grains), so the bank is code, renders in the bank worker in well under a second and caches.
   The contract (src/audio/audio.js plays it):
     banks     [TC_SFX]: (L) -> { salt, items: { name: [secs, sr, loops] }, render(name) }, self-contained
               (it runs in a worker with only the DSP library L); a name ending in _N is a take
     mix       { sound: [dB, pitch spread, minimum ms between plays] }, by name without its take number
     cues      { cue: sound | { s, db, pitch } | null }; a missing cue uses its parent ("shot.rail" ->
               "shot"), so every footstep cue (step.<kind>.<surface>) is listed
     ambience  { mood: [{ s, db }] } by TC.look.mood (overcast, night, smog; else default)
     protect   sounds the voice pool never cuts off
   Listen to every sound and cue: assets/sounds.html. */
function TC_SFX(L) {
  const { TAU, LOOP_FADE, rnd, rr, n1, svf, seam, grains } = L;
  const { exp, sin, min, max, PI, tanh, floor } = Math;
  const HI = 32000, LO = 22050;

  // name -> [seconds, sample rate, loops]
  const SOUNDS = {
    // weapons (shot.<weapon>)
    rifle_0: [0.5, HI], rifle_1: [0.5, HI], rifle_2: [0.5, HI], lmg_0: [0.55, HI], lmg_1: [0.55, HI], smg_0: [0.35, HI], smg_1: [0.35, HI],
    rail: [0.9, HI], pulse: [0.4, HI], cannon: [1.4, LO],
    // where a round ends (impact.*)
    body_0: [0.22, HI], body_1: [0.22, HI], body_2: [0.22, HI], crit: [0.4, HI], spall_0: [0.35, HI], spall_1: [0.35, HI], spall_2: [0.35, HI],
    snap_0: [0.3, HI], snap_1: [0.3, HI], splash_0: [0.6, LO], splash_1: [0.6, LO], ricochet_0: [0.7, HI], ricochet_1: [0.7, HI],
    // grenades and rockets, cover breaking (launch.*, blast.*, debris)
    toss: [0.45, HI], rocket: [0.9, LO], grenade: [1.8, LO], blast: [2.4, LO], debris_0: [1.6, LO], debris_1: [1.6, LO],
    // a unit going down (down.<kind>)
    fall_0: [0.9, LO], fall_1: [0.9, LO], crash: [1.0, LO], wreck: [1.6, LO],
    // footsteps by surface (step.<kind>.<surface>)
    boot_0: [0.16, LO], boot_1: [0.16, LO], boot_2: [0.16, LO], heel_0: [0.14, HI], heel_1: [0.14, HI], heel_2: [0.14, HI],
    grit_0: [0.22, LO], grit_1: [0.22, LO], grit_2: [0.22, LO], glass_0: [0.3, HI], glass_1: [0.3, HI],
    clang_0: [0.3, HI], clang_1: [0.3, HI], clang_2: [0.3, HI], wade_0: [0.42, LO], wade_1: [0.42, LO],
    stomp_0: [0.45, LO], stomp_1: [0.45, LO], stompmetal: [0.6, HI], stompwater: [0.7, LO], hover: [0.5, LO],
    // actions and the interface
    chirp: [0.3, HI], reload: [0.7, HI], hunker: [0.4, LO], heal: [0.9, HI], mark: [0.36, HI],
    turn: [0.8, HI], enemy: [0.8, HI], win: [2.2, HI], lose: [2.2, HI], draw: [1.8, HI], click: [0.05, HI], select: [0.12, HI],
    // the city, one loop per mood
    overcast: [8.0, LO, true], night: [8.0, LO, true], smog: [8.0, LO, true],
  };

  // ------------------------------------------------------------------ building blocks
  // one-pole low-passed noise: call with the pole each sample (lower is darker and quieter)
  const lpN = () => { let y = 0; return (k) => (y += k * (n1() - y)); };
  // a decaying sine thump added at `at` seconds, falling from 2x to f0
  const thud = (s, sr, at, f0, k, a) => { let ph = 0; for (let i = floor(at * sr); i < s.length; i++) { const t = i / sr - at; ph += (f0 + f0 * exp(-t * 30)) / sr; s[i] += sin(TAU * ph) * min(1, t / 0.0015) * exp(-t * k) * a; if (t > 8 / k) break; } return s; };
  // struck metal: inharmonic partials (ratios, gains) of f0, decaying at k
  const ring = (s, sr, at, f0, parts, k, a) => { for (let i = floor(at * sr); i < s.length; i++) { const t = i / sr - at; let v = 0; for (const [r, g] of parts) v += sin(TAU * f0 * r * t) * g; s[i] += v * min(1, t / 0.0008) * exp(-t * k) * a; if (t > 8 / k) break; } return s; };
  // a burst of band-passed noise at `at`, `len` seconds long, decaying at k
  const burst = (s, sr, at, fc, q, k, a) => { const f = svf(sr); for (let i = floor(at * sr); i < s.length; i++) { const t = i / sr - at; s[i] += f(n1(), fc, q) * min(1, t / 0.001) * exp(-t * k) * a; if (t > 8 / k) break; } return s; };
  const PLATE = [[1, 1], [2.32, 0.6], [4.1, 0.35], [6.3, 0.2]], BELL = [[1, 1], [2.76, 0.5], [5.4, 0.25]];
  // a small-arms report: the supersonic crack, the muzzle's thump, the body of the blast, the action's
  // tick and the slap off the street behind
  const gun = (s, sr, o) => {
    const f = svf(sr), lo = lpN(), f0 = o.f0 * rr(0.92, 1.08), fc = o.fc * rr(0.9, 1.1), tick = floor(o.tick * rr(0.9, 1.1) * sr), g = svf(sr);
    let ph = 0;
    for (let i = 0; i < s.length; i++) {
      const t = i / sr, x = n1();
      ph += (f0 + f0 * 1.5 * exp(-t * 70)) / sr;
      const crack = x * exp(-t * o.crackK) * o.crack, body = f(x, fc, 0.6) * exp(-t * o.bodyK) * 1.2;
      const muzzle = sin(TAU * ph) * min(1, t / 0.0012) * exp(-t * o.boomK) * o.boom, tail = lo(0.05) * min(1, t / 0.008) * exp(-t * o.tailK) * o.tail;
      const mech = i >= tick ? g(n1(), 4000, 0.15) * exp(-((i - tick) / sr) * 350) * 0.3 : 0;
      s[i] = tanh((crack + body + muzzle + tail + mech) * o.drive);
    }
    return s;
  };
  // an explosion: the crack, a low thump, a roar of noise closing down, the rumble, then falling grit
  const boom = (s, sr, o) => {
    const lo = lpN(), lo2 = lpN();
    let ph = 0;
    for (let i = 0; i < s.length; i++) {
      const t = i / sr, x = n1();
      ph += (o.f0 + o.f0 * 2 * exp(-t * 12)) / sr;
      const crack = x * exp(-t * 400) * 1.8, thump = sin(TAU * ph) * min(1, t / 0.002) * exp(-t * o.thK) * 1.6;
      const roar = lo(0.2 * exp(-t * 3) + 0.02) * min(1, t / 0.004) * exp(-t * o.roarK) * o.roar, rumble = lo2(0.01) * exp(-t * o.rumK) * o.rum;
      s[i] = tanh((crack + thump + roar + rumble) * 1.3);
    }
    return grains(s, sr, o.grit, 0.15, o.gritTo, 0.004, 0.02, 0.22);
  };
  // water: a plop and a spray of droplets
  const droplets = (s, sr, n, from, to, a) => {
    for (let k = 0; k < n; k++) {
      const at = rr(from, to), fq = rr(900, 2800), i0 = floor(at * sr), g = a * rr(0.3, 1);
      let p = 0;
      for (let j = 0; j < floor(0.04 * sr) && i0 + j < s.length; j++) { const u = j / sr; p += (fq * (1 + u * 25)) / sr; s[i0 + j] += sin(TAU * p) * exp(-u * 90) * g; }
    }
    return s;
  };
  // a radio squelch: the open key's hiss
  const squelch = (s, sr, at, len, a) => { const f = svf(sr); for (let i = floor(at * sr); i < min(s.length, floor((at + len) * sr)); i++) { const t = i / sr - at; s[i] += f(n1(), 2200, 0.5) * sin((PI * t) / len) * a; } return s; };
  // a clean tone with a soft attack, its second harmonic and a decay
  const tone = (s, sr, at, f0, len, a, k = 4, h2 = 0.25) => { let ph = 0; for (let i = floor(at * sr); i < s.length; i++) { const t = i / sr - at; ph += f0 / sr; s[i] += (sin(TAU * ph) + h2 * sin(2 * TAU * ph)) * min(1, t / 0.006) * exp(-t * k) * min(1, max(0, (len - t) / 0.03)) * a; if (t > len) break; } return s; };

  // ------------------------------------------------------------------ the sounds
  const FX = {
    // a 5.56 carbine; the light machine gun is lower and heavier, the SMG lighter and shorter
    rifle: (s, sr) => gun(s, sr, { f0: 95, fc: 1700, tick: 0.026, crackK: 700, crack: 1.5, bodyK: 50, boomK: 30, boom: 1.0, tailK: 8, tail: 6, drive: 1.3 }),
    lmg: (s, sr) => gun(s, sr, { f0: 75, fc: 1200, tick: 0.034, crackK: 600, crack: 1.5, bodyK: 38, boomK: 22, boom: 1.3, tailK: 6, tail: 7, drive: 1.4 }),
    smg: (s, sr) => gun(s, sr, { f0: 130, fc: 2300, tick: 0.018, crackK: 900, crack: 1.2, bodyK: 70, boomK: 45, boom: 0.8, tailK: 12, tail: 4.5, drive: 1.2 }),
    // a coil gun: the capacitor's whine rising, the slug's crack, the rails ringing, ionised hiss
    rail(s, sr) {
      const f = svf(sr), lo = lpN(), t0 = 0.07;
      let ph = 0;
      for (let i = 0; i < s.length; i++) {
        const t = i / sr, u = t - t0;
        if (u < 0) { ph += (900 + 5000 * (t / t0)) / sr; s[i] = sin(TAU * ph) * (t / t0) ** 2 * 0.25; continue; }
        const crack = n1() * exp(-u * 1200) * 1.8, zap = f(n1(), 2600, 0.3) * exp(-u * 30) * 0.8, hiss = lo(0.3) * exp(-u * 5) * 1.1;
        const rails = (sin(TAU * 1180 * u) + 0.6 * sin(TAU * 1180 * 2.71 * u) + 0.35 * sin(TAU * 1180 * 5.2 * u)) * exp(-u * 9) * 0.35;
        s[i] = tanh(crack + zap + hiss + rails);
      }
      return s;
    },
    // a pulse rifle: a phased, buzzing down-sweep over a sharp onset
    pulse(s, sr) {
      const f = svf(sr);
      let ph = 0, ph2 = 0;
      for (let i = 0; i < s.length; i++) {
        const t = i / sr, fq = 1800 * exp(-t * 14) + 220;
        ph += fq / sr; ph2 += (fq * 1.007) / sr;
        const saw = (ph % 1) * 2 - 1 + ((ph2 % 1) * 2 - 1), am = 0.6 + 0.4 * sin(TAU * 95 * t);
        s[i] = f(saw, fq * 1.5, 0.4) * am * min(1, t / 0.002) * exp(-t * 9) + n1() * exp(-t * 300) * 0.6;
      }
      return s;
    },
    // a mech's 30 mm autocannon: a deep boom, the roar, the breech's clank
    cannon(s, sr) {
      const lo = lpN();
      let ph = 0;
      for (let i = 0; i < s.length; i++) {
        const t = i / sr, x = n1();
        ph += (42 + 90 * exp(-t * 25)) / sr;
        s[i] = sin(TAU * ph) * min(1, t / 0.002) * exp(-t * 6) * 1.5 + x * exp(-t * 500) * 1.6 + lo(0.08) * min(1, t / 0.01) * exp(-t * 4) * 5;
      }
      ring(s, sr, 0.09, 610, [[1, 1], [2.5, 0.7], [4.44, 0.4]], 22, 0.35);
      for (let i = 0; i < s.length; i++) s[i] = tanh(s[i] * 1.3);
      return s;
    },
    // a round into a body: the thud, the plate's tick and its short ring
    body(s, sr) {
      thud(s, sr, 0, rr(110, 150), 28, 1.0);
      burst(s, sr, 0, 3200, 0.5, 160, 0.9);
      return ring(s, sr, 0, rr(1600, 2400), BELL, 45, 0.25);
    },
    // a critical hit: a deeper thud and a crunch of plate and grit
    crit(s, sr) {
      thud(s, sr, 0, 85, 14, 1.1);
      burst(s, sr, 0, 2600, 0.4, 60, 0.8);
      ring(s, sr, 0, 1900, [[1, 1], [2.26, 0.5]], 30, 0.3);
      return grains(s, sr, 40, 0.01, 0.22, 0.002, 0.008, 0.35);
    },
    // a round into concrete: the strike, a bright spall, chips falling
    spall(s, sr) {
      for (let i = 0; i < s.length; i++) s[i] = n1() * exp(-(i / sr) * 600) * 1.4;
      burst(s, sr, 0, rr(2800, 4200), 0.3, 35, 0.8);
      thud(s, sr, 0, 180, 60, 0.4);
      return grains(s, sr, 30, 0.03, 0.3, 0.003, 0.012, 0.3);
    },
    // a round passing close: the supersonic crack (an N-wave), then its whiz falling in pitch
    snap(s, sr) {
      const f = svf(sr), dur = s.length / sr, t0 = 0.004, w0 = 0.012;
      for (let i = 0; i < s.length; i++) {
        const t = i / sr, n = t < t0 ? 1 - (2 * t) / t0 : 0, u = (t - w0) / (dur - w0);
        s[i] = n * 1.2 + (u > 0 ? f(n1(), 3500 - 2000 * u, 0.12) * sin(PI * u) ** 2 * 0.8 : 0);
      }
      return s;
    },
    // a round into the flood: a plop and spray
    splash(s, sr) {
      const f = svf(sr);
      let ph = 0;
      for (let i = 0; i < s.length; i++) { const t = i / sr; ph += (420 * exp(-t * 14) + 140) / sr; s[i] = sin(TAU * ph) * exp(-t * 25) * 0.7 + f(n1(), 1800, 0.5) * min(1, t / 0.01) * exp(-t * 9) * 0.9; }
      return droplets(s, sr, 14, 0.05, 0.45, 0.35);
    },
    // a round off steel or grating: the strike and the whine of the ricochet
    ricochet(s, sr) {
      const f = svf(sr), f0 = rr(2600, 3600);
      let ph = 0;
      for (let i = 0; i < s.length; i++) {
        const t = i / sr;
        ph += (f0 * (0.55 + 0.45 * exp(-t * 4)) * (1 + 0.01 * sin(TAU * 31 * t))) / sr;
        s[i] = n1() * exp(-t * 800) * 1.2 + sin(TAU * ph) * min(1, t / 0.01) * exp(-t * 5) * 0.45 + f(n1(), 2500, 0.2) * exp(-t * 20) * 0.4;
      }
      return s;
    },
    // a grenade thrown: the pin's clink and the arm's swing
    toss(s, sr) {
      const f = svf(sr), dur = s.length / sr;
      for (let i = 0; i < s.length; i++) { const t = i / sr, u = (t - 0.1) / (dur - 0.1); s[i] = u > 0 && u < 1 ? f(n1(), 600 + 900 * u, 0.6) * sin(PI * u) ** 2 * 0.9 : 0; }
      return ring(s, sr, 0, 4100, [[1, 1], [1.66, 0.6]], 60, 0.5);
    },
    // a rocket leaving the tube: the pop and the motor's roar going away
    rocket(s, sr) {
      const f = svf(sr), lo = lpN();
      let ph = 0;
      for (let i = 0; i < s.length; i++) {
        const t = i / sr, x = n1();
        ph += (60 + 100 * exp(-t * 30)) / sr;
        s[i] = sin(TAU * ph) * exp(-t * 16) + x * exp(-t * 300) * 1.2 + f(x, 1200 + 800 * exp(-t * 3), 0.8) * min(1, t / 0.03) * exp(-t * 3.2) * 1.1 + lo(0.1) * exp(-t * 2.5) * 3;
      }
      return s;
    },
    grenade: (s, sr) => boom(s, sr, { f0: 48, thK: 7, roarK: 3.5, roar: 4, rumK: 2.5, rum: 14, grit: 60, gritTo: 1.2 }),
    blast: (s, sr) => boom(s, sr, { f0: 38, thK: 4.5, roarK: 2.4, roar: 4.5, rumK: 1.6, rum: 18, grit: 90, gritTo: 1.8 }),
    // a cover piece breaking: a slump, the rush of grains, chunks landing
    debris(s, sr) {
      const lo = lpN();
      for (let i = 0; i < s.length; i++) { const t = i / sr; s[i] = lo(0.06) * exp(-t * 2.2) * min(1, t / 0.02) * 6; }
      thud(s, sr, 0, 70, 12, 0.9);
      for (let k = 0; k < 10; k++) { const at = rr(0.05, 1.0); thud(s, sr, at, rr(120, 220), 40, 0.4 * (1 - at)); }
      return grains(s, sr, 140, 0.02, 1.3, 0.003, 0.02, 0.4);
    },
    // a soldier going down: the knees, the body and the kit, a rattle of gear
    fall(s, sr) {
      thud(s, sr, 0.04, 75, 18, 1.0);
      thud(s, sr, 0.28, 60, 16, 0.75);
      ring(s, sr, 0.05, 2300, BELL, 40, 0.12);
      return grains(s, sr, 50, 0.03, 0.5, 0.002, 0.01, 0.3);
    },
    // a drone going down: its rotors spinning down, the crash
    crash(s, sr) {
      const f = svf(sr);
      let ph = 0;
      for (let i = 0; i < floor(0.36 * sr); i++) { const t = i / sr; ph += (1400 - 1000 * (t / 0.36)) / sr; s[i] = (tanh(3 * sin(TAU * ph)) * 0.3 + f(n1(), 2000, 0.5) * (0.5 + 0.5 * sin(TAU * 140 * t))) * min(1, t / 0.02) * 0.6; }
      burst(s, sr, 0.36, 1800, 0.6, 18, 1.0);
      ring(s, sr, 0.36, 830, PLATE, 14, 0.4);
      return grains(s, sr, 40, 0.38, 0.9, 0.002, 0.01, 0.3);
    },
    // a mech going down: the hydraulics' groan, a heavy crash of steel, hissing lines
    wreck(s, sr) {
      const lo = lpN(), hs = lpN();
      let ph = 0;
      for (let i = 0; i < s.length; i++) {
        const t = i / sr;
        if (t < 0.42) { ph += (90 - 45 * (t / 0.42)) / sr; s[i] = lo(0.2) * 0.2 + tanh(2 * sin(TAU * ph)) * 0.35 * min(1, t / 0.05); }
        else { const u = t - 0.42; const x = n1(); s[i] = (x - hs(0.3)) * (u > 0.1 ? exp(-(u - 0.1) * 2.5) * 0.25 : 0); }
      }
      thud(s, sr, 0.42, 45, 7, 1.4);
      ring(s, sr, 0.42, 210, [[1, 1], [2.67, 0.7], [5.38, 0.4]], 3, 0.4);
      return grains(s, sr, 60, 0.44, 1.3, 0.003, 0.015, 0.35);
    },
    // footsteps: a boot on asphalt (a dull scuff), on concrete (crisp), on rubble (a crunch), in a gutted
    // building (rubble and broken glass; the brick ruin crunches like rubble), on grating (a clang), in the flood (a wade)
    boot(s, sr) {
      const lo = lpN();
      burst(s, sr, 0, rr(380, 620), 0.7, 55, 1.0);
      for (let i = 0; i < s.length; i++) { const t = i / sr; s[i] += lo(0.25) * exp(-t * 30) * 0.6 * min(1, t / 0.01); }
      return s;
    },
    heel(s, sr) {
      for (let i = 0; i < s.length; i++) s[i] = n1() * exp(-(i / sr) * 900) * 0.8;
      return burst(s, sr, 0, rr(900, 1400), 0.5, 70, 1.0);
    },
    grit(s, sr) {
      thud(s, sr, 0, 110, 50, 0.6);
      burst(s, sr, 0, 700, 0.8, 40, 0.5);
      return grains(s, sr, 18, 0, 0.12, 0.002, 0.008, 0.6);
    },
    glass(s, sr) {
      thud(s, sr, 0, 110, 50, 0.5);
      grains(s, sr, 14, 0, 0.1, 0.002, 0.008, 0.5);
      for (let k = 0; k < 3; k++) ring(s, sr, rr(0.01, 0.12), rr(3000, 6000), [[1, 1], [2.1, 0.4]], 70, 0.25);
      return s;
    },
    clang(s, sr) {
      burst(s, sr, 0, 500, 0.6, 80, 0.7);
      ring(s, sr, 0, rr(320, 420), PLATE, 18, 0.55);

    click(s, sr) { for (let i = 0; i < s.length; i++) { const t = i / sr; s[i] = sin(TAU * 2600 * t) * exp(-t * 120); } return s; },
    select(s, sr) { let ph = 0; for (let i = 0; i < s.length; i++) { const t = i / sr; ph += (1500 + 9000 * t) / sr; s[i] = sin(TAU * ph) * min(1, t / 0.004) * exp(-t * 30); } return s; },

<script>
/* The game's audio, on the audio engine (MA.Mixer, MA.Spatial) with the content's sound set (TC.audio:
   banks, mix, cue table, ambience; src/audio/sfx.js, with the contract in ARCHITECTURE.md, "Audio").
   Buses: Sfx (a short room) for the battle, Ui (dry) for the interface, Ambience (a long room) for the
   city's loops.
   The view names what happens as cues at world points (view/playback.js: "shot.rail", "impact.cover",
   "blast.grenade", "step.mech", "down.drone"...); the app passes them here with the camera every frame.
     cue(name, p, o)   plays the cue's sound at world point p (null: not placed, on Ui); o.db, o.pitch
     unlock()          browsers start audio only after a touch or a key
     setEnabled(on)    mute (remembered in the browser)
     update(listener)  { vp, zoom, aspect } of the view: placement follows the camera
     stats()           for the checks: ready, samples, cues heard and played, unknown cues */
(function () {
  const G = (window.TG = window.TG || {}), MA = window.MA;
  const SOUND_KEY = "tactics.sound";
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  class Audio {
    // banks: MA.renderBanks' promise started at boot (else the mixer renders TC.audio.banks itself);
    // o.mood: the look's mood (TC.look.mood), which picks the ambience when it is given per mood
    constructor(set, banks, o = {}) {
      this.set = set || {}; this.mood = o.mood; this.cues = this.set.cues || {}; this.heard = 0; this.unknown = new Set(); this.ready = false;
      let saved = "1";
      try { saved = localStorage.getItem(SOUND_KEY) ?? "1"; } catch (e) { /* storage blocked */ }
      this.enabled = saved !== "0";
      try { this.mixer = new MA.Mixer(); } catch (e) { MA.log("WARN no WebAudio:", e.message); this.mixer = null; return; }
      const m = this.mixer;
      m.master.gain.value = this.enabled ? 1 : 0;
      const sfx = m.verbBus(0.9, 3, 0.6, 0.1), amb = m.verbBus(2.4, 2, 0.8, 0.3), ui = m.gain();
      sfx.out.connect(m.master); amb.out.connect(m.master); ui.connect(m.master);
      m.addBus("Sfx", sfx.input); m.addBus("Ambience", amb.input); m.addBus("Ui", ui);
      this.mix = Object.assign({}, this.set.mix);
      this.sp = new MA.Spatial(m, { bus: "Sfx", mix: this.mix, protect: new Set(this.set.protect || []), voices: 32 });
      m.load(banks || this.set.banks || []).then(() => this.start()).catch((e) => MA.err("AUDIO", e.stack || e.message));
    }
    start() {
      const m = this.mixer;
      // takes: a sound with no sample of its own plays one of name_0, name_1...; every sound gets a mix line
      this.takes = {};
      for (const name of Object.keys(m.samples)) {
        const t = /^(.*)_\d$/.exec(name), base = t ? t[1] : name;
        if (t) (this.takes[base] = this.takes[base] || []).push(name);
        if (!this.mix[base]) this.mix[base] = [-18, 0.05, 30];
      }
      // ambience: one list for every mood, or { mood: [...] } (else its "default", else its first)
      const a = this.set.ambience || [], beds = Array.isArray(a) ? a : a[this.mood] || a.default || Object.values(a)[0] || [];
      this.loops = beds.map((b) => m.voice(b.s, "Ambience", b.db ?? -26, 1, 0, null, true, Math.random() * 3)).filter(Boolean);
      this.readyAt = Math.round(performance.now()); this.ready = true;
    }
    // the cue's entry, else its parent's ("shot.rail" -> "shot"); undefined when none
    entry(name) {
      for (let n = name; ; n = n.slice(0, n.lastIndexOf("."))) {
        if (n in this.cues) return this.cues[n];
        if (n.indexOf(".") < 0) return undefined;
      }
    }
    sound(s) {
      const name = Array.isArray(s) ? pick(s) : s;
      return this.mixer.samples[name] ? name : this.takes[name] ? pick(this.takes[name]) : null;
    }
    cue(name, p, o = {}) {
      this.heard++;
      if (!this.ready) return;
      const e = this.entry(name);
      if (e === undefined) { this.unknown.add(name); return; }
      if (e === null) return;
      const spec = typeof e === "object" && !Array.isArray(e) ? e : { s: e }, s = this.sound(spec.s);
      if (!s) { this.unknown.add(name); return; }
      const db = (spec.db || 0) + (o.db || 0), pitch = (spec.pitch || 1) * (o.pitch || 1);
      if (p) this.sp.play(s, p, db, pitch);
      else {
        const t = /^(.*)_\d$/.exec(s), mix = this.mix[t ? t[1] : s];
        if (this.mixer.voice(s, "Ui", mix[0] + db, pitch * (1 + (Math.random() * 2 - 1) * mix[1]))) this.sp.played++;
      }
    }
    unlock() { if (this.mixer) this.mixer.resume(); }
    setEnabled(on, remember = false) {
      this.enabled = on;
      if (this.mixer) this.mixer.setMuted(!on);
      if (remember) try { localStorage.setItem(SOUND_KEY, on ? "1" : "0"); } catch (e) { /* storage blocked */ }
    }
    toggle() { this.setEnabled(!this.enabled, true); if (this.enabled) this.unlock(); return this.enabled; }
    update(listener) {
      if (!this.ready || !listener) return;
      this.sp.listen(listener.vp, listener.zoom, listener.aspect);
      this.sp.update();
    }
    stats() {
      const m = this.mixer;
      if (!m) return null;
      return { ready: this.ready, readyAt: this.readyAt, state: m.ctx.state, samples: Object.keys(m.samples).length, renderMs: m.renderMs, worker: m.worker, heard: this.heard, played: this.sp.played, loops: (this.loops || []).length, unknown: [...this.unknown] };
    }
  }
  G.Audio = Audio;
})();

<script>
/* The player's commands and the AI's turns: the one place outside the rules that changes the battle. It
   turns clicks, hovers and keys into battle actions for the player's team(s), lets TG.AI play the others,
   and tells the view what to show (the selected unit, the move range and path, the targets, the shot
   preview) through view.set*. It acts only when the playback is idle, so the screen always shows the
   battle as it is when the player decides.
     new Input(battle, { player: [teams], view: { units, stage, playback, hud, R } })
     hover(tile, unitId), click(tile, unitId), action(id), key(e), update(dt) */
(function () {
  const ME = window.ME, G = (window.TG = window.TG || {}), D = G.Defs;

  class Input {
    constructor(battle, o) {
      this.b = battle; this.player = o.player; this.view = o.view;
      this.ai = [0, 1].map((t) => (o.player.includes(t) ? null : new G.AI(battle, t)));
      this.sel = -1; this.mode = "move"; this.tile = null; this.unitId = -1;
      this.dirty = true; this.aiWait = 0; this.aiPace = o.aiPace ?? 0.35; this.reachKey = ""; this.reach = null;
      this.paused = false;
    }
    get myTurn() { return !this.b.over && this.player.includes(this.b.team); }
    get ready() { return this.view.playback.idle && !this.paused; }
    unit(id) { return id >= 0 ? this.b.units[id] : null; }
    selUnit() { const u = this.unit(this.sel); return u && u.alive ? u : null; }

    // ---------------------------------------------------------------- pointer and keys
    hover(tile, unitId) {
      const k = (tile ? tile.join(",") : "-") + ":" + unitId, was = (this.tile ? this.tile.join(",") : "-") + ":" + this.unitId;
      this.tile = tile; this.unitId = unitId;
      if (k !== was) this.dirty = true;
    }
    click(tile, unitId) {
      if (!this.ready || !this.myTurn) return;
      const b = this.b, u = this.selUnit(), t = this.unit(unitId);
      // an own unit: select it (or, for a heal, the patient)
      if (t && t.team === b.team && !(u && this.mode === "ability" && b.ability(u).kind === "heal")) { this.select(t.id); return; }
      if (!u || !b.canAct(u)) { this.dirty = true; return; }
      const A = b.ability(u);
      if (this.mode === "ability") {
        const target = A.kind === "area" ? tile : t;
        if (target && b.abilityCheck(u, target) === "") { b.useAbility(u, target); this.after(); }
        else this.cancel();
        return;
      }
      if (t && t.team !== u.team) {
        if (b.shotInfo(u, t).ok && u.ammo > 0) { b.shoot(u, t); this.after(); }
        return;
      }
      if (this.mode === "shoot") { this.cancel(); return; }
      if (tile && b.move(u, tile[0], tile[1])) this.after();
    }
    action(id) {
      const b = this.b, u = this.selUnit();
      if (id === "next") { this.nextUnit(); return; }
      if (!this.ready || !this.myTurn) return;
      if (id === "end") { b.endTurn(); this.sel = -1; this.mode = "move"; this.dirty = true; return; }
      if (!u || !b.canAct(u) || this.why(id)) return;
      if (id === "shoot") { this.mode = this.mode === "shoot" ? "move" : "shoot"; this.dirty = true; return; }
      if (id === "overwatch") { b.overwatchOn(u); this.after(); return; }
      if (id === "reload") { b.reload(u); this.after(); return; }
      if (id === "ability") {
        const A = b.ability(u);
        if (A.kind === "hunker") { b.useAbility(u); this.after(); return; }
        this.mode = this.mode === "ability" ? "move" : "ability"; this.dirty = true;
      }
    }
    key(e) {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const d = ME.keys.digit(e);
      if (d >= 1 && d <= 4) this.action(["shoot", "overwatch", "reload", "ability"][d - 1]);
      else if (e.key === "Tab") { e.preventDefault(); this.action("next"); }
      else if (e.key === "Enter") this.action("end");
      else if (e.key === "Escape") this.cancel();
    }
    // why an action is not available now ("" when it is)
    why(id) {
      const b = this.b, u = this.selUnit();

      const avg = (a) => +(a.reduce((p, q) => p + q, 0) / Math.max(1, a.length)).toFixed(3);
      // the rules' eye heights (what the rules-only sim plays) must be the art's (what the game plays)
      const eyes = Object.keys(G.Defs.UNITS).filter((k) => TC.units && TC.units[k] && TC.units[k].eye !== G.Defs.UNITS[k].eye).map((k) => k + " " + TC.units[k].eye + " (rules " + G.Defs.UNITS[k].eye + ")");
      const out = {
        // (ok also needs the version to be semver: src/version.js)
        ok: ME.errors.length === 0 && !(audio && audio.unknown.size) && !eyes.length && /^\d+\.\d+\.\d+$/.test(G.VERSION.v) && (selftest ? script.moved && !!script.second && script.ended : battle.over), version: G.VERSION.label, script: selftest ? script : undefined, density, adapter: gpu.info, canvas: [canvas.width, canvas.height], render: R.size, bakeMs, models: MB.stats,
        frames, avgFrameIntervalMs: avg(ints.slice(5)), avgCpuMs: avg(cpus.slice(5)), gpuMs: R.gpuMs,
        battle: { seed: battle.seed, over: battle.over, winner: battle.winner, round: battle.round, team: battle.team, left: [battle.living(0).length, battle.living(1).length], stats: battle.stats, events: playback.played, queued: playback.queue.length },
        view: { sprites: R.sprites.nAdd + R.sprites.nAlpha, volumes: sim.count, looseVoxels: phys.spawned, carved: phys.carvedTotal },
        audio: audio ? audio.stats() : null, eyes,
        errors: ME.errors,
      };
      if (match) ME.log("MATCH", JSON.stringify(out.battle));
      report(out);
      document.title = (match ? "MATCH" : "SELFTEST") + " DONE";
      return;
    }
    const loop = () => { step(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } catch (e) {
    ME.err("BOOT", e.stack || e.message);
    const l = document.getElementById("loading");
    l.style.display = "";
    l.innerHTML = `<div class="fail">${(e.message || String(e)).replace(/</g, "&lt;")}${navigator.gpu ? "" : "<small>This browser has no WebGPU. Try Chrome or Edge on desktop, or Safari 18+ with WebGPU enabled.</small>"}<small>${G.VERSION ? G.VERSION.name + " " + G.VERSION.label : "version unknown"}</small></div>`;
    report({ ok: false, error: e.message, version: G.VERSION ? G.VERSION.label : null, errors: ME.errors });
  }
})();

</script>
