<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mossheart Voxel Studio</title>
<style>
  :root { --bg: #0b0d09; --panel: #12150f; --panel2: #181c14; --fg: #e9e4cf; --dim: #9a967f; --acc: #e0b25c; --acc2: #8cc84a; --line: rgba(233, 228, 207, 0.12); --warn: #ff9b7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button, select, input { font: inherit; color: var(--fg); background: #1d2118; border: 1px solid var(--line); border-radius: 6px; }
  button { padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--acc); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.on { background: #3a3220; border-color: var(--acc); color: #ffe7b0; }
  button.pri { background: #33401f; border-color: #6f9a3a; }
  button.warn { color: var(--warn); }
  input, select { padding: 3px 6px; min-width: 0; }
  input[type=range] { padding: 0; accent-color: var(--acc); }
  input[type=color] { padding: 0 2px; height: 26px; }
  #app { display: grid; grid-template-columns: 240px 1fr 360px; grid-template-rows: 46px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 650; letter-spacing: 0.03em; color: var(--acc); }
  header .brand small { color: var(--dim); font-weight: 400; margin-left: 4px; }
  header .ttl { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; margin-left: 10px; }
  #title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subtitle { color: var(--dim); font-size: 11px; }
  header .sp { flex: 1; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside .top { padding: 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
  aside .top .row { display: flex; gap: 6px; }
  aside .top .row button { flex: 1; }
  #lib { overflow-y: auto; flex: 1; padding: 4px 0 20px; }
  .gh { padding: 7px 10px 4px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; user-select: none; }
  .gh em, .it em { float: right; font-style: normal; color: var(--dim); font-size: 10px; margin-left: 6px; }
  .it { padding: 3px 10px 3px 22px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it:hover { background: var(--panel2); }
  .it.on { background: #2a2a1a; color: #ffe7b0; box-shadow: inset 3px 0 var(--acc); }
  .empty { padding: 2px 22px 6px; color: var(--dim); font-size: 12px; }
  main { position: relative; min-width: 0; min-height: 0; }
  #cv, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cv { touch-action: none; }
  #ov { pointer-events: none; }
  #tools { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; align-items: center; background: rgba(18, 21, 15, 0.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px; backdrop-filter: blur(4px); }
  #tools .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  #tools .cur { display: flex; align-items: center; gap: 6px; padding-right: 6px; color: var(--dim); }
  #status { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 11px ui-monospace, Consolas, monospace; color: var(--dim); pointer-events: none; padding-left: 64px; }
  #status .warn { color: var(--warn); }
  #timeline { position: absolute; right: 10px; top: 10px; display: none; gap: 8px; align-items: center; background: rgba(18, 21, 15, 0.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  #timeline input { width: 120px; }
  #flabel { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); }
  #side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #tabs { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); }
  #tabs button { border-radius: 6px 6px 0 0; border-bottom: none; flex: 1; padding: 5px 4px; font-size: 12px; }
  #panel { overflow-y: auto; flex: 1; padding: 0 10px 30px; }
  section { border-bottom: 1px solid var(--line); padding: 10px 0; }
  section h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--acc); font-weight: 600; }
  .dim { color: var(--dim); font-size: 12px; margin: 6px 0; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .row.wrap { flex-wrap: wrap; }
  .f { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: center; margin: 3px 0; }
  .f.mat { grid-template-columns: 92px auto 1fr; }
  .f label { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scrub { cursor: ew-resize; user-select: none; }
  .scrub:hover { color: var(--acc); }
  .vec { display: grid; grid-template-columns: 62px 1fr 1fr 1fr; gap: 4px; align-items: center; margin: 3px 0; }
  .vec .vl { color: var(--dim); font-size: 12px; }
  .vec .f { grid-template-columns: 12px 1fr; gap: 2px; margin: 0; }
  .vec input { width: 100%; padding: 3px 3px; }
  .chk { display: inline-flex; gap: 6px; align-items: center; margin: 3px 10px 3px 0; color: var(--fg); font-size: 12px; }
  .sw { display: inline-flex; height: 14px; border-radius: 3px; overflow: hidden; vertical-align: middle; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4); flex: none; }
  .sw i { display: block; width: 7px; height: 100%; }
  .big .sw { height: 22px; } .big .sw i { width: 18px; }
  .prims { max-height: 260px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .pr { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .pr:hover { background: var(--panel2); }
  .pr.on { background: #3a3220; }
  .pr.off { opacity: 0.45; }
  .pr b { color: var(--acc); font-weight: 600; width: 10px; }
  .pr em { font-style: normal; font-size: 10px; color: var(--acc2); }
  .pr .eye { margin-left: auto; color: var(--dim); }
  .mlist { max-height: 220px; overflow-y: auto; }
  .mrow { display: flex; gap: 8px; align-items: center; padding: 2px 4px; cursor: pointer; border-radius: 4px; }
  .mrow:hover { background: var(--panel2); }
  .mrow.on { background: #3a3220; }
  .mrow em { font-style: normal; font-size: 10px; color: var(--acc2); margin-left: auto; }
  .rule { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; margin: 6px 0; }
  .rule .f { grid-template-columns: 70px 1fr; }
  .rule .f.mat { grid-template-columns: 0 auto 1fr; } .rule .f.mat label { display: none; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; margin: 6px 0; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: #2a2a1a; border: 1px solid var(--acc); color: #ffe7b0; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 5; max-width: 80vw; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #fail { display: none; position: fixed; inset: 0; place-items: center; background: var(--bg); color: var(--warn); white-space: pre-wrap; padding: 20px; }
  body.failed #fail { display: grid; }
  #log, #result { display: none; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 46px 55vh auto auto; height: auto; min-height: 100vh; }
    html, body { overflow: auto; }
    aside { max-height: 34vh; border-right: none; border-bottom: 1px solid var(--line); order: 3; }
    main { order: 2; }
    #side { order: 4; border-left: none; }
    header .brand small, #b-preview, #b-fork { display: none; }
    #tools { flex-wrap: wrap; right: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">Mossheart <small>Voxel Studio</small></span>
    <div class="ttl"><span id="title"></span><span id="subtitle"></span></div>
    <span class="sp"></span>
    <button id="b-undo" title="Undo (Ctrl+Z)">↶</button><button id="b-redo" title="Redo (Ctrl+Y)">↷</button>
    <button id="b-fork" title="make an editable copy of this library model">Fork</button>
    <button id="b-save" data-doc title="Save to the studio library (Ctrl+S)">Save</button>
    <button id="b-preview" data-doc title="Open the engine with this asset (?gallery=studio)">Preview in engine</button>
  </header>
  <aside>
    <div class="top">
      <div class="row"><button id="b-new" class="pri">New asset</button><button id="b-open" title=".json / .js asset or MagicaVoxel .vox">Import…</button></div>
      <input id="search" placeholder="search models">
    </div>
    <div id="lib"></div>
  </aside>
  <main>
    <canvas id="cv"></canvas><canvas id="ov"></canvas>
    <div id="tools"></div>
    <div id="timeline"><button id="play">▶</button><input id="frame" type="range" min="0" max="0" value="0"><span id="flabel"></span></div>
    <div id="status"></div>
  </main>
  <div id="side"><div id="tabs"></div><div id="panel"></div></div>
</div>
<div id="toast"></div>
<div id="fail"></div>
<pre id="log"></pre>
<pre id="result"></pre>
<!-- Mossheart generator (vendored): models, styles, ramps. SVK records which script defined which models. -->
<script src="../vendor/gen/px.js"></script>
<script src="../vendor/gen/px3.js"></script>
<script src="../vendor/gen/models.js"></script>
<script src="../vendor/gen/styles.js"></script>
<script src="../vendor/gen/models2.js"></script>
<script src="../vendor/gen/models3.js"></script>
<script src="../vendor/gen/styles2.js"></script>
<script src="../vendor/gen/styles3.js"></script>
<script src="../vendor/gen/styles4.js"></script>
<script src="../vendor/gen/styles5.js"></script>
<script>window.SVK = []; window.SVK._seen = new Set(); window.SVK.mark = (label) => { const k = Object.keys(window.MODELS).filter((n) => !SVK._seen.has(n)); k.forEach((n) => SVK._seen.add(n)); SVK.push([label, k]); }; SVK.mark("Generator models");</script>
<!-- engine pieces the bake needs (no WebGPU renderer) -->
<script src="../src/me.js"></script>
<script src="../src/sdf.js"></script>
<script src="../src/reduce.js"></script>
<!-- ?game=<a folder under games/>: that game's art in place of Momiji's content and asset set (live mode,
     studio/live.js). Its content/manifest.js sets window.STUDIO_GAME = { files, style(q) }: the files load
     from the game's folder, in order, and style(q) gives the page's palette. Scripts written here run in
     order, before the next tag. -->
<script>
  window.STUDIO_LOAD = (function () {
    const g = new URLSearchParams(location.search).get("game") || "";
    if (g && !/^[A-Za-z0-9_-]+$/.test(g)) throw new Error("?game= must name a folder under games/ (got " + JSON.stringify(g) + ")");
    const put = (src) => document.write('<script src="' + src + '"><\/script>');
    return { game: g, base: g ? "../../" + g + "/" : "", put, own: (srcs) => { if (!g) srcs.forEach(put); } };
  })();
</script>
<!-- Momiji Valley content (ME.content): lighting classes, model sizes, flipbooks, critter models -->
<script>STUDIO_LOAD.own(["../content/momiji.js", "../content/garden-map.js", "../content/critter-models.js"]);</script>
<script>SVK.mark("Critters & lanterns");</script>
<script src="../src/palette.js"></script>
<script src="../src/bake-terrain.js"></script>
<script src="../src/bake-models.js"></script>
<script>STUDIO_LOAD.own(["../assets/asset-kit.js", "../assets/assets-mockups.js", "../assets/asset-set.js"]);</script>
<script>SVK.mark("Asset models");</script>
<script src="../src/asset-format.js"></script>
<script>STUDIO_LOAD.own(["../assets/pack.js"]);</script>
<script>SVK.mark("Asset pack");</script>
<!-- the game's files (?game=) -->
<script>if (STUDIO_LOAD.game) STUDIO_LOAD.put(STUDIO_LOAD.base + "content/manifest.js");</script>
<script>
  if (STUDIO_LOAD.game) {
    if (!window.STUDIO_GAME) throw new Error("games/" + STUDIO_LOAD.game + "/content/manifest.js sets no window.STUDIO_GAME");
    STUDIO_GAME.files.forEach((f) => STUDIO_LOAD.put(STUDIO_LOAD.base + f));
  }
</script>
<script>if (STUDIO_LOAD.game) SVK.mark("Game models");</script>
<!-- studio -->
<script src="io.js"></script>
<script src="view.js"></script>
<script src="live.js"></script>
<script src="studio.js"></script>
<script src="feed.js"></script>
</body>
</html>
