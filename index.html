<script>/* ../MossheartEngine/content/critters.js */
/* Ambient wildlife: butterflies, dragonflies, bees, songbirds, squirrels, frogs, koi, bunnies, snails,
   beetles and lantern moths. Each is a small state machine over the baked scene: ground heights from the
   voxel grid, perches on the tree volumes' crowns (found in the model bricks, and swaying with the tree),
   the pond and streams, and the lanterns. Ground critters scatter when a walker (or anything an app
   marks with sim.avoid) comes close. It is an instance layer of the sim (sim.layers); splashes and dips
   are queued as water ripples (layer.ripples) for the renderer's ring waves. */
(function () {
  const ME = window.ME, TAU = Math.PI * 2;
  const COUNTS = { butterfly: 5, dragonfly: 2, bee: 3, bird: 5, squirrel: 2, frog: 3, koi: 4, bunny: 2, snail: 2, beetle: 2, moth: 4 }; // 34 (v0.1: 45)
  const TREES = new Set(["niwaki", "maple", "pine", "cedar"]);
  const lerp = (a, b, u) => a + (b - a) * u, ease = (u) => u * u * (3 - 2 * u), clamp01 = (u) => Math.max(0, Math.min(1, u));
  const frame = (fr, rate, t, ph = 0) => fr[Math.floor((((t * rate + ph) % 1) + 1) % 1 * fr.length) % fr.length];

  class Critters {
    constructor(T, st, MB, lights) {
      this.T = T; this.MB = MB; this.F = MB.critterFrames; this.map = st.map; this.ripples = [];
      let seed = 0x2f6b9e1;
      this.rnd = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const map = this.map, { C, RI } = T.geo, inIsland = (x, y) => Math.hypot(x - C, y - C) < RI - 0.7;
      this.cells = { m: [], u: [] };
      for (let y = 0; y < map.H; y++) for (let x = 0; x < map.W; x++) { const t = map.typ[y][x]; if (this.cells[t] && inIsland(x + 0.5, y + 0.5)) this.cells[t].push([x, y]); }
      // trees and their crown perches (top voxel of the volume at sampled offsets)
      this.trees = MB.statics.filter((s) => TREES.has(s.place.name)).map((s) => ({ s, X: s.place.X, Y: s.place.Y, Z: s.place.Z, h: MB.models[s.frames[0]].h, r: MB.models[s.frames[0]].r }));
      this.perches = [];
      for (const tr of this.trees) {
        let n = 0;
        for (let k = 0; k < 40 && n < 6; k++) {
          const a = this.rnd() * TAU, d = Math.sqrt(this.rnd()) * tr.r * 0.75, dx = Math.cos(a) * d, dy = Math.sin(a) * d, z = this.crownTop(tr.s, dx, dy);
          if (z !== null && z > tr.Z + tr.h * 0.45) { this.perches.push({ x: tr.X + dx, y: tr.Y + dy, z, tree: tr }); n++; }
        }
      }
      // water: all wet tiles for dragonflies; the deep still ones are the pond (koi); banks are moss beside water
      this.wet = T.water.map((w) => ({ x: w.x, y: w.y, z: w.z, bed: T.groundAt(w.x + 0.5, w.y + 0.5, w.z), stream: w.stream }));
      this.pond = this.wet.filter((w) => !w.stream && w.z - w.bed > 0.25);
      const wetAt = new Map(this.wet.map((w) => [w.x + "," + w.y, w]));
      this.wetAt = (x, y) => wetAt.get(Math.floor(x) + "," + Math.floor(y));
      this.banks = [];
      for (const [x, y] of this.cells.m) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const w = wetAt.get(x + dx + "," + (y + dy));
        if (w && Math.abs(w.z - map.hgt[y][x] * 0.5) < 0.6) this.banks.push({ x: x + 0.5 + dx * 0.32, y: y + 0.5 + dy * 0.32, wx: x + 0.5 + dx * 0.85, wy: y + 0.5 + dy * 0.85, w });
      }
      this.lamps = lights.filter((l) => l.mat === "glow" || l.mat === "lanternPaper" || l.mat === "candle");
      this.sunny = T.beams.map((b) => [b.x, b.y]);
      this.agents = [];
      for (const kind in COUNTS) for (let k = 0; k < COUNTS[kind]; k++) this.agents.push({ kind, k, ph: this.rnd(), seed: this.rnd() });
      this.lastT = null;
    }

    // world z of the top voxel of a static volume at local offset (dx, dy), or null
    crownTop(s, dx, dy) {
      const MB = this.MB, m = MB.models[s.frames[0]], VS = this.T.VS, p = s.place;
      const [lx, ly] = p.flip ? [dy, dx] : [dx, dy], ix = Math.floor(lx * VS) - m.box[0], iy = Math.floor(ly * VS) - m.box[1];
      if (ix < 0 || iy < 0 || ix >= m.dims[0] || iy >= m.dims[1]) return null;
      for (let z = m.dims[2] - 1; z >= 0; z--) if (MB.voxel(s.frames[0], ix, iy, z)) return p.Z + (m.box[2] + z + 1) / VS;
      return null;
    }
    hgt(x, y) { const cx = Math.floor(x), cy = Math.floor(y); return cx < 0 || cy < 0 || cx >= this.map.W || cy >= this.map.H ? -9 : this.map.hgt[cy][cx]; }
    typ(x, y) { const cx = Math.floor(x), cy = Math.floor(y); return cx < 0 || cy < 0 || cx >= this.map.W || cy >= this.map.H ? "_" : this.map.typ[cy][cx]; }
    gz(x, y) { return this.T.groundAt(x, y, this.hgt(x, y) * 0.5 + 0.6); }
    // a ground point near (x, y): same terrace, on moss (or lanes), clear of tree trunks, straight path
    spot(x, y, r0, r1, lanes) {
      const h = this.hgt(x, y), ok = (px, py) => { const t = this.typ(px, py); return (t === "m" || (lanes && t === "u")) && this.hgt(px, py) === h && Math.hypot(px - this.T.geo.C, py - this.T.geo.C) < this.T.geo.RI - 0.6; };
      for (let k = 0; k < 14; k++) {
        const a = this.rnd() * TAU, d = lerp(r0, r1, this.rnd()), px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
        if (!ok(px, py) || !ok((x + px) / 2, (y + py) / 2) || this.trees.some((t) => Math.hypot(t.X - px, t.Y - py) < 0.3)) continue;
        return [px, py, this.gz(px, py)];
      }
      return null;
    }
    anyMoss() { const c = this.cells.m[Math.floor(this.rnd() * this.cells.m.length)]; return [c[0] + 0.15 + this.rnd() * 0.7, c[1] + 0.15 + this.rnd() * 0.7]; }
    wetPoint(w) { return [w.x + 0.15 + this.rnd() * 0.7, w.y + 0.15 + this.rnd() * 0.7]; }
    threat(a, R) {
      const W = this.wpos;
      for (let i = 0; i < this.wn; i++) if (Math.abs(W[i * 2] - a.x) < R && Math.abs(W[i * 2 + 1] - a.y) < R && Math.hypot(W[i * 2] - a.x, W[i * 2 + 1] - a.y) < R) return [W[i * 2], W[i * 2 + 1]];
      return null;
    }
    ripple(x, y, t, amp) { this.ripples.push({ x, y, t, amp }); if (this.ripples.length > 64) this.ripples.shift(); }
    // start a timed move from the current position
    go(a, state, to, t, dur, extra) { Object.assign(a, { state, from: [a.x, a.y, a.z], to, t0: t, end: t + dur }, extra || {}); if (to && (to[0] !== a.x || to[1] !== a.y)) a.yaw = Math.atan2(to[1] - a.y, to[0] - a.x); }
    wait(a, state, t, dur, extra) { Object.assign(a, { state, t0: t, end: t + dur }, extra || {}); }

    // ---- per-kind behaviour: init places the agent, decide picks the next state when one ends,
    //      pose(a, t, dt) sets x,y,z,yaw,pitch and the model frame mi (or a.hide)
    init(a, t) {
      const R = this.rnd;
      a.yaw = R() * TAU; a.pitch = 0; a.hide = false;
      const place = (p) => { a.x = p[0]; a.y = p[1]; a.z = this.gz(p[0], p[1]); };
      switch (a.kind) {
        case "butterfly": {
          const s = this.sunny.length && a.k % 2 === 0 ? this.sunny[a.k % this.sunny.length] : this.anyMoss();
          a.home = this.spot(s[0], s[1], 0, 1.2) || [...this.anyMoss()];
          place(a.home); a.fr = this.F[["butterflyOrange", "butterflyBlue", "butterflyYellow"][a.k % 3]];
          this.go(a, "fly", null, t, 0);
          break;
        }
        case "dragonfly": { if (!this.wet.length) { a.dead = a.hide = true; break; } const w = this.wet[Math.floor(R() * this.wet.length)], p = this.wetPoint(w); a.x = p[0]; a.y = p[1]; a.z = w.z + 0.3; this.wait(a, "hover", t, R()); break; }
        case "bee": { const f = MB_FERNS(this) || this.anyMoss(); a.h0 = a.h1 = [f[0], f[1]]; a.t0 = t; a.trav = 1; a.end = t + 6 + R() * 8; a.x = f[0]; a.y = f[1]; a.z = this.gz(f[0], f[1]) + 0.3; a.state = "buzz"; break; }
        case "bird": {
          a.col = a.k % 3 === 2 ? "tit" : "robin";
          if (a.k % 3 === 1 && this.perches.length) { const p = this.perches[Math.floor(R() * this.perches.length)]; a.perch = p; a.x = p.x; a.y = p.y; a.z = p.z; this.wait(a, "perch", t, 2 + R() * 6); }
          else { place(this.anyMoss()); this.wait(a, "stand", t, R() * 1.5); }
          break;
        }
        case "squirrel": { if (!this.trees.length) { a.dead = a.hide = true; break; } a.tree = this.trees[a.k % this.trees.length]; place(this.spot(a.tree.X, a.tree.Y, 0.5, 1.6) || this.anyMoss()); this.wait(a, "sit", t, 0.5 + R() * 2); break; }
        case "frog": { const b = this.banks[Math.floor(R() * this.banks.length)]; if (!b) { a.hide = true; a.dead = true; break; } a.bank = b; place([b.x, b.y]); a.yaw = Math.atan2(b.wy - b.y, b.wx - b.x); this.wait(a, "sit", t, 1 + R() * 4); break; }
        case "koi": {
          if (!this.pond.length) { a.dead = a.hide = true; break; }
          const w = this.pond[Math.floor(R() * this.pond.length)], p = this.wetPoint(w);
          Object.assign(a, { x: p[0], y: p[1], w, speed: 0.2 + R() * 0.12, cyc: R(), nextJump: t + 6 + R() * 18, fr: this.F[["koiKohaku", "koiKohaku2", "koiOgon", "koiKohaku"][a.k % 4]] });
          a.z = this.koiZ(a.x, a.y); a.tgt = this.wetPoint(this.pond[Math.floor(R() * this.pond.length)]); a.state = "swim"; a.end = Infinity;
          break;
        }
        case "bunny": place(this.anyMoss()); this.wait(a, "sit", t, R() * 3); break;

    hopFrom(a, d) {

    birdDecide(a, t) {

      if (a.state === "perch") {

      }

      if (r < 0.8) { this.wait(a, "peck", t, 0.28 + R() * 0.2); return; }

    flyTo(a, to, t, perch) {

      this.go(a, "fly", to, t, 0.5 + d / 2.2, { perch, peak: Math.max(a.z, to[2]) + 0.35 + d * 0.18 });
    }

    squirrelDecide(a, t) {
      const R = this.rnd, tr = a.tree;
      switch (a.state) {
        case "run": this.wait(a, "sit", t, 1.2 + R() * 2.5); a.yaw += (R() - 0.5) * 1.5; return;
        case "toTree": {
          const z0 = a.z, top = tr.Z + Math.min(1.3, tr.h * 0.45);
          a.yaw = Math.atan2(tr.Y - a.y, tr.X - a.x);
          this.go(a, "climb", [a.x, a.y, top], t, (top - z0) / 0.9); a.yaw = Math.atan2(tr.Y - a.y, tr.X - a.x);

        }
        case "climb": this.wait(a, "hidden", t, 2 + R() * 4); return;
        case "hidden": { const g = this.gz(a.x, a.y); this.go(a, "descend", [a.x, a.y, g], t, (a.z - g) / 1.1); a.yaw = Math.atan2(a.y - tr.Y, a.x - tr.X); return; }
        case "descend": case "sit": default: {
          if (a.state === "sit" && R() < 0.22) return this.runToTree(a, t, 1.5);
          const p = this.spot(a.x, a.y, 0.8, 2.2) || this.spot(tr.X, tr.Y, 0.6, 1.8);
          if (p) { this.go(a, "run", p, t, Math.hypot(p[0] - a.x, p[1] - a.y) / 1.5); return; }
          this.wait(a, "sit", t, 1 + R() * 2);

      }
    }
    runToTree(a, t, speed) {
      const tr = a.tree, ang = Math.atan2(a.y - tr.Y, a.x - tr.X), bx = tr.X + Math.cos(ang) * 0.16, by = tr.Y + Math.sin(ang) * 0.16;
      this.go(a, "toTree", [bx, by, this.gz(bx, by)], t, Math.max(0.2, Math.hypot(bx - a.x, by - a.y) / speed));
    }

    koiZ(x, y) { const w = this.wetAt(x, y); return w ? Math.max(w.bed + 0.02, w.z - 0.17) : this.gz(x, y); }

    pose(a, t, dt) {
      const F = this.F, u = a.end > a.t0 ? clamp01((t - a.t0) / (a.end - a.t0)) : 1, mv = () => { if (!a.to) return; a.x = lerp(a.from[0], a.to[0], u); a.y = lerp(a.from[1], a.to[1], u); };
      a.pitch = 0;
      switch (a.kind) {
        case "butterfly": {
          if (a.state === "perch") { a.mi = frame(a.fr, 0.6, t, a.ph); break; }
          if (a.to) {
            const e = ease(u), px = -Math.sin(a.yaw), py = Math.cos(a.yaw), wob = Math.sin(u * Math.PI * 3 + a.ph * 9) * 0.1 * Math.sin(u * Math.PI);
            const g = ME.gust(a.x, a.y, t, this.windK) * 0.12;
            a.x = lerp(a.from[0], a.to[0], e) + px * wob + ME.WIND_DIR[0] * g; a.y = lerp(a.from[1], a.to[1], e) + py * wob + ME.WIND_DIR[1] * g;
            a.z = lerp(a.from[2], a.to[2], e) + Math.sin(u * Math.PI) * 0.15 + Math.sin(t * 9 + a.ph * 20) * 0.03;

        }
        case "dragonfly": {
          if (a.state === "dart") { const e = ease(u); a.x = lerp(a.from[0], a.to[0], e); a.y = lerp(a.from[1], a.to[1], e); a.z = lerp(a.from[2], a.to[2], e); }
          else if (a.state === "dip") { const s = Math.sin(u * Math.PI); a.z = lerp(a.from[2], a.to[2], s); if (u > 0.5 && !a.dipped) { a.dipped = true; this.ripple(a.x, a.y, t, 0.35); } if (u < 0.5) a.dipped = false; }
          a.mi = F.dragonfly[Math.floor(t * 28 + a.ph * 2) % 2];
          a.zOff = a.state === "hover" ? Math.sin(t * 5 + a.ph * 9) * 0.015 : 0;
          break;
        }
        case "bee": {
          const e = ease(clamp01((t - a.t0) / a.trav)), hx = lerp(a.h0[0], a.h1[0], e), hy = lerp(a.h0[1], a.h1[1], e), ph = a.ph * 20;
          const at = (s) => [hx + 0.32 * Math.sin(s * 0.9 + ph) + 0.1 * Math.sin(s * 4.3 + 2 * ph), hy + 0.28 * Math.sin(s * 1.17 + ph * 1.3) + 0.1 * Math.cos(s * 3.7 + ph)];
          const p = at(t), q = at(t + 0.05);

            const e = u, c = [(a.from[0] + a.to[0]) / 2, (a.from[1] + a.to[1]) / 2, a.peak], q = (i) => (1 - e) * (1 - e) * a.from[i] + 2 * (1 - e) * e * c[i] + e * e * a.to[i];

            a.pitch = Math.atan2(2 * ((1 - e) * (c[2] - a.from[2]) + e * (a.to[2] - c[2])), Math.max(0.3, Math.hypot(a.to[0] - a.from[0], a.to[1] - a.from[1]))) * 0.4;
            // bounding flight: a burst of beats, then a glide with the wings tucked
            a.mi = (t * 1.7 + a.ph) % 1 < 0.68 || u > 0.85 ? frame(B("Fly"), 7, t, a.ph) : B("Fly")[3];
          } else if (a.state === "perch") {
            const p = a.perch, sh = p.tree.s.wsh || [0, 0], dz = p.z - p.tree.Z;
            a.x = p.x + sh[0] * dz; a.y = p.y + sh[1] * dz; a.z = p.z; a.mi = B("Stand")[0];
          } else {
            if (a.state === "hop") { mv(); a.z = this.gz(a.x, a.y) + Math.sin(u * Math.PI) * 0.05; }

        }
        case "squirrel": {
          if (a.state === "run" || a.state === "toTree") { mv(); a.z = this.gz(a.x, a.y); a.mi = frame(F.squirrelRun, 4.5, t, a.ph); }
          else if (a.state === "climb" || a.state === "descend") { a.z = lerp(a.from[2], a.to[2], u); a.pitch = a.state === "climb" ? Math.PI / 2 : -Math.PI / 2; a.mi = frame(F.squirrelRun, 3.5, t, a.ph); }
          else if (a.state === "hidden") { a.pitch = Math.PI / 2; a.mi = F.squirrelRun[0]; }

        }
        case "frog": {

            a.pitch = Math.cos(u * Math.PI) * 1.0;
            if (!a.splash1 && u > 0.18) { a.splash1 = true; this.ripple(a.x, a.y, t, 0.8); }
            if (!a.splash2 && u > 0.84) { a.splash2 = true; this.ripple(a.x, a.y, t, 1.2); }
            a.mi = a.fr[1];
            break;
          }
          // steer toward a wandering target inside the pond
          const dx = a.tgt[0] - a.x, dy = a.tgt[1] - a.y;
          if (Math.hypot(dx, dy) < 0.25) a.tgt = this.wetPoint(this.pond[Math.floor(this.rnd() * this.pond.length)]);
          let da = Math.atan2(dy, dx) - a.yaw; da = Math.atan2(Math.sin(da), Math.cos(da));
          a.yaw += Math.max(-1.3 * dt, Math.min(1.3 * dt, da));
          const nx = a.x + Math.cos(a.yaw) * a.speed * dt, ny = a.y + Math.sin(a.yaw) * a.speed * dt, w = this.wetAt(nx, ny);
          if (w && !w.stream && w.z - w.bed > 0.2) { a.x = nx; a.y = ny; } else a.yaw += Math.PI * 0.5 * Math.sign(da || 1);
          a.z = lerp(a.z, this.koiZ(a.x, a.y), Math.min(1, dt * 2));
          a.cyc += dt * (1.2 + a.speed * 6);
          a.mi = a.fr[Math.floor((a.cyc % 1) * a.fr.length)];
          if (t > a.nextJump) {
            const L = 0.5, tx = a.x + Math.cos(a.yaw) * L, ty = a.y + Math.sin(a.yaw) * L, tw = this.wetAt(tx, ty);
            if (tw && !tw.stream) this.go(a, "jump", [tx, ty, this.koiZ(tx, ty)], t, 0.8, { splash1: false, splash2: false });
            else a.nextJump = t + 2;
          }

        }
        case "bunny": {
          if (a.state === "hop") { mv(); a.z = lerp(a.from[2], a.to[2], u) + Math.sin(u * Math.PI) * 0.09; a.mi = F.bunnyHop[Math.min(3, Math.floor(u * 4))]; }
          else { a.z = this.gz(a.x, a.y); a.mi = (t * 0.7 + a.ph) % 1 < 0.15 ? F.bunnySit[1] : F.bunnySit[0]; }

        }
        case "snail": case "beetle": {

          a.z = L.p[2] - 0.18 + 0.1 * Math.sin(t * 2.3 + ph); a.yaw = ang + Math.PI / 2;

    // the sim's instance layer hook (off with the renderer's critters setting)
    writeInstances(t, sim, i, opts) { return opts.critters ? this.update(t, sim, i, opts.wind ? opts.windK ?? 1 : 0) : i; }
    // Advance every critter to time t and append its instance to the sim.
    update(t, sim, i, windK) {

      const first = this.lastT === null;
      this.lastT = t; this.windK = windK; this.wpos = sim.wpos; this.wn = sim.wn;
      for (const a of this.agents) {

    flee(a, t) {

      } else if (a.kind === "squirrel" && (busy("sit") || busy("run"))) {

      } else if (a.kind === "frog" && busy("sit")) {
        if (this.threat(a, 0.8)) { const b = a.bank; this.go(a, "dive", [b.wx, b.wy, b.w.z - 0.04], t, 0.4); }

        const w = this.threat(a, 0.9);
        if (w) { a.flee = true; a.hops = 5; a.yaw = Math.atan2(a.y - w[1], a.x - w[0]); const p = this.hopFrom(a, 0.36); if (p) this.go(a, "hop", p, t, 0.24); }
      }
    }
  }

  // a fern or bush to visit (bees), optionally within r of p, else null
  function MB_FERNS(c, p, r) {
    const f = c.MB.statics.filter((s) => (s.place.name === "fern" || s.place.name === "bush") && (!p || Math.hypot(s.place.X - p[0], s.place.Y - p[1]) < r));
    if (!f.length) return null;
    const s = f[Math.floor(c.rnd() * f.length)].place;
    return [s.X, s.Y];
  }

  ME.Critters = Critters;
})();

</script>

<script>/* ../MossheartEngine/assets/asset-kit.js */
/* Asset kit: shared helpers, materials and parts for hand-authored voxel assets (assets/assets-mockups.js,
   assets/asset-set.js), plus the showroom that ?gallery=<name> renders: a cleaned-up jar-koke with rows of assets.
   Model conventions match the generator's: tile units, anchor at the ground centre, Z up, facing +X, chibi
   faces painted toward the viewer, animation phase o.t in [0, 1). Exposed as ME.assetKit. */
(function () {
  const ME = window.ME, P = window.PX, { S, E, C, B, Y } = P.prim, M = window.MODELS, TAU = Math.PI * 2;
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const lerp3 = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

  // chibi face painted toward the viewer (port of the generator's private cface in models2.js)

    }
    if (o.mouth) { const [mx, my, mr] = o.mouth; if ((u - mx) ** 2 + ((v - my) * 1.5) ** 2 < mr * mr) return o.mouthM || "void"; }

  }

  // ---------------------------------------------------------------- materials
  const EM = { em: 1, flat: 1 }, FOL = { cls: 2, wrap: 0.6 };
  const MAT = {
    // Koke Garden
    kgBark: [["#6b4a32", 6, 0.14, 0.55, 0.25]], kgLeaf: [["#4f9a3a", 8, 0.16, 0.68, 0.3], FOL], kgLeafLt: [["#8cc84a", 6, 0.3, 0.8, 0.3], FOL],
    kgRope: [["#e2cf98", 4, 0.5, 0.88, 0.2]], kgPaper: [["#f6f2e6", 3, 0.78, 0.97]], kgHeart: [["#f0604a", "#f47a56", "#f89666", "#fcb07a"], EM],
    kgStem: [["#3f7a2e", 5, 0.14, 0.55]], kgThorn: [["#e0d09a", 3, 0.5, 0.85]], kgRose: [["#e04a70", 6, 0.22, 0.75, 0.3]], kgRoseLt: [["#f490ac", 5, 0.45, 0.88, 0.25]],
    kgPetal: [["#f4c43a", 6, 0.32, 0.86, 0.3]], kgPetalDk: [["#e09a28", 5, 0.25, 0.7, 0.3]], kgBrass: [["#b8863a", 5, 0.25, 0.75, 0.3]], kgLens: [["#f4ead0", 4, 0.6, 0.9], { bias: 0.12 }],
    kgCap: [["#a77ad6", 6, 0.25, 0.76, 0.3]], kgGill: [["#d8c8a8", 4, 0.4, 0.8]], kgSpot: [["#f6eeda", 3, 0.72, 0.97]], kgStalk: [["#efe2c4", 5, 0.5, 0.92]],
    kgSpore: [["#a070e0", "#b488ec", "#c8a4f4"], EM], kgWillow: [["#78b850", 6, 0.22, 0.75, 0.3], FOL], kgWillowLt: [["#a6d468", 5, 0.35, 0.85, 0.3], FOL],
    kgOrb: [["#28b4d8", "#40c4e4", "#64d4ee", "#8ae2f4"], EM], kgGrub: [["#efe0bf", 5, 0.45, 0.92, 0.2]], kgGrubDk: [["#c8b48c", 4, 0.3, 0.7]], kgRot: [["#8a8a4a", 4, 0.2, 0.6]],
    kgGrubHead: [["#6a4a3a", 4, 0.15, 0.5]], kgMothFur: [["#e2d6ee", 5, 0.5, 0.92, 0.2]], kgMothWing: [["#b096d8", 6, 0.28, 0.8, 0.3]], kgMothDk: [["#5a4878", 4, 0.12, 0.45]],
    kgLeafSick: [["#8a7a40", 6, 0.16, 0.62, 0.3], FOL], kgEyeSpot: [["#3a2a5a", 3, 0.1, 0.4]], kgStone: [["#8e8c84", 6, 0.2, 0.72, 0.2]], kgStoneDk: [["#66645e", 5, 0.14, 0.52]], kgGolemEye: [["#30d8a0", "#48e4b0", "#68eec4"], EM],
    // Shrine Craft
    scStone: [["#a29e92", 6, 0.24, 0.8, 0.15]], scLacquer: [["#c8382c", 6, 0.2, 0.7, 0.25]], scGold: [["#dcaa40", 5, 0.32, 0.86, 0.3]], scBronze: [["#5f8a78", 5, 0.2, 0.66, 0.2]],
    scMirror: [["#fff0c0", 4, 0.75, 0.99], { bias: 0.4 }], scWood: [["#7a5638", 5, 0.18, 0.6]], scBlack: [["#2a2628", 3, 0.05, 0.3]], scIndigo: [["#3a4a8a", 5, 0.15, 0.6]],
    scPine: [["#2f6a3a", 7, 0.12, 0.6, 0.3], FOL], scPineLt: [["#5a9a48", 5, 0.25, 0.72, 0.3], FOL], scRose: [["#b0182c", 5, 0.15, 0.6]], scGlaze: [["#9a7ac8", 6, 0.25, 0.78, 0.3]],

    // Hotaru Spirit
    hsBark: [["#cfd6d0", 5, 0.45, 0.88, 0.2]], hsBarkDk: [["#3a3048", 5, 0.1, 0.45]], hsLeaf: [["#2e7a6a", 6, 0.12, 0.58, 0.3], FOL], hsLeafLt: [["#4aa890", 5, 0.25, 0.7, 0.3], FOL],

    hsGlowLime: [["#8ce030", "#a0ea48", "#b8f068"], EM], hsVein: [["#b020e0", "#c040ec", "#d064f4"], EM], hsCrystal: [["#b8f0ff", 4, 0.6, 0.96], { bias: 0.3 }],
    hsStem: [["#2a4a40", 5, 0.1, 0.45]], hsPetal: [["#f4ecd0", 4, 0.6, 0.95], { bias: 0.15 }], hsCap: [["#c8b0f0", 5, 0.45, 0.88], { bias: 0.15 }],
    hsKodama: [["#eef2e8", 4, 0.7, 0.97]], hsBlight: [["#3a2440", 5, 0.08, 0.42, 0.3]], hsWingDk: [["#2a2a5a", 5, 0.08, 0.4]], hsObsidian: [["#2c2834", 5, 0.06, 0.38, 0.3]],
    hsShell: [["#4a2c52", 6, 0.1, 0.5, 0.3]], hsShellLt: [["#6a4478", 5, 0.2, 0.62, 0.3]], hsMask: [["#e8e2ee", 4, 0.62, 0.95, 0.2]], hsWraith: [["#5c3a78", 6, 0.14, 0.6, 0.3]],
  };
  const RAMPS = {}, MATS = {};
  for (const k in MAT) { RAMPS[k] = MAT[k][0]; if (MAT[k][1]) MATS[k] = MAT[k][1]; }
  Object.assign(ME.LIGHT_COL, {

    const hc = [0.2, 0, 0.15 + (w === undefined ? 0 : Math.max(0, Math.sin(w + 1.3)) * 0.02)];
    p.push(S(hc, 0.135, body, { k2: 0.03 }));
    for (const sd of [-1, 1]) {
      p.push(C(add(hc, [0.1, sd * 0.05, -0.08]), add(hc, [0.15, sd * 0.02, -0.12]), 0.018, 0.006, head));

    }
    return { p, hc, hr: 0.135, bounds: [0.025, -0.075, -0.155] };
  }
  // stone lantern (kasuga-ish), s scales it about the base; lit is the window material
  const lantern = (lit, s = 1) => {
    const q = (v) => mul(v, s);
    return [
      Y(q([0, 0, 0.05]), 0.2 * s, 0.05 * s, "scStone", { round: 0.02 * s }), Y(q([0, 0, 0.13]), 0.13 * s, 0.03 * s, "scStone"), Y(q([0, 0, 0.32]), 0.065 * s, 0.17 * s, "scStone"), B(q([0, 0, 0.52]), q([0.16, 0.16, 0.03]), 0.01 * s, "scStone"),

      E(q([0, 0, 0.76]), q([0.27, 0.27, 0.06]), "scStone", { k2: 0.03 * s }), C(q([0, 0, 0.78]), q([0, 0, 0.88]), 0.1 * s, 0.02 * s, "scStone", { k2: 0.02 * s }), S(q([0, 0, 0.9]), 0.04 * s, "scStone"),
    ];
  };
  // kodama (tree spirit): pushes body + head prims, returns the head centre for kodamaFace
  const kodama = (c, s, p) => {
    p.push(E(add(c, [0, 0, 0.06 * s]), [0.045 * s, 0.045 * s, 0.065 * s], "hsKodama", { k2: 0.02 }), S(add(c, [0, 0, 0.16 * s]), 0.07 * s, "hsKodama", { k2: 0.02 }));

    for (const h of heads) if (near([x, y, z], h, 0.078 * s)) return cface([x - h[0], y - h[1], z - h[2]], 0.07 * s, { ex: 0.38, ey: 0.1, er: 0.17, hi: false, mouth: [0.05, -0.35, 0.1] });

  // ---------------------------------------------------------------- registration
  // model(name, k, fn, frames): registers MODELS[name] at world scale k (models are authored at k 1) as a

  // ---------------------------------------------------------------- showroom
  // ME.ASSET_THEMES[name] = { label, rows: [[[id, o, cam], ...], c, offsets], keepPath, deco, walkers, jarLight }

  ME.ASSET_THEMES = ME.ASSET_THEMES || {};

    const th = ME.ASSET_THEMES[theme];

    const clean = (r) => (typeof r === "string" ? r.replace(th.keepPath ? /w/g : /[tw]/g, "m") : r.map((c) => (c === "w" || (!th.keepPath && c === "t") ? "m" : c)));
    const map = Object.assign({}, m0, { typ: m0.typ.map(clean) }), deco = [], cams = {};

      const u = us[i], px = Cc + c + h[0] * u, py = Cc + c + h[1] * u, x = Math.floor(px), y = Math.floor(py);
      deco.push([id, o, x, y, { dx: px - x - 0.5, dy: py - y - 0.5 }]);

    });

    for (const d of base.deco) if (d && /mound|fern/.test(d[0]) && Math.hypot(d[2] + 0.5 - Cc, d[3] + 0.5 - Cc) > 5.6) deco.push(d);

    const b0 = base.light.beams[0], bc = Cc - 1.3, fc = Cc + 1.7;
    const light = th.jarLight ? base.light : Object.assign({}, base.light, { shade: 0.62, pool: 0.3, beams: [Object.assign({}, b0, { x: bc + 0.3, y: bc - 0.3, r: 2.4, k: 0.5 }), Object.assign({}, b0, { x: fc, y: fc, r: 2.0, k: 0.45 })] });
    ME.galleryCams = Object.assign({ g: [Cc, Cc, 1.3, 1.55], l: [Cc, Cc, 1.6, 2.1] }, cams, th.cams || {});
    return Object.assign({}, base, { id: "gallery-" + theme, map, deco, light, walkers: th.walkers, ramps: Object.assign({}, base.ramps, RAMPS), mats: Object.assign({}, base.mats, MATS) });
  };

  ME.assetKit = { P, S, E, C, B, Y, M, TAU, add, mul, lerp3, dot, norm, cross, rx, ry, rz, rmul, orient, near, nz3, cface, mossPad, stoneMoss, larva, lantern, kodama, kodamaFace, model, RAMPS, MATS };
})();

<script>/* ../MossheartEngine/assets/asset-set.js */
/* Mossheart asset set (the user's pick from the mockups): Koke Garden Heart Tree, Sunpetal and Puffcap,
   the Shrine Craft Thornbloom lantern, the Hotaru Spirit Willow Wisp and blighted enemies.
     towers   ms_thorn ms_sun ms_puff ms_wisp       o.lv 1..3 (upgrade level), 4-frame idle over o.t
     base     ms_heart                               o.hurt 0..2 (healthy, wounded, critical), 4-frame idle
     enemies  ms_grub ms_beetle ms_moth ms_golem ms_spirit (boss)   4-frame walk / fly cycles
     props    ms_rift (blight spawn) ms_glowcap ms_lamp ms_stone ms_kodama
   Showrooms: ?gallery=set-towers | set-heart | set-enemies | set-world (a mini level: enemies walk the path,
   add &units=10; &set=cycle:60 loops day and dusk). Built on assets/asset-kit.js. */
(function () {
  const ME = window.ME, { S, E, C, B, Y, TAU, add, mul, lerp3, norm, rx, rz, orient, near, nz3, cface, mossPad, stoneMoss, larva, lantern, kodamaFace, model } = ME.assetKit;
  const lv = (o) => Math.max(1, Math.min(3, o.lv || 2)), ph = (o) => (o.t || 0) * TAU;
  const ring = (n, f) => { for (let i = 0; i < n; i++) f((i / n) * TAU, i); };
  // kodama whose head tilts by (dx, dy): the rattle of the idle loop
  const kodamaT = (c, s, p, dx = 0, dy = 0) => {
    p.push(E(add(c, [0, 0, 0.06 * s]), [0.045 * s, 0.045 * s, 0.065 * s], "hsKodama", { k2: 0.02 }));
    const h = add(c, [dx * s, dy * s, 0.16 * s]);
    p.push(S(h, 0.07 * s, "hsKodama", { k2: 0.02 }));
    return h;
  };

  // ================================================================ towers
  // Thornbloom: a stone tōrō overgrown by a thorny rose vine (Shrine Craft). Level 3 grows a gold finial
  // and green thorn-seeds orbiting the roof; sparks rise from the flame on every level.
  model("ms_thorn", 1.9, (o) => {
    const L = lv(o), w = ph(o), s = [0.82, 1, 1.14][L - 1], p = lantern("scLitGreen", s), top = 0.9 * s;
    const n = [12, 22, 30][L - 1], h = [0.5, 0.84, 1.0][L - 1], th = [0.018, 0.024, 0.03][L - 1];
    let prev = null;
    for (let i = 0; i <= n; i++) {
      const t = i / n, a = t * TAU * (1.4 + 0.35 * L) + 0.6, r = (t < 0.6 ? 0.1 : t < 0.75 ? 0.2 : 0.15) * s + 0.03 * Math.sin(i * 1.7), q = [Math.cos(a) * r, Math.sin(a) * r, 0.06 + t * h];
      if (prev) p.push(C(prev, q, th + 0.002, th, "kgStem", { k2: 0.01 }));
      if (i % 2) p.push(C(q, add(q, mul(norm([Math.cos(a + 0.6), Math.sin(a + 0.6), 0.5]), 0.05 + 0.01 * L)), 0.012, 0.001, "kgThorn"));
      const bloom = L === 1 ? i === n - 2 : i % (L === 3 ? 4 : 5) === 3;
      if (bloom) p.push(E(add(q, [Math.cos(a) * 0.035, Math.sin(a) * 0.035, 0.005 * Math.sin(w + i)]), L === 1 ? [0.022, 0.022, 0.03] : [0.035, 0.035, 0.04], "scRose", { k2: 0.01 }));
      prev = q;
    }
    if (L === 3) {
      p.push(S([0, 0, top + 0.05], 0.045, "scGold"), Y([0, 0, top - 0.02], 0.06, 0.012, "scGold"));
      ring(3, (a) => { const b = a + w / 3, c = [Math.cos(b) * 0.36, Math.sin(b) * 0.36, 0.78 + 0.04 * Math.sin(w + a * 2)], d = [-Math.sin(b), Math.cos(b), 0.2]; p.push(C(c, add(c, mul(norm(d), 0.08)), 0.02, 0.002, "scLitGreen")); });
    }
    // sparks rising from the windows, one per level, looping with the flipbook
    for (let k = 0; k < L; k++) { const f = ((o.t || 0) + k / L) % 1, a = k * 2.1; p.push(S([0.16 * s + Math.cos(a) * 0.04, 0.05 * Math.sin(a), 0.62 * s + f * 0.35], 0.016 * (1 - f * 0.6), "scLitGreen")); }
    const sm = stoneMoss("scStone", 10, 0.55);
    return { prims: p, r: 0.36, h: top + 0.15, k: 1, detail: (x, y, z, m, nx, ny, nz) => sm(x, y, z, m, nx, ny, nz) || m };
  }, 4);

  // Sunpetal Lens: a sunflower turned to the sky with a glass lens for a centre (Koke Garden). The head
  // tracks a slow circle; level 3 has a double petal ring, brass spokes and two buds.
  model("ms_sun", 1.9, (o) => {
    const L = lv(o), w = ph(o), hz = [0.58, 0.84, 1.0][L - 1], hr = [0.15, 0.21, 0.25][L - 1];

  });
  // a cluster of small glowing mushrooms (lights the path at dusk)
  model("ms_glowcap", 1.7, () => {
    const p = [];
    for (const [x, y, h, r] of [[0.02, 0.02, 0.22, 0.09], [-0.1, 0.07, 0.14, 0.065], [0.09, -0.08, 0.17, 0.07]]) p.push(C([x, y, 0], [x, y, h], r * 0.35, r * 0.28, "hsKodama", { k2: 0.01 }), E([x, y, h + r * 0.12], [r, r, r * 0.5], "hsCap", { k2: 0.02 }), E([x, y, h - r * 0.08], [r * 0.85, r * 0.85, r * 0.1], "hsGlowPink"));

  });
  // a mossy boulder
  model("ms_stone", 1.7, () => {

  });
  // a kodama sitting on a mossy rock, rattling its head
  model("ms_kodama", 1.9, (o) => {
    const w = ph(o), p = [E([0, 0, 0.06], [0.14, 0.12, 0.09], "kgStone", { k2: 0.04 }), E([0, 0, 0.13], [0.11, 0.09, 0.03], "moss", { k2: 0.03 })];

  }, 4);

  // ================================================================ showrooms
  const T = ["thorn", "sun", "puff", "wisp"];

  const ENEMY_WALK = [

    { type: "moth", model: "ms_moth", speed: 0.6, rate: 3.2, gait: "fly", fly: 0 }, { type: "golem", model: "ms_golem", speed: 0.28, rate: 1.5, gait: "roll" },
    { type: "spirit", model: "ms_spirit", speed: 0.22, rate: 1.0, gait: "fly", fly: 0.08 },

  Object.assign(ME.ASSET_THEMES, {

    "set-heart": {

    // a mini level on the jar's own path: the Heart Tree at the path's end, towers of each level along it,

    "set-world": {

<script>/* ../MossheartEngine/audio/dsp.js */
/* Mossheart audio engine: namespace, and the offline DSP toolkit sound banks are written with.

   MA_DSP() returns a small library of primitives (seeded noise, a state-variable filter, wavetables,
   Karplus-Strong strings, a unison ensemble, grains, loop seams, normalising). It is self-contained on
   purpose: the bank loader (bank.js) runs its source text, together with the app's bank functions, in
   a Blob worker so synthesis never blocks a frame. A bank function receives this library and returns
   { salt, items: { name: spec }, render(name) -> { data, sr, loop } }; see bank.js.
   Nothing here knows about any game, scene or renderer. */
(function () {
  const MA = (window.MA = window.MA || {});
  MA.dbToGain = (db) => Math.pow(10, db / 20);
  // logging hooks an app may point at its own log
  MA.log = (...a) => console.log(...a);
  MA.err = (...a) => console.error(...a);
  MA.now = () => performance.now();
})();

function MA_DSP() {
  const TAU = Math.PI * 2, TABLE = 2048, LOOP_FADE = 0.4;
  let seed = 1234;
  const reseed = (s) => { seed = s >>> 0; };
  // a seed per name: the same name always renders the same sound
  const nameSeed = (salt, name) => salt ^ [...name].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);
  const rnd = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const rr = (a, b) => a + (b - a) * rnd();
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const n1 = () => rr(-1, 1);
  const { exp, sin, min, max, pow, PI } = Math;
  const lerp = (a, b, u) => a + (b - a) * u;
  const smooth = (e0, e1, x) => { if (e0 === e1) return e0; const s = min(max((x - e0) / (e1 - e0), 0), 1); return s * s * (3 - 2 * s); };
  const midiHz = (n) => 440 * pow(2, (n - 69) / 12);
  // Chamberlin state-variable band-pass; `damping` is 1/Q, lower rings more
  const svf = (sr) => { let low = 0, band = 0; return (x, freq, damping) => { const f = 2 * sin((PI * min(freq, sr / 6)) / sr); low += f * band; const high = x - low - damping * band; band += f * high; return band; }; };
  // a normalised single-cycle wavetable from harmonic amplitudes
  const table = (harm) => {
    const t = new Float32Array(TABLE); let peak = 0;
    for (let i = 0; i < TABLE; i++) { const x = (TAU * i) / TABLE; let v = 0; for (let h = 0; h < harm.length; h++) v += harm[h] * sin(x * (h + 1)); t[i] = v; peak = max(peak, Math.abs(v)); }
    for (let i = 0; i < TABLE; i++) t[i] /= peak;
    return t;
  };
  // cross-fades the last `fade` samples into the first ones and drops them, so the sound loops cleanly
  const seam = (s, fade) => { const n = s.length - fade, out = s.slice(0, n); for (let i = 0; i < fade; i++) { const k = i / fade; out[i] = s[i] * k + s[n + i] * (1 - k); } return out; };
  const normalize = (s) => { let peak = 1e-4; for (let i = 0; i < s.length; i++) peak = max(peak, Math.abs(s[i])); const g = 0.9 / peak; for (let i = 0; i < s.length; i++) s[i] = max(-1, min(1, s[i] * g)); return s; };
  // `count` short noise bursts between `from` and `to` seconds, fading towards the end
  const grains = (s, sr, count, from, to, lmin, lmax, amp) => {
    for (let g = 0; g < count; g++) {
      const t0 = rr(from, to), at = Math.floor(t0 * sr), n = Math.floor(rr(lmin, lmax) * sr), a = amp * rr(0.4, 1) * (1 - ((t0 - from) / max(0.001, to - from)) * 0.7);
      for (let j = 0; j < n; j++) if (at + j < s.length) s[at + j] += n1() * a * sin((PI * j) / n);
    }
    return s;
  };
  const buf = (secs, sr) => new Float32Array(Math.floor(secs * sr));
  // Karplus-Strong string: `decay` below 0.5 damps it faster, `bright` is how much of the pluck's noise survives
  function pluck(f, sr, secs, decay = 0.4985, bright = 0.5) {
    const n = Math.floor(secs * sr), period = max(2, Math.floor(sr / f)), b = new Float32Array(period); let lp = 0;
    for (let i = 0; i < period; i++) { lp += bright * (n1() - lp); b[i] = lp; }
    const out = new Float32Array(n); let idx = 0;
    for (let i = 0; i < n; i++) { const cur = b[idx], nxt = b[(idx + 1) % period]; out[i] = cur; b[idx] = (cur + nxt) * decay; idx = (idx + 1) % period; }
    return out;
  }
  // detuned unison section of a wavetable with vibrato, slow attack and release and a two-pole lowpass
  function ensemble(tab, f, sr, secs, voices, cents, attack, release, cutoff) {
    const out = buf(secs, sr), n = out.length, mask = TABLE - 1;
    for (let v = 0; v < voices; v++) {
      const det = ((v - (voices - 1) * 0.5) / max(1, (voices - 1) * 0.5)) * cents, inc = (f * pow(2, det / 1200) * TABLE) / sr, rate = 4.6 + rnd() * 0.8;
      let ph = rnd() * TABLE, vib = 1;
      for (let i = 0; i < n; i++) { if ((i & 31) === 0) vib = 1 + 0.003 * sin((TAU * rate * i) / sr + v); ph += inc * vib; out[i] += tab[Math.floor(ph) & mask]; }
    }
    let lp = 0, lp2 = 0;
    for (let i = 0; i < n; i++) { const t = i / sr, env = min(t / attack, 1) * min((secs - t) / release, 1); lp += cutoff * (out[i] / voices - lp); lp2 += cutoff * (lp - lp2); out[i] = lp2 * env; }
    return out;
  }
  return { TAU, TABLE, LOOP_FADE, reseed, nameSeed, rnd, rr, ri, n1, lerp, smooth, midiHz, svf, table, seam, normalize, grains, buf, pluck, ensemble };
}

<script>/* ../MossheartEngine/audio/bank.js */
/* Sound bank loader. A bank is a self-contained function of the DSP library (MA_DSP):
     function MY_BANK(L) { ...; return { salt, items: { name: spec }, render(name) -> { data, sr, loop } }; }
   renderBanks renders every item of every bank once, with no AudioContext: in a Blob worker built from
   the functions' source text (so they must not reach outside themselves), or in short main-thread chunks
   when workers are unavailable. Before each render the library is reseeded from the bank's salt and the
   item's name, and the result is normalised, so a sound is identical wherever and in whatever order it
   is rendered. The output is therefore a function of the source text alone: it is kept in IndexedDB
   (MA.bankCache, the audio engine's own store) under a hash of MA_DSP and the bank functions
   (MA.bankKey), and a later load with the same sources reads it back instead of rendering.
     MA.renderBanks(bankFns, o) -> Promise<{ items: { name: { data: Float32Array, sr, loop } }, banks,
                                   key, ms, worker: "cache" | "worker" | "main thread" }>
       o.cache (default true): read and write the cache; o.worker (default true); o.onItem(name)
       banks are the main-thread instances (their items, for the sequencer). It never rejects for want
       of a cache: an unavailable, blocked or failing store just means a render.
     MA.toBuffers(ctx, items) -> { name: { buffer: AudioBuffer, loop } }
     MA.loadBanks(ctx, bankFns, onSample) -> Promise<{ samples, banks, ms, worker }>  (both in one go)
     MA.bankKey(bankFns) -> 16 hex digits;  MA.bankCache.get(key) / .put(key, items) / .clear()
   Mixer.load takes renderBanks' result (or its promise), so an app can start the render before it has
   an AudioContext. */
(function () {
  const MA = window.MA;
  const FORMAT = "ma-bank 1"; // bump when the stored layout or the render's contract changes

  // a 64-bit hash (two 32-bit lanes) of the DSP library and the banks' source text
  MA.bankKey = function (bankFns) {
    const s = [FORMAT, MA_DSP, ...bankFns].map(String).join("\n\0");
    let a = 2166136261, b = 0x9e3779b9 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      a = Math.imul(a ^ c, 16777619);
      b = Math.imul(b ^ c, 0x5bd1e995); b ^= b >>> 15;
    }
    return (a >>> 0).toString(16).padStart(8, "0") + (b >>> 0).toString(16).padStart(8, "0");
  };

  // The rendered banks in IndexedDB, one record per key. A put replaces every other record, so the store
  // holds one bank set (about 10 MB of float32 for the game's): bit-exact, no re-quantising.
  const DB = "ma-banks", STORE = "banks";
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const q = indexedDB.open(DB, 1);
    q.onupgradeneeded = () => q.result.createObjectStore(STORE);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
    q.onblocked = () => rej(new Error("bank cache blocked"));
  }).catch((e) => { dbp = null; throw e; }));
  const tx = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction(STORE, mode), r = fn(t.objectStore(STORE));
    t.oncomplete = () => res(r ? r.result : undefined);
    t.onerror = t.onabort = () => rej(t.error || new Error("bank cache aborted"));
  }));
  const within = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("bank cache timed out")), ms))]);
  MA.bankCache = {
    get: (key) => within(tx("readonly", (s) => s.get(key)), 3000).then((v) => (v && v.items) || null),
    put: (key, items) => tx("readwrite", (s) => { s.clear(); s.put({ items, at: Date.now() }, key); }),
    clear: () => tx("readwrite", (s) => { s.clear(); }),
  };

  MA.renderBanks = function (bankFns, o = {}) {
    const t0 = MA.now(), L = MA_DSP(), banks = bankFns.map((f) => f(L)), key = MA.bankKey(bankFns), items = {};
    const useCache = o.cache !== false, jobs = [];
    banks.forEach((b, k) => { for (const name in b.items) jobs.push([k, name]); });
    const add = (m) => { items[m.n] = { data: m.data, sr: m.sr, loop: m.loop }; if (o.onItem) o.onItem(m.n); };
    const done = (worker) => ({ items, banks, key, worker, ms: Math.round(MA.now() - t0) });
    const renderOne = (Lib, bs, k, name) => { Lib.reseed(Lib.nameSeed(bs[k].salt, name)); const r = bs[k].render(name); return { n: name, sr: r.sr, loop: !!r.loop, data: Lib.normalize(r.data) }; };
    const mainThread = () => new Promise((resolve) => {
      let i = 0;
      const chunk = () => {
        const until = MA.now() + 8;
        while (i < jobs.length && MA.now() < until) { const [k, name] = jobs[i++]; add(renderOne(L, banks, k, name)); }
        if (i < jobs.length) setTimeout(chunk, 0); else resolve(done("main thread"));
      };
      chunk();
    });
    const inWorker = () => {
      let url = null;
      try {
        const src = `${MA_DSP.toString()}\n${bankFns.map((f) => f.toString()).join("\n")}\n` +
          `const L = MA_DSP(), B = [${bankFns.map((f) => f.name).join(", ")}].map((f) => f(L));\n` +
          `const renderOne = ${renderOne.toString()};\n` +
          `onmessage = (e) => { for (const [k, n] of e.data) { const r = renderOne(L, B, k, n); postMessage(r, [r.data.buffer]); } postMessage({ done: true }); };`;
        url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        const w = new Worker(url);
        return new Promise((resolve) => {
          let fellBack = false;
          const fallBack = () => { if (fellBack) return; fellBack = true; w.terminate(); for (const n in items) delete items[n]; mainThread().then(resolve); };
          w.onerror = (e) => { e.preventDefault && e.preventDefault(); fallBack(); };
          w.onmessage = (e) => { if (e.data.done) { w.terminate(); URL.revokeObjectURL(url); resolve(done("worker")); } else add(e.data); };
          w.postMessage(jobs);
        });
      } catch (e) {
        if (url) URL.revokeObjectURL(url);
        return mainThread();
      }
    };
    const render = () => (o.worker === false ? mainThread() : inWorker()).then((r) => {
      // written after the caller has its samples, off the critical path
      if (useCache) setTimeout(() => MA.bankCache.put(key, items).catch((e) => MA.log("WARN bank cache not written:", e.message)), 0);
      return r;
    });
    if (!useCache) return render();
    return MA.bankCache.get(key).then((hit) => {
      if (!hit || !jobs.every(([, n]) => hit[n])) return render();
      for (const [, n] of jobs) add({ n, ...hit[n] });
      return done("cache");
    }, (e) => { MA.log("WARN bank cache not read:", e.message); return render(); });
  };

  MA.toBuffers = function (ctx, items) {
    const samples = {};
    for (const n in items) {
      const m = items[n], b = ctx.createBuffer(1, m.data.length, m.sr);
      b.copyToChannel(m.data, 0);
      samples[n] = { buffer: b, loop: m.loop };
    }
    return samples;
  };

  MA.loadBanks = function (ctx, bankFns, onSample) {
    return MA.renderBanks(bankFns, { onItem: onSample }).then((r) => ({ samples: MA.toBuffers(ctx, r.items), banks: r.banks, worker: r.worker, ms: r.ms }));
  };
})();

</script>
<script>/* ../MossheartEngine/audio/mixer.js */
/* Mixer: the AudioContext, a master chain that never clips, named buses an app builds from small
   blocks, sample voices, and a meter/recorder for checking the mix.
     master -> headroom -> limiter -> destination
   WebAudio compressors add their own makeup gain (about 0.6 x the reduction at 0 dBFS), so the limiter's
   threshold sits at -6 dB with 3 dB of headroom before it: the ceiling lands near -2 dBFS.
   An app wires its buses with gain(), lowpass(), verbBus(), chorus(), delayTap() and addBus(name, input),
   loads its sound banks with load() (bank.js) and plays them with voice(). */
(function () {
  const MA = window.MA, dbToGain = MA.dbToGain;

  // a stereo impulse response: decaying noise, darker as it fades (`damp` 0..1)
  function impulse(ctx, secs, decay, damp, predelay = 0) {
    const sr = ctx.sampleRate, n = Math.floor((secs + predelay) * sr), b = ctx.createBuffer(2, n, sr), p0 = Math.floor(predelay * sr);
    let seed = 99;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x3fffffff - 1; };
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c); let lp = 0;
      for (let i = p0; i < n; i++) { const t = (i - p0) / sr, k = 1 - damp * Math.min(1, t / secs) * 0.9; lp += k * (rnd() - lp); d[i] = lp * Math.pow(1 - t / secs, decay) * Math.exp(-t * 1.5); }
    }
    return b;
  }

  class Mixer {
    constructor() {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC({ latencyHint: "interactive" });
      this.samples = {}; this.banks = []; this.ready = false; this.renderMs = 0; this.worker = "none";
      this.bus = {};
      const c = this.ctx, limiter = c.createDynamicsCompressor();
      limiter.threshold.value = -6; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.12;
      this.headroom = this.gain(dbToGain(-3));
      this.master = this.gain(1); this.master.connect(this.headroom); this.headroom.connect(limiter); limiter.connect(c.destination);
      this.out = limiter;
    }

    // --- building blocks for an app's buses
    gain(v = 1) { const g = this.ctx.createGain(); g.gain.value = v; return g; }
    lowpass(freq, q = 1) { const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq; f.Q.value = q; return f; }
    compressor(o) { const k = this.ctx.createDynamicsCompressor(); for (const p in o) k[p].value = o[p]; return k; }
    panner(pan = 0) { const p = this.ctx.createStereoPanner(); p.pan.value = pan; return p; }
    // a bus with a dry path and a convolution reverb send: { input, out, wet }
    verbBus(secs, decay, damp, wet, dry = 1, predelay = 0) {
      const input = this.gain(), out = this.gain(), d = this.gain(dry), w = this.gain(wet), cv = this.ctx.createConvolver();
      cv.buffer = impulse(this.ctx, secs, decay, damp, predelay);
      input.connect(d); d.connect(out); input.connect(cv); cv.connect(w); w.connect(out);
      return { input, out, wet: w };
    }
    // a light chorus: one delay line swept by an LFO, mixed in at `wet`; returns { input, out }
    chorus(delay, depth, rate, wet) {
      const c = this.ctx, input = this.gain(), out = this.gain(), d = c.createDelay(0.05), w = this.gain(wet), lfo = c.createOscillator(), amt = this.gain(depth);
      d.delayTime.value = delay; lfo.frequency.value = rate; lfo.connect(amt); amt.connect(d.delayTime); lfo.start();
      input.connect(out); input.connect(d); d.connect(w); w.connect(out);
      return { input, out };
    }
    // a delay tap from `src` into `dest` at `db`, panned; returns the DelayNode (set delayTime to taste)
    delayTap(src, dest, db, pan) { const d = this.ctx.createDelay(4), g = this.gain(dbToGain(db)), p = this.panner(pan); src.connect(d); d.connect(g); g.connect(p); p.connect(dest); return d; }
    addBus(name, input) { this.bus[name] = input; return input; }

    // --- samples
    // The app's sound banks (bank.js): MA.renderBanks' result or its promise (a render started before
    // this context existed), or the bank functions themselves. Resolves when every sample is an AudioBuffer.
    load(banks) {
      return Promise.resolve(Array.isArray(banks) ? MA.renderBanks(banks) : banks).then((r) => {
        this.samples = MA.toBuffers(this.ctx, r.items); this.banks = r.banks; this.renderMs = r.ms; this.worker = r.worker; this.ready = true;
        MA.log("AUDIO", { samples: Object.keys(this.samples).length, renderMs: r.ms, worker: r.worker });
      });
    }
    // Starts a sample on a bus at ctx time `when` (0 = now). Returns the voice, or null before loading.
    voice(name, bus, db, rate = 1, when = 0, pan = null, loop = false, offset = 0) {
      const s = this.samples[name];
      if (!s) return null;
      const c = this.ctx, src = c.createBufferSource(), g = c.createGain();
      src.buffer = s.buffer; src.loop = loop || s.loop; src.playbackRate.value = rate; g.gain.value = dbToGain(db);
      let tail = g;
      if (pan !== null) { const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p; }
      src.connect(g); tail.connect(this.bus[bus]);
      const v = { src, g, p: pan !== null ? tail : null, name, rate, at: Math.max(c.currentTime, when), done: false };
      src.onended = () => { v.done = true; src.disconnect(); g.disconnect(); if (v.p) v.p.disconnect(); };
      src.start(v.at, offset);
      return v;
    }
    stop(v, when = 0) { if (v && !v.done) { try { v.src.stop(Math.max(when, this.ctx.currentTime)); } catch (e) { /* already stopped */ } } }
    // browsers start audio suspended until the user touches the page
    resume() { if (this.ctx.state !== "running") this.ctx.resume().catch(() => {}); }
    setMuted(muted) { this.master.gain.setTargetAtTime(muted ? 0 : 1, this.ctx.currentTime, 0.05); }

    // --- checking the mix: meter the output (peak, RMS, clipped frames) and record it to webm/opus
    startRecording() {
      const c = this.ctx;
      this.meter = { an: c.createAnalyser(), buf: null, peak: 0, sum: 0, n: 0, clipped: 0 };
      this.meter.an.fftSize = 2048; this.meter.buf = new Float32Array(2048);
      this.out.connect(this.meter.an);
      const dest = c.createMediaStreamDestination(), chunks = [];
      this.out.connect(dest);
      this.rec = new MediaRecorder(dest.stream, { mimeType: "audio/webm;codecs=opus", audioBitsPerSecond: 128000 });
      this.rec.ondataavailable = (e) => chunks.push(e.data);
      this.recDone = new Promise((resolve) => { this.rec.onstop = () => resolve(new Blob(chunks, { type: "audio/webm" })); });
      this.rec.start(1000);
    }
    // the recording as base64, once stopped
    async stopRecording() {
      if (!this.rec) return null;
      this.rec.stop();
      const blob = await this.recDone, bytes = new Uint8Array(await blob.arrayBuffer());
      let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s);
    }
    // call once per frame while metering
    meterFrame() {
      const m = this.meter;
      if (!m) return;
      m.an.getFloatTimeDomainData(m.buf);
      let pk = 0, ss = 0;
      for (const x of m.buf) { pk = Math.max(pk, Math.abs(x)); ss += x * x; }
      m.peak = Math.max(m.peak, pk); m.sum += ss / m.buf.length; m.n++; if (pk > 0.98) m.clipped++;
    }
    meterStats() {
      const m = this.meter;
      if (!m || !m.n) return {};
      return { peakDb: +(20 * Math.log10(m.peak + 1e-9)).toFixed(1), rmsDb: +(10 * Math.log10(m.sum / m.n + 1e-12)).toFixed(1), clippedFrames: m.clipped, meteredFrames: m.n };
    }
  }
  MA.Mixer = Mixer;
})();

<script>/* ../MossheartEngine/audio/sequencer.js */
/* Sequencer: a step clock and a sampler, for music made of pitched samples.
   The clock runs on music time (advance(dt, speed): speed 1 is real time, lower drags like a slowing
   tape) and every step falling inside the lookahead window is handed to onStep(step, t) early, so the
   notes it plays are scheduled on the AudioContext clock and the groove stays tight whatever the frame
   rate. play() picks the nearest-pitched take of an instrument (name or name_hi, from the bank's
   items: name -> [base MIDI note, ...]), pitch-shifts it, and keeps a voice pool per bus (the oldest
   voice gives way). setRate() bends every sounding voice (tape wow and flutter). */
(function () {
  const MA = window.MA;
  const posmod = (a, n) => ((a % n) + n) % n;

  class Sequencer {
    // instruments: name -> [base MIDI note, ...]; pools: bus -> max voices
    constructor(mixer, instruments, pools, opts = {}) {
      this.mixer = mixer; this.instruments = instruments; this.pools = pools;
      this.stepsPerBar = opts.stepsPerBar ?? 16; this.lookahead = opts.lookahead ?? 0.12;
      this.voices = {}; for (const b in pools) this.voices[b] = [];
      this.ready = false; this.bpm = 72; this.clock = 0; this.nextStep = 0; this.step = 0; this.bar = 0; this.rate = 1; this.played = 0;
      this.onStep = null; this.onBarEnd = null;
    }
    start(at = 0.1) { this.ready = true; this.clock = 0; this.nextStep = at; }
    // seconds per step (a 16th at 4 steps per beat)
    sixteenth() { return 60 / this.bpm / (this.stepsPerBar / 4); }
    // seconds of music clock until the next step of the grid
    toGrid() { return posmod(this.nextStep - this.clock, this.sixteenth()); }
    // the next step starts a fresh bar, now
    restartBar() { this.step = 0; this.nextStep = this.clock; }

    // plays `inst` (or its "_hi" twin) at MIDI `note`, `at` seconds of music clock (default now)
    play(inst, note, db, bus, at = this.clock) {
      if (!this.ready) return;
      const m = this.mixer, I = this.instruments, hi = inst + "_hi";
      const name = I[hi] && Math.abs(note - I[hi][0]) < Math.abs(note - I[inst][0]) ? hi : inst;
      const pitch = Math.min(4, Math.max(0.05, Math.pow(2, (note - I[name][0]) / 12)));
      const when = m.ctx.currentTime + Math.max(0, at - this.clock);
      const pool = this.voices[bus];
      for (let k = pool.length - 1; k >= 0; k--) if (pool[k].done) pool.splice(k, 1);
      if (pool.length >= this.pools[bus]) m.stop(pool.shift(), when);
      const v = m.voice(name, bus, db, pitch * this.rate, when);
      if (v) { v.pitch = pitch; pool.push(v); this.played++; }
    }
    later(delay, inst, note, db, bus, from = this.clock) { this.play(inst, note, db, bus, from + Math.max(0, delay)); }
    stopAll() { for (const b in this.voices) { for (const v of this.voices[b]) this.mixer.stop(v); this.voices[b] = []; } }
    // bends every sounding voice to `rate` x its pitch
    setRate(rate) {
      this.rate = rate;
      const now = this.mixer.ctx.currentTime;
      for (const b in this.voices) for (const v of this.voices[b]) if (!v.done) v.src.playbackRate.setTargetAtTime(v.pitch * rate, now, 0.02);
    }
    // moves the clock on and schedules every step inside the lookahead window
    advance(dt, speed = 1) {
      if (!this.ready) return;
      this.clock += dt * Math.max(speed, 0);
      while (this.nextStep < this.clock + this.lookahead) {
        if (this.onStep) this.onStep(this.step, this.nextStep);
        this.nextStep += this.sixteenth();
        if (++this.step === this.stepsPerBar) { this.step = 0; this.bar++; if (this.onBarEnd) this.onBarEnd(); }
      }
    }
  }
  MA.Sequencer = Sequencer;
})();

</script>
<script>/* ../MossheartEngine/audio/spatial.js */
/* Spatial sounds for a view from above: one-shots and loops at world points, panned by where the point
   lands on screen and quieter the further it is from the middle of the view (a touch louder zoomed in).
   listen() takes the camera's view-projection matrix (column-major 4x4) every frame.
   One-shots go through a mix table, name (without a "_N" take suffix) -> [dB, pitch spread, minimum ms
   between plays], and a voice pool whose oldest unprotected voice gives way. */
(function () {
  const MA = window.MA;
  const smooth = (e0, e1, x) => { const s = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return s * s * (3 - 2 * s); };
  const lerp = (a, b, u) => a + (b - a) * u;

  class Spatial {
    // o: { bus, mix, protect: Set of names never cut off, voices }
    constructor(mixer, o) {
      this.mixer = mixer; this.bus = o.bus; this.mix = o.mix; this.protect = o.protect || new Set(); this.maxVoices = o.voices ?? 40;
      this.voices = []; this.last = {}; this.loops = []; this.vp = null; this.zoom = 1; this.aspect = 1; this.played = 0;
    }
    // vp: view-projection matrix; zoom: 1 at the default framing; aspect: view height / width
    listen(vp, zoom, aspect) { this.vp = vp; this.zoom = zoom; this.aspect = aspect; }
    project(p) { const m = this.vp; if (!m) return [0, 0]; return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13]]; }
    pan(p) { return Math.max(-1, Math.min(1, this.project(p)[0])) * 0.7; }
    // full in the middle of the view, falling away off screen, a touch louder zoomed in close
    gainDb(p) {
      const q = this.project(p), d = Math.hypot(q[0], q[1] * this.aspect);
      return -16 * smooth(0.8, 1.8, d) + lerp(-2, 2, Math.min(1, Math.max(0, (this.zoom - 0.7) / 1.3)));
    }
    // a one-shot at a world point, at its mixed volume plus `db`
    play(sound, p, db = 0, pitch = 1) {
      if (!this.mixer.samples[sound]) return;
      const m = /^(.*)_\d$/.exec(sound), group = m ? m[1] : sound, mix = this.mix[group], now = MA.now();
      if (now - (this.last[group] ?? -1e5) < mix[2]) return;
      this.last[group] = now;
      for (let k = this.voices.length - 1; k >= 0; k--) if (this.voices[k].done) this.voices.splice(k, 1);
      if (this.voices.length >= this.maxVoices) {
        const k = this.voices.findIndex((v) => !this.protect.has(v.name));
        if (k < 0) return;
        this.mixer.stop(this.voices.splice(k, 1)[0]);
      }
      const v = this.mixer.voice(sound, this.bus, mix[0] + db + this.gainDb(p), pitch * (1 + (Math.random() * 2 - 1) * mix[1]), 0, this.pan(p));
      if (v) { this.voices.push(v); this.played++; }
    }
    // a looping sound held at a world point on `bus`, starting at a random offset
    loop(name, p, db, bus) {
      const v = this.mixer.voice(name, bus, db + this.gainDb(p), 1, 0, this.pan(p), true, Math.random() * 3);
      if (v) this.loops.push({ v, p, db });
      return v;
    }
    // follow the view: re-pan and re-level the loops
    update() {
      const now = this.mixer.ctx.currentTime;
      for (const l of this.loops) { l.v.g.gain.setTargetAtTime(MA.dbToGain(l.db + this.gainDb(l.p)), now, 0.1); l.v.p.pan.setTargetAtTime(this.pan(l.p), now, 0.1); }
    }
  }
  MA.Spatial = Spatial;
})();
