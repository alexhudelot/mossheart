<script>/* src/core/defs.js */
/* Static game data: plant towers, creatures, wave recipes and roguelike boons (port of Defs, defs.gd).
   Distances and speeds are in tiles (the Godot build used 2-unit tiles, so its numbers are halved here).

   Every plant deals one element, and every creature takes more or less damage from each (its affinity:
   below 1 it resists, above 1 it is weak). The kinds form a loop, so no single plant handles every wave:
     Rot Grub     weak to Thornbloom,  resists Willow Wisp
     Bark Beetle  weak to Puffcap,     resists Thornbloom
     Dusk Moth    weak to Sunpetal,    resists Puffcap
     Moss Golem   weak to Willow Wisp, resists Sunpetal (and some Thornbloom)
   Later waves add a trait that stacks one more resistance (or speed, or vitality) on every creature. */
(function () {
  const G = (window.MG = window.MG || {});

  const D = (G.Defs = {});
  // elements by index; ELEMENT_TOWER is the plant that deals each one
  D.ELEMENTS = ["pierce", "light", "spore", "spirit"];
  D.ELEMENT_TOWER = ["thorn", "sun", "puff", "wisp"];
  D.ELEMENT_NAMES = ["Pierce", "Sunlight", "Spores", "Spirit"];
  // affinities past these show as a resistance or a weakness (glows, HUD, hit feedback)
  D.RESIST_BELOW = 0.8;
  D.WEAK_ABOVE = 1.25;

  D.TOWERS = {
    thorn: { name: "Thornbloom", cost: 50, range: 2.5, rate: 1.6, damage: 8, speed: 8, color: [0.55, 1.0, 0.45], element: "pierce", desc: "Fast seed volleys at a single creature." },
    sun: { name: "Sunpetal Lens", cost: 90, range: 3.75, rate: 0.6, damage: 38, speed: 21, color: [1.0, 0.85, 0.35], element: "light", desc: "Long-range focused sunlight. Targets the toughest creature." },
    puff: { name: "Puffcap", cost: 75, range: 1.7, rate: 0.8, damage: 10, speed: 0, color: [0.85, 0.6, 1.0], slow: 0.3, slowTime: 1.5, element: "spore", desc: "Spore bursts hit everything nearby and slow it." },
    wisp: { name: "Willow Wisp", cost: 110, range: 2.75, rate: 1.0, damage: 14, speed: 6, color: [0.5, 0.95, 1.0], chain: 2, element: "spirit", desc: "Spirit light that leaps between creatures." },
  };
  D.TOWER_ORDER = ["thorn", "puff", "sun", "wisp"];
  D.MAX_LEVEL = 3;

  // `blight` is how fast a creature corrupts the plants around it, `color` its HUD swatch
  D.ENEMIES = {
    grub: { name: "Rot Grub", hp: 48, speed: 0.95, reward: 4, harm: 1, fly: 0, size: 1.0, blight: 1.0, color: [0.86, 0.8, 0.62], affinity: { pierce: 1.75, spirit: 0.5 }, lore: "Soft and mindless: thorns sink in, wisps find nothing to unbind." },
    beetle: { name: "Bark Beetle", hp: 36, speed: 1.15, reward: 4, harm: 1, fly: 0, size: 1.0, blight: 0.8, color: [0.55, 0.36, 0.66], affinity: { pierce: 0.45, spore: 1.75 }, lore: "Its shell turns thorns; spores choke its breathing pores." },
    moth: { name: "Dusk Moth", hp: 22, speed: 1.85, reward: 3, harm: 1, fly: 0.65, size: 0.9, blight: 0.6, color: [0.8, 0.68, 0.9], affinity: { spore: 0.4, light: 1.8 }, lore: "Wingbeats scatter spores; sunlight scorches its powdered wings." },
    golem: { name: "Moss Golem", hp: 180, speed: 0.65, reward: 12, harm: 3, fly: 0, size: 1.4, blight: 1.5, color: [0.55, 0.52, 0.54], affinity: { light: 0.45, pierce: 0.7, spirit: 1.8 }, lore: "Cool stone drinks sunlight; a wisp can unbind the spirit inside." },
    spirit: { name: "Blight Spirit", hp: 1100, speed: 0.475, reward: 80, harm: 10, fly: 0.2, size: 2.0, blight: 3.0, color: [0.36, 0.24, 0.5], affinity: { spirit: 0.4, spore: 0.7, light: 1.6 }, lore: "The blight's heart. Wisps slide off it; sunlight burns through." },
  };
  D.ENEMY_ORDER = ["grub", "beetle", "moth", "golem", "spirit"];

  // wave traits: one more resistance (or speed, or vitality) on every creature of a wave
  D.TRAITS = [
    { id: "shelled", name: "Shelled", desc: "Hardened shells: all resist Thornbloom", affinity: { pierce: 0.55 } },
    { id: "shadowed", name: "Shadowed", desc: "Cloaked in shade: all resist Sunpetal", affinity: { light: 0.55 } },
    { id: "mouldering", name: "Mouldering", desc: "Spores find no hold: all resist Puffcap", affinity: { spore: 0.55 } },
    { id: "hollow", name: "Hollow", desc: "Nothing to unbind: all resist Willow Wisp", affinity: { spirit: 0.55 } },
    { id: "swift", name: "Swift", desc: "All move 30% faster", speed: 1.3 },
    { id: "bloated", name: "Bloated", desc: "All have 40% more vitality", hp: 1.4 },
  ];

  D.BOONS = [
    { id: "sharp_thorns", name: "Sharpened Thorns", desc: "Thornbloom damage +35%", mods: { dmg_thorn: 0.35 }, max: 3 },
    { id: "thorn_split", name: "Twin Seeds", desc: "Thornbloom fires at one extra creature", mods: { split: 1 }, max: 2 },
    { id: "solar_focus", name: "Solar Focus", desc: "Sunpetal range +20%, damage +25%", mods: { range_sun: 0.2, dmg_sun: 0.25 }, max: 3 },
    { id: "spore_cloud", name: "Spore Cloud", desc: "Puffcap reach +25%, slows 10% more", mods: { range_puff: 0.25, slow_bonus: 0.1 }, max: 2 },
    { id: "wisp_chain", name: "Kindred Wisps", desc: "Willow Wisp chains to one more creature", mods: { chain_bonus: 1 }, max: 3 },
    { id: "deep_roots", name: "Deep Roots", desc: "All plants deal 12% more damage", mods: { dmg_all: 0.12 }, max: 4 },
    { id: "quick_sap", name: "Quickened Sap", desc: "All plants attack 12% faster", mods: { rate_all: 0.12 }, max: 4 },
    { id: "overgrowth", name: "Overgrowth", desc: "All plants reach 10% further", mods: { range_all: 0.1 }, max: 3 },
    { id: "dew_collector", name: "Dew Collector", desc: "Creatures drop 20% more dew", mods: { dew_gain: 0.2 }, max: 2 },
    { id: "seed_bank", name: "Seed Bank", desc: "New plants cost 12% less", mods: { cost: -0.12 }, max: 3 },
    { id: "photosynthesis", name: "Photosynthesis", desc: "Earn 4% of your dew after each wave (max 30)", mods: { interest: 0.04 }, max: 2 },
    { id: "crit_bloom", name: "Critical Bloom", desc: "10% chance for hits to deal 2.5x damage", mods: { crit: 0.1 }, max: 3 },
    { id: "spring_rain", name: "Spring Rain", desc: "Heart Tree heals 6 and gains 4 max vitality; the blight recedes", heal: 6, maxHp: 4 },
    { id: "golden_dew", name: "Golden Dew", desc: "Gain 60 dew right now", dew: 60 },
  ];

  // additive modifiers (default 0) versus multipliers (default 1)
  D.ADDITIVE_MODS = new Set(["split", "slow_bonus", "chain_bonus", "interest", "crit"]);
  D.modDefault = (key) => (D.ADDITIVE_MODS.has(key) ? 0 : 1);

  // Creature vitality by wave. It grows exponentially so that the garden, which grows every wave too
  // (more plants, upgrades, stacking boons), is always eventually overrun: a run ends, and the question
  // is how far you got.
  D.hpScale = (wave) => { const w = wave - 1; return Math.pow(1.22, w) * (1 + 0.04 * w) * (1 + 0.08 * Math.max(0, w - 4)); };

  // index into ELEMENTS of the element a plant deals
  D.elementOf = (towerKind) => D.ELEMENT_TOWER.indexOf(towerKind);

  // damage multiplier per element (indexed like ELEMENTS) for a kind under a trait
  D.affinity = (kind, trait) => {
    const base = D.ENEMIES[kind].affinity || {}, extra = (trait && trait.affinity) || {};
    return D.ELEMENTS.map((e) => (base[e] ?? 1) * (extra[e] ?? 1));
  };

  // Small seeded generator (mulberry32) standing in for Godot's RandomNumberGenerator. state() reads its
  // position and state(v) sets it, so a saved run carries on with the same draws.
  G.rng = (seed) => {
    let s = seed >>> 0;
    const next = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    return { f: next, i: (n) => Math.floor(next() * n), range: (a, b) => a + Math.floor(next() * (b - a + 1)), between: (a, b) => a + (b - a) * next(), state: (v) => (v === undefined ? s : (s = v | 0)) };
  };
  const mix = (a, b) => { let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35); h ^= h >>> 16; h = Math.imul(h, 0x7feb352d); h ^= h >>> 15; return h >>> 0; };

  // Everything known about a wave before it starts: its spawn list (pairs of [enemy, delay after the
  // previous]), the creatures it brings and its trait. Plans depend only on the run seed and the wave
  // number, so the almanac can show the next wave while the player is still planning for this one.
  D.planWave = (wave, runSeed) => {
    const rng = G.rng(mix(runSeed, wave));
    let budget = 6 + wave * 3.5 + Math.max(0, wave - 8) * 1.0;
    const interval = Math.max(0.28, 0.75 - wave * 0.025), boss = wave % 5 === 0;
    const costs = { grub: 1.2, beetle: 1.0, moth: 1.0, golem: 4.0 };
    // the first waves introduce one creature each; later ones mix two or three
    const intro = [["grub"], ["beetle", "grub"], ["moth", "beetle"], ["golem", "grub"], ["beetle", "moth"]];
    let kinds = [];
    if (wave <= intro.length) kinds = intro[wave - 1];
    else {
      const pool = ["grub", "beetle", "moth", "golem"];
      for (let i = 0; i < (wave >= 9 ? 3 : 2); i++) kinds.push(pool.splice(rng.i(pool.length), 1)[0]);
    }
    let trait = null;
    if (wave >= 6 && !boss && rng.f() < 0.55 + 0.05 * (wave - 6)) trait = D.TRAITS[rng.i(D.TRAITS.length)];
    // Spawn in small themed clusters so waves have rhythm (which the music follows). The first kind
    // listed leads the wave, and every kind listed gets at least one cluster, so the wave is what the
    // almanac promised.
    const spawns = [], counts = {};
    let cluster = 0;
    while (budget > 0) {
      const kind = cluster < kinds.length ? kinds[cluster] : rng.f() < 0.55 ? kinds[0] : kinds[rng.i(kinds.length)];
      cluster++;
      const group = kind !== "golem" ? rng.range(3, 6) : rng.range(1, 2);
      for (let i = 0; i < group; i++) {
        spawns.push([kind, interval * (kind === "moth" ? 0.6 : 1)]);
        counts[kind] = (counts[kind] || 0) + 1;
        budget -= costs[kind];
      }
      spawns.push(["", interval * 2.5]);
    }
    if (boss) { spawns.push(["", 2.0]); spawns.push(["spirit", 0]); counts.spirit = 1; }
    // the boss first, then the most numerous
    const groups = Object.keys(counts).map((k) => ({ kind: k, count: counts[k] }));
    groups.sort((a, b) => (a.kind === "spirit" ? -1 : b.kind === "spirit" ? 1 : b.count - a.count));
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    return { wave, spawns, groups, trait, boss, total };
  };
})();

</script>
<script>/* src/core/state.js */
/* Run-wide state shared by gameplay, HUD, audio and effects (port of GameState, game_state.gd).
   Systems talk through events (G.on / G.emit) so the music and effects can react without gameplay
   code knowing about them: spawn, boss, hit, kill, fire, heart_hit, wave_start, wave_clear, boon,
   tower_placed, tower_upgraded, tower_sold, game_over, plus the state changes dew, heart, wave, phase,
   mods. */
(function () {
  const G = window.MG, D = G.Defs;

  const handlers = {};
  // returns a function that removes the handler again
  G.on = (name, fn) => { (handlers[name] = handlers[name] || []).push(fn); return () => { handlers[name] = handlers[name].filter((f) => f !== fn); }; };
  G.emit = (name, data = {}) => { for (const fn of handlers[name] || []) fn(data); };

  G.Phase = { BUILD: 0, WAVE: 1, CHOOSE_BOON: 2, GAME_OVER: 3 };
  const SAVE_KEY = "mossheart.best_wave";

  const S = (G.state = {
    START_DEW: 160, START_HEART: 20,
    rng: G.rng(1), seed: 0, dew: 0, heartHp: 0, heartMax: 0, wave: 0, phase: 0,
    // smoothed 0..1 "how dramatic is it right now", written by the game
    intensity: 0,
    boons: [], best: 0, mods: {},
    // live readings of the battle for the music, ambience and HUD: creatures on the field per kind,
    // corruption of the plants near the path (0..1), hits per second (smoothed), lead creature's progress
    field: {}, corruption: 0, combat: 0, danger: 0,
  });
  try { S.best = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0; } catch (e) { /* storage blocked */ }

  S.newRun = (seed) => {
    S.seed = seed >>> 0;
    S.rng = G.rng(S.seed ^ 0x5eed);
    S.dew = S.START_DEW; S.heartMax = S.START_HEART; S.heartHp = S.heartMax; S.wave = 0; S.intensity = 0;
    S.field = {}; S.corruption = 0; S.combat = 0; S.danger = 0; S.boons = []; S.mods = {};
    G.emit("dew"); G.emit("heart"); G.emit("wave"); G.emit("mods");
    S.setPhase(G.Phase.BUILD);
  };
  S.setPhase = (p) => { S.phase = p; G.emit("phase", { phase: p }); };
  // multiplier modifiers default to 1, additive ones to 0 (Defs.ADDITIVE_MODS)
  S.mod = (key) => (key in S.mods ? S.mods[key] : D.modDefault(key));
  S.addMod = (key, amount) => { S.mods[key] = S.mod(key) + amount; G.emit("mods"); };

  S.applyBoon = (b) => {
    S.boons.push(b.id);
    for (const k in b.mods || {}) S.addMod(k, b.mods[k]);
    if (b.maxHp) S.heartMax += b.maxHp;
    if (b.heal || b.maxHp) S.healHeart(b.heal || 0);
    if (b.dew) { S.dew += b.dew; G.emit("dew"); }
    G.emit("boon", { id: b.id });
  };
  // up to `count` boons, skipping ones already taken the maximum number of times
  S.rollBoons = (count) => {
    const pool = D.BOONS.filter((b) => S.boons.filter((id) => id === b.id).length < (b.max || 99)), picks = [];
    while (picks.length < count && pool.length) picks.push(pool.splice(S.rng.i(pool.length), 1)[0]);
    return picks;
  };

  S.towerCost = (base) => Math.round(base * S.mod("cost"));
  S.canAfford = (cost) => S.dew >= cost;
  S.spend = (cost) => { if (S.dew < cost) return false; S.dew -= cost; G.emit("dew"); return true; };
  S.earn = (amount) => { S.dew += Math.round(amount * S.mod("dew_gain")); G.emit("dew"); };
  // income that boons don't scale (wave bonuses, refunds)
  S.earnRaw = (amount) => { S.dew += amount; G.emit("dew"); };
  S.healHeart = (n) => { S.heartHp = Math.min(S.heartMax, S.heartHp + n); G.emit("heart"); };
  S.damageHeart = (n) => {
    if (S.phase === G.Phase.GAME_OVER) return;
    S.heartHp = Math.max(0, S.heartHp - n);
    G.emit("heart");
    G.emit("heart_hit", { amount: n });
    if (S.heartHp === 0) {
      S.best = Math.max(S.best, S.wave);
      try { localStorage.setItem(SAVE_KEY, String(S.best)); } catch (e) { /* storage blocked */ }
      S.setPhase(G.Phase.GAME_OVER);
      G.emit("game_over", { wave: S.wave, best: S.best });
    }
  };
  S.heartRatio = () => S.heartHp / Math.max(1, S.heartMax);
  S.nextWave = () => { S.wave++; G.emit("wave"); };
})();

</script>
<script>/* src/core/world.js */
/* The level's rules: which cells can take a plant, the creatures' road and the Heart Tree, and the blight
   field (port of LevelMap / BlightField). World units are tiles: cell (cx, cy) spans
   [cx, cx + 1) x [cy, cy + 1), Z up.
   The level itself comes from outside, already described (view/level.js reads it off the baked map):
     { W, H, blocked: Uint8Array W*H (cells the map itself rules out: water, rock, props, lamps),
       path: [[cx, cy], ...] in walking order, len, at(s) -> [X, Y, Z, dx, dy] (the road at distance s),
       groundZ(X, Y), heart: [X, Y] } */
(function () {
  const G = window.MG;

  class World {
    constructor(level) {
      this.level = level;
      const W = (this.W = level.W), H = (this.H = level.H);
      this.pathCells = level.path; this.len = level.len;
      this.heart = level.heart;
      this.heartZ = this.groundZ(this.heart[0], this.heart[1]);
      // no plant on the road or under the Heart Tree's crown
      const blocked = Uint8Array.from(level.blocked), at = (x, y) => y * W + x;
      for (const [x, y] of this.pathCells) blocked[at(x, y)] = 1;
      for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) { const cx = Math.floor(this.heart[0]) + x, cy = Math.floor(this.heart[1]) + y; if (cx >= 0 && cy >= 0 && cx < W && cy < H) blocked[at(cx, cy)] = 1; }
      this.blocked = blocked;
      this.occupied = new Map(); // cell index -> tower
      // Chebyshev distance of every cell to the road (blight reading, bot)
      const dist = (this.pathDist = new Float32Array(W * H).fill(99));
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) for (const [px, py] of this.pathCells) dist[at(x, y)] = Math.min(dist[at(x, y)], Math.max(Math.abs(px - x), Math.abs(py - y)));
      this.buildCount = blocked.reduce((a, b) => a + (b ? 0 : 1), 0);
    }
    idx(cx, cy) { return cy * this.W + cx; }
    inside(cx, cy) { return cx >= 0 && cy >= 0 && cx < this.W && cy < this.H; }
    isBuildable(cx, cy) { return this.inside(cx, cy) && !this.blocked[this.idx(cx, cy)] && !this.occupied.has(this.idx(cx, cy)); }
    towerAt(cx, cy) { return this.inside(cx, cy) ? this.occupied.get(this.idx(cx, cy)) || null : null; }
    groundZ(X, Y) { return this.level.groundZ(X, Y); }
    cellCentre(cx, cy) { const X = cx + 0.5, Y = cy + 0.5; return [X, Y, this.groundZ(X, Y)]; }
    // the road at distance s: [X, Y, Z, dx, dy]
    roadAt(s) { return this.level.at(s); }
  }
  G.World = World;

  // ------------------------------------------------------------------ blight
  // Where creatures linger, plants wither and then rot. Corruption builds up around every creature on the
  // path (faster and wider for big ones and the boss, longer where they are slowed). It heals slowly while
  // the path is quiet and faster between waves, but each pass leaves a scar that never heals, so a long
  // run visibly sickens the garden around the creatures' road. The field is `bytes` (W*RES x H*RES,
  // 0..255); `dirty` says it changed since the view last drew it.
  const RES = 4, RATE = 0.08, RADIUS = 1.3, HEAL_WAVE = 0.012, HEAL_BUILD = 0.07, SCAR = 0.35, TICK = 0.1;

  class Blight {
    constructor(world) {
      this.world = world;
      const w = (this.w = world.W * RES), h = (this.h = world.H * RES);
      this.level = new Float32Array(w * h); this.scar = new Float32Array(w * h);
      this.bytes = new Uint8Array(w * h);
      this.active = new Set();
      this.pathTexels = [];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (world.pathDist[world.idx((x / RES) | 0, (y / RES) | 0)] <= 1) this.pathTexels.push(y * w + x);
      this.kernels = new Map();
      this.accum = 0; this.dirty = true;
    }
    // 0..1 corruption at a world point (nearest texel)
    at(X, Y) {
      const x = Math.floor(X * RES), y = Math.floor(Y * RES);
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0;
      return this.bytes[y * this.w + x] / 255;
    }
    // heals a share of all corruption, scars included (the Spring Rain boon)
    cleanse(amount) {
      for (let i = 0; i < this.level.length; i++) { this.scar[i] *= 1 - amount; this.level[i] *= 1 - amount; this.bytes[i] = (this.level[i] * 255) | 0; if (this.level[i] > 0) this.active.add(i); }
      this.dirty = true;
    }
    update(dt, enemies) {
      this.accum += dt;
      if (this.accum < TICK) return;
      const step = this.accum; this.accum = 0;
      const S = G.state;
      this.heal(step * (S.phase === G.Phase.WAVE ? HEAL_WAVE : HEAL_BUILD));
      const D = G.Defs;
      enemies.forEachLive((i) => {
        if (enemies.dist[i] < 0) return;
        const b = D.ENEMIES[D.ENEMY_ORDER[enemies.kind[i]]].blight;
        this.stamp(enemies.px[i], enemies.py[i], RADIUS * Math.sqrt(b), RATE * b * step);
      });
      let sum = 0;
      for (const i of this.pathTexels) sum += this.level[i];
      S.corruption = sum / Math.max(1, this.pathTexels.length);
      this.dirty = true;
    }
    heal(amount) {
      for (const i of this.active) {
        const v = Math.max(this.scar[i], this.level[i] - amount);
        this.level[i] = v; this.bytes[i] = (v * 255) | 0;
        if (v <= this.scar[i] + 0.001) this.active.delete(i);
      }
    }
    stamp(X, Y, radius, amount) {
      const cx = Math.floor(X * RES), cy = Math.floor(Y * RES), k = this.kernel(radius * RES);
      for (let j = 0; j < k.w.length; j++) {
        const x = cx + k.o[j * 2], y = cy + k.o[j * 2 + 1];
        if (x < 0 || y < 0 || x >= this.w || y >= this.h) continue;
        const i = y * this.w + x, v = Math.min(1, this.level[i] + amount * k.w[j]);
        this.level[i] = v; this.scar[i] = Math.max(this.scar[i], v * SCAR); this.bytes[i] = (v * 255) | 0;
        this.active.add(i);
      }
    }
    // texels a stamp of radius r (texels) covers, with a falloff weight each; cached per quarter texel
    kernel(r) {
      r = Math.round(r * 4) / 4;
      let k = this.kernels.get(r);
      if (!k) {
        const o = [], w = [], n = Math.ceil(r);
        for (let dy = -n; dy <= n; dy++) for (let dx = -n; dx <= n; dx++) { const d2 = (dx * dx + dy * dy) / (r * r); if (d2 < 1) { o.push(dx, dy); w.push(1 - d2); } }
        k = { o, w }; this.kernels.set(r, k);
      }
      return k;
    }
  }
  G.Blight = Blight;
  G.BLIGHT_RES = RES;
})();

</script>
<script>/* src/core/enemies.js */
/* Creatures as flat arrays (port of EnemySystem, enemy_system.gd). Each one carries its damage
   multiplier per element (its kind's affinity times the wave trait), the element and outcome of the last
   hit while its flash lasts, and how long it stays slowed; the view turns these into glows.
   Body sizes come from the art as plain data, handed in by whoever builds the game: body.creatureH
   (height per kind) and body.hover (how high each model already floats). */
(function () {
  const G = window.MG, D = G.Defs;
  const CAPACITY = 320, MAX_SLOW = 0.5;
  const Hit = (G.Hit = { PLAIN: 0, WEAK: 1, RESISTED: 2 });
  const SPIRIT = D.ENEMY_ORDER.indexOf("spirit");

  class Enemies {
    constructor(world, body) {
      this.world = world; this.body = body;
      const N = CAPACITY, F = (n = N) => new Float32Array(n), I = () => new Int32Array(N);
      this.alive = new Uint8Array(N); this.uid = I(); this.kind = I();
      this.hp = F(); this.maxHp = F(); this.dist = F(); this.speed = F(); this.slowAmt = F(); this.slowT = F();
      this.flash = F(); this.phase = F(); this.lat = F(); this.px = F(); this.py = F(); this.pz = F(); this.yaw = F();
      this.affinity = F(N * 4); this.hitEl = I(); this.hitRes = I();
      this.count = 0; this.kindCounts = new Int32Array(D.ENEMY_ORDER.length);
      this.lastHit = Hit.PLAIN; this.hitStats = [0, 0, 0];
      this.free = []; for (let i = N - 1; i >= 0; i--) this.free.push(i);
      this.nextUid = 1;
    }
    clear() { for (let i = 0; i < CAPACITY; i++) if (this.alive[i]) this.release(i); }
    forEachLive(fn) { for (let i = 0; i < CAPACITY; i++) if (this.alive[i]) fn(i); }

    spawn(kindName, hpMult, trait) {
      if (!this.free.length) return -1;
      const def = D.ENEMIES[kindName], i = this.free.pop(), rng = G.state.rng;
      this.alive[i] = 1; this.uid[i] = this.nextUid++; this.kind[i] = D.ENEMY_ORDER.indexOf(kindName);
      this.maxHp[i] = def.hp * hpMult * ((trait && trait.hp) || 1); this.hp[i] = this.maxHp[i];
      this.dist[i] = -rng.f() * 0.3;
      this.speed[i] = def.speed * rng.between(0.92, 1.08) * ((trait && trait.speed) || 1);
      this.slowAmt[i] = 0; this.slowT[i] = 0; this.flash[i] = 0; this.phase[i] = rng.f() * Math.PI * 2;
      this.lat[i] = (rng.f() - 0.5) * (kindName === "spirit" ? 0 : 0.3);
      const aff = D.affinity(kindName, trait);
      for (let e = 0; e < 4; e++) this.affinity[i * 4 + e] = aff[e];
      this.hitEl[i] = -1; this.hitRes[i] = Hit.PLAIN;
      this.count++;
      this.place(i, 0);
      G.emit("spawn", { kind: kindName, pos: [this.px[i], this.py[i], this.pz[i]] });
      if (kindName === "spirit") G.emit("boss", {});
      return i;
    }
    kindOf(i) { return D.ENEMY_ORDER[this.kind[i]]; }
    isValid(i, uid) { return i >= 0 && this.alive[i] === 1 && this.uid[i] === uid; }
    // world point of a creature's body centre (where shots aim and bars hang from)
    centre(i) { const h = this.body.creatureH[this.kind[i]]; return [this.px[i], this.py[i], this.pz[i] + h * 0.45]; }

    // Applies a hit of `element` (index into ELEMENTS, -1 for none) scaled by the creature's affinity;
    // sets lastHit and returns whether it killed.
    damage(i, amount, element = -1) {
      if (!this.alive[i]) return false;
      this.lastHit = Hit.PLAIN;
      if (element >= 0) {
        const mult = this.affinity[i * 4 + element];
        amount *= mult;
        if (mult > D.WEAK_ABOVE) this.lastHit = Hit.WEAK;
        else if (mult < D.RESIST_BELOW) this.lastHit = Hit.RESISTED;
        this.hitEl[i] = element; this.hitRes[i] = this.lastHit;
      }
      this.hitStats[this.lastHit]++;
      this.hp[i] -= amount; this.flash[i] = 1;
      if (this.hp[i] <= 0) {
        // (element: what the killing blow dealt, -1 for none)
        const kind = this.kindOf(i), reward = D.ENEMIES[kind].reward, p = [this.px[i], this.py[i], this.pz[i]];
        this.release(i);
        G.state.earn(reward);
        G.emit("kill", { kind, pos: p, reward, element });
        return true;
      }
      return false;
    }
    // Slows a creature by `amount` (at most half its speed). Big creatures shrug part of it off: a golem
    // feels about 70% of it, the boss half.
    applySlow(i, amount, duration) {
      if (!this.alive[i]) return;
      const size = D.ENEMIES[this.kindOf(i)].size;
      this.slowAmt[i] = Math.max(this.slowAmt[i], Math.min(MAX_SLOW, Math.max(0, amount / Math.max(size, 1))));
      this.slowT[i] = Math.max(this.slowT[i], duration);
    }
    // index of the best target in range or -1; mode "first" (closest to the Heart) or "strong"
    pickTarget(x, y, radius, mode = "first", exclude = null) {
      let best = -1, bestScore = -Infinity;
      const r2 = radius * radius;
      for (let i = 0; i < CAPACITY; i++) {
        if (!this.alive[i] || this.dist[i] < 0) continue;
        const dx = this.px[i] - x, dy = this.py[i] - y;
        if (dx * dx + dy * dy > r2 || (exclude && exclude.includes(i))) continue;
        const score = mode === "first" ? this.dist[i] : this.hp[i] * 1000 + this.dist[i];
        if (score > bestScore) { bestScore = score; best = i; }
      }
      return best;
    }
    inRadius(x, y, radius) {
      const out = [], r2 = radius * radius;
      for (let i = 0; i < CAPACITY; i++) {
        if (!this.alive[i] || this.dist[i] < 0) continue;
        const dx = this.px[i] - x, dy = this.py[i] - y;
        if (dx * dx + dy * dy <= r2) out.push(i);
      }
      return out;
    }
    // 0..1 of how far the most advanced creature has walked
    maxProgress() { let m = 0; for (let i = 0; i < CAPACITY; i++) if (this.alive[i]) m = Math.max(m, this.dist[i]); return m / Math.max(this.world.len, 1); }
    bossAlive() { for (let i = 0; i < CAPACITY; i++) if (this.alive[i] && this.kind[i] === SPIRIT) return true; return false; }
    release(i) { this.alive[i] = 0; this.count--; this.free.push(i); }

    // position on the road at distance s, offset sideways by the creature's lane offset
    place(i, time) {
      const W = this.world, s = Math.max(0, this.dist[i]), [X, Y, Z, dx, dy] = W.roadAt(s), l = Math.hypot(dx, dy) || 1;
      const def = D.ENEMIES[this.kindOf(i)];
      this.px[i] = X - (dy / l) * this.lat[i]; this.py[i] = Y + (dx / l) * this.lat[i];
      const fly = def.fly - this.body.hover[this.kind[i]];
      this.pz[i] = Z + fly + (def.fly > 0 ? Math.sin(time * 3 + this.phase[i]) * 0.075 : 0);
      // look a little ahead so turns are smooth
      const [ax, ay] = W.roadAt(s + 0.35);
      if (Math.hypot(ax - X, ay - Y) > 1e-3) this.yaw[i] = Math.atan2(ay - Y, ax - X);
    }

    update(dt, time) {
      const S = G.state, counts = new Int32Array(D.ENEMY_ORDER.length);
      for (let i = 0; i < CAPACITY; i++) {
        if (!this.alive[i]) continue;
        const kind = this.kindOf(i), def = D.ENEMIES[kind];
        if (this.slowT[i] > 0) { this.slowT[i] -= dt; if (this.slowT[i] <= 0) this.slowAmt[i] = 0; }
        this.dist[i] += this.speed[i] * (1 - this.slowAmt[i]) * dt;
        if (this.dist[i] >= this.world.len) {
          const harm = def.harm;
          this.release(i);
          G.emit("leaked", { kind, harm });
          S.damageHeart(harm);
          continue;
        }
        this.place(i, time);
        this.flash[i] = Math.max(0, this.flash[i] - dt * 5);
        if (this.flash[i] <= 0) this.hitEl[i] = -1;
        counts[this.kind[i]]++;
      }
      this.kindCounts = counts;
    }
  }
  G.Enemies = Enemies;
  G.ENEMY_CAPACITY = CAPACITY;
})();

</script>
<script>/* src/core/towers.js */
/* Planted defenders and their shots (ports of Tower, tower.gd and ProjectileSystem,
   projectile_system.gd). What a plant looks like doing it (growing in, swaying, leaning toward its
   target, squashing on every shot) is the view's: it hears every shot as a "fire" event
   { kind, level, tower, pos (where the shot leaves), base (the plant's foot), target (the creature it
   aimed at, or null), radius (an area plant's reach, or 0) } and every landing as a "hit". */
(function () {
  const G = window.MG, D = G.Defs;

  class Tower {
    constructor(kind, cx, cy, world, body) {
      this.body = body; this.kind = kind; this.level = 1; this.cx = cx; this.cy = cy; this.invested = 0;
      this.def = D.TOWERS[kind]; this.element = D.elementOf(kind);
      [this.X, this.Y, this.Z] = world.cellCentre(cx, cy);
      this.cooldown = 0.5;
    }
    // stats: base * level * boons
    damage() { const S = G.state; return this.def.damage * Math.pow(1.55, this.level - 1) * S.mod("dmg_" + this.kind) * S.mod("dmg_all"); }
    range() { const S = G.state; return this.def.range * (1 + 0.1 * (this.level - 1)) * S.mod("range_" + this.kind) * S.mod("range_all"); }
    rate() { const S = G.state; return this.def.rate * (1 + 0.15 * (this.level - 1)) * S.mod("rate_" + this.kind) * S.mod("rate_all"); }
    upgradeCost() { return G.state.towerCost(Math.floor(this.def.cost * 0.8 * this.level)); }
    sellValue() { return Math.floor(this.invested * 0.6); }
    upgrade() { this.level++; }
    // where shots leave from: the plant's head
    origin() { const h = this.body.towerH(this.kind, this.level); return [this.X, this.Y, this.Z + h * 0.8]; }

    update(dt, game) {
      this.cooldown -= dt;
      const S = G.state;
      if (this.cooldown > 0 || S.phase === G.Phase.GAME_OVER) return;
      const { enemies, shots } = game, o = this.origin(), R = this.range();
      let target = null, radius = 0;
      if (this.kind === "thorn") {
        const first = enemies.pickTarget(this.X, this.Y, R, "first");
        if (first >= 0) {
          target = enemies.centre(first);
          shots.fire(o, first, this.damage(), this.def.speed, this.def.color, this.kind);
          const exclude = [first];
          for (let s = 0; s < Math.round(S.mod("split")); s++) {
            const extra = enemies.pickTarget(this.X, this.Y, R, "first", exclude);
            if (extra < 0) break;
            exclude.push(extra);
            shots.fire(o, extra, this.damage(), this.def.speed, this.def.color, this.kind);
          }
        }
      } else if (this.kind === "sun") {
        const strong = enemies.pickTarget(this.X, this.Y, R, "strong");
        if (strong >= 0) {
          target = enemies.centre(strong);
          shots.strike(strong, this.damage(), this.element, this.kind);
        }
      } else if (this.kind === "puff") {
        const victims = enemies.inRadius(this.X, this.Y, R);
        if (victims.length) {
          radius = R;
          const slow = this.def.slow + S.mod("slow_bonus");
          for (const v of victims) { enemies.applySlow(v, slow, this.def.slowTime); shots.strike(v, this.damage(), this.element, this.kind); }
        }
      } else if (this.kind === "wisp") {
        const first = enemies.pickTarget(this.X, this.Y, R, "first");
        if (first >= 0) {
          target = enemies.centre(first);
          shots.fire(o, first, this.damage(), this.def.speed, this.def.color, this.kind, this.def.chain + Math.round(S.mod("chain_bonus")));
        }
      }
      if (target || radius) {
        this.cooldown = 1 / this.rate();
        G.emit("fire", { kind: this.kind, pos: o, level: this.level, tower: this, base: [this.X, this.Y, this.Z], target, radius });
      } else this.cooldown = 0.1; // idle re-scan; cheaper than scanning every frame
    }
  }
  G.Tower = Tower;

  // ------------------------------------------------------------------ shots
  // Homing seeds and wisps; handles hits, crits, wisp chaining and split shots.
  const CAP = 256, CHAIN_RANGE = 1.6;

  class Shots {
    constructor(enemies) {
      this.enemies = enemies;
      this.alive = new Uint8Array(CAP); this.pos = new Float32Array(CAP * 3); this.aimP = new Float32Array(CAP * 3);
      this.target = new Int32Array(CAP); this.tuid = new Int32Array(CAP); this.speed = new Float32Array(CAP); this.dmg = new Float32Array(CAP);
      this.chains = new Int32Array(CAP); this.kind = new Array(CAP); this.hitList = new Array(CAP); this.col = new Array(CAP);
      this.free = []; for (let i = CAP - 1; i >= 0; i--) this.free.push(i);
    }
    get capacity() { return CAP; }
    clear() { for (let i = 0; i < CAP; i++) if (this.alive[i]) { this.alive[i] = 0; this.free.push(i); } }
    fire(from, enemy, dmg, speed, col, kind, chains = 0, exclude = []) {
      if (!this.free.length || enemy < 0) return;
      const i = this.free.pop(), E = this.enemies;
      this.alive[i] = 1; this.pos.set(from, i * 3); this.aimP.set(E.centre(enemy), i * 3);
      this.target[i] = enemy; this.tuid[i] = E.uid[enemy]; this.speed[i] = speed; this.dmg[i] = dmg;
      this.chains[i] = chains; this.col[i] = col; this.kind[i] = kind; this.hitList[i] = exclude.concat([enemy]);
    }
    // Rolls crit and applies damage of `element` from a plant of kind `source`; emits "hit" with how it
    // landed (weak or resisted) and whether a projectile (`shot`) carried it. Returns whether it killed.
    strike(enemy, dmg, element = -1, source = "", shot = false) {
      const E = this.enemies, at = E.centre(enemy), kind = E.kindOf(enemy), S = G.state;
      const crit = S.rng.f() < S.mod("crit");
      if (crit) dmg *= 2.5;
      const killed = E.damage(enemy, dmg, element), result = E.lastHit;
      G.emit("hit", { pos: at, element, result, kind, crit, source, shot });
      return killed;
    }
    update(dt) {
      const E = this.enemies;
      for (let i = 0; i < CAP; i++) {
        if (!this.alive[i]) continue;
        const t = this.target[i], o = i * 3;
        if (E.isValid(t, this.tuid[i])) this.aimP.set(E.centre(t), o);
        const dx = this.aimP[o] - this.pos[o], dy = this.aimP[o + 1] - this.pos[o + 1], dz = this.aimP[o + 2] - this.pos[o + 2], L = Math.hypot(dx, dy, dz), step = this.speed[i] * dt;
        if (L <= step + 0.075) { this.arrive(i); continue; }
        this.pos[o] += (dx / L) * step; this.pos[o + 1] += (dy / L) * step; this.pos[o + 2] += (dz / L) * step;
      }
    }
    arrive(i) {
      this.alive[i] = 0; this.free.push(i);
      const E = this.enemies, t = this.target[i];
      if (!E.isValid(t, this.tuid[i])) return;
      const at = E.centre(t);
      this.strike(t, this.dmg[i], D.elementOf(this.kind[i]), this.kind[i], true);
      if (this.chains[i] > 0) {
        const next = E.pickTarget(at[0], at[1], CHAIN_RANGE, "first", this.hitList[i]);
        if (next >= 0) this.fire(at, next, this.dmg[i] * 0.85, this.speed[i], this.col[i], this.kind[i], this.chains[i] - 1, this.hitList[i]);
      }
    }
  }
  G.Shots = Shots;
})();

</script>
<script>/* src/core/game.js */
/* Run controller (port of Game, game.gd): places plants, spawns waves, tracks the intensity that drives
   music and mood, and moves through build -> wave -> boon phases. Waves are planned ahead
   (Defs.planWave) so the almanac can show what is coming. Pure rules: it tells the view, the audio
   and the HUD what happened through events (state.js) and never draws or plays anything itself. */
(function () {
  const G = window.MG, D = G.Defs, S = G.state;

  class Game {
    // level: the level description (world.js); body: the sizes the rules need from the art, as data
    // { creatureH[kind index], hover[kind index], towerH(kind, level) }
    constructor(level, body) {
      this.world = new G.World(level); this.body = body;
      this.enemies = new G.Enemies(this.world, body);
      this.shots = new G.Shots(this.enemies);
      this.blight = new G.Blight(this.world);
      this.towers = [];
      this.spawnQueue = []; this.spawnTimer = 0; this.hpMult = 1; this.trait = null;
      this.heartShock = 0; this.plans = new Map(); this.hitsSeen = 0; this.lastCount = -1;
      this.time = 0;
      // the gifts on offer while the phase is CHOOSE_BOON
      this.offer = null;
      // the run so far, for the end-of-run summary: kills per creature and per element of the killing
      // blow (Defs.ELEMENTS order), creatures that reached the Heart Tree, plants sown per kind, growths,
      // uprootings and dew gathered (kills and wave bonuses)
      this.stats = { kills: {}, byElement: [0, 0, 0, 0], leaked: 0, planted: {}, grown: 0, uprooted: 0, dew: 0 };
      const st = this.stats;
      this.unsub = [
        G.on("leaked", () => { this.heartShock = Math.min(0.5, this.heartShock + 0.25); st.leaked++; }),
        G.on("kill", (e) => { st.kills[e.kind] = (st.kills[e.kind] || 0) + 1; if (e.element >= 0) st.byElement[e.element]++; st.dew += Math.round(e.reward * S.mod("dew_gain")); }),
      ];
    }
    // a new run replaces this game: drop its event handlers
    dispose() { for (const u of this.unsub) u(); }

    // --- building
    canPlace(kind, cx, cy) { return this.world.isBuildable(cx, cy) && S.canAfford(S.towerCost(D.TOWERS[kind].cost)) && S.phase !== G.Phase.GAME_OVER; }
    place(kind, cx, cy) {
      if (!this.canPlace(kind, cx, cy)) return null;
      const cost = S.towerCost(D.TOWERS[kind].cost);
      S.spend(cost);
      const t = new G.Tower(kind, cx, cy, this.world, this.body);
      t.invested = cost;
      this.towers.push(t);
      this.world.occupied.set(this.world.idx(cx, cy), t);
      this.stats.planted[kind] = (this.stats.planted[kind] || 0) + 1;
      G.emit("tower_placed", { kind, pos: [t.X, t.Y, t.Z], tower: t });
      return t;
    }
    upgrade(t) {
      const cost = t.upgradeCost();
      if (t.level >= D.MAX_LEVEL || !S.spend(cost)) return false;
      t.invested += cost; t.upgrade(); this.stats.grown++;
      G.emit("tower_upgraded", { kind: t.kind, level: t.level, pos: [t.X, t.Y, t.Z], tower: t });
      return true;
    }
    sell(t) {
      S.earnRaw(t.sellValue());
      this.world.occupied.delete(this.world.idx(t.cx, t.cy));
      this.towers = this.towers.filter((x) => x !== t); this.stats.uprooted++;
      G.emit("tower_sold", { pos: [t.X, t.Y, t.Z], tower: t });
    }
    towerAt(cx, cy) { return this.world.towerAt(cx, cy); }

    // --- waves
    plan(wave) { if (!this.plans.has(wave)) this.plans.set(wave, D.planWave(wave, S.seed)); return this.plans.get(wave); }
    // creatures of the running wave still to come or on the field, per kind
    remaining() {
      const out = {};
      for (const [k] of this.spawnQueue) if (k) out[k] = (out[k] || 0) + 1;
      D.ENEMY_ORDER.forEach((k, i) => { if (this.enemies.kindCounts[i] > 0) out[k] = (out[k] || 0) + this.enemies.kindCounts[i]; });
      return out;
    }
    startWave() {
      if (S.phase !== G.Phase.BUILD) return;
      S.nextWave();
      const p = this.plan(S.wave);
      this.spawnQueue = p.spawns.slice(); this.trait = p.trait; this.spawnTimer = 0.8; this.hpMult = D.hpScale(S.wave);
      S.setPhase(G.Phase.WAVE);
      G.emit("wave_start", { wave: S.wave, boss: p.boss, trait: this.trait });
      G.emit("waves");
    }
    chooseBoon(b) {
      S.applyBoon(b); this.offer = null;
      if (b.id === "spring_rain") this.blight.cleanse(0.5);
      S.setPhase(G.Phase.BUILD);
      G.emit("waves");
    }
    waveCleared() {
      const bonus = 18 + S.wave, interest = Math.min(30, Math.floor(S.dew * S.mod("interest")));
      S.earnRaw(bonus + interest); this.stats.dew += bonus + interest;
      G.emit("wave_clear", { wave: S.wave, dew: bonus + interest });
      // (the offer is drawn before the phase changes, so a save taken on the phase change carries it)
      this.offer = S.rollBoons(3);
      S.setPhase(G.Phase.CHOOSE_BOON);
      G.emit("boons_offered", { boons: this.offer });
    }

    update(dt) {
      this.time += dt;
      if (S.phase === G.Phase.WAVE) {
        this.spawnTimer -= dt;
        while (this.spawnTimer <= 0 && this.spawnQueue.length) {
          const [kind, delay] = this.spawnQueue.shift();
          if (kind) this.enemies.spawn(kind, this.hpMult, this.trait);
          this.spawnTimer += delay;
        }
      }
      this.enemies.update(dt, this.time);
      for (const t of this.towers) t.update(dt, this);
      this.shots.update(dt);
      this.blight.update(dt, this.enemies);
      if (S.phase === G.Phase.WAVE && !this.spawnQueue.length && this.enemies.count === 0) this.waveCleared();
      this.readBattle(dt);
      this.updateIntensity(dt);
    }
    // live readings for the music, ambience and HUD
    readBattle(dt) {
      const field = {};
      D.ENEMY_ORDER.forEach((k, i) => { if (this.enemies.kindCounts[i] > 0) field[k] = this.enemies.kindCounts[i]; });
      S.field = field;
      const hs = this.enemies.hitStats, hits = hs[0] + hs[1] + hs[2], rate = (hits - this.hitsSeen) / Math.max(dt, 1e-4);
      this.hitsSeen = hits;
      S.combat += (rate - S.combat) * (1 - Math.exp(-dt * 1.5));
      S.danger = this.enemies.maxProgress();
      if (this.enemies.count !== this.lastCount) { this.lastCount = this.enemies.count; G.emit("waves"); }
    }
    updateIntensity(dt) {
      this.heartShock = Math.max(0, this.heartShock - dt * 0.35);
      let target = 0.05;
      if (S.phase === G.Phase.WAVE) {
        const crowd = Math.min(1, this.enemies.count / 30), dg = S.danger;
        target = 0.28 + crowd * 0.32 + dg * dg * 0.3 + S.corruption * 0.15;
        if (this.enemies.bossAlive()) target += 0.3;
      } else if (S.phase === G.Phase.CHOOSE_BOON) target = 0.12;
      else if (S.phase === G.Phase.GAME_OVER) target = 0;
      target = Math.min(1, Math.max(0, target + this.heartShock));
      const rate = target > S.intensity ? 1.6 : 0.4, step = rate * dt;
      S.intensity = Math.abs(target - S.intensity) <= step ? target : S.intensity + Math.sign(target - S.intensity) * step;
    }
  }
  G.Game = Game;
})();

</script>
<script>/* src/core/save.js */
/* Save and continue: a run kept in localStorage ("mossheart.run") as plain data, so a reload picks it up.
   A run is saved only at rest, in the build phase and while the garden's gifts are on offer. A reload
   during a wave goes back to the build phase before it. A game over clears the save.
     G.Save.capture(game) -> data, or null mid-wave        G.Save.read() / write(data) / clear()
     G.Save.fits(game, data) -> whether data belongs on this level and this version of the rules
     G.Save.restore(game, data) -> true if restored: a fresh Game takes on the saved run (state, plants,
       blight, stats, the gifts on offer) and the usual state events go out, then "restored"
     G.Save.watch(getGame) -> autosave from now on (the app calls it; the bot, the self-test and the
       rules-only sim leave it off) */
(function () {
  const G = window.MG, D = G.Defs, S = G.state, P = G.Phase;
  const KEY = "mossheart.run", VERSION = 1;
  const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const quantise = (f32) => { const u = new Uint8Array(f32.length); for (let i = 0; i < u.length; i++) u[i] = Math.round(Math.min(1, f32[i]) * 255); return u; };

  const Save = (G.Save = {
    KEY, VERSION,
    // true while a restore runs: the autosave holds off, and so do the restore's own state events
    busy: false,

    capture(game) {
      if (S.phase !== P.BUILD && S.phase !== P.CHOOSE_BOON) return null;
      const w = game.world, b = game.blight;
      return {
        v: VERSION, level: [w.W, w.H, +w.len.toFixed(3)], saved: Date.now(),
        seed: S.seed, rng: S.rng.state(), wave: S.wave, dew: S.dew, heart: [S.heartHp, S.heartMax],
        boons: S.boons.slice(), mods: Object.assign({}, S.mods), best: S.best,
        phase: S.phase, offer: S.phase === P.CHOOSE_BOON && game.offer ? game.offer.map((o) => o.id) : null,
        towers: game.towers.map((t) => [t.kind, t.cx, t.cy, t.level, t.invested]),
        blight: { level: b64(quantise(b.level)), scar: b64(quantise(b.scar)) },
        stats: JSON.parse(JSON.stringify(game.stats)), time: +game.time.toFixed(2),
      };
    },
    read() { try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); return d && d.v === VERSION ? d : null; } catch (e) { return null; } },
    write(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* storage blocked or full */ } },
    clear() { try { localStorage.removeItem(KEY); } catch (e) { /* storage blocked */ } },

    fits(game, d) {
      if (!d || d.v !== VERSION) return false;
      const w = game.world;
      if (d.level[0] !== w.W || d.level[1] !== w.H || Math.abs(d.level[2] - w.len) > 0.01) return false;
      const n = w.W * G.BLIGHT_RES * w.H * G.BLIGHT_RES;
      if (unb64(d.blight.level).length !== n || unb64(d.blight.scar).length !== n) return false;
      const seen = new Set();
      for (const [kind, cx, cy, level] of d.towers) {
        const k = w.idx(cx, cy);
        if (!D.TOWERS[kind] || !w.inside(cx, cy) || w.blocked[k] || seen.has(k) || !(level >= 1 && level <= D.MAX_LEVEL)) return false;
        seen.add(k);
      }
      return d.boons.every((id) => D.BOONS.some((b) => b.id === id));
    },

    restore(game, d) {
      if (game.towers.length || !Save.fits(game, d)) return false;
      Save.busy = true;
      try {
        S.newRun(d.seed);
        S.rng.state(d.rng);
        S.wave = d.wave; S.dew = d.dew; S.heartHp = d.heart[0]; S.heartMax = d.heart[1];
        S.boons = d.boons.slice(); S.mods = Object.assign({}, d.mods); S.best = Math.max(S.best, d.best || 0);
        const w = game.world;
        for (const [kind, cx, cy, level, invested] of d.towers) {
          const t = new G.Tower(kind, cx, cy, w, game.body);
          t.level = level; t.invested = invested;
          game.towers.push(t); w.occupied.set(w.idx(cx, cy), t);
        }
        const b = game.blight, lv = unb64(d.blight.level), sc = unb64(d.blight.scar);
        for (let i = 0; i < lv.length; i++) {
          b.level[i] = lv[i] / 255; b.scar[i] = sc[i] / 255; b.bytes[i] = lv[i];
          if (b.level[i] > b.scar[i] + 0.001) b.active.add(i);
        }
        b.dirty = true;
        game.stats = Object.assign(game.stats, JSON.parse(JSON.stringify(d.stats || {})));
        game.time = d.time || 0; game.plans.clear();
        G.emit("dew"); G.emit("heart"); G.emit("wave"); G.emit("mods");
        const offer = d.phase === P.CHOOSE_BOON && d.offer ? d.offer.map((id) => D.BOONS.find((o) => o.id === id)).filter(Boolean) : null;
        if (offer && offer.length) {
          game.offer = offer;
          S.setPhase(P.CHOOSE_BOON);
          G.emit("boons_offered", { boons: offer });
        } else S.setPhase(P.BUILD);
        G.emit("waves");
      } finally { Save.busy = false; }
      G.emit("restored", { wave: S.wave, towers: game.towers.length });
      return true;
    },

    watch(getGame) {
      const save = () => {
        const g = getGame();
        if (Save.busy || !g) return;
        if (S.phase === P.GAME_OVER || (S.wave === 0 && !g.towers.length)) { Save.clear(); return; }
        const d = Save.capture(g);
        if (d) Save.write(d);
      };
      for (const ev of ["phase", "tower_placed", "tower_upgraded", "tower_sold", "restored"]) G.on(ev, save);
      G.on("game_over", () => Save.clear());
    },
  });
})();

</script>
<script>/* src/art/models.js */
/* Game models: the Mossheart asset set (MossheartEngine/assets/asset-set.js, the user's mix of the
   mockups) cast in the game's roles, how the level is dressed with it, and the list of flipbooks the
   engine bakes for the game (ME.bakeModels opts.models).
     plants    Thornbloom ms_thorn (Shrine Craft lantern), Sunpetal Lens ms_sun, Puffcap ms_puff (Koke
               Garden), Willow Wisp ms_wisp (Hotaru Spirit): one flipbook per level (o.lv 1..3)
     creatures Rot Grub ms_grub, Bark Beetle ms_beetle, Dusk Moth ms_moth, Moss Golem ms_golem, Blight
               Spirit ms_spirit (Hotaru Spirit blight)
     the heart ms_heart (Koke Garden) in place of the valley's big maple; hurt 0..2 as it loses vitality
     dressing  a blight rift where the creatures come in, glowcaps beside the road (they light it at dusk)
   Same conventions as the generator: tile units, anchor at the ground centre, Z up, heads toward +X,
   faces painted toward the default view (+X+Y). */
(function () {
  const G = (window.MG = window.MG || {}), ME = window.ME, M = window.MODELS;
  // world scale of an asset model (its own k), so the game can size it relative to the showroom look
  const k0 = (name) => M[name]({}).k;

  G.addMaterials = (st) => {
    const AK = ME.assetKit;
    Object.assign(st.ramps, AK.RAMPS);
    Object.assign(st.mats, AK.MATS);
  };

  // What the game bakes. Creatures: size = world scale relative to the asset's own, fine = voxel density
  // (drawn scaled back down), fwd = the angle of the model's forward (heads point +X), hover = how high
  // the model already floats (in tiles, after scaling), gait = flipbook cycles per tile walked (fliers:
  // per second), flap = animated by time rather than by distance.
  G.CREATURE_MODELS = {
    grub: { name: "ms_grub", size: 0.8, fine: 1.5, fwd: 0, hover: 0, gait: 2.6 },
    beetle: { name: "ms_beetle", size: 0.8, fine: 1.5, fwd: 0, hover: 0, gait: 3.0 },
    moth: { name: "ms_moth", size: 0.7, fine: 1.5, fwd: 0, hover: 0.375, gait: 3.2, flap: true },
    golem: { name: "ms_golem", size: 0.75, fine: 1.25, fwd: 0, hover: 0, gait: 1.5 },
    spirit: { name: "ms_spirit", size: 0.85, fine: 1, fwd: 0, hover: 0.06, gait: 0.9, flap: true },
  };
  G.TOWER_MODELS = { thorn: { name: "ms_thorn", size: 0.72 }, sun: { name: "ms_sun", size: 0.72 }, puff: { name: "ms_puff", size: 0.72 }, wisp: { name: "ms_wisp", size: 0.72 } };
  G.HEART_MODEL = { name: "ms_heart", size: 1.25 };
  // the asset models grow by level themselves; the instance adds only a touch
  G.LEVEL_SCALE = [1, 1.04, 1.08];
  const FRAMES = 4;

  // The level's dressing, before the bake: the Heart Tree takes the big maple's place (the road ends under
  // it), a blight rift opens where the road starts, and glowcaps grow on unbuildable cells beside the road.
  // Nothing here changes which cells can be planted (tools/level-momiji.js stays valid).
  G.dressLevel = (st) => {
    const map = st.map, deco = st.deco, path = map.path[0], { C, RI } = map.geo;
    const hi = deco.findIndex((d) => d && (d[0] === "niwaki" || d[0] === "maple") && d[1] && d[1].H >= 3);
    if (hi >= 0) { const d = deco[hi]; deco[hi] = [G.HEART_MODEL.name, heartO(0), d[2], d[3], d[4]]; }
    const [sx, sy] = path[0];
    deco.push(["ms_rift", { scale: k0("ms_rift") * 0.75 }, sx, sy]);
    // glowcaps: every ~7 road cells, on the road's verge (its own cell, pushed to a side that isn't road),
    // so the build spots stay as they are; none on the bridge (map.typ w)
    const cells = [];
    for (let i = 0; i + 1 < path.length; i++) {
      let [x, y] = path[i]; const [x1, y1] = path[i + 1];
      while (x !== x1 || y !== y1) { cells.push([x, y]); if (x !== x1) x += Math.sign(x1 - x); else y += Math.sign(y1 - y); }
    }
    const road = new Set(cells.map(([x, y]) => x + "," + y));
    for (let i = 5; i < cells.length - 5; i += 7) {
      const [x, y] = cells[i];
      if (map.typ[y][x] === "w") continue;
      const side = [[1, 0], [0, 1], [-1, 0], [0, -1]].find(([dx, dy]) => !road.has(x + dx + "," + (y + dy)));
      if (side) deco.push(["ms_glowcap", { scale: k0("ms_glowcap") * 0.7 }, x, y, { dx: side[0] * 0.38, dy: side[1] * 0.38 }]);
    }
  };
  const heartO = (hurt) => ({ hurt, scale: k0(G.HEART_MODEL.name) * G.HEART_MODEL.size });

  // opts.models for ME.bakeModels: key -> [model, options, frames]
  G.bakeList = () => {
    const out = {};
    for (const k in G.CREATURE_MODELS) { const c = G.CREATURE_MODELS[k]; out["e_" + k] = [c.name, { scale: k0(c.name) * c.size, fine: c.fine }, FRAMES]; }
    for (const k in G.TOWER_MODELS) { const c = G.TOWER_MODELS[k]; for (let lv = 1; lv <= 3; lv++) out["t_" + k + lv] = [c.name, { lv, scale: k0(c.name) * c.size }, FRAMES]; }
    for (const h of [1, 2]) out["heart" + h] = [G.HEART_MODEL.name, heartO(h), FRAMES];
    return out;
  };

  // Once baked (MB = ME.bakeModels' result): G.models, the frames the view draws and how each creature
  // is posed, and G.body, the sizes the rules need (creature heights and float, plant heights).
  G.bindModels = (MB) => {
    const gf = MB.extraFrames, K = Object.keys(G.CREATURE_MODELS);
    const towerFrames = (kind, lv) => gf["t_" + kind + lv];
    G.models = {
      creature: G.Defs.ENEMY_ORDER.map((k) => {
        const c = G.CREATURE_MODELS[k], frames = gf["e_" + k], m = MB.models[frames[0]];
        return { frames, fwd: c.fwd, hover: c.hover * k0(c.name) * c.size, gait: c.gait, flap: !!c.flap, scale: 1 / c.fine, h: m.h, r: m.r };
      }),
      towerFrames,
      // the Heart Tree's flipbook per hurt stage (0 is the baked static's own)
      heartFrames: (s0) => [s0.frames, gf.heart1, gf.heart2],
    };
    G.models.creatureH = G.models.creature.map((c) => c.h);
    G.body = {
      creatureH: G.models.creatureH,
      hover: G.models.creature.map((c) => c.hover),
      towerH: (kind, lv) => MB.models[towerFrames(kind, lv)[0]].h * G.LEVEL_SCALE[lv - 1],
    };
    if (K.length !== G.Defs.ENEMY_ORDER.length) throw new Error("creature models and Defs.ENEMY_ORDER differ");
  };
})();

</script>
<script>/* src/view/shaders.js */
/* The game's look in the engine's shader hooks (ME.SHADER_HOOKS; spliced in by the Renderer):
     mark     creature halos and veins (element matchups), hit flashes, spore dust, the placement ghost
              and the selected plant, from the bits GameView packs into each instance (MARK below)
     shade    the blight withering moss, grass and foliage (the field map is the blight)
     overlay  the build grid, the hovered cell and the range rings (the cell map holds the build flags)
     wilt     blighted grass shrinking and flopping over
   Renderer.user slots (written by GameView.overlays):
     user[0] = blight on, build overlay on, hover cell xy (-1 = none)
     user[1] = range ring: centre xy, radius, strength (0 = off)
     user[2] = ring rgb, hover cell valid
     user[3] = second range ring: centre xy, radius, strength */
(function () {
  const G = window.MG;

  // instance mark bits (sim.put mark; markV = hit flash 0..1): bits 0-3 resists element e, 4-7 weak to
  // element e, 8-9 element of the last hit, 10 that hit found a weakness, 11 it was resisted, 13 slowed,
  // 14/15 placement ghost (valid / not), 16 selected
  G.MARK = { WEAK_SHIFT: 4, HIT_SHIFT: 8, HIT_WEAK: 1 << 10, HIT_RESISTED: 1 << 11, SLOWED: 1 << 13, GHOST_OK: 1 << 14, GHOST_BAD: 1 << 15, SELECTED: 1 << 16 };

  // element colours in Defs.ELEMENTS order (the plants' colours)
  const els = () => G.Defs.ELEMENTS.map((_, e) => G.Defs.TOWERS[G.Defs.ELEMENT_TOWER[e]].color);
  const v3 = (c) => `vec3f(${c.map((x) => x.toFixed(3)).join(", ")})`;

  G.shaderHooks = () => ({
    // Resistances: a steady rim halo with a shimmer rising through it, cycling through the colours of every
    // element resisted. Weaknesses: veins that pulse in the colour of every element that hurts it.
    mark: /* wgsl */ `
const ELEMENT_COL = array<vec3f, 4>(${els().map(v3).join(", ")});
fn hookMark(m: u32, flash: f32, n: vec3f, lp: vec3f, hc: f32, seed: f32) -> Mark {
  var g = Mark(vec4f(0.0), vec3f(0.0));
  let tm = u.vdir.w;
  let rim = pow(1.0 - clamp(dot(n, -u.vdir.xyz), 0.0, 1.0), 2.2);
  var ward = vec3f(0.0); var weak = vec3f(0.0); var nWard = 0.0; var nWeak = 0.0;
  for (var e = 0u; e < 4u; e++) { nWard += f32((m >> e) & 1u); nWeak += f32((m >> (e + 4u)) & 1u); }
  var kWard = 0.0; var kWeak = 0.0;
  for (var e = 0u; e < 4u; e++) {
    if (((m >> e) & 1u) != 0u) { ward += ELEMENT_COL[e] * pow(0.5 + 0.5 * cos(6.2832 * (tm * 0.4 - kWard / nWard)), 3.0); kWard += 1.0; }
    if (((m >> (e + 4u)) & 1u) != 0u) { weak += ELEMENT_COL[e] * pow(0.5 + 0.5 * cos(6.2832 * (tm * 0.4 - kWeak / nWeak)), 3.0); kWeak += 1.0; }
  }
  if (nWard > 1.0) { ward *= 1.6; }
  if (nWeak > 1.0) { weak *= 1.6; }
  let shimmer = 0.65 + 0.35 * sin(lp.z * 22.0 - tm * 3.0);
  g.emit += ward * rim * 1.9 * shimmer;
  let pulse = 0.5 + 0.5 * sin(tm * 6.0 + seed * 1.7);
  let crack = 1.0 - sstep(0.02, 0.075, abs(vnoise(lp.xy * 7.0 + vec2f(lp.z * 5.0)) - 0.5));
  g.emit += weak * (crack * (0.8 + 2.2 * pulse) + pulse * 0.3) * 0.55;
  // spore dust clinging while slowed
  if ((m & ${G.MARK.SLOWED}u) != 0u) { g.tint = vec4f(0.8, 0.66, 0.95, step(0.62, hc) * 0.55); }
  // hit flash: the element's colour on a weak spot, dull grey when resisted, white otherwise
  if (flash > 0.0) {
    let hcol = ELEMENT_COL[(m >> 8u) & 3u];
    var fc = vec3f(1.0); var fa = flash;
    if ((m & ${G.MARK.HIT_WEAK}u) != 0u) { fc = mix(hcol, vec3f(1.0), 0.35); g.emit += hcol * flash * 1.6; }
    else if ((m & ${G.MARK.HIT_RESISTED}u) != 0u) { fc = vec3f(0.42, 0.42, 0.45); fa *= 0.6; }
    g.tint = vec4f(fc, max(g.tint.a, fa));
    g.emit += fc * fa * 0.6;
  }
  if ((m & ${G.MARK.GHOST_OK}u) != 0u) { g.emit += vec3f(0.35, 1.0, 0.45) * (0.35 + 0.2 * sin(tm * 5.0)) * (0.4 + rim); }
  if ((m & ${G.MARK.GHOST_BAD}u) != 0u) { g.emit += vec3f(1.0, 0.3, 0.25) * (0.45 + 0.2 * sin(tm * 7.0)) * (0.4 + rim); }
  if ((m & ${G.MARK.SELECTED}u) != 0u) { g.emit += vec3f(1.0, 0.92, 0.65) * rim * (0.9 + 0.3 * sin(tm * 3.0)); }
  return g;
}`,

    // Blight: greens and reds fade to straw first, then a dark violet rot spreads in blotches with faintly
    // pulsing veins. Noise breaks the edges up so it creeps rather than fades (the Godot blight_tint).
    // Only moss, grass and foliage wither (not the creatures or the plants of the game).
    shade: /* wgsl */ `
fn blightTint(c: vec3f, b: f32, p: vec3f) -> vec3f {
  let n = vnoise(p.xy * 1.6) * 0.6 + vnoise(p.xy * 4.7 + 3.1) * 0.4;
  let wither = sstep(0.04, 0.4, b + (n - 0.5) * 0.25);
  let rot = sstep(0.45, 0.82, b + (n - 0.5) * 0.45);
  let lum = dot(c, vec3f(0.35, 0.5, 0.15));
  var col = mix(c, vec3f(lum * 1.3, lum * 1.02, lum * 0.55), wither * 0.85);
  col = mix(col, vec3f(0.52, 0.3, 0.62) * lum * (0.6 + n * 0.5), rot * 0.92);
  let vein = 1.0 - sstep(0.0, 0.05, abs(vnoise(p.xy * 2.3 + 11.0) - 0.5));
  return col + vec3f(0.75, 0.22, 0.62) * vein * rot * (0.55 + 0.45 * sin(u.vdir.w * 1.7 + n * 9.0)) * 0.6;
}
fn hookShade(col: vec3f, p: vec3f, n: vec3f, cls: u32, unit: bool) -> vec3f {
  if (u.user[0].x < 0.5 || unit || (cls != 1u && cls != 2u)) { return col; }
  let b = fieldAt(p.xy);
  if (b > 0.002) { return blightTint(col, b, p); }
  return col;
}`,

    // Build overlay on the ground: buildable cells outlined, the hovered one lit green (or red when it can't
    // take a plant), and range rings around the hovered spot and the selected plant.
    overlay: /* wgsl */ `
fn ring(p: vec2f, R: vec4f) -> f32 {
  if (R.w <= 0.0) { return 0.0; }
  let d = length(p - R.xy);
  return (1.0 - sstep(0.0, 0.04, abs(d - R.z)) + select(0.0, 0.16, d < R.z)) * R.w;
}
fn hookOverlay(c: vec3f, p: vec3f, n: vec3f, unit: bool) -> vec3f {
  if (unit || (u.user[0].y < 0.5 && u.user[1].w <= 0.0 && u.user[3].w <= 0.0)) { return c; }
  var col = c;
  let top = sstep(0.35, 0.7, n.z);
  let cl = vec2i(floor(p.xy));
  let f = fract(p.xy); let edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  if (u.user[0].y > 0.5) {
    if (cellAt(cl).r > 0.5) {
      let line = 1.0 - sstep(0.03, 0.07, edge);
      col = mix(col, vec3f(1.0, 0.95, 0.75), (0.1 + 0.4 * line) * top);
    }
    if (all(cl == vec2i(u.user[0].zw))) {
      let hc = select(vec3f(1.0, 0.35, 0.3), vec3f(0.55, 1.0, 0.5), u.user[2].w > 0.5);
      let line = 1.0 - sstep(0.04, 0.1, edge);
      col = mix(col, hc * 1.4, (0.25 + 0.55 * line) * top);
    }
  }
  let r = max(ring(p.xy, u.user[1]), ring(p.xy, u.user[3])) * sstep(0.2, 0.5, n.z);
  return mix(col, u.user[2].rgb * 1.3, clamp(r, 0.0, 1.0) * 0.8);
}`,

    // blighted blades shrink and flop over (the shade hook withers their colour)
    wilt: /* wgsl */ `
fn hookWilt(xy: vec2f) -> f32 { if (u.user[0].x < 0.5) { return 0.0; } return fieldAt(xy); }`,
  });
})();

</script>
<script>/* src/view/level.js */
/* Reads the level description the rules need (core/world.js) off the baked valley: the map's open moss
   inside the island, minus props and lamps; the road (the engine sim's path, in walking order, with its
   length and heights); the voxel ground's height; and the Heart Tree (the asset set's, which
   art/models.js plants where the road ends). The one place gameplay and the baked art meet. */
(function () {
  const G = window.MG;

  G.levelFrom = (app) => {
    const { st, T, sim } = app, map = st.map, W = map.W, H = map.H, { C, RI } = map.geo;
    const groundZ = (X, Y) => {
      const i = Math.floor((X - T.O[0]) * T.VS), j = Math.floor((Y - T.O[1]) * T.VS);
      if (i < 0 || j < 0 || i >= T.NX || j >= T.NY) return 0;
      const k = T.top[j * T.NX + i];
      return k < 0 ? 0 : T.O[2] + k / T.VS;
    };
    const blocked = new Uint8Array(W * H), at = (x, y) => y * W + x;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (map.typ[y][x] !== "m" || Math.hypot(x + 0.5 - C, y + 0.5 - C) > RI - 0.7) blocked[at(x, y)] = 1;
    }
    for (const d of st.deco) {
      if (!d || !d[0] || !window.MODELS[d[0]]) continue;
      const ex = d[4] || {}, X = d[2] + 0.5 + (ex.dx || 0), Y = d[3] + 0.5 + (ex.dy || 0);
      blocked[at(Math.min(W - 1, Math.max(0, Math.floor(X))), Math.min(H - 1, Math.max(0, Math.floor(Y))))] = 1;
    }
    for (const l of T.lights || []) { const x = Math.floor(l.p[0]), y = Math.floor(l.p[1]); if (x >= 0 && y >= 0 && x < W && y < H) blocked[at(x, y)] = 1; }
    const heart = st.deco.find((d) => d && d[0] === G.HEART_MODEL.name);
    return { W, H, blocked, path: sim.cells, len: sim.len, at: (s) => sim.at(s), groundZ, heart: heart ? [heart[2] + 0.5, heart[3] + 0.5] : [7.5, 5.5] };
  };
})();

</script>
<script>/* src/view/fx.js */
/* One-shot effects (port of Fx, fx.gd): particle bursts, sunbeams, rings and floating text, set off by
   the game's events (fire, hit, kill, leaked, wave_clear, tower_placed / upgraded / sold). Drawn as the
   engine's sprites (ME.SpriteBatch, kinds ME.SPRITE); floating text is DOM, placed with the camera
   every frame. */
(function () {
  const G = window.MG, D = G.Defs, S = G.state, ME = window.ME;
  const K = ME.SPRITE;
  const MAXP = 2600;
  // CSS colour of an [r, g, b] 0..1 triple
  G.css = (c, a = 1) => `rgba(${Math.round(c[0] * 255)}, ${Math.round(c[1] * 255)}, ${Math.round(c[2] * 255)}, ${a})`;

  // burst presets: [amount, lifetime, colours, vmin, vmax, gravity, size, glowing, damping]
  // (the Godot numbers with distances halved for 1-unit tiles)
  const BURSTS = {
    hit_thorn: [10, 0.4, [[0.6, 1, 0.5], [1, 1, 0.8]], 1.25, 2, -3, 0.025, true],
    hit_sun: [14, 0.45, [[1, 0.9, 0.4], [1, 0.6, 0.3]], 1.5, 2.5, -2, 0.03, true],
    hit_wisp: [10, 0.5, [[0.5, 1, 1], [0.8, 0.9, 1]], 0.75, 1.5, 0.25, 0.03, true],
    hit_puff: [8, 0.4, [[0.9, 0.7, 1]], 0.5, 1, 0, 0.03, true],
    spores: [40, 0.9, [[0.85, 0.6, 1], [1, 0.8, 0.95], [0.7, 0.5, 0.95]], 1.5, 2.5, 0.2, 0.06, true, 3],
    kill: [22, 1.2, [[1, 0.75, 0.85], [1, 1, 0.9], [0.6, 0.9, 0.45], [1, 0.9, 0.5]], 0.75, 1.75, -1.25, 0.045, false],
    plant: [24, 0.9, [[0.5, 0.85, 0.35], [0.75, 0.95, 0.5], [0.6, 0.45, 0.3]], 1, 2, -3.5, 0.04, false],
    heart: [30, 1.0, [[1, 0.3, 0.4], [0.6, 0.2, 0.6]], 1, 2.5, -1.5, 0.05, true],
    boss_kill: [90, 2.0, [[1, 0.75, 0.9], [0.7, 0.5, 1], [1, 1, 0.85]], 1.5, 4, -0.75, 0.06, true],
    resist: [7, 0.35, [[0.62, 0.6, 0.58], [0.4, 0.38, 0.4]], 0.75, 1.5, -4.5, 0.022, true],
  };
  // a weak spot struck: a bright starburst in the element's colour
  D.ELEMENTS.forEach((_, e) => { const c = D.TOWERS[D.ELEMENT_TOWER[e]].color; BURSTS["weak_" + e] = [16, 0.45, [[1, 1, 1], c, c.map((v) => v + (1 - v) * 0.4)], 2, 3.5, -1, 0.035, true, 4]; });

  class Fx {
    constructor() {
      this.world = null;
      this.n = 0;
      this.p = new Float32Array(MAXP * 3); this.v = new Float32Array(MAXP * 3); this.c = new Float32Array(MAXP * 3);
      this.life = new Float32Array(MAXP); this.max = new Float32Array(MAXP); this.size = new Float32Array(MAXP);
      this.grav = new Float32Array(MAXP); this.damp = new Float32Array(MAXP); this.glow = new Uint8Array(MAXP);
      this.beams = []; this.rings = []; this.lastMark = [0, 0];
      this.quality = 1;
      // floating text: a pool of DOM labels
      this.layer = document.getElementById("floats");
      this.labels = Array.from({ length: 18 }, () => { const el = document.createElement("div"); el.className = "float"; this.layer.appendChild(el); return { el, t: 1, p: [0, 0, 0] }; });
      this.li = 0;
      const on = (ev, fn) => G.on(ev, (e) => { if (this.world) fn(e); });
      on("fire", (e) => {
        if (e.kind === "sun" && e.target) { this.beam(e.pos, e.target); this.burst("hit_sun", e.target); }
        else if (e.kind === "puff") { const [X, Y, Z] = e.base; this.burst("spores", [X, Y, Z + 0.3]); this.ring([X, Y, Z + 0.06], e.radius, D.TOWERS.puff.color, 0.55, true); }
      });
      on("hit", (e) => {
        const at = e.pos;
        if (e.crit) this.floatText([at[0], at[1], at[2] + 0.6], "crit!", [1, 0.9, 0.5]);
        if (e.result !== G.Hit.PLAIN) this.hitMark(at, e.element, e.result === G.Hit.WEAK);
        if (e.shot) this.burst("hit_" + e.source, at);
      });
      on("kill", (e) => {
        const p = [e.pos[0], e.pos[1], e.pos[2] + 0.25];
        this.burst(e.kind === "spirit" ? "boss_kill" : "kill", p);
        this.floatText([p[0], p[1], p[2] + 0.35], "+" + Math.round(e.reward * S.mod("dew_gain")), [0.75, 0.95, 1.0]);
      });
      on("leaked", () => { const w = this.world; this.burst("heart", [w.heart[0], w.heart[1], w.heartZ + 1.1]); });
      on("wave_clear", (e) => { const w = this.world; this.floatText([w.heart[0], w.heart[1], w.heartZ + 2.6], "+" + e.dew + " dew", [0.7, 0.95, 1.0]); });
      on("tower_placed", (e) => this.burst("plant", [e.pos[0], e.pos[1], e.pos[2] + 0.15]));
      on("tower_upgraded", (e) => this.burst("plant", [e.pos[0], e.pos[1], e.pos[2] + 0.25]));
      on("tower_sold", (e) => this.burst("plant", [e.pos[0], e.pos[1], e.pos[2] + 0.15]));
    }
    // a new run: forget the old one's effects
    reset(world) {
      this.world = world; this.n = 0; this.beams = []; this.rings = [];
      for (const L of this.labels) L.t = 1;
    }
    burst(kind, at) {
      const b = BURSTS[kind];
      if (!b) return;
      const [amount, life, cols, vmin, vmax, grav, size, glow, damp = 0.5] = b, n = Math.max(2, Math.round(amount * this.quality)), rnd = Math.random;
      for (let k = 0; k < n; k++) {
        if (this.n >= MAXP) return;
        const i = this.n++, u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), sp = vmin + (vmax - vmin) * rnd();
        const dir = [s * Math.cos(a), s * Math.sin(a), u], r0 = 0.075 * Math.cbrt(rnd());
        this.p.set([at[0] + dir[0] * r0, at[1] + dir[1] * r0, at[2] + dir[2] * r0], i * 3);
        this.v.set([dir[0] * sp, dir[1] * sp, dir[2] * sp], i * 3);
        const c = cols[(rnd() * cols.length) | 0];
        this.c.set(c, i * 3);
        this.life[i] = life * (0.85 + 0.15 * rnd()); this.max[i] = this.life[i];
        this.size[i] = size * (0.6 + 0.7 * rnd()); this.grav[i] = grav; this.damp[i] = damp * (1 + 0.5 * rnd()); this.glow[i] = glow ? 1 : 0;
      }
    }
    // A sunbeam from a Sunpetal to its target: wide and bright, thinning out over 0.18 s.
    beam(from, to, col = [1, 0.85, 0.45]) { this.beams.push({ a: from, b: to, t: 0, col }); }
    // an expanding ring on the ground (spore bursts) or in the air
    ring(at, r, col, life = 0.5, ground = true) { this.rings.push({ p: at, r, col, t: 0, life, ground }); }
    // How a hit of `element` landed: a starburst in the element's colour on a weak spot, dull sparks off a
    // resistance, and now and then the word, so the matchup reads without flooding the screen.
    hitMark(at, element, weak) {
      const p = [at[0], at[1], at[2] + 0.2];
      this.burst(weak ? "weak_" + element : "resist", p);
      const now = performance.now(), k = weak ? 1 : 0;
      if (now - this.lastMark[k] < 450) return;
      this.lastMark[k] = now;
      if (weak) { const c = D.TOWERS[D.ELEMENT_TOWER[element]].color; this.floatText([p[0], p[1], p[2] + 0.45], "weak!", c.map((v) => v + (1 - v) * 0.2)); }
      else this.floatText([p[0], p[1], p[2] + 0.45], "resisted", [0.72, 0.7, 0.68]);
    }
    floatText(at, text, col) {
      const L = this.labels[this.li]; this.li = (this.li + 1) % this.labels.length;
      L.el.textContent = text; L.el.style.color = G.css(col); L.p = at.slice(); L.t = 0;
    }
    update(dt) {
      // particles: drift, damping, gravity; swap-remove the dead
      for (let i = 0; i < this.n; i++) {
        this.life[i] -= dt;
        if (this.life[i] <= 0) { this.kill(i); i--; continue; }
        const d = Math.exp(-this.damp[i] * dt), o = i * 3;
        this.v[o] *= d; this.v[o + 1] *= d; this.v[o + 2] = this.v[o + 2] * d + this.grav[i] * dt;
        this.p[o] += this.v[o] * dt; this.p[o + 1] += this.v[o + 1] * dt; this.p[o + 2] += this.v[o + 2] * dt;
      }

<script>/* src/view/scene.js */
/* GameView: how a run looks, through the engine's generic extension points (and nothing else):

                                     wounded and critical ones as it loses vitality

                                     under it, uprooted plants crumble, the fallen Heart Tree falls apart

                                     wilting) and the plants' glow

    }

    // scatters from.

      }

        const yaw = E.yaw[k] - cm.fwd + (n === 1 ? Math.sin(ph * Math.PI * 2) * 0.08 : 0);

    }

        for (let k = 0; k < tw.level; k++) {

          sp.put(o[0] + Math.cos(a) * 0.32, o[1] + Math.sin(a) * 0.32, o[2] + Math.sin(a * 2) * 0.06, 0.06, 0, 0, 0, K.ORB, c[0] * 1.8, c[1] * 1.8, c[2] * 1.8, 1);

          sp.put(E.px[k] + Math.cos(a) * 0.55, E.py[k] + Math.sin(a) * 0.55, E.pz[k] + 0.35 + Math.sin(j * 2.1 + t * 2) * 0.15, 0.09, 0, 0, 0, K.ORB, 0.7 * 1.6, 0.4 * 1.6, 1.6, 1);
