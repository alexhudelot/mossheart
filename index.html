      }
      sp.overlay();
      // health bars over hurt creatures, green to red, sized in render pixels
      const MD = G.models;
      for (let k = 0; k < G.ENEMY_CAPACITY; k++) {
        if (!E.alive[k] || E.hp[k] >= E.maxHp[k] || E.dist[k] < 0) continue;
        const f = Math.max(0, E.hp[k] / E.maxHp[k]), sz = Math.min(1.6, Math.max(1, D.ENEMIES[E.kindOf(k)].size)), h = MD.creatureH[E.kind[k]];
        const col = f > 0.5 ? [1.0 - (f - 0.5) * 2 * 0.45, 0.9, 0.4] : [1.0, 0.35 + f * 1.1, 0.3];
        sp.put(E.px[k], E.py[k], E.pz[k] + h + 0.12, 0, 15 * sz * barPx, 2.6 * barPx, f, K.BAR, col[0], col[1], col[2], 1);
      }
      sp.end();
    }

    // --- overlays (shader hooks' user slots, see shaders.js) and the mood
    overlays() {
      const u = this.R.user, game = this.game, hv = this.hover, seedKind = this.seed, sel = this.selected;
      let ring = [0, 0, 0, 0], ring2 = [0, 0, 0, 0];
      if (seedKind && hv && hv.cell && game.world.inside(hv.cell[0], hv.cell[1])) {
        this.hoverOk = game.canPlace(seedKind, hv.cell[0], hv.cell[1]);
        const def = D.TOWERS[seedKind], r = def.range * S.mod("range_" + seedKind) * S.mod("range_all");
        ring = [hv.cell[0] + 0.5, hv.cell[1] + 0.5, r, 0.85];
        this.ringCol = def.color;
      }
      if (sel) { ring2 = [sel.X, sel.Y, sel.range(), 1]; if (!seedKind) this.ringCol = sel.def.color; }
      const cell = hv && hv.cell ? hv.cell : [-1, -1];
      u.set([1, seedKind ? 1 : 0, cell[0], cell[1]], 0);
      u.set(ring, 4);
      u.set([...this.ringCol, this.hoverOk ? 1 : 0], 8);
      u.set(ring2, 12);
    }
    // the garden darkens and blooms as the battle gets dramatic (world.set_mood in the Godot build), then
    // the whole look blends toward the engine's dusk (ME.DUSK; ME.DayCycle's blend, driven by the run)
    mood() {
      const m = S.intensity, s = this.R.set, base = this.base, d = this.dusk;
      const day = { exposure: base.exposure * (1 - 0.1 * m), bloomK: base.bloomK * (1 + 0.45 * m), vignette: base.vignette + 0.3 * m };
      for (const k in ME.DUSK) { const v = k in day ? day[k] : base[k]; s[k] = v + (ME.DUSK[k] - v) * d; }
      s.haze = base.haze + 0.035 * m;
      s.dusk = d;
    }
    // everything the renderer needs this frame
    draw(barPx) { this.flushField(); this.mood(); this.overlays(); this.writeSprites(barPx); }

    // Screen -> ground: march the view ray (an affine camera, so the ray direction is fixed) from the
    // near plane down until it passes under the voxel ground. Returns [X, Y, Z] or null.
    pick(px, py, cam, w, h) {
      const iv = cam.matrices(w, h).ivp, x = (px / w) * 2 - 1, y = 1 - (py / h) * 2;
      const a = ME.m4.apply(iv, [x, y, 1]), b = ME.m4.apply(iv, [x, y, 0]);
      const T = this.app.T, zTop = T.O[2] + T.NZ / T.VS, zBot = T.O[2];
      // clip the segment to the grid's z range, then step a quarter voxel at a time
      const ta = (zTop - a[2]) / (b[2] - a[2]), tb = (zBot - a[2]) / (b[2] - a[2]);
      const t0 = Math.max(0, Math.min(ta, tb)), t1 = Math.min(1, Math.max(ta, tb));
      const L = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]) * (t1 - t0), n = Math.ceil(L * T.VS * 4);
      for (let s = 0; s <= n; s++) {
        const t = t0 + ((t1 - t0) * s) / n, X = a[0] + (b[0] - a[0]) * t, Y = a[1] + (b[1] - a[1]) * t, Z = a[2] + (b[2] - a[2]) * t;
        const i = Math.floor((X - T.O[0]) * T.VS), j = Math.floor((Y - T.O[1]) * T.VS);
        if (i < 0 || j < 0 || i >= T.NX || j >= T.NY) continue;
        const k = T.top[j * T.NX + i];
        if (k >= 0 && Z <= T.O[2] + k / T.VS) return [X, Y, Z];
      }
      return null;
    }
    // the map cell under a canvas pixel, or null
    cellAt(px, py, cam, w, h) { const p = this.pick(px, py, cam, w, h); return p ? [Math.floor(p[0]), Math.floor(p[1])] : null; }
  }
  G.GameView = GameView;
})();

</script>
<script>/* src/view/hud.js */
/* Touch-sized DOM HUD (port of Hud, hud.gd): vitality / dew / wave readouts, seed cards, the wave
   button, the plant inspector, the boon draft, the end-of-run card and the wave almanac: what the
   running (or coming) wave brings and the one after it, each creature with what it is weak to and what
   it resists. Seed cards mark the plants that counter the coming creatures, or that they shrug off. */
(function () {
  const G = window.MG, D = G.Defs, S = G.state;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const hex = (c) => "#" + c.map((v) => Math.round(Math.min(1, v) * 255).toString(16).padStart(2, "0")).join("");
  const short = (name) => name.split(" ")[0];

  class Hud {
    constructor(game, actions) {
      this.game = game; this.act = actions;
      this.selected = ""; this.matchup = {};
      const seeds = $("seeds");
      this.cards = {};
      for (const kind of D.TOWER_ORDER) {
        const def = D.TOWERS[kind], b = document.createElement("button");
        b.className = "seed"; b.style.setProperty("--acc", hex(def.color.map((v) => v * 0.75)));
        b.innerHTML = `<span class="dot" style="background:${hex(def.color)}"></span><b>${def.name}</b><span class="cost"></span><span class="tag"></span>`;
        b.addEventListener("click", () => { this.selected = this.selected === kind ? "" : kind; this.act.seed(this.selected); this.refresh(); });
        seeds.appendChild(b); this.cards[kind] = b;
      }
      $("wavebtn").addEventListener("click", () => this.act.startWave());
      $("speed").addEventListener("click", () => { const fast = !$("speed").classList.contains("on"); $("speed").classList.toggle("on", fast); $("speed").textContent = fast ? "2x" : "1x"; this.act.speed(fast); });
      $("sound").addEventListener("click", () => { const on = this.act.sound(); $("sound").textContent = on ? "♪" : "♪̸"; $("sound").classList.toggle("off", !on); });
      $("almtog").addEventListener("click", () => { const body = $("almbody"), open = body.classList.toggle("hide"); $("almtog").textContent = "Wave almanac  " + (open ? "▸" : "▾"); });
      if (window.innerWidth < 720) { $("almbody").classList.add("hide"); $("almtog").textContent = "Wave almanac  ▸"; }
      $("grow").addEventListener("click", () => this.act.upgrade());
      $("uproot").addEventListener("click", () => this.act.sell());
      $("again").addEventListener("click", () => this.act.restart());
      for (const ev of ["dew", "heart", "wave", "phase", "mods"]) G.on(ev, () => this.refresh());
      this.refresh();
    }
    clearSeed() { this.selected = ""; this.refresh(); }
    setFps(fps, scale) { $("fps").textContent = `${Math.round(fps)} fps · ${Math.round(scale * 100)}%`; }

    showBoons(boons, choose) {
      const row = $("boonrow");
      row.innerHTML = "";
      for (const b of boons) {
        const el = document.createElement("button");
        el.className = "boon";
        el.innerHTML = `<b>${esc(b.name)}</b><span>${esc(b.desc)}</span>`;
        el.addEventListener("click", () => { $("boons").classList.remove("show"); choose(b); });
        row.appendChild(el);
      }
      $("boons").classList.add("show");
    }
    showGameOver(wave, best) {
      $("overtxt").innerHTML = `You tended the meadow for ${wave} waves.<br>Longest bloom: ${best}`;
      $("over").classList.add("show");
    }
    hideGameOver() { $("over").classList.remove("show"); }

    inspect(t) {
      const box = $("inspector");
      if (!t) { box.classList.remove("show"); return; }
      const def = D.TOWERS[t.kind];
      $("insptitle").textContent = `${def.name}  ·  Lv ${t.level}`;
      $("inspbody").innerHTML = `${esc(def.desc)}<br>Damage <b>${t.damage().toFixed(0)}</b> · Reach <b>${t.range().toFixed(1)}</b><br>Attacks <b>${t.rate().toFixed(2)}</b> / s<br><span class="dim">${esc(this.matchupsOf(t.kind))}</span>`;
      const grow = $("grow");
      if (t.level >= D.MAX_LEVEL) { grow.textContent = "Fully grown"; grow.disabled = true; }
      else { grow.textContent = `Grow  (${t.upgradeCost()} dew)`; grow.disabled = !S.canAfford(t.upgradeCost()); }
      $("uproot").textContent = `Uproot  (+${t.sellValue()} dew)`;
      box.classList.add("show");
    }

    // Two waves' plans: `first` is the running wave (with `left` its creatures still to come or on the
    // field) or, between waves, the coming one; `second` the one after. Seed cards rate against `first`.
    showWaves(first, left, second) {
      const running = Object.keys(left).length > 0;
      let tag = "coming";
      if (running) tag = `now · ${Object.values(left).reduce((a, b) => a + b, 0)} left`;
      $("almbody").innerHTML = this.waveHtml(first, tag, running ? left : null) + this.waveHtml(second, running ? "next" : "after", null) +
        `<div class="legend">halo = resists · pulsing veins = weak spot</div>`;
      this.matchup = this.matchups(first, running ? left : null);
      this.refresh();
    }
    waveHtml(p, tag, left) {
      const wt = p.trait;
      let t = `<div class="wv"><b class="wn">Wave ${p.wave}</b> <span class="wt">${tag}</span>${wt ? ` <span class="tr">· ${esc(wt.name)}</span>` : ""}${p.boss ? ` <span class="tr">· boss</span>` : ""}</div>`;
      for (const g of p.groups) {
        const e = D.ENEMIES[g.kind], count = left ? left[g.kind] || 0 : g.count, aff = D.affinity(g.kind, wt), weak = [], resist = [];
        D.ELEMENTS.forEach((_, el) => {
          const tw = D.TOWERS[D.ELEMENT_TOWER[el]], chip = `<span style="color:${hex(tw.color)}">${short(tw.name)} ×${aff[el].toFixed(1)}</span>`;
          if (aff[el] > D.WEAK_ABOVE) weak.push(chip); else if (aff[el] < D.RESIST_BELOW) resist.push(chip);
        });
        const line = `<span class="sw" style="color:${hex(e.color)}">●</span> ${e.name} ×${count}`;
        if (left && count === 0) t += `<div class="ln gone">${line}</div>`;
        else t += `<div class="ln">${line}<div class="det">${weak.length ? "weak " + weak.join(", ") : ""}${weak.length && resist.length ? " &nbsp; " : ""}${resist.length ? "resists " + resist.join(", ") : ""}</div></div>`;
      }
      if (wt) t += `<div class="det tr">${esc(wt.desc)}</div>`;
      return t;
    }
    // per plant: +1 if the creatures of a wave are mostly weak to it, -1 if mostly resistant
    matchups(p, left) {
      const out = {};
      D.ELEMENTS.forEach((_, el) => {
        let score = 0, total = 0;
        for (const g of p.groups) { const n = left ? left[g.kind] || 0 : g.count; score += n * (D.affinity(g.kind, p.trait)[el] - 1); total += n; }
        const avg = score / Math.max(total, 1);
        out[D.ELEMENT_TOWER[el]] = avg > 0.2 ? 1 : avg < -0.15 ? -1 : 0;
      });
      return out;
    }
    // which creatures a plant's element hurts most, and which shrug it off
    matchupsOf(kind) {
      const el = D.elementOf(kind), strong = [], weak = [];
      for (const e of D.ENEMY_ORDER) { const a = D.affinity(e, null)[el]; if (a > D.WEAK_ABOVE) strong.push(D.ENEMIES[e].name); else if (a < D.RESIST_BELOW) weak.push(D.ENEMIES[e].name); }
      return `${D.ELEMENT_NAMES[el]}. Strong vs ${strong.length ? strong.join(", ") : "none"}.` + (weak.length ? ` Resisted by ${weak.join(", ")}.` : "");
    }

    refresh() {
      $("hearttxt").textContent = `Heart ${S.heartHp}/${S.heartMax}`;
      $("heartfill").style.width = (100 * S.heartRatio()).toFixed(1) + "%";
      $("dew").textContent = `Dew ${S.dew}`;
      $("wave").textContent = `Wave ${S.wave}`;
      for (const kind in this.cards) {
        const b = this.cards[kind], cost = S.towerCost(D.TOWERS[kind].cost), m = this.matchup[kind] || 0;
        b.querySelector(".cost").textContent = `${cost} dew`;
        const tag = b.querySelector(".tag");
        tag.textContent = m > 0 ? "▲ counters" : m < 0 ? "▼ resisted" : "";
        tag.className = "tag" + (m > 0 ? " up" : m < 0 ? " down" : "");
        b.classList.toggle("on", this.selected === kind);
        b.classList.toggle("poor", !S.canAfford(cost));
      }
      const building = S.phase === G.Phase.BUILD;
      if (S.phase !== G.Phase.CHOOSE_BOON) $("boons").classList.remove("show");
      $("wavebtn").style.display = building ? "" : "none";
      $("wavebtn").textContent = `Begin Wave ${S.wave + 1}`;
      $("hint").style.display = S.wave === 0 && building ? "" : "none";
      if (S.phase === G.Phase.GAME_OVER) $("inspector").classList.remove("show");
    }
  }
  G.Hud = Hud;
})();

</script>
<script>/* src/view/menu.js */
/* Menus: the title screen, the in-game pause menu, settings and how-to-play, and the screen shown when
   WebGPU cannot start. Settings live in localStorage ("mossheart.settings") and apply live, except the
   voxel density, which is read here before the bake (this file loads before main.js) and so takes a
   reload. While a menu is open the run is paused (app.paused) and the game's keys are held back.
   ?menu=0 skips the title; the bot and the self-test never see it. */
(function () {
  const G = window.MG, ME = window.ME;
  const KEY = "mossheart.settings";
  const $ = (id) => document.getElementById(id);

  const DEFAULTS = {
    master: 0.9, music: 0.8, sfx: 0.9, ambience: 0.8,
    quality: "high", scale: "auto", look: "cosy", fps: true, shake: true, vs: 16,
  };
  const load = () => { try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { return Object.assign({}, DEFAULTS); } };
  const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* storage blocked */ } };

  // Voxel densities this device may pick: phones and small-memory machines stop at 16. Against 16, the
  // terrain at 20 holds ~2x the voxels and bakes ~1.4x as long, at 24 ~3.4x and ~2.2x (Iris Xe: 6.7 s at
  // 16, 14.8 s at 24; phones bake several times slower). GPU time barely moves: it is per pixel.
  const mobile = /Android|iPhone|iPad|Mobile/.test(navigator.userAgent), mem = navigator.deviceMemory || 8;
  const VS_MAX = mobile || mem <= 4 ? 16 : 24;
  const VS_NAMES = { 8: "Chunky (8)", 12: "Coarse (12)", 16: "Standard (16)", 20: "Fine (20)", 24: "Ultra (24)" };
  G.vsChoices = () => ME.VS_LEVELS.filter((v) => v <= VS_MAX);
  // before the bake: the saved density, unless ?vs= pins one
  const boot = load();
  if (!ME.vsPinned) ME.setVS(Math.min(VS_MAX, boot.vs));

  const QUALITY = {
    low: { shafts: false, glass: false, grass: false, critters: false, particles: true, water: true },
    medium: { shafts: false, glass: true, grass: true, critters: true, particles: true, water: true },
    high: { shafts: true, glass: true, grass: true, critters: true, particles: true, water: true },
  };

  // (a function: the key labels follow the player's keyboard layout, ME.keys)
  const HOWTO = () => `
    <p><b>Keep the Heart Tree alive.</b> Creatures of the blight walk the road to it; every one that arrives hurts it.</p>
    <p>Tap a <b>seed card</b>, then tap the moss to plant it. Plants cost dew; creatures you stop drop more.</p>
    <p>Tap a plant to <b>Grow</b> it (up to level 3) or <b>Uproot</b> it for 60% of its dew back.</p>
    <p><b>Begin Wave</b> sends the next wave. The <b>wave almanac</b> lists what is coming, what each creature is
      weak to (▲) and what it resists (▼). Seed cards are marked the same way.</p>
    <p>A steady halo on a creature means it resists the plant hitting it; pulsing veins mean it is weak to it.</p>
    <p>After each wave the garden offers a gift. Every 5th wave brings the Blight Spirit.</p>
    <p class="dim">Drag to pan, pinch or wheel to zoom, ${ME.keys.text("{KeyQ}/{KeyE} turn. Keys: 1–4 seeds, Space wave, {KeyU} grow, {KeyF} speed, {KeyM} sound, Esc pause.")}</p>`;

  class Menu {
    // app: the live app (ME.app); act: { setSpeed, restart, saved, continueRun } (saved() -> the saved run
    // or null; continueRun() replaces the run with it)
    constructor(app, act) {
      this.app = app; this.act = act; this.s = load(); this.open = "";
      app.paused = false;
      const root = document.createElement("div");
      root.id = "menus";
      root.innerHTML = `
        <div id="title" class="veil menu"><div class="col">
          <h1>Mossheart</h1><p class="sub">a cozy roguelike tower defence in a voxel bell jar</p>
          <button class="btn pink big" data-a="play">Play</button>
          <button class="btn big" data-a="new">New garden</button>
          <button class="btn big" data-a="settings">Settings</button>
          <button class="btn big" data-a="howto">How to play</button>
        </div></div>
        <div id="pause" class="veil menu"><div class="panel card">
          <h2>Paused</h2>
          <button class="btn pink big" data-a="resume">Resume</button>
          <button class="btn big" data-a="settings">Settings</button>
          <button class="btn big" data-a="howto">How to play</button>
          <button class="btn big" data-a="restart">Plant anew</button>
          <button class="btn big" data-a="title">Main menu</button>
        </div></div>
        <div id="settings" class="veil menu"><div class="panel card wide"><h2>Settings</h2><div id="setbody"></div>
          <button class="btn pink big" data-a="back">Done</button></div></div>
        <div id="howto" class="veil menu"><div class="panel card wide"><h2>How to play</h2><div class="howto">${HOWTO()}</div>
          <button class="btn pink big" data-a="back">Back</button></div></div>`;
      document.body.appendChild(root);
      ME.keys.onChange(() => { root.querySelector(".howto").innerHTML = HOWTO(); });
      root.addEventListener("click", (e) => { const b = e.target.closest("[data-a]"); if (b) this.action(b.dataset.a); });
      $("pausebtn").addEventListener("click", () => this.show("pause"));
      // menus hold the game's keys back; Esc opens the pause menu or steps back out of a menu
      window.addEventListener("keydown", (e) => {
        if (e.target && e.target.tagName === "INPUT" && e.key !== "Escape") return;
        // (with a seed or a plant picked, Esc first lets go of it: the game's own key)
        if (e.key === "Escape" && !this.open && (app.hud.selected || app.scene.selected)) return;
        if (e.key === "Escape") { e.stopImmediatePropagation(); if (this.open) this.action(this.open === "title" ? "play" : this.open === "pause" ? "resume" : "back"); else this.show("pause"); }
        else if (this.open) e.stopImmediatePropagation();
      }, true);
      // a phone backgrounding the tab mid-run comes back paused
      document.addEventListener("visibilitychange", () => { if (document.hidden && !this.open && this.inRun()) this.show("pause"); });
      this.apply();
      const skip = !ME.qn("menu", 1) || ME.qn("autoplay", 0) || ME.qn("selftest", 0);
      if (!skip) this.show("title");
    }

    inRun() { const g = this.app.game; return !!g && (G.state.wave > 0 || g.towers.length > 0) && G.state.phase !== G.Phase.GAME_OVER; }
    show(name, from) {
      for (const id of ["title", "pause", "settings", "howto"]) $(id).classList.toggle("show", id === name);
      if (name === "settings" || name === "howto") this.back = from || this.open || "pause";
      if (name === "settings") this.renderSettings();
      if (name === "title") {
        // Continue: the run going on, or else a run saved before a reload (with the wave it is at)
        const d = this.inRun() ? null : this.saved();
        $("title").querySelector('[data-a="play"]').innerHTML = this.inRun() ? "Continue" : d ? `Continue <small>wave ${d.wave + 1}</small>` : "Play";
      }
      this.open = name || "";
      this.app.paused = !!name;
      document.body.dataset.menu = name || "";
      if (this.app.audio) this.app.audio.unlock();
    }
    saved() { return this.act.saved ? this.act.saved() : null; }
    action(a) {
      if (a === "play" && !this.inRun() && this.saved()) { this.act.continueRun(); this.show(""); }
      else if (a === "play" || a === "resume") this.show("");
      else if (a === "new" || a === "restart") { this.act.restart(); this.show(""); }
      else if (a === "settings" || a === "howto") this.show(a, this.open);
      else if (a === "title") this.show("title");
      else if (a === "back") this.show(this.back || "pause");
      else if (a === "reload") location.reload();
    }

    // ------------------------------------------------------------------ settings
    set(k, v) { this.s[k] = v; save(this.s); this.apply(); }
    apply() {
      const s = this.s, R = this.app.R, a = this.app.audio;
      Object.assign(R.set, QUALITY[s.quality] || QUALITY.high);
      if (!ME.params.has("preset")) R.applyPreset(s.look);
      if (!ME.params.has("scale")) {
        if (s.scale === "auto") R.set.autoScale = !ME.qn("selftest", 0);
        else { R.set.autoScale = false; R.set.scale = +s.scale; }
      }
      $("fps").style.visibility = s.fps ? "" : "hidden";
      G.shake = s.shake ? 1 : 0;
      if (a && a.mixer) {
        const bus = a.mixer.bus, set = (n, v) => { if (bus[n] && bus[n].gain) bus[n].gain.value = v * s.master; };
        set("Music", s.music); set("Sfx", s.sfx); set("Ambience", s.ambience);
      }
    }
    renderSettings() {
      const s = this.s, body = $("setbody");
      const slider = (k, label) => `<label class="row"><span>${label}</span><input type="range" min="0" max="1" step="0.05" value="${s[k]}" data-k="${k}"><em>${Math.round(s[k] * 100)}%</em></label>`;
      const choice = (k, label, opts) => `<div class="row"><span>${label}</span><div class="seg">${opts.map(([v, t]) => `<button class="${String(s[k]) === String(v) ? "on" : ""}" data-k="${k}" data-v="${v}">${t}</button>`).join("")}</div></div>`;
      const vsNow = ME.VS, vsNote = s.vs !== vsNow && !ME.vsPinned ? `<div class="note">Takes effect on reload. <button class="btn" data-a="reload">Reload now</button></div>` : ME.vsPinned ? `<div class="note">Pinned to ${vsNow} by the page address (?vs=).</div>` : "";
      body.innerHTML =
        `<h3>Sound</h3>` + slider("master", "Volume") + slider("music", "Music") + slider("sfx", "Effects") + slider("ambience", "Ambience") +
        `<h3>Graphics</h3>` +
        choice("quality", "Quality", [["low", "Low"], ["medium", "Medium"], ["high", "High"]]) +
        choice("scale", "Render scale", [["auto", "Auto"], ["0.6", "60%"], ["0.8", "80%"], ["1", "100%"]]) +
        choice("look", "Light", [["cosy", "Cosy"], ["morning", "Morning"], ["clear", "Clear"]]) +
        choice("vs", "Voxel density", G.vsChoices().map((v) => [v, VS_NAMES[v]])) +
        `<div class="note dim">Voxels per tile edge. Finer looks smoother and bakes longer (now ${vsNow}).${VS_MAX < 24 ? " This device stops at 16." : ""}</div>` + vsNote +
        `<h3>Game</h3>` + choice("shake", "Screen shake", [[true, "On"], [false, "Off"]]) + choice("fps", "Show fps", [[true, "On"], [false, "Off"]]);
      body.querySelectorAll("input[type=range]").forEach((el) => el.addEventListener("input", () => { this.set(el.dataset.k, +el.value); el.nextElementSibling.textContent = Math.round(el.value * 100) + "%"; }));
      body.querySelectorAll(".seg button").forEach((el) => el.addEventListener("click", () => {
        const k = el.dataset.k, raw = el.dataset.v, v = raw === "true" ? true : raw === "false" ? false : k === "vs" ? +raw : raw;
        this.set(k, v); this.renderSettings();
      }));
    }
  }
  G.Menu = Menu;

  // When the boot fails: what went wrong and what the player can do about it, instead of a bare error.
  G.bootFailed = function (e) {
    const l = $("loading"), esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const adv = e.advice || null;
    let tips = adv ? adv.tips : [];
    if (!navigator.gpu) tips = ["This browser has no WebGPU. Use Chrome or Edge (desktop or Android 12+), or Safari 26+."];
    const detail = [e.message, "UA: " + navigator.userAgent].concat(adv ? adv.tried.map((t) => "requestAdapter " + t.opts + " → " + (t.ok ? "ok" : "none") + (t.err ? " (" + t.err + ")" : "")) : []).join("\n");
    l.style.display = "";
    l.innerHTML = `<div class="box fail-box"><h1>Mossheart</h1><div class="fail">${esc(e.message || String(e))}</div>` +
      (tips.length ? `<ul class="tips">${tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : "") +
      `<details><summary>Details</summary><pre>${esc(detail)}</pre></details>` +
      `<button class="btn" id="copydiag">Copy details</button> <button class="btn" onclick="location.reload()">Try again</button></div>`;
    const c = $("copydiag");
    if (c) c.addEventListener("click", () => { try { navigator.clipboard.writeText(detail); c.textContent = "Copied"; } catch (x) { c.textContent = "Copy failed"; } });
  };
})();

<script>/* src/audio/score.js */
/* The score's material (from music_director.gd): Hisaishi-style progressions in F major (the "royal road"
   IV-V-iii-vi, a descending bass line with a borrowed bVII), darker ones for the battle, the boss and
   the outro, two-bar melody rhythms, melodic steps, electric-piano comping patterns, the music-box
   figure each kind of creature is announced with, the cues the director crossfades between (one per
   phase of a run) and the sting of a cleared wave. Pure data; music.js plays it. */
(function () {
  const G = window.MG;
  // A chord: a bass note, a rootless voicing for the electric piano and `dark`, a borrowed minor colour
  // the blight swaps in as it spreads.
  const C = (bass, notes, dark) => ({ bass, notes, dark });
  const BBMAJ9 = C(46, [57, 60, 62, 65], [56, 60, 61, 65]), C9SUS = C(48, [58, 62, 65, 67], [58, 61, 65, 67]), AM9 = C(45, [55, 59, 60, 64], [55, 60, 63, 67]);
  const DM9 = C(50, [57, 60, 64, 65], [57, 61, 64, 65]), GM9 = C(43, [57, 58, 62, 65], [58, 61, 65, 67]), C13 = C(48, [58, 62, 64, 69], [58, 61, 64, 68]);
  const FMAJ9 = C(41, [57, 60, 64, 67], [56, 60, 63, 67]), F69 = C(41, [57, 62, 65, 67], [56, 60, 61, 65]), BBMAJ7S11 = C(46, [57, 60, 62, 64], [56, 60, 61, 64]);
  const F_A = C(45, [57, 60, 64, 65], [56, 60, 63, 65]), EBMAJ9 = C(39, [58, 62, 65, 67], [58, 61, 65, 67]), A7B13 = C(45, [55, 61, 65, 69], [55, 61, 65, 68]);
  const A7B9 = C(45, [55, 58, 61, 64], [55, 58, 61, 64]), EBMAJ7S11 = C(39, [57, 58, 62, 67], [57, 58, 62, 66]);

  const PROG_A = [BBMAJ9, C9SUS, AM9, DM9, GM9, C13, FMAJ9, F69]; // IV V iii vi | ii V I
  const PROG_B = [DM9, BBMAJ7S11, F_A, GM9, EBMAJ9, C9SUS, FMAJ9, A7B13]; // falling bass, bVII
  const PROG_WAVE = [DM9, BBMAJ9, FMAJ9, C9SUS, DM9, BBMAJ7S11, GM9, C13]; // vi IV I V | vi IV ii V, walking on
  const PROG_TENSE = [DM9, BBMAJ9, GM9, A7B9];
  const PROG_BOSS = [DM9, EBMAJ7S11, BBMAJ9, A7B9];
  const PROG_BOSS_B = [GM9, EBMAJ7S11, DM9, A7B13];
  const PROG_OUTRO = [FMAJ9, DM9, BBMAJ9, C9SUS];
  const PROG_WISTFUL = [BBMAJ9, AM9, DM9, GM9, BBMAJ9, C9SUS, FMAJ9, F69]; // IV iii vi ii | IV V I, looking back

  G.Score = {
    KEY: 65, MAJOR: [0, 2, 4, 5, 7, 9, 11],
    FIRST_CHORD: BBMAJ9,
    PROG_A, PROG_B, PROG_WAVE, PROG_TENSE, PROG_BOSS, PROG_BOSS_B, PROG_OUTRO, PROG_WISTFUL,
    // The cues, one per phase: build (calm keys, guitar and the odd melody), wave (a gentle boom-bap
    // drive), boss (a harp ostinato over a pedal bass and half-time toms: tension, still cosy) and over
    // (solo felt piano, soft and wistful). Each has its tempo and how far intensity pushes it, the
    // progressions its sections take turns with (`tense`: the wave's when the fighting is hard), its
    // swing, the music bus's lowpass and reverb send (calm..intense), and how long it takes to fade in
    // and, when the next cue takes over, to fade out.
    CUES: {
      build: { bpm: 70, drive: 0, progs: [PROG_A, PROG_B], swing: 0.2, lp: [5200, 5600], wet: [0.2, 0.22], fadeIn: 1.5, fadeOut: 2.5 },
      wave: { bpm: 78, drive: 8, progs: [PROG_WAVE, PROG_A], tense: PROG_TENSE, swing: 0.24, lp: [6000, 11000], wet: [0.18, 0.24], fadeIn: 0.8, fadeOut: 2 },
      boss: { bpm: 84, drive: 4, progs: [PROG_BOSS, PROG_BOSS_B], swing: 0.16, lp: [7000, 11500], wet: [0.22, 0.26], fadeIn: 0.6, fadeOut: 2.5 },
      over: { bpm: 58, drive: 0, progs: [PROG_OUTRO, PROG_WISTFUL], swing: 0.2, lp: [2600, 2600], wet: [0.3, 0.3], fadeIn: 3, fadeOut: 3 },
    },
    // a cleared wave: a harp run up F major add9, then the chord rolled on the keys over a low F, a bell

    STING: { run: [53, 57, 60, 65, 67, 69, 72, 76], chord: [57, 60, 64, 67], bass: 41, bell: 77, top: [79, 81] },
    // two-bar melody rhythms: [start, length] in 16ths
    RHYTHMS: [
      [[0, 6], [6, 2], [8, 8], [16, 4], [20, 4], [24, 8]], [[2, 2], [4, 4], [8, 4], [12, 4], [16, 12], [28, 4]],
      [[0, 4], [4, 4], [8, 2], [10, 6], [16, 8], [24, 4], [28, 4]], [[0, 12], [12, 2], [14, 2], [16, 8], [24, 8]],
      [[4, 2], [6, 2], [8, 6], [14, 2], [16, 16]], [[0, 3], [3, 3], [6, 2], [8, 8], [20, 2], [22, 2], [24, 8]],

    STEPS: [-1, -1, -1, 1, 1, 1, -2, 2, 0, 3, -3, 2],

    COMPS: [[0, 6, 10], [0, 10, 14], [0, 3, 8, 11], [0, 8, 14], [0, 6, 11, 14]],
    // music-box figures (chord-tone indices) announcing each kind of creature

})();

<script>/* src/audio/instruments.js */
/* The score's instruments, a sound bank for the audio engine (MA.loadBanks; ports of Synth, synth.gd):
   FM electric piano, additive felt piano, a round bass, Karplus-Strong guitar and harp, a music box, a
   breathy flute, a saw pad, a temple bell, a heartbeat, a dusty lofi kit and vinyl crackle. Each is
   synthesised once at a base pitch; the sequencer pitch-shifts it per note. Keyboards have a "_hi"
   twin so no note is shifted far. Self-contained: it runs in the bank worker with only the DSP
   library L (MA_DSP). */
function MG_INSTRUMENTS(L) {
  const { TAU, TABLE, LOOP_FADE, rnd, rr, ri, n1, smooth, midiHz, svf, table, seam, buf, pluck, ensemble } = L;
  const { exp, sin, min, max, pow, tanh } = Math;

  // name -> [base MIDI note, sample rate]
  const INSTRUMENTS = {
    keys: [57, 32000], keys_hi: [69, 32000], piano: [62, 32000], piano_hi: [76, 32000], bass: [36, 22050], guitar: [52, 32000],
    pad: [57, 22050], celesta: [81, 32000], harp: [57, 32000], flute: [74, 32000], bell: [57, 32000], heartbeat: [40, 22050],
    kick: [36, 22050], snare: [60, 32000], rim: [60, 32000], hat: [60, 32000], ohat: [60, 32000], shaker: [60, 32000], tom: [45, 22050], vinyl: [60, 22050],
  };

  // ------------------------------------------------------------------ instruments
  const SAW = (() => { const h = []; for (let k = 1; k < 25; k++) h.push((1 / k) * exp(-k / 10)); return table(h); })();
  const FLUTE = table([1, 0.22, 0.08, 0.03]);

  // electric piano by two-operator FM: a 1:1 pair whose brightness dies away like a struck tine, a high
  // bell partial for the attack's "tink", a two-stage decay and gentle tape saturation
  function epiano(f, sr, secs) {
    const out = buf(secs, sr), w = (TAU * f) / sr; let ph = 0, tine = 0;
    for (let i = 0; i < out.length; i++) {
      const t = i / sr, index = 1.5 * exp(-t * 3) + 0.22, m = sin(ph);
      const body = sin(ph + index * m) + 0.25 * sin(2 * ph) * exp(-t * 1.6), bell = sin(tine + 0.8 * m) * exp(-t * 26) * 0.16;
      const env = min(t / 0.003, 1) * (0.55 * exp(-t * 2.6) + 0.45 * exp(-t * 0.55));
      out[i] = tanh(1.5 * (body * env + bell)) * min((secs - t) / 0.3, 1);
      ph += w; tine += w * 14;
    }
    return out;
  }
  // felt piano: stiff-string partials from two detuned strings, a muffled hammer, a prompt sound that
  // falls into a long aftersound, and the soft thump of the hammer
  function feltPiano(f, sr, secs) {
    const out = buf(secs, sr), n = out.length, stiff = 0.0004;
    for (let p = 1; p < 11; p++) {
      const fp = f * p * Math.sqrt(1 + stiff * p * p);
      if (fp > sr * 0.45) break;
      const amp = pow(p, -1.5) * exp(-0.3 * (p - 1)), decay = 0.9 + 0.45 * p;
      for (const det of [-0.25, 0.3]) {
        const w = (TAU * (fp + det)) / sr, k1 = exp(-decay / sr), k2 = exp((-decay * 0.22) / sr);
        let ph = rnd() * TAU, e1 = 0.65 * amp, e2 = 0.35 * amp;
        for (let i = 0; i < n; i++) { out[i] += sin(ph) * (e1 + e2); ph += w; e1 *= k1; e2 *= k2; }
      }
    }
    let lp = 0;
    for (let i = 0; i < n; i++) { const t = i / sr; lp += 0.08 * (n1() - lp); out[i] = (out[i] + lp * exp(-t * 90) * 0.6) * min(t / 0.004, 1) * min((secs - t) / 0.4, 1); }
    return out;
  }
  // a round fingered bass: sine with soft harmonics that fade after the pluck, and the finger's click
  function bass(f, sr, secs) {
    const out = buf(secs, sr), w = (TAU * f) / sr; let ph = 0, lp = 0;
    for (let i = 0; i < out.length; i++) {
      const t = i / sr, x = sin(ph) + 0.4 * sin(2 * ph) * exp(-t * 3) + 0.15 * sin(3 * ph) * exp(-t * 6);
      lp += 0.2 * (n1() - lp);
      const env = min(t / 0.006, 1) * (0.5 * exp(-t * 1.6) + 0.5 * exp(-t * 0.4)) * min((secs - t) / 0.25, 1);
      out[i] = tanh(1.3 * x * env) + lp * exp(-t * 80) * 0.25; ph += w;
    }
    return out;
  }
  // nylon guitar: a mellow plucked string through a wooden body resonance
  function guitar(f, sr, secs) { const s = pluck(f, sr, secs, 0.4994, 0.35), body = svf(sr); for (let i = 0; i < s.length; i++) s[i] = s[i] + body(s[i], 210, 0.4) * 0.6; return s; }
  // music box: a plucked steel comb, bright stretched partials ringing down over a purer fundamental
  function musicBox(f, sr, secs) {
    const out = buf(secs, sr), ratios = [1, 2, 3.01, 4.17, 5.43], amps = [1, 0.25, 0.12, 0.18, 0.08], decays = [1.6, 3.5, 6, 9, 14];
    for (let k = 0; k < ratios.length; k++) {
      if (f * ratios[k] > sr * 0.45) continue;
      const w = (TAU * f * ratios[k]) / sr, kd = exp(-decays[k] / sr); let ph = 0, e = amps[k];
      for (let i = 0; i < out.length; i++) { out[i] += sin(ph) * e; ph += w; e *= kd; }
    }
    for (let i = 0; i < out.length; i++) out[i] *= min(i / sr / 0.0015, 1);
    return out;
  }
  function fluteNote(f, sr, secs) {
    const out = buf(secs, sr), mask = TABLE - 1, inc = (f * TABLE) / sr; let ph = 0, noise = 0;
    for (let i = 0; i < out.length; i++) {
      const t = i / sr; ph += inc * (1 + 0.004 * sin(TAU * 5.2 * t) * smooth(0.25, 0.7, t));
      noise += 0.12 * (n1() - noise);
      const env = min(t / 0.07, 1) * min((secs - t) / 0.5, 1) * (0.92 + 0.08 * sin(TAU * 5.2 * t));
      out[i] = (FLUTE[Math.floor(ph) & mask] + noise * 0.15) * env;
    }
    return out;
  }
  // temple bell (rin): inharmonic partials ringing down at different rates, the fundamental beating slowly
  function bell(f, sr, secs) {
    const out = buf(secs, sr), ratios = [1, 1.003, 2.756, 5.404, 8.933], amps = [0.7, 0.5, 0.6, 0.35, 0.2], decays = [0.5, 0.55, 0.9, 1.6, 2.6];
    for (let i = 0; i < out.length; i++) { const t = i / sr; let v = 0; for (let k = 0; k < 5; k++) v += sin(TAU * f * ratios[k] * t) * amps[k] * exp(-t * decays[k]); out[i] = v * min(t / 0.003, 1); }
    return out;
  }
  // a heartbeat: a low "lub" and a softer "dub"
  function heartbeat(f, sr, secs) {
    const out = buf(secs, sr);
    for (const [start, amp] of [[0, 1], [0.28, 0.7]]) { let ph = 0; for (let i = Math.floor(start * sr); i < out.length; i++) { const t = i / sr - start; ph += (f * (1 + 0.5 * exp(-t * 30))) / sr; out[i] += sin(TAU * ph) * exp(-t * 14) * min(t / 0.004, 1) * amp; } }
    return out;
  }
  // drums, soft and dusty, for a lofi kit
  function kick(sr, secs) {
    const out = buf(secs, sr); let ph = 0, lp = 0;
    for (let i = 0; i < out.length; i++) { const t = i / sr; ph += (TAU * (46 + 90 * exp(-t * 30))) / sr; lp += 0.3 * (n1() - lp); out[i] = tanh(2 * (sin(ph) * (0.6 * exp(-t * 9) + 0.4 * exp(-t * 4)) + lp * exp(-t * 250) * 0.35)); }
    return out;
  }
  function snare(sr, secs) {
    const out = buf(secs, sr), f = svf(sr); let lp = 0;
    for (let i = 0; i < out.length; i++) {
      const t = i / sr, tone = sin(TAU * 185 * t) * exp(-t * 28) * 0.55 + sin(TAU * 320 * t) * exp(-t * 34) * 0.3, noise = f(n1(), 2000, 0.9) * exp(-t * 15) * 1.6;
      lp += 0.45 * (tone + noise - lp); out[i] = lp * min(t / 0.001, 1); // dusty: no fizz above ~5 kHz
    }
    return out;
  }
  // side stick: a woody click on the rim
  function rim(sr, secs) {
    const out = buf(secs, sr), hi = svf(sr), lo = svf(sr);
    for (let i = 0; i < out.length; i++) { const t = i / sr, x = n1() * exp(-t * 900) + (i === 0 ? 1 : 0); out[i] = (hi(x, 1750, 0.06) + lo(x, 480, 0.1) * 0.7) * exp(-t * 30); }
    return out;
  }
  // hi-hat: bright noise with the lows taken out; `damp` sets how fast it closes
  function hat(sr, secs, damp) {
    const out = buf(secs, sr), f = svf(sr); let lp = 0;
    for (let i = 0; i < out.length; i++) { const t = i / sr, x = n1(); lp += 0.55 * (x - lp); out[i] = ((x - lp) * 0.6 + f(x, 5200, 0.5) * 0.8) * min(t / 0.0015, 1) * exp(-t * damp); }
    return out;
  }
  function shaker(sr, secs) { const out = buf(secs, sr); let lp = 0; for (let i = 0; i < out.length; i++) { const t = i / sr, x = n1(); lp += 0.3 * (x - lp); out[i] = (x - lp) * min(t / 0.015, 1) * exp(-t * 28); } return out; }
  // a soft, low tom
  function tom(f, sr, secs) {
    const out = buf(secs, sr); let ph = 0, lp = 0;
    for (let i = 0; i < out.length; i++) { const t = i / sr; ph += (TAU * f * (1 + 0.35 * exp(-t * 18))) / sr; lp += 0.15 * (n1() - lp); out[i] = tanh(1.4 * (sin(ph) * exp(-t * 5.5) + lp * exp(-t * 60) * 0.4)); }
    return out;
  }
  // record noise: soft hiss and rumble with crackle, and now and then a pop
  function vinyl(sr, secs) {
    const out = buf(secs, sr), n = out.length; let hiss = 0, rumble = 0;
    for (let i = 0; i < n; i++) { const x = n1(); hiss += 0.35 * (x - hiss); rumble += 0.004 * (x - rumble); out[i] = hiss * 0.05 + rumble * 0.9; }
    for (let k = 0; k < Math.floor(secs * 14); k++) {
      const at = ri(0, n - 40), amp = rr(0.04, 0.22) * (rnd() < 0.05 ? 3 : 1), len = ri(2, 12), sg = rnd() < 0.5 ? 1 : -1;
      for (let j = 0; j < len; j++) out[at + j] += sg * amp * exp(-j * 0.5) * (j % 2 === 0 ? 1 : -0.6);
    }
    return out;
  }

  function render(name) {
    const [base, sr] = INSTRUMENTS[name], f = midiHz(base);
    let s;
    switch (name) {
      case "keys": case "keys_hi": s = epiano(f, sr, 4); break;
      case "piano": case "piano_hi": s = feltPiano(f, sr, 4.5); break;
      case "bass": s = bass(f, sr, 2.4); break;
      case "guitar": s = guitar(f, sr, 2.8); break;
      case "pad": s = ensemble(SAW, f, sr, 5, 4, 7, 1.4, 1.6, 0.09); break;
      case "celesta": s = musicBox(f, sr, 2.4); break;
      case "harp": s = pluck(f, sr, 2.6); break;
      case "flute": s = fluteNote(f, sr, 2.2); break;
      case "bell": s = bell(f, sr, 5); break;
      case "heartbeat": s = heartbeat(f, sr, 0.9); break;
      case "kick": s = kick(sr, 0.55); break;
      case "snare": s = snare(sr, 0.4); break;
      case "rim": s = rim(sr, 0.15); break;
      case "hat": s = hat(sr, 0.1, 60); break;
      case "ohat": s = hat(sr, 0.6, 7); break;
      case "shaker": s = shaker(sr, 0.22); break;
      case "tom": s = tom(f, sr, 0.7); break;
      case "vinyl": s = seam(vinyl(sr, 8 + LOOP_FADE), Math.floor(LOOP_FADE * sr)); break;
    }
    return { data: s, sr, loop: name === "vinyl" };
  }
  return { salt: 1234, items: INSTRUMENTS, render };
}

</script>
<script>/* src/audio/sfx.js */
/* Every sound effect, a sound bank for the audio engine (MA.loadBanks; port of SfxBank, sfx_bank.gd):
   noise, filters, pitch sweeps and grains for the plants, hits, creatures, the garden, its wildlife and
   the valley's ambience. Loops (waterfall, stream, wind) are rendered long and cross-faded into
   themselves. A name ending in a number is a take (hit_thorn_2 is the third take of hit_thorn), so
   repeated hits differ. Self-contained: it runs in the bank worker with only the DSP library L. */
function MG_SFX(L) {
  const { TAU, LOOP_FADE, rnd, rr, n1, lerp, smooth, svf, seam, grains } = L;
  const { exp, sin, min, max, pow, PI } = Math;

  // name -> [seconds, sample rate, loops]
  const SOUNDS = {
    thorn_fire: [0.2, 32000], sun_fire: [0.55, 32000], puff_fire: [0.6, 22050], wisp_fire: [0.7, 32000], plant: [0.55, 22050], grow: [0.8, 22050], uproot: [0.6, 22050],
    hit_thorn_0: [0.2, 32000], hit_thorn_1: [0.2, 32000], hit_thorn_2: [0.2, 32000], hit_sun_0: [0.32, 32000], hit_sun_1: [0.32, 32000], hit_sun_2: [0.32, 32000],
    hit_puff_0: [0.28, 32000], hit_puff_1: [0.28, 32000], hit_puff_2: [0.28, 32000], hit_wisp_0: [0.5, 32000], hit_wisp_1: [0.5, 32000], hit_wisp_2: [0.5, 32000],
    mat_grub: [0.22, 22050], mat_beetle: [0.14, 32000], mat_moth: [0.16, 32000], mat_golem: [0.32, 22050], mat_spirit: [0.45, 22050],
    hit_weak: [0.45, 32000], hit_resist: [0.32, 32000],
    grub: [0.45, 22050], beetle: [0.45, 32000], moth: [0.7, 22050], golem: [0.5, 22050], spirit: [2.6, 22050], spawn: [1.0, 22050],
    death_pop: [0.4, 32000], death_crumble: [0.9, 22050], death_boss: [2.4, 22050], heart_hurt: [0.9, 22050],

    // soil being dug (low grains) and leaves settling

    },
    // roots tearing (dense crackle), then a pop as it comes free
    uproot(s, sr) {

    },
    // a seed striking home: a click, a short woody knock and a few splinters
    hit_thorn(s, sr, take) {
      const wood = svf(sr), knock = [880, 1010, 760][take]; let ph = 0;
      for (let i = 0; i < s.length; i++) { const t = i / sr, x = n1(), click = x * exp(-t * 900); ph += (150 - 50 * min(t * 25, 1)) / sr; s[i] = click * 0.8 + wood(click + x * exp(-t * 200) * 0.3, knock, 0.07) * exp(-t * 38) * 2 + sin(TAU * ph) * exp(-t * 40) * 0.5; }

    // a sunbeam scorching: a hot pop, a sizzle sweeping down and crackling embers

    // spores bursting against it: a soft "pff", powdery sparkle, a dull bump

    // spirit light: a glassy chime shimmering as two near-twins beat, over a breathy whoosh

    // soft flesh: a wet squelch that sinks in pitch

    // chitin: two hard clacks, the second quieter

    },
    // powdery wings: a papery flutter
    mat_moth(s, sr) { let lp = 0; for (let i = 0; i < s.length; i++) { const t = i / sr, x = n1(); lp += 0.4 * (x - lp); s[i] = (x - lp) * (0.5 + 0.5 * sin(TAU * 70 * t)) * min(t / 0.004, 1) * exp(-t * 22); } return s; },
    // stone: a hollow knock, a low thud and grit trickling off
    mat_golem(s, sr) {
      const stone = svf(sr); let ph = 0;

    },
    // something not quite there: a hollow, wavering "whum"
    mat_spirit(s, sr) { const voice = svf(sr); let ph = 0; for (let i = 0; i < s.length; i++) { const t = i / sr; ph += (210 + 18 * sin(TAU * 7 * t)) / sr; s[i] = (sin(TAU * ph) * 0.6 + voice(n1(), 720, 0.25) * 0.8) * min(t / 0.02, 1) * exp(-t * 8); } return s; },
    // a weak spot gives way: a crunchy crack, a bright rising "shing" and a sparkle (C7 and G7, in key)

    // shrugged off: a muffled "tunk" and a ricochet whining away

    // a wet squelch and a low blorp

    // a heavy stone footfall and the gravel it shifts

  }
  return { salt: 4242, items: SOUNDS, render };
}

<script>/* src/audio/music.js */
/* Adaptive lofi score (port of the Music autoload, music_director.gd): cosy, unhurried, a little Ghibli.

   The audio engine's sequencer (MA.Sequencer) runs a swung 16th grid; this director decides what plays
   on it, from the score's material (score.js): warm electric-piano chords, a round bass, a felt-piano
   melody composed per section (a two-bar motif, repeated, lifted, then answered with a cadence) and a
   dusty boom-bap kit, all under vinyl crackle and a gentle tape wobble.

   The score is a set of cues, one per phase of a run (score.js, CUES):
   - build: keys, bass, a lone rim click, a melody every other section and a nylon guitar picking the
     chord in between;
   - wave: the drums come in, the keys comp, the melody sings every section, and hard fighting opens the
     filter, thickens the hats and turns the harmony to D minor;
   - boss (a boss wave): darker progressions, a harp ostinato over a pedal bass, half-time toms, the
     flute on the melody and a pad under every bar;
   - over: the tape winds down to a stop, then a slow solo felt piano with a soft pad.
   A cue plays on one of two decks, each its own copy of the music sub-buses (audio.js). On a phase or
