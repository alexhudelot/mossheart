<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mossheart</title>
<style>
/* Mossheart HUD: the Godot build's paper-and-ink look (ink text on warm paper, moss and blossom edges),
   touch sized, inset from the safe areas; on narrow screens the seed cards share the bottom row. */
:root {
  --ink: #38452e; --paper: rgba(250, 242, 219, 0.94); --paper2: #fffaf0; --moss: #6b9952; --blossom: #ed8ca8;
  --dewc: #2e7399; --bg: #0b0d09; --shadow: 0 3px 8px rgba(26, 38, 13, 0.28);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body { color: var(--ink); font: 600 15px/1.3 "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.panel { background: var(--paper); border: 3px solid var(--moss); border-radius: 16px; box-shadow: var(--shadow); }
.btn { font: inherit; color: var(--ink); background: var(--paper); border: 3px solid var(--moss); border-radius: 16px; box-shadow: var(--shadow); cursor: pointer; touch-action: manipulation; }
.btn:hover { background: var(--paper2); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid #fff6; outline-offset: 2px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.pink { border-color: var(--blossom); }
.btn.small { width: 54px; height: 48px; font-size: 20px; padding: 0; }
.btn.small.on { background: #e3f0d6; }
.btn.small.off { color: #9a8f7a; }

#top { position: fixed; left: calc(12px + var(--sl)); top: calc(12px + var(--st)); display: flex; gap: 20px; align-items: center; padding: 8px 16px; }
#hearttxt { font-size: 16px; }
.hbar { width: 150px; height: 12px; background: #d9d1b8; border-radius: 7px; overflow: hidden; margin-top: 3px; }
#heartfill { height: 100%; width: 100%; background: var(--blossom); border-radius: 7px; transition: width 0.25s; }
#dew { color: var(--dewc); font-size: 22px; }
#wave { font-size: 22px; }
#topright { position: fixed; right: calc(12px + var(--sr)); top: calc(12px + var(--st)); display: flex; gap: 8px; align-items: center; pointer-events: none; }
#topright > * { pointer-events: auto; }
#fps { color: #fffd; font: 12px ui-monospace, Consolas, monospace; text-shadow: 0 0 4px #000; margin-right: 6px; pointer-events: none; }

#almanac { position: fixed; right: calc(12px + var(--sr)); top: calc(72px + var(--st)); width: min(370px, calc(100vw - 24px)); max-height: calc(100vh - 290px); overflow: auto;
  background: rgba(26, 23, 18, 0.84); border: 3px solid #8c6b42; border-radius: 14px; color: #ede6d1; padding: 6px 12px 8px; font-weight: 500; font-size: 14px; }
#almtog { background: none; border: 0; color: #fadb9e; font: 700 15px/1.6 inherit; font-family: inherit; padding: 0; cursor: pointer; }
#almbody .wv { margin-top: 6px; }
#almbody .wn { color: #f6dca0; }
#almbody .wt { color: #b5aa92; }
#almbody .tr { color: #ffb070; }
#almbody .ln { margin: 2px 0; }
#almbody .ln.gone { color: #6f685c; }
#almbody .det { font-size: 12.5px; margin-left: 16px; color: #d8cfba; }
#almbody .legend { font-size: 12px; color: #a99f8a; margin-top: 6px; }
.hide { display: none !important; }

#hint { position: fixed; left: 50%; top: calc(86px + var(--st)); transform: translateX(-50%); color: #fff; font-size: 21px; text-align: center; pointer-events: none;
  text-shadow: 0 0 3px #26401c, 0 0 6px #26401c, 0 2px 8px #26401c; width: min(600px, calc(100vw - 32px)); }

#seeds { position: fixed; left: calc(12px + var(--sl)); bottom: calc(12px + var(--sb)); display: flex; gap: 10px; }
.seed { position: relative; width: 136px; height: 104px; padding: 8px 8px 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
  font: inherit; color: var(--ink); background: var(--paper); border: 3px solid var(--acc); border-radius: 16px; box-shadow: var(--shadow); cursor: pointer; touch-action: manipulation; }
.seed b { font-size: 15px; line-height: 1.15; }
.seed .cost { color: var(--dewc); font-size: 14px; }
.seed .tag { font-size: 13px; }
.seed .tag.up { color: #3f8a2a; }
.seed .tag.down { color: #b0485a; }
.seed .dot { position: absolute; right: 9px; top: 9px; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
.seed.on { background: #fffbe8; transform: translateY(-6px); box-shadow: 0 8px 14px rgba(26, 38, 13, 0.35), 0 0 0 3px #fff8 inset; }
.seed.poor { opacity: 0.55; }
#wavebtn { position: fixed; right: calc(12px + var(--sr)); bottom: calc(12px + var(--sb)); width: 210px; height: 104px; font-size: 24px; }

#inspector { position: fixed; left: calc(12px + var(--sl)); top: 50%; transform: translateY(-50%); width: 280px; padding: 12px 14px; display: none; flex-direction: column; gap: 8px; }
#inspector.show { display: flex; }
#insptitle { font-size: 21px; }
#inspbody { font-weight: 500; font-size: 14.5px; }
#inspbody .dim { color: #6b7560; }
#inspector .btn { height: 52px; font-size: 18px; }

.veil { position: fixed; inset: 0; display: none; place-items: center; background: rgba(20, 31, 15, 0.45); animation: fade 0.35s; padding: 16px; }
.veil.show { display: grid; }
.veil.dark { background: rgba(13, 15, 26, 0.55); animation-duration: 1.2s; }
.veil h2 { color: #fffae6; font-size: 30px; text-align: center; margin: 0 0 16px; text-shadow: 0 2px 8px #1a260d; }
.veil .col { display: flex; flex-direction: column; align-items: center; }
#boonrow { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.boon { width: 250px; min-height: 180px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: center; justify-content: center;
  font: inherit; color: var(--ink); background: var(--paper); border: 3px solid var(--blossom); border-radius: 16px; box-shadow: var(--shadow); cursor: pointer; }
.boon:hover { background: var(--paper2); transform: translateY(-3px); }
.boon b { font-size: 21px; }
.boon span { font-weight: 500; font-size: 16px; }
.card { padding: 20px 24px; text-align: center; width: min(480px, calc(100vw - 32px)); }
.card h2 { color: var(--ink); text-shadow: none; }
.card p { font-size: 19px; font-weight: 500; }
.card .btn { width: 100%; height: 66px; font-size: 24px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

#floats { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; left: 0; top: 0; font: 800 17px/1 "Trebuchet MS", system-ui, sans-serif; white-space: nowrap; opacity: 0; will-change: transform, opacity;
  text-shadow: 0 0 2px #1a260d, 0 0 4px #1a260d, 0 1px 3px #1a260d; }
#flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(214, 48, 92, 0.6) 100%); }
.help { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(8px + var(--sb)); color: #fffb; font-size: 12px; font-weight: 500; text-shadow: 0 0 4px #000; pointer-events: none; white-space: nowrap; }

#lost { position: fixed; inset: 0; display: none; place-items: center; background: rgba(7, 8, 6, 0.9); z-index: 20; }
#lost button { font: 600 16px "Trebuchet MS", system-ui, sans-serif; padding: 12px 22px; border-radius: 10px; border: 1px solid #f6dca0; background: #1d2018; color: #e9e4cf; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 0 16px; color: #e9e4cf; }
#loading .box { width: min(440px, 100%); text-align: center; }
#loading h1 { font: 700 30px "Trebuchet MS", system-ui, sans-serif; letter-spacing: 0.04em; margin: 0 0 4px; color: #f6dca0; }
#loading p { color: #9a967f; margin: 0 0 18px; font-weight: 500; }
#track { height: 6px; background: #1d2018; border-radius: 3px; overflow: hidden; }
#bar { height: 100%; width: 0; background: linear-gradient(90deg, #6f9a3a, #e0b25c); transition: width 0.15s; }
#bartxt { margin-top: 8px; color: #9a967f; font: 12px ui-monospace, Consolas, monospace; }
.fail { color: #ff9b7a; white-space: pre-wrap; line-height: 1.5; }
.fail small { display: block; color: #9a967f; margin-top: 10px; }
#log, #result { display: none; }

@media (max-width: 760px) {
  #top { gap: 10px; padding: 6px 10px; border-radius: 13px; left: calc(6px + var(--sl)); top: calc(6px + var(--st)); }
  .hbar { width: 84px; }
  #hearttxt { font-size: 13px; }
  #dew, #wave { font-size: 16px; }
  #topright { right: calc(6px + var(--sr)); top: calc(6px + var(--st)); }
  .btn.small { width: 44px; height: 42px; font-size: 17px; }
  #fps { display: none; }
  #almanac { top: calc(56px + var(--st)); right: calc(6px + var(--sr)); max-height: 45vh; font-size: 13px; }
  #hint { top: auto; bottom: calc(166px + var(--sb)); font-size: 17px; }
  #seeds { left: calc(6px + var(--sl)); right: calc(6px + var(--sr)); bottom: calc(6px + var(--sb)); gap: 6px; }
  .seed { flex: 1; width: auto; min-width: 0; height: 80px; padding: 6px 6px 4px; border-radius: 13px; }
  .seed b { font-size: 12.5px; }
  .seed .cost, .seed .tag { font-size: 11.5px; }
  .seed .dot { width: 9px; height: 9px; right: 6px; top: 6px; }
  #wavebtn { right: calc(6px + var(--sr)); bottom: calc(94px + var(--sb)); width: 156px; height: 56px; font-size: 18px; border-radius: 13px; }
  #inspector { left: calc(6px + var(--sl)); top: auto; bottom: calc(158px + var(--sb)); transform: none; width: min(320px, calc(100vw - 12px)); padding: 10px 12px; gap: 6px; }
  #inspector .btn { height: 44px; font-size: 16px; }
  #insptitle { font-size: 18px; }
  #inspbody { font-size: 13px; }
  .boon { width: min(320px, calc(100vw - 32px)); min-height: 0; padding: 12px; gap: 6px; }
  .boon b { font-size: 18px; }
  .boon span { font-size: 14px; }
  #boonrow { gap: 10px; }
  .veil h2 { font-size: 24px; }
  .help { display: none; }
}
@media (prefers-reduced-motion: reduce) { .veil, .seed, #heartfill, #bar { animation: none; transition: none; } }

/* menus (view/menu.js): title, pause, settings, how to play; the boot failure screen */
.menu { z-index: 10; overflow: auto; }
body[data-menu]:not([data-menu=""]) #ui { visibility: hidden; }
#title { background: linear-gradient(180deg, rgba(11, 13, 9, 0.15), rgba(11, 13, 9, 0.6)); }
#title h1 { font: 700 clamp(44px, 11vw, 76px)/1 "Trebuchet MS", system-ui, sans-serif; letter-spacing: 0.04em; color: #f6dca0; margin: 0; text-shadow: 0 3px 14px #1a260d, 0 0 2px #1a260d; }
#title .sub { color: #fffae6; margin: 8px 0 26px; font-weight: 500; text-align: center; text-shadow: 0 1px 6px #1a260d; }
#title .btn.big { width: min(300px, calc(100vw - 48px)); }
.btn.big { display: block; width: 100%; height: 58px; font-size: 21px; margin: 0 0 10px; }
.card.wide { width: min(560px, calc(100vw - 32px)); text-align: left; max-height: calc(100vh - 32px); overflow: auto; }
.card.wide h2 { text-align: center; }
#setbody h3 { font-size: 16px; color: var(--moss); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.06em; }
#setbody .row { display: flex; align-items: center; gap: 10px; min-height: 42px; }
#setbody .row > span { width: 120px; flex: none; }
#setbody input[type=range] { flex: 1; accent-color: var(--moss); height: 28px; }
#setbody .row em { width: 44px; text-align: right; font-style: normal; color: #6b7560; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.seg button { font: inherit; font-size: 14px; color: var(--ink); background: #efe6c9; border: 2px solid #cdbf98; border-radius: 10px; padding: 7px 10px; cursor: pointer; touch-action: manipulation; }
.seg button.on { background: #e3f0d6; border-color: var(--moss); }
#setbody .note { font-size: 13px; font-weight: 500; margin: 2px 0 6px 130px; }
#setbody .note .btn { font-size: 14px; padding: 4px 10px; border-radius: 10px; margin-left: 6px; }
.dim { color: #6b7560; }
.howto p { font-weight: 500; font-size: 15.5px; margin: 0 0 10px; }
.fail-box { text-align: left; }
.fail-box h1 { text-align: center; }
.tips { color: #e9e4cf; font-weight: 500; padding-left: 20px; line-height: 1.45; }
.fail-box details { color: #9a967f; margin: 8px 0 14px; }
.fail-box pre { white-space: pre-wrap; word-break: break-all; font: 11px ui-monospace, Consolas, monospace; }
.fail-box .btn { padding: 8px 14px; font-size: 15px; }
@media (max-width: 760px) {
  #setbody .row > span { width: 92px; font-size: 14px; }
  #setbody .note { margin-left: 0; }
  .btn.big { height: 50px; font-size: 18px; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="flash"></div>
<div id="floats"></div>
<div id="ui">
  <div id="top" class="panel">
    <div id="heart"><div id="hearttxt">Heart 20/20</div><div class="hbar"><div id="heartfill"></div></div></div>
    <div id="dew">Dew 0</div>
    <div id="wave">Wave 0</div>
  </div>
  <div id="topright"><span id="fps"></span><button id="sound" class="btn small" title="sound (M)">♪</button><button id="speed" class="btn small" title="speed (F)">1x</button><button id="pausebtn" class="btn small" title="menu (Esc)">☰</button></div>
  <div id="almanac"><button id="almtog">Wave almanac  ▾</button><div id="almbody"></div></div>
  <div id="hint">Tap a seed, then tap the meadow to plant it</div>
  <div id="inspector" class="panel"><div id="insptitle"></div><div id="inspbody"></div><button id="grow" class="btn">Grow</button><button id="uproot" class="btn pink">Uproot</button></div>
  <div id="seeds"></div>
  <button id="wavebtn" class="btn pink">Begin Wave 1</button>
  <div id="boons" class="veil"><div class="col"><h2>The garden offers a gift</h2><div id="boonrow"></div></div></div>
  <div id="over" class="veil dark"><div class="panel card"><h2>The Heart Tree sleeps</h2><p id="overtxt"></p><button id="again" class="btn pink">Plant anew</button></div></div>
  <div class="help">drag pan · wheel zoom · Q/E turn · 1–4 seeds · space wave</div>
</div>
<div id="loading"><div class="box"><h1>Mossheart</h1><p>a cozy roguelike tower defence in a voxel bell jar</p><div id="track"><div id="bar"></div></div><div id="bartxt">loading</div></div></div>
<div id="lost"><button onclick="location.reload()">The GPU was reset · tap to reload</button></div>
<script>
  // A copy of this page without its folders (src/, ../MossheartEngine/) cannot load its scripts: say so
  // instead of a loading bar that never moves. tools\artifact.ps1 builds a single-file copy that can travel.
  window.addEventListener("error", (e) => {
    const s = e.target;
    if (!s || s.tagName !== "SCRIPT" || window.__missing) return;
    window.__missing = s.getAttribute("src");
    const b = document.querySelector("#loading .box");
    if (b) b.insertAdjacentHTML("beforeend", `<div class="fail">The game's files did not load (${window.__missing}).<small>This page needs the folders that sit next to it. To play from a single downloaded file, use mossheart.html (the one-file build).</small></div>`);
  }, true);
</script>
<pre id="log"></pre>
<pre id="result"></pre>
<!-- Mossheart generator (vendored with the engine): models, styles, the Momiji Valley map -->
<script>/* ../MossheartEngine/vendor/gen/px.js */
/* Pixel-art engine: palette-indexed buffers with depth, iso cube terrain,
   SDF models ray-marched straight to quantised pixels, pixel-space post. */
(function () {
  const P = (window.PX = {});
  const SQ3 = Math.sqrt(3);

  P.hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  P.ramp = (s) => s.trim().split(/\s+/).map(P.hex);
  P.rng = (seed) => { let s = (seed * 2654435761) >>> 0 || 1; return () => ((s = Math.imul(s ^ (s >>> 15), 0x2c1b3c6d) + 0x6d2b79f5 >>> 0) / 4294967296); };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  P.clamp = clamp;
  P.smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ------------------------------------------------------------------ noise
  function hash(x, y, z, s) {
    let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x61c88647) ^ Math.imul((s | 0) + 1, 0x3c6ef372);
    h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d); h = Math.imul(h ^ (h >>> 12), 0x297a2d39); h ^= h >>> 15;
    return (h >>> 0) / 4294967296;
  }
  P.hash = hash;
  const fade = (t) => t * t * (3 - 2 * t);
  function noise(x, y, z = 0, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const u = fade(x - xi), v = fade(y - yi), w = fade(z - zi);
    const c = (a, b, d) => hash(xi + a, yi + b, zi + d, s);
    const l = (a, b, t) => a + (b - a) * t;
    return l(l(l(c(0, 0, 0), c(1, 0, 0), u), l(c(0, 1, 0), c(1, 1, 0), u), v), l(l(c(0, 0, 1), c(1, 0, 1), u), l(c(0, 1, 1), c(1, 1, 1), u), v), w);
  }
  P.noise = noise;
  P.fbm = (x, y, z = 0, s = 0, o = 3) => { let a = 0, f = 1, amp = 0.5, n = 0; for (let i = 0; i < o; i++) { a += noise(x * f, y * f, z * f, s + i * 17) * amp; n += amp; f *= 2.03; amp *= 0.5; } return a / n; };
  // Nearest jittered feature point; returns a shared object (copy what you need).
  const CELL = { f1: 0, f2: 0, x: 0, y: 0, z: 0, id: 0 };
  P.cell = function (x, y, z, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let f1 = 9, f2 = 9;
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = xi + dx, cy = yi + dy, cz = zi + dz;
      const px = cx + hash(cx, cy, cz, s), py = cy + hash(cx, cy, cz, s + 1), pz = cz + hash(cx, cy, cz, s + 2);
      const d = (px - x) * (px - x) + (py - y) * (py - y) + (pz - z) * (pz - z);
      if (d < f1) { f2 = f1; f1 = d; CELL.x = px; CELL.y = py; CELL.z = pz; CELL.id = hash(cx, cy, cz, s + 3); } else if (d < f2) f2 = d;
    }
    CELL.f1 = Math.sqrt(f1); CELL.f2 = Math.sqrt(f2); return CELL;
  };
  P.cell2 = function (x, y, s = 0) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9, f2 = 9;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = xi + dx, cy = yi + dy;
      const px = cx + 0.15 + 0.7 * hash(cx, cy, 0, s), py = cy + 0.15 + 0.7 * hash(cx, cy, 0, s + 1);
      const d = (px - x) * (px - x) + (py - y) * (py - y);
      if (d < f1) { f2 = f1; f1 = d; CELL.x = px; CELL.y = py; CELL.id = hash(cx, cy, 0, s + 3); } else if (d < f2) f2 = d;
    }
    CELL.f1 = Math.sqrt(f1); CELL.f2 = Math.sqrt(f2); return CELL;
  };
  // HD moss: shade a soft height field of cushions (no cells), darker in the hollows. Ln: light direction.
  P.velvetAt = function (td, X, Y, base, Ln) {
    const f = td.scale ?? 1.6, e = 0.02, sd = td.seed ?? 13;
    const hf = (x, y) => P.fbm(x * f, y * f, 0, sd, 3) + 0.4 * P.fbm(x * f * 3.3, y * f * 3.3, 0, sd + 50, 2);
    const h0 = hf(X, Y), gx = (hf(X + e, Y) - h0) / e, gy = (hf(X, Y + e) - h0) / e, amp = td.amp ?? 0.22;
    const nx = -gx * amp, ny = -gy * amp, nl = Math.sqrt(nx * nx + ny * ny + 1);
    let s = base + ((nx * Ln[0] + ny * Ln[1] + Ln[2]) / nl - Ln[2]) * (td.k ?? 1.1) + (h0 - 0.7) * (td.hk ?? 0.35);
    if (td.fuzz) s += (noise(X * 46, Y * 46, 0, 41) - 0.5) * td.fuzz + (noise(X * 110, Y * 110, 0, 42) - 0.5) * td.fuzz * 0.3;
    if (td.flowers && hash(Math.floor(X * 9), Math.floor(Y * 9), 0, 44) > 1 - td.flowers && Math.hypot((X * 9 % 1) - 0.5, (Y * 9 % 1) - 0.5) < 0.16) return { ramp: td.flowerRamp, s: 0.75 + (0.5 - (Y * 9 % 1)) * 0.6 };
    return { ramp: td.top2 && P.fbm(X * 0.45, Y * 0.45, 0, 29) > 1 - (td.mix ?? 0.3) ? td.top2 : td.top, s };
  };

  falls({
    id: "mf-falls", name: "Momiji Falls", jp: "紅葉の滝", map: FALLS, seed: 43, dumpMap: true,
    deco: [MAPLE({ x: 1, y: 5 }), ["lantern", { t: 0.2 }, 10, 12], ["basin", { sz: 1.0 }, 5, 3],
      ["hotaru", { t: 0.1 }, 11, 5], ["puffcap", { t: 0.4 }, 9, 3], ["sprout", { t: 0.6 }, 8, 5], ["piglet", { t: 0.2 }, 12, 6], ["pillbug", { t: 0.5 }, 10, 5],
      ["mound", { seed: 1, sz: 1.5 }, 1, 8], ["mound", { seed: 2, sz: 1.3 }, 11, 9], ["mound", { seed: 5, sz: 1.2 }, 4, 12], ["niwaki", { seed: 6, H: 1.6, girth: 0.75, spread: 0.6, padR: 0.44, n: 5, flat: 0.24, mat: "maple", bumps: 3 }, 2, 10],

  falls({

<script>/* ../MossheartEngine/src/me.js */
/* Mossheart Engine POC: shared namespace, logging, URL params and column-major mat4 helpers.
   Everything hangs off window.ME, the same way the generator hangs off window.PX. */
(function () {
  const ME = (window.ME = { VS: 16 });

  // ------------------------------------------------------------------ log (also the self-test channel)
  ME.lines = [];
  ME.errors = [];
  ME.log = (...a) => {
    const s = a.map((x) => (typeof x === "string" ? x : JSON.stringify(x))).join(" ");
    ME.lines.push(s);
    console.log(s);
    const el = document.getElementById("log");
    if (el) el.textContent = ME.lines.slice(-400).join("\n");
  };
  ME.err = (...a) => { ME.errors.push(a.join(" ")); ME.log("ERROR", ...a); };
  window.addEventListener("error", (e) => ME.err("JS", e.message, (e.filename || "").split("/").pop() + ":" + e.lineno));
  window.addEventListener("unhandledrejection", (e) => ME.err("PROMISE", (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)));

  ME.VERSION = "0.2";
  ME.params = new URLSearchParams(location.search);
  ME.q = (k, d) => (ME.params.has(k) ? ME.params.get(k) : d);
  ME.qn = (k, d) => (ME.params.has(k) ? parseFloat(ME.params.get(k)) : d);

  // ------------------------------------------------------------------ keys by physical position
  // A key binding is a position on the keyboard (KeyboardEvent.code: KeyQ, KeyW, Digit1...), so it stays
  // in the same place on every layout: Q/E on QWERTY are A/E on AZERTY. label(code) is what that key
  // shows on the user's layout, for help text. It comes from the keys pressed so far, else the browser's
  // layout map (navigator.keyboard), else a guess (AZERTY for French, else QWERTY) that the first letter
  // pressed corrects. Shortcuts with Ctrl (undo, save) stay on e.key: they follow the letter, not the place.
  //   ME.keys.code(e) -> e.code; for an event without one (synthetic, old browsers), the QWERTY code of e.key
  //   ME.keys.is(e, ...codes) -> true if e is one of them; "Digit1" also matches "Numpad1"
  //   ME.keys.digit(e) -> 0-9 from the digit row or the numpad (no Shift needed on AZERTY), else -1
  //   ME.keys.label(code) -> "A" for "KeyQ" on AZERTY;  ME.keys.text(s): each {Code} in s becomes its label
  //   ME.keys.layout -> "qwerty" | "azerty" | "qwertz";  ME.keys.onChange(fn): the labels changed
  {
    const K = (ME.keys = {}), seen = new Map(), subs = [];
    const SWAP = { qwerty: {}, azerty: { KeyQ: "A", KeyA: "Q", KeyW: "Z", KeyZ: "W", Semicolon: "M", KeyM: ",", Comma: ";", Period: ":" }, qwertz: { KeyY: "Z", KeyZ: "Y" } };
    const NAMES = { Space: "Space", Comma: ",", Period: ".", Semicolon: ";", BracketLeft: "[", BracketRight: "]", Escape: "Esc", Delete: "Del", Backspace: "Backspace", Home: "Home", Enter: "Enter" };
    const FROM_KEY = { " ": "Space", ",": "Comma", ".": "Period", ";": "Semicolon", "[": "BracketLeft", "]": "BracketRight" };
    let map = null, mapLayout = null;
    const lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
    K.layout = /^fr(-fr|-be|-lu|-mc)?$/.test(lang) ? "azerty" : "qwerty";
    const changed = () => subs.forEach((f) => { try { f(); } catch (e) { ME.err("KEYS", e.message); } });
    // what a letter key's character says of the layout: one of the three, or only which one it is not
    const layoutOf = (code, ch) => ({ KeyQ: { A: "azerty", Q: "!azerty" }, KeyA: { Q: "azerty", A: "!azerty" }, KeyW: { Z: "azerty", W: "!azerty" }, KeyZ: { W: "azerty", Y: "qwertz", Z: "qwerty" }, KeyY: { Z: "qwertz", Y: "!qwertz" } }[code] || {})[ch];
    K.code = (e) => {
      if (e.code) return e.code;
      const k = e.key || "";
      if (/^[a-z]$/i.test(k)) return "Key" + k.toUpperCase();
      if (/^[0-9]$/.test(k)) return "Digit" + k;
      return FROM_KEY[k] || k;
    };
    K.is = (e, ...codes) => { const c = K.code(e); return codes.some((x) => c === x || (x.startsWith("Digit") && c === "Numpad" + x.slice(5))); };
    K.digit = (e) => { const m = /^(?:Digit|Numpad)(\d)$/.exec(K.code(e)); return m ? +m[1] : -1; };
    K.label = (code) => {
      const d = /^(?:Digit|Numpad)(\d)$/.exec(code);
      if (d) return d[1];
      const s = seen.get(code) || (map && mapLayout === K.layout ? map.get(code) : null);
      if (s) return s.length === 1 ? s.toUpperCase() : s;
      if (SWAP[K.layout][code]) return SWAP[K.layout][code];
      const m = /^Key([A-Z])$/.exec(code);
      return m ? m[1] : NAMES[code] || code;
    };
    K.text = (s) => s.replace(/\{(\w+)\}/g, (_, c) => K.label(c));
    K.onChange = (fn) => { subs.push(fn); };
    // what a real key press shows: its character (a letter or punctuation, not a digit: AZERTY's
    // unshifted digit row is & é " ' ...) and the layout it gives away
    K.learn = (e) => {
      if (!e.code || !e.key || e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey || /^(Digit|Numpad)/.test(e.code)) return;
      const ch = e.key.toUpperCase(), was = K.label(e.code);
      seen.set(e.code, ch);
      let L = layoutOf(e.code, ch);
      if (L && L[0] === "!") L = K.layout === L.slice(1) ? "qwerty" : null; // not that one: QWERTY
      // a new layout (the user switched): what was learned on the old one goes
      if (L && L !== K.layout) { seen.clear(); seen.set(e.code, ch); K.layout = L; changed(); } else if (was !== K.label(e.code)) changed();
    };
    // forgets what was learned (tests)
    K.reset = (layout) => { seen.clear(); K.layout = layout || (mapLayout || "qwerty"); changed(); };
    window.addEventListener("keydown", (e) => { if (e.isTrusted) K.learn(e); }, true);
    try {
      if (navigator.keyboard && navigator.keyboard.getLayoutMap) {
        navigator.keyboard.getLayoutMap().then((m) => {
          map = m;
          mapLayout = m.get("KeyQ") === "a" ? "azerty" : m.get("KeyY") === "z" ? "qwertz" : "qwerty";
          if (!seen.size) K.layout = mapLayout;
          changed();
        }, () => {});
      }
    } catch (e) { /* no layout map (an iframe without the permission): guess and learn */ }
  }

  // Voxels per tile edge: every bake reads ME.VS (and stores it as T.VS). An app picks one of VS_LEVELS
  // with ME.setVS before it bakes; ?vs=N overrides the app's choice. Memory and bake time grow with VS³:
  // 32-64 are for close-up asset work (64 bakes the whole library in about 190 s), never for a phone (24 at most).
  ME.VS_LEVELS = [8, 12, 16, 20, 24, 32, 48, 64];
  ME.setVS = (n) => { const L = ME.VS_LEVELS; ME.VS = L.reduce((b, v) => (Math.abs(v - n) < Math.abs(b - n) ? v : b), L[0]); return ME.VS; };
  ME.vsPinned = ME.params.has("vs");
  if (ME.vsPinned) ME.setVS(ME.qn("vs", 16));

  // Let the page paint between bake steps, but only every ~40 ms: each real yield costs a frame, and the
  // bake calls this often. A message-channel post is not clamped like setTimeout.
  const ch = new MessageChannel(), waiting = [];
  ch.port1.onmessage = () => waiting.shift()();
  let lastYield = 0;
  ME.tick = () => {
    if (performance.now() - lastYield < 40) return Promise.resolve();
    return new Promise((r) => { waiting.push(() => { lastYield = performance.now(); r(); }); ch.port2.postMessage(0); });
  };
  ME.progress = (label, f) => {
    const bar = document.getElementById("bar"), txt = document.getElementById("bartxt");
    if (bar) bar.style.width = Math.round(f * 100) + "%";
    if (txt) txt.textContent = label;
  };
  ME.now = () => performance.now();

  // ------------------------------------------------------------------ mat4, column-major (WGSL layout)
  const M4 = (ME.m4 = {});
  M4.fromRows = (r) => { const m = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) m[j * 4 + i] = r[i][j]; return m; };
  M4.mul = (a, b) => {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; }
    return o;
  };
  M4.apply = (m, p) => [0, 1, 2].map((r) => m[r] * p[0] + m[4 + r] * p[1] + m[8 + r] * p[2] + m[12 + r]);
  M4.inv = (m) => {
    const a = Array.from(m), inv = new Float32Array(16);
    inv[0] = a[5] * a[10] * a[15] - a[5] * a[11] * a[14] - a[9] * a[6] * a[15] + a[9] * a[7] * a[14] + a[13] * a[6] * a[11] - a[13] * a[7] * a[10];
    inv[4] = -a[4] * a[10] * a[15] + a[4] * a[11] * a[14] + a[8] * a[6] * a[15] - a[8] * a[7] * a[14] - a[12] * a[6] * a[11] + a[12] * a[7] * a[10];
    inv[8] = a[4] * a[9] * a[15] - a[4] * a[11] * a[13] - a[8] * a[5] * a[15] + a[8] * a[7] * a[13] + a[12] * a[5] * a[11] - a[12] * a[7] * a[9];
    inv[12] = -a[4] * a[9] * a[14] + a[4] * a[10] * a[13] + a[8] * a[5] * a[14] - a[8] * a[6] * a[13] - a[12] * a[5] * a[10] + a[12] * a[6] * a[9];
    inv[1] = -a[1] * a[10] * a[15] + a[1] * a[11] * a[14] + a[9] * a[2] * a[15] - a[9] * a[3] * a[14] - a[13] * a[2] * a[11] + a[13] * a[3] * a[10];
    inv[5] = a[0] * a[10] * a[15] - a[0] * a[11] * a[14] - a[8] * a[2] * a[15] + a[8] * a[3] * a[14] + a[12] * a[2] * a[11] - a[12] * a[3] * a[10];
    inv[9] = -a[0] * a[9] * a[15] + a[0] * a[11] * a[13] + a[8] * a[1] * a[15] - a[8] * a[3] * a[13] - a[12] * a[1] * a[11] + a[12] * a[3] * a[9];
    inv[13] = a[0] * a[9] * a[14] - a[0] * a[10] * a[13] - a[8] * a[1] * a[14] + a[8] * a[2] * a[13] + a[12] * a[1] * a[10] - a[12] * a[2] * a[9];
    inv[2] = a[1] * a[6] * a[15] - a[1] * a[7] * a[14] - a[5] * a[2] * a[15] + a[5] * a[3] * a[14] + a[13] * a[2] * a[7] - a[13] * a[3] * a[6];
    inv[6] = -a[0] * a[6] * a[15] + a[0] * a[7] * a[14] + a[4] * a[2] * a[15] - a[4] * a[3] * a[14] - a[12] * a[2] * a[7] + a[12] * a[3] * a[6];
    inv[10] = a[0] * a[5] * a[15] - a[0] * a[7] * a[13] - a[4] * a[1] * a[15] + a[4] * a[3] * a[13] + a[12] * a[1] * a[7] - a[12] * a[3] * a[5];
    inv[14] = -a[0] * a[5] * a[14] + a[0] * a[6] * a[13] + a[4] * a[1] * a[14] - a[4] * a[2] * a[13] - a[12] * a[1] * a[6] + a[12] * a[2] * a[5];
    inv[3] = -a[1] * a[6] * a[11] + a[1] * a[7] * a[10] + a[5] * a[2] * a[11] - a[5] * a[3] * a[10] - a[9] * a[2] * a[7] + a[9] * a[3] * a[6];
    inv[7] = a[0] * a[6] * a[11] - a[0] * a[7] * a[10] - a[4] * a[2] * a[11] + a[4] * a[3] * a[10] + a[8] * a[2] * a[7] - a[8] * a[3] * a[6];
    inv[11] = -a[0] * a[5] * a[11] + a[0] * a[7] * a[9] + a[4] * a[1] * a[11] - a[4] * a[3] * a[9] - a[8] * a[1] * a[7] + a[8] * a[3] * a[5];
    inv[15] = a[0] * a[5] * a[10] - a[0] * a[6] * a[9] - a[4] * a[1] * a[10] + a[4] * a[2] * a[9] + a[8] * a[1] * a[6] - a[8] * a[2] * a[5];
    const det = a[0] * inv[0] + a[1] * inv[4] + a[2] * inv[8] + a[3] * inv[12];
    for (let i = 0; i < 16; i++) inv[i] /= det;
    return inv;
  };

  // sRGB byte -> linear float
  ME.lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
})();

<script>/* ../MossheartEngine/src/gpu.js */
/* WebGPU device setup, error capture and small resource helpers. */
(function () {
  const ME = window.ME;

  // Adapter requests in order: a core adapter, then a compatibility one (WebGPU on OpenGL ES / D3D11,
  // which Chrome offers on phones whose Vulkan driver it does not trust). ?compat=1 asks for compatibility
  // first, ?compat=2 also keeps the device a compatibility one (tests). ME.gpuTried records what each
  // request gave, for the failure screen.
  ME.requestAdapter = async function () {
    const core = [{ powerPreference: "high-performance" }, {}], compat = [{ featureLevel: "compatibility" }, { featureLevel: "compatibility", powerPreference: "low-power" }];
    const tries = ME.qn("compat", 0) ? compat.concat(core) : core.concat(compat);
    ME.gpuTried = [];
    for (const o of tries) {
      let a = null, err = "";
      try { a = await navigator.gpu.requestAdapter(o); } catch (e) { err = e.message; }

/* Camera: the generator's 2:1 projection (px.js P.proj) as an affine clip matrix.

    }
  }
  ME.Camera = Camera;
})();

/* SDF evaluation and voxelisation of generator models.
   dPrim / evalModel are copied verbatim from vendor/gen/px.js (private there), plus a function prim (k: 5);

      for (const [r, w] of [[1.5, 0.45], [3.5, 0.35], [7, 0.25]]) { const t = r / vs, dd = S.ev(px + n[0] * t, py + n[1] * t, pz + n[2] * t); occ += w * Math.max(0, (t - dd) / t); }

    }

  };

  // Stamp a placed model into a material grid (terrain bake). place: {X,Y,Z,flip}; grid: {vox,NX,NY,NZ,O,vs}.
  ME.stampModel = function (md, place, grid, pal) {
    const { vs, O, NX, NY, NZ, vox } = grid, K = md.k, R = md.r * K * 1.6 + 0.2, H = md.h * K * 1.45 + 0.2;
    const ix0 = Math.max(0, Math.floor((place.X - R - O[0]) * vs)), ix1 = Math.min(NX, Math.ceil((place.X + R - O[0]) * vs));
    const iy0 = Math.max(0, Math.floor((place.Y - R - O[1]) * vs)), iy1 = Math.min(NY, Math.ceil((place.Y + R - O[1]) * vs));
    const iz0 = Math.max(0, Math.floor((place.Z - 0.45 - O[2]) * vs)), iz1 = Math.min(NZ, Math.ceil((place.Z + H - O[2]) * vs));
    const iK = 1 / K, prims = md.prims, ev = (x, y, z) => evalModel(prims, x * iK, y * iK, z * iK) * K;
    // local model coords for a world voxel centre (flip swaps the model's x and y, as P.flip does for sprites)
    const loc = (ix, iy, iz) => {
      const wx = O[0] + (ix + 0.5) / vs - place.X, wy = O[1] + (iy + 0.5) / vs - place.Y, wz = O[2] + (iz + 0.5) / vs - place.Z;
      return place.flip ? [wy, wx, wz] : [wx, wy, wz];

    const B = 4, hd = ((B / vs) * Math.sqrt(3)) / 2 + 1e-4, thr = 0.3 / vs, h = 0.5 / vs;
    let n = 0;
    for (let bz = iz0; bz < iz1; bz += B) for (let by = iy0; by < iy1; by += B) for (let bx = ix0; bx < ix1; bx += B) {
      const c = loc(bx + B / 2 - 0.5, by + B / 2 - 0.5, bz + B / 2 - 0.5), dc = ev(c[0], c[1], c[2]);
      if (dc > hd + thr) continue;
      for (let z = bz; z < Math.min(iz1, bz + B); z++) for (let y = by; y < Math.min(iy1, by + B); y++) for (let x = bx; x < Math.min(ix1, bx + B); x++) {
        const [lx, ly, lz] = loc(x, y, z), e = ev(lx, ly, lz);
        if (e >= thr) continue;
        let m = EV_M;
        if (md.detail && e > -2 / vs) {
          const nn = normalAt(ev, lx, ly, lz, h); ev(lx, ly, lz);
          m = md.detail(lx / K, ly / K, lz / K, EV_M, nn[0], nn[1], nn[2]) || m;
        }
        vox[(z * NY + y) * NX + x] = pal.id(m || ME.content.defaultMaterial);
        n++;
      }
    }
    return n;
  };

  // Octahedral normal encoding to two bytes.
  ME.octEnc = function (n) {
    const s = Math.abs(n[0]) + Math.abs(n[1]) + Math.abs(n[2]);
    let x = n[0] / s, y = n[1] / s;
    if (n[2] < 0) { const ox = x, oy = y; x = (1 - Math.abs(oy)) * (ox >= 0 ? 1 : -1); y = (1 - Math.abs(ox)) * (oy >= 0 ? 1 : -1); }
    return [Math.round((x * 0.5 + 0.5) * 255), Math.round((y * 0.5 + 0.5) * 255)];
  };

  ME.sdf = { dPrim, evalModel, mat: () => EV_M };
})();

<script>/* ../MossheartEngine/src/palette.js */
/* Materials: name -> 8-bit id, resolved through the style's mats/ramps exactly like px.js does
   (mat.ramp || name). Each material gets a base albedo (its ramp near s = 0.6 + bias), a lighting
   class, and its whole hue-shifted ramp resampled to 16 steps for the ramp-shading mode. */
(function () {
  const ME = window.ME, P = window.PX;
  // lighting classes; which material is which comes from the content (ME.content.materialClass)
  const CLS = (ME.CLS = { DEFAULT: 0, MOSS: 1, FOLIAGE: 2, EMISSIVE: 3, WATER: 4, ROCK: 5, BARK: 6, SKIN: 7 });
  // per-voxel albedo jitter by class (the "voxel grain")
  const VAR = [0.1, 0.12, 0.18, 0, 0.04, 0.16, 0.14, 0.06];

  class Palette {
    constructor(st) { this.st = st; this.names = [null]; this.ids = {}; this.missing = new Set(); }
    id(name) {
      let i = this.ids[name];
      if (i !== undefined) return i;
      i = this.names.length;
      if (i > 255) throw new Error("more than 255 materials");
      this.names.push(name); this.ids[name] = i;
      return i;
    }
    mat(name) { return Object.assign({ ramp: name }, this.st.mats[name] || {}); }
    ramp(name) {
      const M = this.mat(name);
      let spec = this.st.ramps[M.ramp];
      if (!spec) { this.missing.add(name); spec = this.st.ramps.stone; }
      return P.makeRamp(spec);
    }
    // GPU tables: mats = 2 x vec4 per id [albedo.rgb(linear), emissive] [wrap, jitter, bias, class];
    // ramps = 16 x 256 rgba8 (sRGB) rows.
    build() {
      const mats = new Float32Array(256 * 8), ramps = new Uint8Array(16 * 256 * 4), byName = (ME.content && ME.content.materialClass) || {};
      for (let i = 1; i < this.names.length; i++) {
        const name = this.names[i], M = this.mat(name), r = this.ramp(name), n = r.length;
        const cls = M.em ? CLS.EMISSIVE : M.cls ?? CLS[byName[name]] ?? CLS.DEFAULT; // mats may give their class number (cls)
        const s0 = Math.min(1, Math.max(0, 0.6 + (M.bias || 0))), c = r[Math.round(s0 * (n - 1))];
        mats.set([ME.lin(c[0]), ME.lin(c[1]), ME.lin(c[2]), M.em ? 1 : 0, M.wrap ?? 0.25, VAR[cls], M.bias || 0, cls], i * 8);
        for (let j = 0; j < 16; j++) {
          const g = (j / 15) * (n - 1), a = Math.floor(g), b = Math.min(n - 1, a + 1), t = g - a;
          for (let k = 0; k < 3; k++) ramps[(i * 16 + j) * 4 + k] = Math.round(r[a][k] + (r[b][k] - r[a][k]) * t);
          ramps[(i * 16 + j) * 4 + 3] = 255;
        }
      }
      return { mats, ramps };
    }
  }
  ME.Palette = Palette;
})();

</script>
<script>/* ../MossheartEngine/src/bake-terrain.js */
/* Terrain bake: a generator map (the diorama format: tile types, heights, water, a path, deco) voxelised
   at ME.VS voxels per tile edge. Columns rise from the floor to hgt*0.5; the top voxel takes the tile's
   surface (moss carpet, gravel lane with stepping stones, pebble river bed), the next few voxels a hanging
   moss drape, everything below rock. Lips get 1-3 voxel moss overhangs, the island is clipped to its
   circle over a strata drum and a wooden plinth, and static props are stamped in from their SDFs.
   Which material plays each of those roles, and which deco become volumes or walkers instead of terrain,
   comes from the content (ME.content.terrain, .volumeDeco, .walkers). */
(function () {
  const ME = window.ME, P = window.PX, sm = P.smooth;
  // deco names asset packs want as ray-marched volumes (added to the content's volumeDeco)
  ME.VOLUME_DECO = ME.VOLUME_DECO || new Set();

  ME.bakeTerrain = async function (st, pal) {
    const t0 = ME.now(), VS = ME.VS, map = st.map, { C, RI } = map.geo, CT = ME.content;
    const RG = RI + 0.35, DRUM = (st.clip && st.clip.foot) ?? 0.92, PL_R = RG + 0.45, PL_ZB = -2.15, PL_ZT = -1.5, ZF = (map.floor ?? -3) * 0.5;
    const O = [-1, -1, -2.5], NX = 26 * VS, NY = 26 * VS, NZ = 10 * VS, PLANE = NX * NY;
    const vox = new Uint8Array(PLANE * NZ), top = new Int16Array(PLANE).fill(-1);
    const id = (n) => pal.id(n);
    // material ids of the roles (moss, moss2, gravel, stone, rock, earth, pebble, pebble2, wood, brass, litter)
    const M = {};
    for (const k in CT.terrain) if (typeof CT.terrain[k] === "string") M[k] = id(CT.terrain[k]);
    const VOLUME_DECO = new Set([...(CT.volumeDeco || []), ...ME.VOLUME_DECO]), WALKER_DECO = new Set(Object.keys(CT.walkers || {}));
    const kOf = (Z) => Math.round((Z - O[2]) * VS);
    const typ = (x, y) => (x < 0 || y < 0 || x >= map.W || y >= map.H ? "_" : map.typ[y][x]);
    const wetV = (X, Y) => (map.waterD ? map.waterD(X, Y) + (P.fbm(X * 1.3, Y * 1.3, 0, 61) - 0.5) * 0.3 : -1);
    const onLane = (x, y) => { const t = typ(x, y); return t === "u" || t === "t"; };
    const kPB = kOf(PL_ZB), kPT = kOf(PL_ZT), kD = kOf(DRUM), kF = kOf(ZF);
    let wetCols = 0;
    const maples = st.deco.filter((d) => d && CT.terrain.litterTree(d)).map((d) => [d[2] + 0.5, d[3] + 0.5]);

    for (let j = 0; j < NY; j++) {
      if ((j & 31) === 0) { ME.progress("terrain columns " + Math.round((j / NY) * 100) + "%", 0.05 + 0.15 * (j / NY)); await ME.tick(); }
      const Y = O[1] + (j + 0.5) / VS;
      for (let i = 0; i < NX; i++) {
        const X = O[0] + (i + 0.5) / VS, r = Math.hypot(X - C, Y - C), col = j * NX + i;
        if (r > PL_R) continue;
        // wooden plinth with a brass trim on its upper outer edge
        for (let k = kPB; k < kPT; k++) vox[k * PLANE + col] = k === kPT - 1 && r > PL_R - 0.09 ? M.brass : M.wood;
        top[col] = kPT;
        if (r > RG - 0.06) continue;
        // drum: soil strata seen through the glass, a moss lip under the rim, a moss ring on top
        const U = Math.atan2(Y - C, X - C) * RG, shell = r > RG - 0.06 - 2.5 / VS;
        for (let k = kPT; k < kD; k++) {
          let m = M.earth;
          if (shell) {
            const Zc = O[2] + (k + 0.5) / VS, sr = st.strata && P.strataAt(st, U, Zc, 1);
            if (sr) m = id(sr.ramp);
            if (DRUM - Zc < 0.08 + 0.18 * P.fbm(U * 3, 0.5, 0, 71)) m = M.moss;
          }
          vox[k * PLANE + col] = m;
        }
        if (r > RI - 0.12) vox[(kD - 1) * PLANE + col] = P.fbm(X * 0.45, Y * 0.45, 0, 29) > 0.78 ? M.moss2 : M.moss;
        top[col] = kD;
        const cx = Math.floor(X), cy = Math.floor(Y), t = typ(cx, cy);
        if (r > RI || t === "_") continue;
        // terrain column
        const kTop = kOf(map.hgt[cy][cx] * 0.5);
        let kT = kTop, bed = false, wv = -1;
        if (t === "w") {
          wv = wetV(X, Y);
          if (wv > 0) { bed = true; wetCols++; kT = kTop - Math.max(2, Math.round((0.12 + 0.34 * sm(0, 0.9, wv)) * VS)); }
        }
        // surface material and micro relief
        let mTop = M.moss, extra = 0;
        const lx = X - cx, ly = Y - cy;
        if (bed) mTop = P.hash(Math.floor(X * 7), Math.floor(Y * 7), 0, 3) > 0.72 ? M.stone : P.hash(Math.floor(X * 11), Math.floor(Y * 11), 0, 4) > 0.5 ? M.pebble : M.pebble2;
        else if (t === "w") mTop = wv > -0.12 ? M.pebble : M.moss;
        else if (onLane(cx, cy)) {
          mTop = M.gravel;
          // moss creeping in from the lane edges that meet plain moss
          const edge = (dx, dy, dist) => !onLane(cx + dx, cy + dy) && typ(cx + dx, cy + dy) !== "w" && dist < 0.1 + 0.14 * P.noise(X * 9, Y * 9, 0, 21);
          if (edge(-1, 0, lx) || edge(1, 0, 1 - lx) || edge(0, -1, ly) || edge(0, 1, 1 - ly)) mTop = M.moss;
          else { const c = P.cell2(X * 1.25, Y * 1.25, 7); if (c.f1 < 0.27) { mTop = M.stone; extra = 1; } }
        } else {
          mTop = P.fbm(X * 0.45, Y * 0.45, 0, 29) > 0.78 ? M.moss2 : M.moss;
          if (P.fbm(X * 1.6, Y * 1.6, 0, 13) > 0.6) extra = 1; // velvet cushions
          // fallen leaves, thick under the maples and thinning out
          let lf = 0;
          for (const [tx, ty] of maples) { const dd = (X - tx) ** 2 + (Y - ty) ** 2; if (dd < 9) lf = Math.max(lf, 0.16 * Math.exp(-dd / 2.2)); }
          if (lf > 0 && P.hash(Math.floor(X * 9), Math.floor(Y * 9), 0, 44) < lf && Math.hypot(((X * 9) % 1) - 0.5, ((Y * 9) % 1) - 0.5) < 0.42) mTop = M.litter;
        }
        // drape: a couple of voxels of moss under every lip, with hanging strands
        let dd = 2;
        const n1 = P.noise(X * 9, Y * 9, 0, 5);
        if (n1 > 0.52) dd += Math.round((n1 - 0.52) * 30);
        if (P.noise(X * 21, Y * 21, 0, 6) > 0.8) dd += 5;
        const kEnd = kT + extra;
        for (let k = kF; k < kEnd; k++) {
          const dz = kEnd - 1 - k;
          vox[k * PLANE + col] = dz === 0 || (extra && dz === 1 && mTop !== M.stone) ? mTop : dz <= dd && !bed ? (n1 > 0.7 ? M.moss2 : M.moss) : M.rock;
        }
        for (let k = kEnd; k < kD; k++) vox[k * PLANE + col] = 0; // beds carved below the drum top
        top[col] = kEnd;
      }
    }

    // Moss overhangs: where a column stands 4+ voxels above a neighbour, hang 0-3 voxels over the lip.
    ME.progress("moss overhangs", 0.21); await ME.tick();
    const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    let lobes = 0;
    for (let j = 1; j < NY - 1; j++) for (let i = 1; i < NX - 1; i++) {
      const col = j * NX + i, tk = top[col];
      if (tk < 0) continue;
      const X = O[0] + (i + 0.5) / VS, Y = O[1] + (j + 0.5) / VS;
      for (const [dx, dy] of D4) {
        const nc = col + dx + dy * NX, nk = top[nc];
        if (nk < 0 || tk - nk < 4) continue;
        const len = Math.floor(P.noise(X * 7 + dx * 3.1, Y * 7 + dy * 3.1, 0, 9) * 4.6) - 1;
        for (let k = tk - len; k < tk; k++) if (!vox[k * PLANE + nc]) { vox[k * PLANE + nc] = M.moss; lobes++; }
      }
    }

    // Static props stamped into the grid; volume props and walkers are returned for the model bake.
    const grid = { vox, NX, NY, NZ, O, vs: VS };
    const volumes = [], walkers = [];
    let stamped = 0, propCount = 0;
    const deco = st.deco;
    for (let n = 0; n < deco.length; n++) {
      const [name, o, x, y, ex = {}] = deco[n];
      if (!name || !window.MODELS[name]) continue;
      const place = { name, o, X: x + 0.5 + (ex.dx || 0), Y: y + 0.5 + (ex.dy || 0), Z: map.hgt[y][x] * 0.5 + (ex.dz || 0), flip: !!ex.flip };
      if (WALKER_DECO.has(name)) { walkers.push(place); continue; }
      if (VOLUME_DECO.has(name)) { volumes.push(place); continue; }
      if ((n & 7) === 0) { ME.progress("stamping props " + n + "/" + deco.length, 0.22 + 0.1 * (n / deco.length)); await ME.tick(); }
      stamped += ME.stampModel(ME.modelOf(name, o), place, grid, pal);
      propCount++;
    }

    // Ground lamps (content.groundLamps): one kind lining the lanes, another by the water, on moss tiles
    // clear of the props, at least `spacing` tiles apart. Stamped into the grid; each one lights.
    const lights = [], GL = CT.groundLamps;
    if (GL) {
      const surfZ = (X, Y, zFrom) => {
        const i = Math.floor((X - O[0]) * VS), j = Math.floor((Y - O[1]) * VS);
        for (let k = Math.min(NZ - 1, kOf(zFrom)); k >= 0; k--) if (vox[k * PLANE + j * NX + i]) return O[2] + (k + 1) / VS;
        return zFrom;
      };
      const taken = deco.filter((d) => d && window.MODELS[d[0]]).map((d) => [d[2] + 0.5 + ((d[4] && d[4].dx) || 0), d[3] + 0.5 + ((d[4] && d[4].dy) || 0)]);
      const cand = [];
      for (let cy = 0; cy < map.H; cy++) for (let cx = 0; cx < map.W; cx++) {
        if (typ(cx, cy) !== "m" || Math.hypot(cx + 0.5 - C, cy + 0.5 - C) > RI - 1.0) continue;
        let dir = null, kind = null;
        for (const [dx, dy] of D4) {
          const t = typ(cx + dx, cy + dy);
          if (onLane(cx + dx, cy + dy) && map.hgt[cy + dy][cx + dx] === map.hgt[cy][cx]) { dir = [dx, dy]; kind = GL.lane; }
          else if (t === "w" && !dir) { dir = [dx, dy]; kind = GL.water; }
        }
        if (dir) cand.push({ cx, cy, dir, kind, r: P.hash(cx, cy, 0, 61) });
      }
      cand.sort((a, b) => a.r - b.r);
      const placed = [];
      for (const c of cand) {
        if (placed.length >= GL.max) break;
        const side = (P.hash(c.cx, c.cy, 1, 61) - 0.5) * 0.4;
        const X = c.cx + 0.5 + c.dir[0] * 0.3 + (c.dir[1] ? side : 0), Y = c.cy + 0.5 + c.dir[1] * 0.3 + (c.dir[0] ? side : 0);
        if (placed.some((p) => Math.hypot(p.X - X, p.Y - Y) < GL.spacing) || taken.some(([tx, ty]) => Math.hypot(tx - X, ty - Y) < 0.75)) continue;
        const Z = surfZ(X, Y, map.hgt[c.cy][c.cx] * 0.5 + 0.6), o = { seed: 1 + placed.length * 7 }, md = ME.modelOf(c.kind.model, o);
        stamped += ME.stampModel(md, { X, Y, Z, flip: false }, grid, pal);
        placed.push({ X, Y });
        const lp = [X, Y, Z + md.lz * md.k];
        const L = c.kind.light;
        lights.push({ p: lp, r: L.r, col: L.col.slice(), k: L.k, mat: L.mat });
      }
    }

    // Water: one surface quad per wet tile, falls where a wet tile steps down into lower water.
    const water = [], falls = [];
    for (let cy = 0; cy < map.H; cy++) for (let cx = 0; cx < map.W; cx++) {
      if (typ(cx, cy) !== "w") continue;
      let any = false;
      for (let s = 0; s < 64 && !any; s++) any = wetV(cx + ((s % 8) + 0.5) / 8, cy + (Math.floor(s / 8) + 0.5) / 8) > 0;
      if (!any) continue;
      const h = map.hgt[cy][cx], Zw = h * 0.5 - 1.5 / VS;
      let fx = 0, fy = 0;
      for (const [dx, dy] of D4) if (typ(cx + dx, cy + dy) === "w") { const dh = map.hgt[cy + dy][cx + dx] - h; if (dh < 0) { fx += dx; fy += dy; } else if (dh > 0) { fx -= dx; fy -= dy; } }
      const stream = Math.abs(map.waterD(cx + 0.5, cy + 0.5)) < 1 && (fx || fy) ? 1 : 0;
      water.push({ x: cx, y: cy, z: Zw, fx, fy, stream });
      for (const [dx, dy] of D4) {
        if (typ(cx + dx, cy + dy) !== "w") continue;
        const hb = map.hgt[cy + dy][cx + dx];
        if (hb >= h) continue;
        // wet run along the shared edge, sampled just inside the upper tile
        let u0 = 1, u1 = 0;
        for (let s = 0; s < 32; s++) {
          const u = (s + 0.5) / 32, ex = dx ? cx + (dx > 0 ? 1 - 0.5 / VS : 0.5 / VS) : cx + u, ey = dy ? cy + (dy > 0 ? 1 - 0.5 / VS : 0.5 / VS) : cy + u;
          if (wetV(ex, ey) > 0) { u0 = Math.min(u0, u - 0.5 / 32); u1 = Math.max(u1, u + 0.5 / 32); }
        }
        if (u1 <= u0) continue;
        const ztop = Zw, zbot = hb * 0.5 - 1.5 / VS, off = 0.7 / VS;
        // the falling sheet stands just in front of the cliff face, facing the lower tile
        const ex0 = dx ? cx + (dx > 0 ? 1 + off : -off) : cx + u0, ey0 = dy ? cy + (dy > 0 ? 1 + off : -off) : cy + u0;
        const ex1 = dx ? ex0 : cx + u1, ey1 = dy ? ey0 : cy + u1;
        falls.push({ a: [ex0, ey0], b: [ex1, ey1], ztop, zbot, n: [dx, dy] });
      }
    }

    // Density for normals/AO from half resolution up (mip0 = 2x2x2 box average of occupancy, mip1 = 4x4x4) and the coarse occupancy
    // (8 cells per tile, taller than the voxel grid so the tree canopies fit) that feeds the sun volume.
    ME.progress("density mips", 0.33); await ME.tick();
    const d0 = new Uint8Array(PLANE * NZ);
    let solid = 0, kMax = 0;
    for (let i = 0; i < d0.length; i++) if (vox[i]) { d0[i] = 255; solid++; }
    for (let k = NZ - 1; k >= 0 && !kMax; k--) for (let c = 0; c < PLANE; c += 7) if (vox[k * PLANE + c]) { kMax = k; break; }
    const down = (src, nx, ny, nz) => {
      const mx = nx >> 1, my = ny >> 1, mz = nz >> 1, out = new Uint8Array(mx * my * mz);
      for (let z = 0; z < mz; z++) for (let y = 0; y < my; y++) for (let x = 0; x < mx; x++) {
        let s = 0;
        for (let c = 0; c < 8; c++) s += src[((2 * z + (c >> 2)) * ny + 2 * y + ((c >> 1) & 1)) * nx + 2 * x + (c & 1)];
        out[(z * my + y) * mx + x] = s >> 3;
      }
      return out;
    };
    const d1 = down(d0, NX, NY, NZ), d2 = down(d1, NX >> 1, NY >> 1, NZ >> 1);
    const CPU = VS / 2, CX = NX >> 1, CY = NY >> 1, CZ = 13 * CPU, coarse = new Uint8Array(CX * CY * CZ);
    coarse.set(d1); // same origin and cell size for the first NZ/2 layers

    // Beams stand on the tile below their foot point (px3 P.lightAt needs bm.z).
    const beams = (st.light.beams || []).map((b) => Object.assign({}, b, { z: b.z ?? map.hgt[Math.min(map.H - 1, Math.floor(b.y))][Math.min(map.W - 1, Math.floor(b.x))] * 0.5 }));

    // Walkable ground: first solid voxel scanning down from zFrom.

    const stats = { dims: [NX, NY, NZ], solid, wetCols, lobes, props: propCount, lanterns: lights.length, stampedVoxels: stamped, water: water.length, falls: falls.length, zTop: O[2] + (kMax + 1) / VS, ms: Math.round(ME.now() - t0) };

  ME.groundAt = (T) => {

    };

})();

<script>/* ../MossheartEngine/src/greedy.js */
/* Greedy mesher: exposed voxel faces merged into quads by material (per-voxel variation is
   restored in the shader from the voxel coordinate). Faces pointing down are never visible from the
   isometric camera and are dropped. Vertices are 8 bytes: uint16 x,y,z (voxel units) + dir|mat<<3.
   For each 90-degree camera snap the visible quads (up and two sides) are sorted front to back into
   their own index range, so a snapped view is one draw call with good early-Z. */
(function () {
  const ME = window.ME;

  ME.greedyMesh = async function (T) {
    const t0 = ME.now(), { vox, NX, NY, NZ } = T, PLANE = NX * NY;
    let kLo = NZ, kHi = 0;
    for (let k = 0; k < NZ; k++) { const a = k * PLANE; for (let c = 0; c < PLANE; c += 3) if (vox[a + c]) { kLo = Math.min(kLo, k); kHi = Math.max(kHi, k); break; } }
    kLo = Math.max(0, kLo - 1); kHi = Math.min(NZ - 1, kHi + 1);
    const ZN = kHi - kLo + 1;

    let cap = 1 << 18, nq = 0, V = new Uint16Array(cap * 16), CEN = new Float32Array(cap * 3), DIR = new Uint8Array(cap);
    const grow = () => {
      cap *= 2;
      const v2 = new Uint16Array(cap * 16); v2.set(V); V = v2;
      const c2 = new Float32Array(cap * 3); c2.set(CEN); CEN = c2;
      const d2 = new Uint8Array(cap); d2.set(DIR); DIR = d2;
    };
    const emit = (dir, mat, p0, p1, p2, p3) => {
      if (nq >= cap) grow();
      const w = dir | (mat << 3), o = nq * 16;
      V[o] = p0[0]; V[o + 1] = p0[1]; V[o + 2] = p0[2]; V[o + 3] = w;
      V[o + 4] = p1[0]; V[o + 5] = p1[1]; V[o + 6] = p1[2]; V[o + 7] = w;
      V[o + 8] = p2[0]; V[o + 9] = p2[1]; V[o + 10] = p2[2]; V[o + 11] = w;
      V[o + 12] = p3[0]; V[o + 13] = p3[1]; V[o + 14] = p3[2]; V[o + 15] = w;
      CEN[nq * 3] = (p0[0] + p2[0]) / 2; CEN[nq * 3 + 1] = (p0[1] + p2[1]) / 2; CEN[nq * 3 + 2] = (p0[2] + p2[2]) / 2;
      DIR[nq] = dir; nq++;
    };
    // Greedy merge of a W x H mask; quad(i, j, w, h, value) receives each rectangle.
    const merge = (mask, W, H, quad) => {
      for (let j = 0; j < H; j++) for (let i = 0; i < W; ) {
        const n = i + j * W, c = mask[n];
        if (!c) { i++; continue; }
        let w = 1; while (i + w < W && mask[n + w] === c) w++;
        let h = 1;
        outer: for (; j + h < H; h++) for (let k = 0; k < w; k++) if (mask[n + k + h * W] !== c) break outer;
        quad(i, j, w, h, c);
        for (let l = 0; l < h; l++) mask.fill(0, n + l * W, n + l * W + w);
        i += w;
      }
    };

    // +z faces: slice planes between z = s-1 and s
    let mask = new Int16Array(PLANE);
    for (let s = kLo; s <= kHi + 1; s++) {
      if ((s & 15) === 0) { ME.progress("meshing tops " + s, 0.36 + 0.04 * ((s - kLo) / ZN)); await ME.tick(); }
      const a = (s - 1) * PLANE, b = s * PLANE;
      let any = false;
      for (let c = 0; c < PLANE; c++) { const va = s > 0 ? vox[a + c] : 0, vb = s < NZ ? vox[b + c] : 0; const m = va && !vb ? va : 0; mask[c] = m; any = any || m !== 0; }
      if (any) merge(mask, NX, NY, (i, j, w, h, c) => emit(4, c, [i, j, s], [i + w, j, s], [i + w, j + h, s], [i, j + h, s]));
    }
    // x faces: mask over (y, z) per slice s. All slices are filled in one pass along the voxel rows
    // (reading the grid column-wise per slice was cache-hostile), then merged slice by slice.
    ME.progress("meshing x sides", 0.4); await ME.tick();
    const SL = NY * ZN, xm = new Int16Array((NX + 1) * SL), xany = new Uint8Array(NX + 1);
    for (let z = 0; z < ZN; z++) {
      const zo = (z + kLo) * PLANE;
      for (let y = 0; y < NY; y++) {
        const ro = zo + y * NX, mo = y + z * NY;
        let va = 0;
        for (let s = 0; s <= NX; s++) {
          const vb = s < NX ? vox[ro + s] : 0;
          if (va !== vb && !(va && vb)) { xm[s * SL + mo] = va ? va : -vb; xany[s] = 1; }
          va = vb;
        }
      }
    }
    for (let s = 0; s <= NX; s++) {
      if ((s & 31) === 0) { ME.progress("meshing x sides " + s, 0.4 + 0.04 * (s / NX)); await ME.tick(); }
      mask = xm.subarray(s * SL, (s + 1) * SL);
      if (xany[s]) merge(mask, NY, ZN, (i, j, w, h, c) => {
        const z0 = j + kLo, z1 = z0 + h;
        if (c > 0) emit(0, c, [s, i, z0], [s, i + w, z0], [s, i + w, z1], [s, i, z1]);
        else emit(1, -c, [s, i, z0], [s, i + w, z0], [s, i + w, z1], [s, i, z1]);
      });
    }
    // y faces: mask over (x, z)
    mask = new Int16Array(NX * ZN);
    for (let s = 0; s <= NY; s++) {
      if ((s & 31) === 0) { ME.progress("meshing y sides " + s, 0.44 + 0.04 * (s / NY)); await ME.tick(); }
      let any = false;
      const ya = (s - 1) * NX, yb = s * NX;
      for (let z = 0; z < ZN; z++) {
        const zo = (z + kLo) * PLANE;
        for (let x = 0; x < NX; x++) {
          const va = s > 0 ? vox[zo + ya + x] : 0, vb = s < NY ? vox[zo + yb + x] : 0;
          const m = va && !vb ? va : !va && vb ? -vb : 0;
          mask[x + z * NX] = m; any = any || m !== 0;
        }
      }
      if (any) merge(mask, NX, ZN, (i, j, w, h, c) => {
        const z0 = j + kLo, z1 = z0 + h;
        if (c > 0) emit(2, c, [i, s, z0], [i + w, s, z0], [i + w, s, z1], [i, s, z1]);
        else emit(3, -c, [i, s, z0], [i + w, s, z0], [i + w, s, z1], [i, s, z1]);
      });
    }

    // Per-snap visible quads, sorted front to back by rotated depth (X'+Y'+Z).
    ME.progress("sorting quads per snap", 0.49); await ME.tick();
    const snaps = [], lists = [];
    let total = 0;
    for (let k = 0; k < 4; k++) {
      const th = (k * Math.PI) / 2, c = Math.round(Math.cos(th)), s = Math.round(Math.sin(th));
      const vis = [c + s > 0, c + s < 0, c - s > 0, c - s < 0, true];
      const ids = [];
      for (let q = 0; q < nq; q++) if (vis[DIR[q]]) ids.push(q);
      const key = new Float32Array(nq);
      for (const q of ids) key[q] = (c + s) * CEN[q * 3] + (c - s) * CEN[q * 3 + 1] + CEN[q * 3 + 2];
      const arr = Uint32Array.from(ids).sort((a, b) => key[b] - key[a]);
      lists.push(arr); total += arr.length;
    }
    const IDX = new Uint32Array(total * 6);
    let o = 0;
    for (let k = 0; k < 4; k++) {
      snaps.push({ first: o, count: lists[k].length * 6 });
      for (const q of lists[k]) { const b = q * 4; IDX[o++] = b; IDX[o++] = b + 1; IDX[o++] = b + 2; IDX[o++] = b; IDX[o++] = b + 2; IDX[o++] = b + 3; }
    }
    return { verts: V.subarray(0, nq * 16), index: IDX, snaps, quads: nq, ms: Math.round(ME.now() - t0) };
  };
})();

</script>
<script>/* ../MossheartEngine/src/bake-models.js */
/* Model bake: the scene's volume props, its walkers and critters, and any models an app asks for,
   voxelised for the ray-marched volume pass. Animated models are baked as flipbooks over the
   generator's own animation phase o.t. Volumes are laid out brick-aligned (8^3) in a virtual atlas that
   exists only as a brick map; the voxels of occupied bricks live in a dense brick pool. Static volumes
   are also splatted into the coarse occupancy so trees shade the sun volume. Frame counts, walkers,
   critters and glowing materials come from ME.content. */
(function () {
  const ME = window.ME;
  // registries asset packs add to (assets/asset-kit.js and friends), on top of the content pack's tables:
  // flipbook frames per model, emissive material -> point light [r, g, b, k(, radius)]
  ME.FRAMES = ME.FRAMES || {};
  ME.LIGHT_COL = ME.LIGHT_COL || {};

  // opts.walkers = false skips the content's walkers; opts.models = { key: [name, o, frames] } adds
  // flipbooks for an app's own instance layer (returned as extraFrames[key]). Model options o.scale
  // and o.remap (material name -> name) let an app reuse and recolour the content's models.
  ME.bakeModels = async function (T, st, pal, opts = {}) {
    const CT = ME.content, FRAMES = Object.assign({}, ME.FRAMES, CT.flipbookFrames), LIGHT_COL = Object.assign({}, ME.LIGHT_COL, CT.primLights);
    const t0 = ME.now(), VS = ME.VS, variants = [], byKey = new Map();
    const add = (name, o) => {
      const key = name + JSON.stringify(o);
      if (byKey.has(key)) return byKey.get(key);
      const idx = variants.length;
      variants.push({ name, o, key }); byKey.set(key, idx);
      return idx;
    };
    // flipbook frames for a model name, keeping the deco's own options
    const frames = (name, o) => { const n = FRAMES[name] || 1; if (n === 1) return [add(name, o)]; return Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n }))); };

    const statics = T.volumes.map((v) => ({ place: v, frames: frames(v.name, v.o), phase: v.o && v.o.t !== undefined ? v.o.t : 0 }));
    // walkers on the route: the style's own list (st.walkers), else the content's; each is
    // { type, model?, o?, speed, rate, gait: hop | roll | fly, fly? (hover height) }
    const walkerTypes = opts.walkers === false ? [] : st.walkers || Object.entries(CT.walkers || {}).map(([type, w]) => Object.assign({ type }, w)), walkerFrames = {};
    for (const w of walkerTypes) walkerFrames[w.type] = frames(w.model || w.type, w.o || {});
    const extraFrames = {};
    for (const key in opts.models || {}) {
      const [name, o, n] = opts.models[key];
      extraFrames[key] = n > 1 ? Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n }))) : [add(name, o)];
    }
    // critter flipbooks, baked at `fine` x density (o.size overrides the model's own scale)
    const critterFrames = {}, CRITTERS = CT.critters || {};
    for (const key in CRITTERS) {
      const [name, o, n, fine] = CRITTERS[key];
      critterFrames[key] = Array.from({ length: n }, (_, i) => add(name, Object.assign({}, o, { t: i / n, fine })));
    }

    // voxelise every variant
    const vols = [];
    for (let i = 0; i < variants.length; i++) {
      const v = variants[i];
      if ((i & 1) === 0) { ME.progress("voxelising " + v.name + " (" + (i + 1) + "/" + variants.length + ")", 0.5 + 0.3 * (i / variants.length)); await ME.tick(); }
      // critters (o.fine set) are drawn content.critterScale x life size so they read beside the chibi
      // units; app models may set their own scale (o.scale) and recolour materials (o.remap: name -> name)
      const md = ME.modelOf(v.name, v.o), fine = (v.o && v.o.fine) || 1;
      let vf = fine; // o.chunk: voxelise at 1/chunk density and draw scaled back up (the chunky "toy" look)
      if (v.o && v.o.scale) md.k = v.o.scale * fine;
      else if (fine !== 1) md.k = ((v.o && v.o.size) || md.k) * fine * (CT.critterScale ?? 1);
      if (v.o && v.o.chunk) { md.k /= v.o.chunk; vf = 1 / v.o.chunk; }
      if (v.o && v.o.remap) {
        const map = v.o.remap, d0 = md.detail;
        md.detail = (x, y, z, m, nx, ny, nz) => { const r = d0 ? d0(x, y, z, m, nx, ny, nz) || m : m; return map[r] || r; };
      }
      const vx = ME.voxelizeModel(md, VS, pal);
      vx.md = md; vx.name = v.name; vx.fine = vf;
      vols.push(vx);
    }

    // shelf-pack brick-aligned volumes into the atlas; short volumes stack in z inside a column whose
    // footprint fits them (critters and ferns would otherwise each reserve the full atlas depth)
    const pad = (n) => Math.ceil(n / 8) * 8, W = 1024, AZ = Math.max(8, ...vols.map((v) => pad(v.dims[2]))), cols = [];
    let x = 0, y = 0, rowH = 0;
    for (const v of vols) {
      const [nx, ny, nz] = v.dims.map(pad);
      let c = cols.find((c) => c.w >= nx && c.h >= ny && c.w - nx <= 16 && c.h - ny <= 16 && c.z + nz <= AZ);
      if (!c) {
        if (x + nx > W) { x = 0; y += rowH; rowH = 0; }
        c = { x, y, w: nx, h: ny, z: 0 }; cols.push(c);
        x += nx; rowH = Math.max(rowH, ny);
      }
      v.base = [c.x, c.y, c.z]; v.pdims = [nx, ny, nz]; c.z += nz;
    }
    // brick map (one u32 per 8^3 brick of the layout above: 0 = empty, else 1 + pool slot) and a dense
    // pool holding only the occupied bricks (the layout is ~1% solid, so the pool is a fraction of it)
    const AX = W, AY = pad(y + rowH), BX = AX / 8, BY = AY / 8, BZ = AZ / 8, bricks = new Uint32Array(BX * BY * BZ);
    const occupied = (v, ix, iy, iz) => {
      const [nx, ny, nz] = v.dims;
      for (let z = iz * 8; z < Math.min(nz, iz * 8 + 8); z++) for (let yy = iy * 8; yy < Math.min(ny, iy * 8 + 8); yy++)
        for (let xx = ix * 8; xx < Math.min(nx, ix * 8 + 8); xx++) if (v.rgba[((z * ny + yy) * nx + xx) * 4 + 3]) return true;
      return false;
    };
    let nb = 0, solid = 0;
    for (const v of vols) {
      const [px, py, pz] = v.pdims.map((n) => n / 8), [bx, by, bz] = v.base.map((n) => n / 8);
      for (let iz = 0; iz < pz; iz++) for (let iy = 0; iy < py; iy++) for (let ix = 0; ix < px; ix++)
        if (occupied(v, ix, iy, iz)) bricks[((bz + iz) * BY + by + iy) * BX + bx + ix] = ++nb;
    }
    const PB = 16, PX = PB * 8, PY = PB * 8, PZ = Math.max(1, Math.ceil(nb / (PB * PB))) * 8, pool = new Uint8Array(PX * PY * PZ * 4);
    for (const v of vols) {
      const [nx, ny, nz] = v.dims, [bx, by, bz] = v.base.map((n) => n / 8);
      for (let z = 0; z < nz; z++) for (let yy = 0; yy < ny; yy++) for (let xx = 0; xx < nx; xx++) {
        const src = ((z * ny + yy) * nx + xx) * 4;
        if (!v.rgba[src + 3]) continue;
        const k = bricks[((bz + (z >> 3)) * BY + by + (yy >> 3)) * BX + bx + (xx >> 3)] - 1;
        const qx = (k % PB) * 8 + (xx & 7), qy = (Math.floor(k / PB) % PB) * 8 + (yy & 7), qz = Math.floor(k / (PB * PB)) * 8 + (z & 7);
        pool.set(v.rgba.subarray(src, src + 4), ((qz * PY + qy) * PX + qx) * 4);
        solid++;
      }
    }

    // static volumes shade the sun volume: splat their voxels into the coarse occupancy (foliage half weight)
    const [CX, CY, CZ] = T.cdims, CPU = T.CPU, acc = new Float32Array(CX * CY * CZ);
    const FOL = new Set((CT.sunShadeHalf || []).map((n) => pal.ids[n]).filter((i) => i !== undefined));
    for (const s of statics) {
      const v = vols[s.frames[0]], [nx, ny, nz] = v.dims, [ox, oy, oz] = v.box, p = s.place;
      for (let z = 0; z < nz; z++) for (let yy = 0; yy < ny; yy++) for (let xx = 0; xx < nx; xx++) {
        const m = v.rgba[((z * ny + yy) * nx + xx) * 4 + 3];
        if (!m) continue;
        let lx = (ox + xx + 0.5) / VS, ly = (oy + yy + 0.5) / VS;
        if (p.flip) [lx, ly] = [ly, lx];
        const cx = Math.floor((p.X + lx - T.O[0]) * CPU), cy = Math.floor((p.Y + ly - T.O[1]) * CPU), cz = Math.floor((p.Z + (oz + z + 0.5) / VS - T.O[2]) * CPU);
        if (cx < 0 || cy < 0 || cz < 0 || cx >= CX || cy >= CY || cz >= CZ) continue;
        acc[(cz * CY + cy) * CX + cx] += FOL.has(m) ? 0.06 : 0.125;
      }
    }
    for (let i = 0; i < acc.length; i++) if (acc[i]) T.coarse[i] = Math.min(255, T.coarse[i] + Math.round(acc[i] * 255));
    for (const v of vols) v.rgba = null;

    // point lights from emissive primitives of static volumes
    const lights = [];
    for (const s of statics) {
      const md = vols[s.frames[0]].md, K = md.k, groups = {};
      for (const p of md.prims) if (LIGHT_COL[p.m]) (groups[p.m] = groups[p.m] || []).push(p);
      for (const m in groups) {
        const g = groups[m], c = [0, 0, 0];
        for (const p of g) { c[0] += p.x / g.length; c[1] += p.y / g.length; c[2] += p.z / g.length; }
        let lx = c[0] * K, ly = c[1] * K;
        if (s.place.flip) [lx, ly] = [ly, lx];
        const col = LIGHT_COL[m];
        lights.push({ p: [s.place.X + lx, s.place.Y + ly, s.place.Z + c[2] * K], r: col[4], col: col.slice(0, 3), k: col[3], mat: m });
      }
    }

    // h and r in world units (a fine model is drawn at 1/fine scale)
    const models = vols.map((v) => ({ name: v.name, base: v.base, dims: v.dims, box: v.box, k: v.md.k, fine: v.fine, h: (v.md.h * v.md.k) / v.fine, r: (v.md.r * v.md.k) / v.fine }));
    const stats = { variants: vols.length, layout: [AX, AY, AZ], bricks: nb, pool: [PX, PY, PZ], poolMB: +((pool.byteLength / 1048576).toFixed(1)), solid, surface: vols.reduce((a, v) => a + v.surf, 0), lights: lights.length, ms: Math.round(ME.now() - t0) };
    const MB = { atlas: pool, adims: [PX, PY, PZ], bricks, bdims: [BX, BY, BZ], models, statics, walkerTypes, walkerFrames, critterFrames, extraFrames, lights, stats };
    MB.voxel = ME.brickVoxel(MB);
    return MB;
  };

  // Material byte of voxel (x, y, z) of model mi (0 = empty), through the brick map into the pool
  // (16 x 16 bricks per pool layer). Rebuilt from the arrays on a cache hit.
  ME.brickVoxel = (MB) => {
    const { atlas: pool, bricks, models } = MB, [PX, PY] = MB.adims, [BX, BY] = MB.bdims, PB = PX / 8;
    return (mi, x, y, z) => {
      const [bx, by, bz] = models[mi].base, k = bricks[(((bz + z) >> 3) * BY + ((by + y) >> 3)) * BX + ((bx + x) >> 3)] - 1;
      if (k < 0) return 0;
      const qx = (k % PB) * 8 + (x & 7), qy = (Math.floor(k / PB) % PB) * 8 + (y & 7), qz = Math.floor(k / (PB * PB)) * 8 + (z & 7);
      return pool[((qz * PY + qy) * PX + qx) * 4 + 3];
    };
  };
})();
