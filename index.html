      if (f.beetle && (s === 13 || s === 15) && rf() < 0.7) this.play("rim", 64, layerDb(f.beetle, -24), "MusicPerc", t + swing);
      if (f.moth && (s === 6 || s === 14) && rf() < 0.5) {
        const a = pick(this.arp()) + 12, db = layerDb(f.moth, -25);
        this.play("celesta", a, db, "MusicKeys", t); this.play("celesta", a + 2, db - 2, "MusicKeys", t + this.sixteenth() * 0.5);
      }
      if (f.golem && (s === 0 || s === 8)) this.play("tom", 41, layerDb(f.golem, -15), "MusicPerc", t);
      if (f.spirit && s === 0 && this.seq.bar % 2 === 0) this.play("bell", root + 24, -15, "MusicPads", t);
    }
    arp() { return this.chordNotes.map((n) => n + 12).sort((a, b) => a - b); }

    // --- event gestures (on the grid, in the current chord)
    onEvent(name, data) {
      if (!this.ready || this.gameOver) return;
      const q = this.seq, clock = q.clock, g = clock + q.toGrid(), arp = () => this.arp();
      switch (name) {
        case "spawn": if (!this.seen.has(data.kind)) { this.seen.add(data.kind); this.stinger = data.kind; } break;
        case "hit":
          if (data.result === G.Hit.WEAK && clock - this.lastPing > 0.3) { this.lastPing = clock; this.play("keys", pick(arp()) + 12, -24, "MusicKeys", g); }
          break;
        case "kill":
          if (data.kind === "spirit") this.triumph();
          else if (clock - this.lastSparkle > 0.12) { this.lastSparkle = clock; this.play("celesta", pick(arp()) + 12, -22, "MusicKeys", g); }
          break;
        case "tower_placed": { const a = arp(); for (let k = 0; k < 3; k++) this.play("guitar", a[k] - 12, -13, "MusicKeys", g + k * 0.05); break; }
        case "tower_upgraded": { const a = arp(); for (let k = 0; k < 3; k++) this.play("celesta", a[(k * 2) % a.length], -17, "MusicKeys", g + k * 0.07); break; }
        case "tower_sold": { const a = arp(); for (let k = 0; k < 3; k++) this.play("guitar", a[a.length - 1 - k] - 12, -15, "MusicKeys", g + k * 0.08); break; }
        case "wave_start": {
          this.swift = !!(data.trait && data.trait.id === "swift"); this.want = data.boss ? "boss" : "wave";
          const a = arp(); for (let k = 0; k < 3; k++) this.play("celesta", a[k], -19, "MusicKeys", g + k * this.sixteenth());
          break;
        }
        case "wave_clear": this.swift = false; this.sting(g); break;
        case "boss": this.want = "boss"; this.play("bell", 50, -10, "MusicPads"); this.play("tom", 38, -10, "MusicPerc"); break;
        case "heart_hit": this.tapeDip = 1; this.play("tom", 36, -12, "MusicPerc"); break;
        case "boon": { const a = arp(); for (let k = 0; k < 6; k++) this.play("harp", a[k % a.length] + (k >= 4 ? 12 : 0), -15, "MusicKeys", clock + k * 0.06); break; }
        case "game_over": this.gameOver = true; this.want = "over"; this.tapeState = 1; break;
      }
    }
    onPhase(p) {
      if (p === G.Phase.WAVE && this.want !== "boss") this.want = "wave";
      if (p !== G.Phase.BUILD && p !== G.Phase.CHOOSE_BOON) return;
      if (!this.gameOver) this.want = "build";
      if (p !== G.Phase.BUILD || S.wave !== 0) return;
      // a new run: back to the calm start, on a fresh bar
      if (this.tapeState !== 0 && this.seq) {
        this.cut(1.5); this.seq.restartBar(); this.holdUntil = 0;
        if (this.vinyl) this.vinyl.g.gain.setTargetAtTime(MA.dbToGain(-22), this.mixer.ctx.currentTime, 0.3);
      }
      this.gameOver = false; this.tense = false; this.swift = false; this.want = "build";
      this.tapeSpeed = 1; this.tapeState = 0; this.seen.clear(); this.stinger = "";
    }
    // a cleared wave: the wave stops, a harp runs up into a rolled chord and a bell, and the build cue
    // comes in on the first bar after it has rung
    sting(g) {
      const st = SC.STING, end = g + st.run.length * 0.065;
      this.cut(1.2); this.want = "build"; this.holdUntil = end + 1;
      st.run.forEach((n, k) => this.play("harp", n, -16 + k * 0.4, "MusicKeys", g + k * 0.065));
      this.play("bass", st.bass, -13, "MusicPads", end);
      st.chord.forEach((n, k) => this.play("keys", n, -17, "MusicKeys", end + k * 0.02));
      this.play("bell", st.bell, -16, "MusicPads", end);
      st.top.forEach((n, k) => this.play("celesta", n, -20, "MusicKeys", end + 0.3 + k * 0.2));
      this.logCue("sting");
    }
    // first sighting of a kind: a soft bell and its music-box figure
    announce(kind, t) {
      this.play("bell", this.chord.bass + 24, -16, "MusicPads", t);
      const a = this.arp(), fig = SC.FIGURES[kind] || [0, 1, 2];
      fig.forEach((f, k) => this.play("celesta", a[f % a.length], -18, "MusicKeys", t + this.sixteenth() * k * (kind === "golem" ? 2 : 1)));
    }
    // the boss falls: a harp flourish and a bell, and the wave's own cue for what is left of it
    triumph() {
      if (S.phase === G.Phase.WAVE) this.want = "wave";
      const a = this.arp(), clock = this.seq.clock;
      for (let k = 0; k < 8; k++) this.play("harp", a[k % a.length] + 12 * Math.floor(k / a.length), -13, "MusicKeys", clock + k * 0.05);
      this.play("bell", 53, -13, "MusicPads");
    }
  }
  const layerDb = (count, base) => base + clamp((Math.log(1 + count) / Math.log(2)) * 1.2, 0, 5);
  G.Music = Music;
})();

</script>
<script>/* src/audio/soundscape.js */
/* Every sound that isn't music (port of Soundscape, soundscape.gd): plants firing, hits (layered from the
   plant's impact, the creature's material and, on a weak spot or a resisted hit, a crunch or a
   ricochet), creature calls and deaths, the garden's own sounds (digging, growth, uprooting), critters
   and the valley's ambience (waterfalls, streams, wind).

   Placement in the view is the audio engine's (MA.Spatial): a sound is panned by where it lands on
   screen and gets quieter the further it is from the middle of the view. Birds sing from the valley's
   songbirds, frogs from its frogs, crickets from the moss (the app's ambient-life layer, app.critters);
   they fall silent where the blight spreads and as the battle grows, while the wind rises with it. */
(function () {
  const G = window.MG, S = G.state, D = G.Defs, MA = window.MA;
  // name (without its take number) -> [volume dB, pitch spread, minimum ms between plays]
  const MIX = {
    thorn_fire: [-21, 0.12, 40], sun_fire: [-17, 0.05, 90], puff_fire: [-15, 0.1, 90], wisp_fire: [-19, 0.08, 80],
    plant: [-9, 0.08, 100], grow: [-9, 0.05, 100], uproot: [-9, 0.05, 100],
    hit_thorn: [-19, 0.12, 30], hit_sun: [-18, 0.08, 60], hit_puff: [-21, 0.12, 45], hit_wisp: [-20, 0.06, 50],
    mat_grub: [-20, 0.15, 45], mat_beetle: [-21, 0.12, 40], mat_moth: [-22, 0.15, 45], mat_golem: [-17, 0.1, 60], mat_spirit: [-15, 0.08, 120],
    hit_weak: [-15, 0.06, 70], hit_resist: [-18, 0.1, 90],
    grub: [-21, 0.15, 150], beetle: [-22, 0.15, 150], moth: [-20, 0.15, 150], golem: [-14, 0.1, 200], spirit: [-9, 0.05, 1500], spawn: [-20, 0.1, 700],
    death_pop: [-15, 0.12, 50], death_crumble: [-11, 0.08, 120], death_boss: [-6, 0, 1000], heart_hurt: [-8, 0.05, 250],
    uguisu: [-17, 0.04, 2000], chirp: [-20, 0.08, 500], trill: [-20, 0.06, 800], cricket: [-24, 0.05, 300], frog: [-19, 0.1, 1500], leaves: [-22, 0.1, 1000],
  };
  // too long to cut off when the pool needs a voice
  const PROTECTED = new Set(["spirit", "death_boss", "uguisu"]);
  const DEATH = { grub: ["death_pop", 0.7], beetle: ["death_pop", 1.0], moth: ["death_pop", 1.4], golem: ["death_crumble", 1.0], spirit: ["death_boss", 1.0] };
  const rr = (a, b) => a + (b - a) * Math.random(), pick = (a) => a[Math.floor(Math.random() * a.length)];
  const lerp = (a, b, u) => a + (b - a) * u, toDb = (x) => 20 * Math.log10(x);

  class Soundscape {
    constructor(mixer, game, app) {
      this.mixer = mixer; this.game = game; this.app = app; this.ready = false;
      this.sp = new MA.Spatial(mixer, { bus: "Sfx", mix: MIX, protect: PROTECTED, voices: 40 });
      this.t = { vocal: 1, bird: 2, cricket: 1, frog: 4, leaves: 5, boss: 6 };
      for (const ev of ["fire", "hit", "kill", "spawn", "heart_hit", "tower_placed", "tower_upgraded", "tower_sold"]) G.on(ev, (d) => this.onEvent(ev, d));
    }
    get played() { return this.sp.played; }
    start() {
      this.ready = true;
      const app = this.app, T = app.T;
      // one roar per waterfall (falls that touch merge), one babble per stretch of water, the wind everywhere
      const feet = [];
      for (const f of T.falls) {
        const p = [(f.a[0] + f.b[0]) / 2, (f.a[1] + f.b[1]) / 2, f.zbot], near = feet.find((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) < 1.6);
        if (near) { near[0] = (near[0] + p[0]) / 2; near[1] = (near[1] + p[1]) / 2; } else feet.push(p);
      }
      for (const p of feet) this.sp.loop("waterfall", p, -13, "Ambience");
      const levels = new Map();
      for (const w of T.water) { const k = Math.round(w.z * 2); if (!levels.has(k)) levels.set(k, []); levels.get(k).push(w); }
      this.water = [];
      for (const ws of levels.values()) { const n = ws.length, p = [ws.reduce((a, w) => a + w.x, 0) / n + 0.5, ws.reduce((a, w) => a + w.y, 0) / n + 0.5, ws[0].z]; this.water.push(p); this.sp.loop("stream", p, -20, "Ambience"); }
      this.wind = this.mixer.voice("wind", "Ambience", -22, 1, 0, null, true);
      const cr = app.critters;
      this.trees = cr ? cr.trees.map((t) => [t.X, t.Y, t.Z + t.h * 0.8]) : [];
      this.moss = cr ? cr.cells.m : [];
    }
    play(sound, p, db = 0, pitch = 1) { if (this.ready) this.sp.play(sound, p, db, pitch); }

    onEvent(name, d) {
      if (!this.ready) return;
      switch (name) {
        case "fire": this.play(d.kind + "_fire", d.pos, 0, 1 - 0.06 * (d.level - 1)); break;
        case "hit": {
          // the plant's impact, the creature's material, then the outcome: weak spots crunch and ring,
          // resisted hits thud and ricochet
          const weak = d.result === G.Hit.WEAK, resisted = d.result === G.Hit.RESISTED;
          if (d.element >= 0) this.play(`hit_${D.ELEMENT_TOWER[d.element]}_${Math.floor(Math.random() * 3)}`, d.pos, weak ? 2 : resisted ? -5 : 0, weak ? 0.92 : 1);
          if (d.kind) this.play("mat_" + d.kind, d.pos, resisted ? -3 : 0);
          if (weak) this.play("hit_weak", d.pos); else if (resisted) this.play("hit_resist", d.pos);
          break;
        }
        case "kill": { const x = DEATH[d.kind] || DEATH.grub; this.play(x[0], d.pos, 0, x[1]); break; }
        case "spawn": if (d.kind === "spirit") this.play("spirit", d.pos, 3, 0.9); else this.play("spawn", d.pos); break;
        case "heart_hit": { const w = this.game.world; this.play("heart_hurt", [w.heart[0], w.heart[1], w.heartZ + 1]); break; }
        case "tower_placed": this.play("plant", d.pos); break;
        case "tower_upgraded": this.play("grow", d.pos); break;
        case "tower_sold": this.play("uproot", d.pos); break;
      }
    }

    // --- every frame, real time (the 2x speed toggle doesn't make the forest chatter)
    update(dt, L) {
      if (!this.ready) return;
      this.sp.listen(L.vp, L.zoom, L.aspect);
      this.sp.update();
      const now = this.mixer.ctx.currentTime, i = S.intensity;
      if (this.wind) { this.wind.g.gain.setTargetAtTime(MA.dbToGain(lerp(-24, -13, i)), now, 0.3); this.wind.src.playbackRate.setTargetAtTime(lerp(0.9, 1.15, i), now, 0.3); }
      this.creatureCalls(dt);
      // the Heart Tree's leaves fall as it worsens (view/scene.js heartStage), and it crumbles when lost
      const sc = this.app.scene, w = this.game.world, hp = [w.heart[0], w.heart[1], w.heartZ + 1.4];
      if (sc.heartStage > (this.heartStage || 0)) { this.play("leaves", hp, 6, 0.8); this.play("heart_hurt", hp, -4, 0.85); }
      this.heartStage = sc.heartStage;
      const fallen = !!(sc.heartStatic && sc.heartStatic.hidden);
      if (fallen && !this.fallen) { this.play("death_crumble", hp, 4, 0.6); this.play("leaves", hp, 6, 0.7); }
      this.fallen = fallen;
      if (S.phase === G.Phase.GAME_OVER) return;
      // dusk (the view's, while waves run): the birds settle and the crickets take over
      const T = this.t, cr = this.app.critters, dusk = sc.dusk || 0;
      if ((T.bird -= dt) <= 0) {
        T.bird = rr(2.5, 6.5) * (1 + 2.5 * dusk);
        const birds = cr ? cr.agents.filter((a) => a.kind === "bird" && !a.hide && a.x !== undefined) : [];
        const at = birds.length ? (({ x, y, z }) => [x, y, z])(pick(birds)) : this.trees.length ? pick(this.trees) : null;
        if (at) { const calm = this.calm(at, 0.85); if (Math.random() < calm) this.play(pick(["uguisu", "chirp", "trill", "chirp"]), at, toDb(Math.max(calm, 0.05))); }
      }
      if ((T.cricket -= dt) <= 0 && this.moss.length) {
        T.cricket = rr(1, 2.8) * (1 - 0.6 * dusk);
        const [cx, cy] = pick(this.moss), at = [cx + 0.5, cy + 0.5, cr ? cr.gz(cx + 0.5, cy + 0.5) : 0], calm = this.calm(at, 0.6 * (1 - dusk));
        if (Math.random() < calm) this.play("cricket", at, toDb(Math.max(calm, 0.05)) + 3 * dusk, rr(0.94, 1.06));
      }
      if ((T.frog -= dt) <= 0) {
        T.frog = rr(5, 11);
        const frogs = cr ? cr.agents.filter((a) => a.kind === "frog" && !a.hide && a.x !== undefined) : [];
        const at = frogs.length ? (({ x, y, z }) => [x, y, z])(pick(frogs)) : this.water.length ? pick(this.water) : null;
        if (at && Math.random() < this.calm(at, 0.7)) this.play("frog", at, 0, rr(0.85, 1.15));
      }
      if ((T.leaves -= dt) <= 0 && this.trees.length) { T.leaves = rr(4, 9) * lerp(1, 0.5, i); this.play("leaves", pick(this.trees), lerp(0, 4, i)); }
    }
    // how freely critters sing at a spot: hushed by the blight there and by the battle
    calm(at, hush) { return Math.min(1, Math.max(0, 1 - this.app.scene.wiltAt(at[0], at[1]) * 1.6)) * (1 - S.intensity * hush); }
    creatureCalls(dt) {
      const E = this.game.enemies;
      if (E.count === 0) return;
      const T = this.t;
      if ((T.vocal -= dt) <= 0) {
        T.vocal = Math.min(1.8, Math.max(0.22, 1.8 / Math.sqrt(E.count))) * rr(0.7, 1.3);
        const live = []; E.forEachLive((k) => { if (E.dist[k] >= 0) live.push(k); });
        if (live.length) { const k = pick(live), kind = E.kindOf(k); if (kind !== "spirit") this.play(kind, [E.px[k], E.py[k], E.pz[k]]); }
      }
      if (E.bossAlive() && (T.boss -= dt) <= 0) {
        T.boss = rr(6, 9);
        E.forEachLive((k) => { if (E.kindOf(k) === "spirit") this.play("spirit", [E.px[k], E.py[k], E.pz[k]]); });
      }
    }
  }
  G.Soundscape = Soundscape;
})();

</script>
<script>/* src/audio/audio.js */
/* The game's audio: the bus layout of the Godot build, built from the audio engine's mixer (MA.Mixer),
   with the game's two sound banks (instruments.js, sfx.js), the music director (music.js) and the
   soundscape (soundscape.js):
     Music      lowpass -> reverb -> gentle compressor; sub-buses MusicPads, MusicKeys (chorus + slow
                autopan), MusicLead (two delay taps on the 16th grid), MusicPerc (dusty lowpass), and two
                decks of those four (MusicPadsA ... MusicPercB) the director crossfades its cues on
     Sfx        short reverb       Ambience   longer reverb
   G.Audio is what the game talks to: it unlocks the context on the first tap and remembers the sound
   toggle. */
(function () {
  const G = window.MG, MA = window.MA;
  const SOUND_KEY = "mossheart.sound";
  G.SOUND_BANKS = [MG_INSTRUMENTS, MG_SFX];

  // the game's buses on the mixer; returns the controls the music director moves
  function buildBuses(m) {
    // Music: lowpass -> reverb -> compressor (+3 dB, less the ~3.8 dB the node adds by itself)
    const fade = m.gain(0), lp = m.lowpass(6000, 0.8), verb = m.verbBus(2.2, 2.2, 0.5, 0.2, 0.9, 0.025);
    const comp = m.compressor({ threshold: -16, ratio: 2.5, knee: 6, attack: 0.01, release: 0.2 }), makeup = m.gain(MA.dbToGain(3 - 3.8));
    const music = m.gain();
    music.connect(lp); lp.connect(verb.input); verb.out.connect(comp); comp.connect(makeup); makeup.connect(fade); fade.connect(m.master);
    const pads = m.gain(); pads.connect(music);
    // keys: a light chorus and a slow autopan
    const keys = m.gain(), ch = m.chorus(0.014, 0.0025, 0.8, 0.2), keysPan = m.panner();
    keys.connect(ch.input); ch.out.connect(keysPan); keysPan.connect(music);
    // lead: dry plus two delay taps (3 and 6 sixteenths), panned apart
    const lead = m.gain(); lead.connect(music);
    const taps = [[-0.3, -15], [0.3, -20]].map(([pan, db]) => m.delayTap(lead, music, db, pan));
    // perc: dusty, no fizz on top
    const perc = m.gain(), dust = m.lowpass(7000); perc.connect(dust); dust.connect(music);
    const sfx = m.verbBus(1.2, 2.5, 0.5, 0.12), amb = m.verbBus(2.6, 2, 0.8, 0.28);
    sfx.out.connect(m.master); amb.out.connect(m.master);
    for (const [name, input] of [["Music", music], ["MusicPads", pads], ["MusicKeys", keys], ["MusicLead", lead], ["MusicPerc", perc], ["Sfx", sfx.input], ["Ambience", amb.input]]) m.addBus(name, input);
    // two decks of the sub-buses, silent until a cue plays on one (music.js)
    const decks = ["A", "B"].map((d) => [["Pads", pads], ["Keys", keys], ["Lead", lead], ["Perc", perc]].map(([k, bus]) => { const g = m.gain(0); g.connect(bus); m.addBus("Music" + k + d, g); return g; }));
    return { fade, lp, wet: verb.wet, keysPan, taps, decks };
  }

  class Audio {
    // banks: MA.renderBanks' promise, started at boot (else the mixer renders them itself)
    constructor(game, app, banks) {
      this.game = game;
      let saved = "1";
      try { saved = localStorage.getItem(SOUND_KEY) ?? "1"; } catch (e) { /* storage blocked */ }
      this.enabled = saved !== "0";
      try { this.mixer = new MA.Mixer(); } catch (e) { MA.log("WARN no WebAudio:", e.message); this.mixer = null; return; }
      const m = this.mixer;
      m.master.gain.value = this.enabled ? 1 : 0;
      this.music = new G.Music(m, buildBuses(m));
      this.sound = new G.Soundscape(m, game, app);
      m.load(banks || G.SOUND_BANKS).then(() => { this.readyAt = Math.round(performance.now()); this.music.start(m.banks[0].items); this.sound.start(); }).catch((e) => MA.err("AUDIO", e.stack || e.message));
      if (G.devFlag && G.devFlag("record")) m.startRecording();
    }
    // dev (?record=1): the recording of the final mix
    stopRecording() { return this.mixer ? this.mixer.stopRecording() : Promise.resolve(null); }
    setGame(game) { this.game = game; if (this.sound) this.sound.game = game; }
    unlock() { if (this.mixer) this.mixer.resume(); }
    setEnabled(on, remember = false) {
      this.enabled = on;
      if (this.mixer) this.mixer.setMuted(!on);
      if (remember) try { localStorage.setItem(SOUND_KEY, on ? "1" : "0"); } catch (e) { /* storage blocked */ }
    }
    toggle() { this.setEnabled(!this.enabled, true); if (this.enabled) this.unlock(); return this.enabled; }
    // rdt: real seconds; listener: { vp, zoom, aspect } of the view
    update(rdt, listener) {
      if (!this.mixer || !this.mixer.ready) return;
      this.music.update(rdt);
      this.sound.update(rdt, listener);
      this.mixer.meterFrame();
    }
    stats() {
      const m = this.mixer;
      if (!m) return null;
      return Object.assign({ ready: m.ready, readyAt: this.readyAt, state: m.ctx.state, samples: Object.keys(m.samples).length, renderMs: m.renderMs, worker: m.worker, notes: this.music.notes, sfx: this.sound.played, mood: this.music.mood, bpm: Math.round(this.music.bpm), cues: this.music.cueLog.join(" ") }, m.meterStats());
    }
  }
  G.Audio = Audio;
})();

</script>
<script>/* src/bot.js */
/* Dev harness (port of autoplay.gd): plays the game by itself to smoke-test systems and judge balance.
   ?autoplay=1&waves=N&speed=X. It plants where each plant's reach covers the most path (favouring the
   plants the coming wave is weak to, so it plays like a competent player), sometimes grows a plant,
   starts waves, takes the first boon, logs a line per wave (how hits landed, how far the blight
   spread) and hands a report to hooks.finish after N waves or on game over.
   It plays through the rules alone, so the same bot drives the full game (main.js) and the rules-only
   balance sim (tools/sim.html). Everything else comes through hooks: { maxWaves, now(), log(line),
   deselect(), hideBoons(), setSpeed(x), finish(report) }. */
(function () {
  const G = window.MG, D = G.Defs, S = G.state;

  class Bot {
    constructor(game, hooks) {
      this.game = game; this.hooks = hooks;
      this.maxWaves = hooks.maxWaves || 8;
      this.rng = G.rng((S.seed ^ 0xb07) >>> 0);
      this.t0 = hooks.now(); this.waveT0 = 0; this.simT = 0; this.hits0 = [0, 0, 0];
      this.rows = []; this.done = false; this.boonAt = -1; this.boons = null;
      this.frames = 0; this.fpsAcc = 0;
      this.unsub = [
        G.on("boons_offered", (e) => { this.boons = e.boons; this.boonAt = 0.3; }),
        G.on("wave_clear", (e) => this.waveRow(e.wave)),
        G.on("game_over", (e) => { this.hooks.log(`GAME OVER at wave ${e.wave}`); this.finish(true); }),
      ];
    }
    dispose() { for (const u of this.unsub) u(); }

    update(rdt) {
      if (this.done) return;
      this.simT += rdt;
      if (this.boons && (this.boonAt -= rdt) <= 0) {
        const b = this.boons[0]; this.boons = null;
        this.hooks.hideBoons();
        this.hooks.log(`  boon: ${b.name}`);
        this.game.chooseBoon(b);
      }
      if (S.phase !== G.Phase.BUILD) return;
      if (S.wave >= this.maxWaves) { this.hooks.log(`reached wave ${S.wave}, heart ${S.heartHp}/${S.heartMax}, dew ${S.dew}, plants ${this.game.towers.length}`); this.finish(false); return; }
      this.spend();
      this.waveT0 = this.game.time;
      this.hooks.deselect();
      this.game.startWave();
    }
    afterFrame() { this.frames++; }

    spend() {
      const game = this.game;
      // grow existing plants sometimes
      for (const t of game.towers) if (t.level < D.MAX_LEVEL && S.dew > t.upgradeCost() + 80 && this.rng.f() < 0.5) game.upgrade(t);
      // lead with the plant the coming wave is most weak to, then mostly that with some variety
      const coming = game.plan(S.wave + 1);
      const kinds = D.TOWER_ORDER.slice().sort((a, b) => counterScore(coming, b) - counterScore(coming, a));
      const cost = (k) => S.towerCost(D.TOWERS[k].cost);
      for (let tries = 0, placed = 0; tries < 200; tries++) {
        let kind = placed === 0 || this.rng.f() < 0.6 ? kinds[0] : kinds[this.rng.i(kinds.length)];
        if (!S.canAfford(cost(kind))) {
          const cheap = kinds.filter((k) => S.canAfford(cost(k)));
          if (!cheap.length) break;
          kind = cheap[0];
        }
        const c = this.bestCell(kind);
        if (!c || !game.place(kind, c[0], c[1])) break;
        placed++;
      }
    }
    // a free cell where a plant of `kind` reaches the most path, picked among the best few so runs differ
    bestCell(kind) {
      const game = this.game, w = game.world;
      if (!this.pathPts) { this.pathPts = []; for (let s = 0; s < w.len; s += 0.5) { const p = w.roadAt(s); this.pathPts.push([p[0], p[1]]); } }
      const reach = D.TOWERS[kind].range, r2 = reach * reach, best = [];
      for (let y = 0; y < w.H; y++) for (let x = 0; x < w.W; x++) {
        if (!game.canPlace(kind, x, y)) continue;
        const X = x + 0.5, Y = y + 0.5;
        let score = 0;
        for (const q of this.pathPts) if ((q[0] - X) ** 2 + (q[1] - Y) ** 2 <= r2) score++;
        best.push([score + this.rng.f() * 0.5, [x, y]]);
      }
      if (!best.length) return null;
      best.sort((a, b) => b[0] - a[0]);
      return best[this.rng.i(Math.min(4, best.length))][1];
    }

    waveRow(wave) {
      const hs = this.game.enemies.hitStats, d = [hs[0] - this.hits0[0], hs[1] - this.hits0[1], hs[2] - this.hits0[2]], total = Math.max(1, d[0] + d[1] + d[2]);
      this.hits0 = hs.slice();
      const plants = {};
      for (const t of this.game.towers) plants[t.kind] = (plants[t.kind] || 0) + 1;
      const row = {
        wave, secs: +(this.game.time - this.waveT0).toFixed(1), heart: S.heartHp, dew: S.dew, intensity: +S.intensity.toFixed(2), hits: total,
        weakPct: Math.round((d[1] / total) * 100), resistedPct: Math.round((d[2] / total) * 100), blight: +S.corruption.toFixed(2), plants,
      };
      this.rows.push(row);
      this.hooks.log(`wave ${wave} cleared in ${row.secs}s (sim), heart ${row.heart}, dew ${row.dew}, intensity ${row.intensity}, hits ${total} (weak ${row.weakPct}%, resisted ${row.resistedPct}%), blight ${row.blight}, plants ${JSON.stringify(plants)}`);
    }
    finish(gameOver) {
      if (this.done) return;
      this.done = true;
      const real = (this.hooks.now() - this.t0) / 1000;
      const report = {
        seed: S.seed, reached: S.wave, gameOver, heart: [S.heartHp, S.heartMax], dew: S.dew,
        plants: this.game.towers.map((t) => t.kind + t.level).join(" "), boons: S.boons.join(" "),
        waves: this.rows, realSecs: +real.toFixed(1), avgFps: +(this.frames / Math.max(1e-3, real)).toFixed(1),
      };
      this.hooks.setSpeed(1);
      this.hooks.finish(report);
    }
  }
  // average damage multiplier a plant gets against a wave, weighted by the vitality each kind brings
  const counterScore = (p, kind) => {
    const el = D.elementOf(kind);
    let sum = 0, n = 0;
    for (const g of p.groups) { const hp = g.count * D.ENEMIES[g.kind].hp; sum += hp * D.affinity(g.kind, p.trait)[el]; n += hp; }
    return sum / Math.max(n, 1);
  };
  G.Bot = Bot;
})();

</script>
<script>/* src/main.js */
/* Boot and main loop, the one place every layer meets: bakes Momiji Valley with the Mossheart Engine
   (its content pack, without the generator's sample towers and walkers, dressed with the asset set's
   Heart Tree, blight rift and glowcaps) plus the game's models, adds the engine's voxel physics, reads
   the level off it, then runs the rules (core/), the view (view/), the HUD, input, audio and camera
   every frame.
   URL options: ?seed=N fixes the run, ?speed=2, ?dpr=1, ?scale=0.8 (render scale), ?mute=1,
   ?autoplay=1&waves=8 (bot; see bot.js), ?selftest=1 (render N frames, report timings into #result). */
(async function () {
  const ME = window.ME, G = window.MG, S = G.state, D = G.Defs;
  const canvas = document.getElementById("cv"), result = document.getElementById("result");
  const report = (o) => { result.textContent = typeof o === "string" ? o : JSON.stringify(o, null, 1); };
  G.devFlag = (name) => ME.qn(name, 0);
  try {
    const t0 = ME.now();
    ME.progress("starting WebGPU", 0.01);
    // Android can drop the GPU device when the tab is backgrounded: offer a reload instead of a frozen frame
    ME.onDeviceLost = () => { const l = document.getElementById("lost"); if (l) l.style.display = "grid"; };
    // the sound banks render (worker, or the IndexedDB cache) while the GPU starts and the bake runs; G.Audio takes the promise
    const banks = window.MA && G.SOUND_BANKS ? MA.renderBanks(G.SOUND_BANKS, { cache: !ME.qn("nocache", 0) }) : null;
    const gpu = await ME.initGPU(canvas);
    ME.log("ADAPTER", gpu.info, "features", [...gpu.features]);
    // the pipelines (with the game's shader hooks) compile in the GPU process while the CPU bakes
    const hooks = G.shaderHooks(), pipelines = ME.compilePipelines(gpu, hooks);
    pipelines.then(() => ME.log("PIPELINES", { ms: Math.round(ME.now() - t0) }), () => {}); // errors: reported by ME.err, rethrown in R.init
    const st = window.STYLES.find((s) => s.id === "mf-valley");
    // the level without the generator's sample towers and walkers: the game plants and spawns its own
    const DEMO = new Set(["hotaru", "puffcap", "sprout", "piglet", "pillbug"]);
    st.deco = st.deco.filter((d) => !(d && DEMO.has(d[0])));
    G.dressLevel(st);
    ME.content.addMaterials(st);
    G.addMaterials(st);
    const pal = new ME.Palette(st);
    const ids = { sky: pal.id("sky"), water: pal.id("water"), fall: pal.id("fall"), maple: pal.id("maple") };
    // the bake, or the cached copy of it (the engine's IndexedDB bake cache; ?nocache=1 skips it)
    const bakeOpts = { walkers: false, models: G.bakeList() };
    const key = ME.bakeCache.key(st, JSON.stringify(bakeOpts)), hit = await ME.bakeCache.get(key);
    let T, mesh, MB, grass;
    if (hit) {
      for (const n of hit.palNames.slice(1)) pal.id(n); // same material ids as the baked arrays
      ({ T, mesh, MB, grass } = hit);
      T.groundAt = ME.groundAt(T); MB.voxel = ME.brickVoxel(MB);
      ME.log("CACHE", { hit: true });
    } else {
      T = await ME.bakeTerrain(st, pal);
      ME.log("TERRAIN", T.stats);
      mesh = await ME.greedyMesh(T);
      MB = await ME.bakeModels(T, st, pal, bakeOpts);
      ME.log("MODELS", MB.stats);
      grass = ME.bakeGrass(T, st, pal);
      ME.bakeCache.put(key, { palNames: pal.names, T: Object.assign({}, T, { groundAt: null }), mesh, MB: Object.assign({}, MB, { voxel: null }), grass });
    }
    G.bindModels(MB);
    const tables = pal.build();
    if (pal.missing.size) ME.log("WARN materials without ramps:", [...pal.missing].join(","));
    ME.progress("uploading", 0.85); await ME.tick();
    const sim = new ME.Sim(T, st, MB, { capacity: 1200 });
    sim.setCount(0);
    const R = new ME.Renderer(gpu, { T, mesh, MB, pal, st, sim, tables, ids, grass, hooks, pipelines, fieldRes: G.BLIGHT_RES });
    R.applyPreset(ME.q("preset", "cosy"));
    ME.progress("compiling shaders", 0.9); await ME.tick();
    await R.init();
    const critters = new ME.Critters(T, st, MB, R.lightList);
    // loose voxels: creatures burst into theirs, uprooted plants crumble, the fallen Heart Tree falls apart
    const phys = R.addLayer(new ME.VoxelPhysics(T, { capacity: 12288 }));
    // dynamic resolution (the engine's), unless ?scale= pins the render scale; self-tests are fixed too
    if (ME.params.has("scale")) R.set.scale = ME.qn("scale", 1);
    R.set.autoScale = ME.qn("auto", ME.params.has("scale") || ME.qn("selftest", 0) ? 0 : 1) === 1;
    const dyn = new ME.DynRes(R);

    const app = { gpu, st, pal, T, mesh, MB, sim, R, critters, phys };
    const level = G.levelFrom(app);
    const scene = (app.scene = new G.GameView(app));
    sim.layers.push(scene, critters);
    sim.wiltAt = (x, y) => scene.wiltAt(x, y);
    const seed = ME.params.has("seed") ? ME.qn("seed", 1) >>> 0 : (Date.now() ^ (Math.random() * 1e9)) >>> 0;
    S.newRun(seed);
    let game = new G.Game(level, G.body);
    scene.setGame(game);
    const bakeMs = Math.round(ME.now() - t0);
    ME.log("READY", { bakeMs, materials: pal.names.length - 1, route: +sim.len.toFixed(1), statics: MB.statics.length, volumes: MB.stats.variants, buildable: game.world.buildCount, seed });

    // ------------------------------------------------------------------ camera, HUD, audio
    const cam = new ME.Camera(T.geo.C, T.geo.C);
    const fitCanvas = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, ME.qn("dpr", 2));
      const w = Math.max(64, Math.round(canvas.clientWidth * dpr)), h = Math.max(64, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      R.resize(w, h);
    };
    const frameView = () => {
      cam.fit(canvas.width, canvas.height);
      // leave room for the HUD: a little more zoom on wide screens, centred a touch higher on tall ones
      if (canvas.width < canvas.height) { cam.zoom *= 1.12; cam.pan = [0.4, -1.6]; }
    };
    fitCanvas(); frameView();
    cam.attach(canvas);
    window.addEventListener("resize", fitCanvas);
    document.getElementById("loading").style.display = "none";

    let speed = ME.qn("speed", 1), selected = null;
    const audio = G.Audio ? new G.Audio(game, app, banks) : null;
    if (audio && ME.qn("mute", 0)) audio.setEnabled(false);
    const hud = new G.Hud(game, {
      seed: (kind) => { deselect(); scene.seed = kind; },
      startWave: () => { deselect(); game.startWave(); audio && audio.unlock(); },
      speed: (fast) => { speed = fast ? 2 : 1; },
      sound: () => (audio ? audio.toggle() : false),
      upgrade: () => { if (selected && game.upgrade(selected)) select(selected); },
      sell: () => { if (selected) { game.sell(selected); deselect(); } },
      restart: () => restart(),
    });
    const refreshWaves = () => {
      if (S.phase === G.Phase.WAVE) hud.showWaves(game.plan(S.wave), game.remaining(), game.plan(S.wave + 1));
      else hud.showWaves(game.plan(S.wave + 1), {}, game.plan(S.wave + 2));
    };
    G.on("waves", refreshWaves); G.on("phase", refreshWaves);
    G.on("boons_offered", (e) => hud.showBoons(e.boons, (b) => game.chooseBoon(b)));
    G.on("game_over", (e) => { speed = 1; hud.showGameOver(e.wave, e.best); });
    G.on("dew", () => { if (selected) hud.inspect(selected); });
    refreshWaves();

    const select = (t) => { selected = t; scene.selected = t; hud.inspect(t); };
    const deselect = () => { selected = null; scene.selected = null; hud.inspect(null); };
    // a new run on the same baked world: clear the field and the plants, heal the garden. With d (a saved
    // run, G.Save), that run instead; false if it does not fit this level
    const newGame = (d) => {
      const next = new G.Game(level, G.body);
      if (d && !G.Save.fits(next, d)) { next.dispose(); return false; }
      game.dispose();
      deselect(); hud.clearSeed(); hud.hideGameOver(); document.getElementById("boons").classList.remove("show");
      game = next; hud.game = game; if (audio) audio.setGame(game); if (bot) bot.game = game;
      if (d) G.Save.restore(game, d); else S.newRun((Date.now() ^ (Math.random() * 1e9)) >>> 0);
      scene.setGame(game);
      refreshWaves();
      return true;
    };
    const restart = () => newGame(null);
    // save and continue (core/save.js): the bot and the self-test neither load a saved run nor save theirs
    const keepRuns = !ME.qn("autoplay", 0) && !ME.qn("selftest", 0);
    if (keepRuns) G.Save.watch(() => game);
    const saved = () => (keepRuns ? G.Save.read() : null);
    const continueRun = () => { const d = saved(); if (d && newGame(d)) return true; G.Save.clear(); return false; };

    // ------------------------------------------------------------------ input: taps plant / inspect
    const toCanvas = (e) => { const r = canvas.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * canvas.width, ((e.clientY - r.top) / r.height) * canvas.height]; };
    const cellAt = (e) => { const [px, py] = toCanvas(e); return scene.cellAt(px, py, cam, canvas.width, canvas.height); };
    let down = null;
    canvas.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, t: ME.now(), id: e.pointerId }; audio && audio.unlock(); });
    canvas.addEventListener("pointerup", (e) => {
      if (!down || down.id !== e.pointerId) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = ME.now() - down.t;
      down = null;
      if (moved < 10 && dt < 600) tap(e);
    });
    canvas.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" && !e.buttons) { const c = cellAt(e); scene.hover = c ? { cell: c } : null; } });
    canvas.addEventListener("pointerleave", () => { scene.hover = null; });
    const tap = (e) => {
      if (S.phase === G.Phase.GAME_OVER || S.phase === G.Phase.CHOOSE_BOON) return;
      const c = cellAt(e);
      if (!c) { deselect(); return; }
      if (e.pointerType !== "mouse") scene.hover = { cell: c };
      const t = game.towerAt(c[0], c[1]);
      if (t) { hud.clearSeed(); scene.seed = ""; select(t); return; }
      const kind = hud.selected;
      if (kind && game.canPlace(kind, c[0], c[1])) {
        const placed = game.place(kind, c[0], c[1]);
        if (placed && !S.canAfford(S.towerCost(D.TOWERS[kind].cost))) { hud.clearSeed(); scene.seed = ""; }
        return;
      }
      deselect();
    };
    // keys by physical position (ME.keys), so they sit in the same place on AZERTY; Esc stays on e.key
    window.addEventListener("keydown", (e) => {
      if (e.target && e.target.tagName === "INPUT") return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const d = ME.keys.digit(e);
      if (d >= 1 && d <= 4) { const kind = D.TOWER_ORDER[d - 1]; hud.selected = hud.selected === kind ? "" : kind; scene.seed = hud.selected; deselect(); hud.refresh(); }
      else if (ME.keys.is(e, "Space")) { e.preventDefault(); if (S.phase === G.Phase.BUILD) { deselect(); game.startWave(); audio && audio.unlock(); } }
      else if (e.key === "Escape") { hud.clearSeed(); scene.seed = ""; deselect(); }
      else if (ME.keys.is(e, "KeyF")) document.getElementById("speed").click();
      else if (ME.keys.is(e, "KeyM")) document.getElementById("sound").click();
      else if (ME.keys.is(e, "KeyU") && selected) { if (game.upgrade(selected)) select(selected); }
    });
    // the help line names the keys the player's layout shows
    const helpEl = document.querySelector(".help"), helpText = () => { helpEl.textContent = ME.keys.text("drag pan · wheel zoom · {KeyQ}/{KeyE} turn · 1–4 seeds · space wave"); };
    helpText(); ME.keys.onChange(helpText);

    // ------------------------------------------------------------------ juice: shake, heart flash
    let trauma = 0, flash = 0;
    G.on("heart_hit", () => { trauma = Math.min(1, trauma + 0.7); flash = 1; });
    G.on("boss", () => { trauma = Math.min(1, trauma + 0.5); });
    G.on("kill", (e) => { if (e.kind === "spirit") { trauma = 1; flash = 0.6; } });
    const flashEl = document.getElementById("flash");

    // ------------------------------------------------------------------ fps readout (the render scale
    // is the engine's dynamic resolution, ME.DynRes)
    const perf = { acc: 0, n: 0, t: ME.now(), fps: 60 };
    const fpsMeter = (dt) => {
      perf.acc += dt; perf.n++;
      if (ME.now() - perf.t < 2000) return;
      perf.fps = perf.n / Math.max(1e-3, perf.acc); perf.acc = 0; perf.n = 0; perf.t = ME.now();
    };

    const bot = G.Bot && ME.qn("autoplay", 0) ? new G.Bot(game, {
      maxWaves: ME.qn("waves", 8), now: () => ME.now(), log: (line) => ME.log("BOT", line),
      deselect, hideBoons: () => document.getElementById("boons").classList.remove("show"), setSpeed: (s) => { speed = s; },
      finish: (r) => {
        const out = JSON.stringify(Object.assign({ ok: ME.errors.length === 0 }, r, { audio: audio ? audio.stats() : null, errors: ME.errors }));
        if (audio && audio.mixer && audio.mixer.rec) audio.stopRecording().then((b64) => { result.textContent = out + "\nFILE mix.webm " + b64; });
        else result.textContent = out;
      },
    }) : null;
    if (bot) speed = ME.qn("speed", 6);
    // (a live getter: a new run replaces the game)
    ME.app = Object.defineProperties(Object.assign(app, { cam, hud, audio, bot }), { game: { get: () => game, enumerable: true } });
    // title screen, pause menu and settings (view/menu.js)
    app.menu = G.Menu ? new G.Menu(app, { setSpeed: (s) => { speed = s; }, restart, saved, continueRun }) : null;

    // what the audio hears from: the view's projection, how far it is zoomed in, its shape
    const listener = () => {
      const w = canvas.width, h = canvas.height;
      return { vp: cam.matrices(w, h).vp, zoom: cam.zoom / Math.min(w / 37, h / 24.5), aspect: h / w };
    };
    const start = ME.now();
    let last = start;
    const step = () => {
      const now = ME.now(), rdt = Math.min(0.1, (now - last) / 1000);
      dyn.update(now, now - last); last = now;
      cam.update(now);
      if (R.set.scale !== R._scale) { R._scale = R.set.scale; R.size = [0, 0]; fitCanvas(); }
      // simulate in steps of at most 1/30 s (2x and the bot's fast-forward take several per frame)
      let simDt = app.paused ? 0 : rdt * speed;
      const n = Math.min(12, Math.ceil(simDt / (1 / 30)));
      for (let k = 0; k < n; k++) { game.update(simDt / n); scene.update(simDt / n); }
      if (bot) bot.update(rdt);
      trauma = Math.max(0, trauma - rdt * 1.4); flash = Math.max(0, flash - rdt * 1.8);
      flashEl.style.opacity = flash.toFixed(3);
      const sh = trauma * trauma * 0.22 * (G.shake ?? 1), tt = now / 1000, jx = sh * Math.sin(tt * 61.3) * Math.sin(tt * 17.1), jy = sh * Math.sin(tt * 53.7 + 1.3) * Math.sin(tt * 13.9);
      scene.draw(R.size[0] / Math.max(1, canvas.clientWidth));
      cam.pan[0] += jx; cam.pan[1] += jy;
      const c0 = ME.now();
      R.frame(cam, (now - start) / 1000, rdt);
      const cpu = ME.now() - c0;
      cam.pan[0] -= jx; cam.pan[1] -= jy;
      scene.fx.place(cam, canvas);
      if (audio) audio.update(rdt, listener());
      fpsMeter(rdt);
      hud.setFps(perf.fps, R.set.scale);
      return cpu;
    };

    if (ME.qn("selftest", 0)) {
      // N frames with a scripted mini battle (a few plants, wave 1 running) for timings and GPU errors
      const N = ME.qn("frames", 240), cpus = [], ints = [];
      for (const [kind, cx, cy] of [["thorn", 20, 6], ["puff", 18, 10], ["sun", 17, 14], ["wisp", 6, 13]]) if (game.world.isBuildable(cx, cy)) game.place(kind, cx, cy);
      scene.selected = game.towers[0] || null; scene.seed = "thorn"; scene.hover = { cell: [20, 10] };
      game.startWave(); speed = 3;
      let prev = ME.now();
      await new Promise((resolve) => {
        let n = 0;
        const tick = () => { const now = ME.now(); ints.push(now - prev); prev = now; cpus.push(step()); if (++n < N) requestAnimationFrame(tick); else resolve(); };
        requestAnimationFrame(tick);
      });
      await gpu.device.queue.onSubmittedWorkDone();
      step(); await gpu.device.queue.onSubmittedWorkDone(); await new Promise((r) => setTimeout(r, 60));
      const avg = (a) => +(a.reduce((p, q) => p + q, 0) / a.length).toFixed(3);
      report({
        ok: ME.errors.length === 0, adapter: gpu.info, canvas: [canvas.width, canvas.height], render: R.size, bakeMs, models: MB.stats,
        frames: N, avgFrameIntervalMs: avg(ints.slice(5)), avgCpuMs: avg(cpus.slice(5)), gpuMs: R.gpuMs,
        game: { wave: S.wave, enemies: game.enemies.count, towers: game.towers.length, dew: S.dew, heart: S.heartHp, corruption: +S.corruption.toFixed(3), sprites: R.sprites.nAdd + R.sprites.nAlpha, volumes: sim.count, looseVoxels: phys.spawned, dusk: +scene.dusk.toFixed(2) },
        errors: ME.errors,
      });
      document.title = "SELFTEST DONE";
      return;
    }

    const loop = () => { step(); if (bot) bot.afterFrame(canvas); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } catch (e) {
    ME.err("BOOT", e.stack || e.message);
    const l = document.getElementById("loading");
    l.style.display = "";
    if (G.bootFailed) G.bootFailed(e); else l.innerHTML = `<div class="fail">${(e.message || String(e)).replace(/</g, "&lt;")}${navigator.gpu ? "" : "<small>This browser has no WebGPU. Try Chrome or Edge on desktop or Android, or Safari 18+ with WebGPU enabled.</small>"}</div>`;
    report({ ok: false, error: e.message, errors: ME.errors });
  }
})();

</script>
